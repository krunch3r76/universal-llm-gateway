"mcp.agentbus.post.failed" = "Atomic thread+turn creation failed"
"mcp.agentbus.thread.abandoned" = "Thread reaped by watchdog after TTL expiry or all-terminal-no-delivery condition. `reason` values: `pending_ttl_exceeded`, `admitted_ttl_exceeded`, `all_terminal_no_delivery`, `tracker_expired`"
