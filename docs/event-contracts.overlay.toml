"mcp.agentbus.thread.created" = "Atomic thread+turn creation succeeded"
"mcp.agentbus.thread.deleted" = "Thread and all turns deleted"
"mcp.agentbus.thread.lifecycle.transitioned" = "Thread lifecycle state machine transition. `role=coordination`. `trigger` values: `create`, `admit`, `turn_posted`, `delivery_sent`, `delivery_failed`, `watchdog_reap`, `reopen`. Emitted from `_transition_lifecycle_state` — single point of correctness for all callers"
"mcp.agentbus.thread.reopened" = "Emitted alongside `mcp.agentbus.thread.lifecycle.transitioned` when a turn POST transitions a thread out of a terminal state (completed, abandoned, or failed) back to active"
"mcp.agentbus.thread.updated" = "Thread status/summary updated (non-close)"
"mcp.agentbus.threads.listed" = "Thread listing retrieved"
