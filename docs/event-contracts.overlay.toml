"rag.dependencies.activated" = "emitted when Stargate readiness, embedding readiness, and extraction runtime startup have succeeded, before optional watcher registration begins."
"rag.dependency.retry.scheduled" = "emitted once per retry while Stargate-backed activation is still blocked"
"rag.directory.sources.deleted" = "directory-level delete completed across vector index and article metadata"
"rag.entity.gate.io.failed" = "Emitted by `services/rag/entity_admission/_io.py` when cortex-api source-paths refresh or Event Service subscribe fails. `operation`: `\"refresh\"` or `\"subscribe\"`. `error`: exception string. Prior admitted set is retained (fail-safe)."
"rag.exclusion.purged" = "Indexed sources matching exclusion patterns purged during startup"
"rag.extraction.admission.closed" = "Gate transitioned OPEN → CLOSED. `reason` ∈ {`iteration-timeout-burst`, `step-failure-ratio`, `gateway:<gateway_id>`, `model:<model_id>`}. `signal` is the upstream Stargate signal that drove the transition."
"rag.extraction.admission.opened" = "Last active close-reason cleared; gate reopened. `closed_seconds` measures the wall-clock window between the matching `closed` and this `opened`."
"rag.extraction.admission.timeout" = "The extraction worker's pre-dequeue wait timed out and the worker proceeded optimistically. Each occurrence is a tuning datum, not a failure."
"rag.extraction.batch.completed" = "Batch extraction finished (successful ≤ chunk_count; written = 0 on partial failure). Optional payload: `extraction_model`, `finish_reason` (present when pipeline stop reason ≠ \"stop\", e.g. `\"length\"` = max_tokens truncation)."
"rag.extraction.batch.skipped" = "All chunks permanently failed — no pipeline call made"
"rag.extraction.batch.started" = "Batch extraction initiated for a file"
"rag.extraction.batch.timed.out" = "Extraction batch exceeded dynamic timeout budget; all chunks recorded as transient failures"
"rag.extraction.claim.recovered" = "RAG startup cleared a claim left by a previous process before starting the worker"
"rag.extraction.failed" = "Per-chunk extraction failure (expected iteration result missing or invalid after batch parsing)"
"rag.extraction.model.mismatch" = "Re-extraction triggered because existing chunks have different or missing extraction_model."
"rag.extraction.permanently.skipped" = "Chunk crossed `max_extraction_attempts`; permanently abandoned. Persisted as `permanent=1` in `failed_extractions`. Emitted exactly once per chunk."
"rag.extraction.recovery.completed" = "recovery pass for missing extraction metadata completed successfully"
"rag.extraction.recovery.failed" = "recovery attempted but extraction metadata could not be committed"
"rag.extraction.recovery.skipped" = "recovery skipped (e.g. no documents in ChromaDB, all chunks permanently failed)"
"rag.extraction.source.claimed" = "source row atomically claimed from `extraction_queue`; row remains in-flight until completion, failure, or startup claim recovery"
"rag.extraction.source.completed" = "source extraction completed and the queue row was deleted"
"rag.extraction.source.failed" = "source extraction failed and the row remains queued for backoff or exhaustion; `increment_attempt=false` means capacity-class failure did not consume source defect budget"
"rag.extraction.structurally.unavailable" = "Extraction model ID has no Stargate catalog entry; failures are marked permanent (no retry loop)."
"rag.extraction.unavailable" = "Extraction pipeline not routable via Stargate at watcher start. Watcher is not started; RAG serves queries but does not index until restart."
"rag.file.deleted" = "all chunks deleted, no replacement (file now empty); optional: `operation_id`, `operation`"
"rag.file.deletion.failed" = "watcher-triggered delete cleanup failed; indexed rows may still exist"
"rag.file.indexed" = "file fully indexed; `duration_seconds` = wall-clock time to index this file; optional: `batch_start_ts` (ISO-8601), `processing_seconds` (Stargate-derived post-queue work time), `queue_wait_seconds` (time from pipeline step start to first inference started), `document_metadata` (dict — e.g. `article_title`, `article_authors`, `article_venue`, `published_date`, `article_doi` when file is in registry), `noise_chunks` (int — count of chunks tagged `is_noise` / legacy `is_bibliography` for this file), `operation_id` (per-attempt correlation handle), `operation` (`index`/`reindex` when route-originated)"
"rag.file.indexing.failed" = "terminal indexing failure from unhandled exception. ¬emitted for retriable extraction failures (see `rag.file.retry.deferred`). Optional: `operation_id`, `operation`."
"rag.file.indexing.failure.cleared" = "row removed from `indexing_failures`. `reason` ∈ {`indexed_successfully`, `source_deleted`, `operator_cleared`}. Emitted only when a row actually existed. role=coordination."
"rag.file.indexing.failure.recorded" = "file-level failure persisted to `indexing_failures` table. `failure_category` ∈ {`permanent`, `transient`}. Optional: `error_type` (`type(exc).__qualname__` of the underlying exception), `error_head` (first ~200 chars of `str(exc)`) — both let `query-events --signal rag.file.indexing.failure.recorded` reveal the actual exception without consulting RAG logs. role=coordination."
"rag.file.indexing.retry.requested" = "operator requested a retry via admin API. `scheduled` reflects whether the watcher accepted the admission. role=coordination."
"rag.file.indexing.failure.skipped" = "reconcile/initial-reindex skipped the file because a permanent row exists with unchanged mtime/size, or a transient row is inside its backoff window. role=coordination."
"rag.file.indexing.gated" = "file in an entity-gated watch root skipped because no cortex entity backs it via `source_uri`. `layer` ∈ {`watcher_sweep`, `index_funnel`}. role=coordination. **Not** a failure row. Distinct from `rag.entity.gate.io.failed` (upstream refresh/subscribe outage)."
"rag.file.retry.deferred" = "extraction incomplete but file NOT marked indexed — watcher will re-attempt on next sweep. reasons: `extraction_incomplete`, `infrastructure_unavailable`. Optional: `operation_id`, `operation`."
"rag.file.skipped" = "file skipped; `reason` ∈ {`unchanged`, `duplicate_pdf`}; optional: `operation_id`, `operation`"
"rag.html.normalization.completed" = "HTML normalized to markdown successfully"
"rag.html.normalization.failed" = "HTML normalization failed; file indexing aborted"
"rag.html.normalization.started" = "HTML/HTM normalization started before chunking"
"rag.orphan.purged" = "Missing watched sources reconciled during startup; `chunks` counts only Chroma deletions"
"rag.pending.reconciled" = "Startup reconciliation of files interrupted mid-index"
"rag.property.index.unavailable" = "indexing proceeded without property index availability"
"rag.source.deleted" = "source-level delete completed across vector index and article metadata"
"rag.start.degraded" = "first transition from core boot into dependency-waiting mode"
"rag.started" = "emitted after core boot (event bus, config, property index, registry load attempt) completes"
"rag.vocabulary.classification.failed" = "LLM classification failed for one or more scopes; `reasons` is a `{scope: reason_string}` map; `trigger` is the repair trigger source"
"rag.vocabulary.gaps.detected" = "vocabulary could not be filled for one or more scopes; `reason` ∈ {`no_model_available`, `no_terms`, `non_latin_terms`}"
"rag.vocabulary.gaps.repaired" = "vocabulary rows successfully written after LLM classification; `model` is the local Stargate model ID used"
"rag.watch.file.deleted" = "watcher deleted all chunks for a source file removed from disk"
"rag.watch.initial.complete" = "emitted once per watch path at end of startup sweep; invariant: total_files == reindexed + unchanged + errors; `files` includes errored files"
"rag.watch.initial.progress" = "emitted approximately every 10% of total_files during startup sweep; `processed` is monotonic; invariant: `processed = reindexed + unchanged + errors`"
"rag.watch.initial.started" = "emitted once per watch path when startup sweep candidate list is finalized"
