"mcp.agentbus.turn.deleted" = "Single turn deleted"
"mcp.agentbus.turn.detail.fetched" = "Single turn fetched by number"
"mcp.agentbus.turn.posted" = "Reply turn posted to existing thread"
"mcp.agentbus.turn.body_over_briefing" = "Turn body exceeded the briefing target (2k) without allow_long_body, a sidecar, or an inline-contract envelope. Advisory only — the turn was inserted unchanged."
"mcp.agentbus.turn.updated" = "Turn body/subject updated"
"mcp.agentbus.turns.fetched" = "Turns fetched (inbox or thread)"
"mcp.agentbus.wait.called" = "MCP wait relay invoked (server-side block)"
"mcp.agentbus.wait.completed" = "MCP wait relay returned"
"mcp.agentbus.watchdog.sweep.failed" = "Watchdog sweep pass raised an unhandled exception. Repeated occurrences indicate a persistent failure in the reap path."
"mcp.auth.admitted" = "Request passed auth — source IP for firewall auditing"
"mcp.cortex.boot.card.overbudget" = "Delivered briefing card UTF-8 byte count exceeded per-seat ceiling (`web`: 19_000; `default`: 15_500); breach line appended to card before manifest assembly; per-block ledger in audit dump"
"mcp.cortex.boot.dump.failed" = "Audit dump write failed; `stage` ∈ {`mkdir`, `write_text`}; `path` present for `write_text` stage only; boot itself succeeds (dump is best-effort)"
"mcp.cortex.boot.dump.written" = "Per-boot audit dump written successfully to `/data/files/notes/system/audit/boots/`; `path` is the full dump file path (second-resolution filename decoupled from `session_id`); `bytes` is the UTF-8 byte count of the written file"
"mcp.cortex.boot.fetch.failed" = "Boot fetch recorder could not serialize a fetch result to JSON; the corresponding `FetchRecord.bytes` is set to `-1` (`BYTES_UNAVAILABLE`); distinct from `bytes=0` (legitimately empty payload)"
"mcp.cortex.boot.manifest.assembled" = "Injected-artifacts manifest assembled after cortex_brief fetch + render; `total_bytes` sums bytes across all artifacts where `bytes >= 0` (excludes `manifest_only` and `BYTES_UNAVAILABLE` entries)"
"mcp.cortex.bulk.rolled.back" = "A bulk dispatch op rolled back the transaction at item `failed_index` and returned a structured error to the caller. `op` ∈ {`entities_bulk_upsert`, `relationships_bulk_upsert`}. `reason` ∈ {`item_not_object`, `http_exception`, `integrity_error`}. `status_code` is also present on `http_exception` rollbacks. Symmetric counterpart to the post-commit `*.bulk.upserted` event — emit-and-return on the rollback path keeps the failure observable on the event bus, not just in the caller's response body."
"mcp.cortex.dispatch.arguments.invalid" = "Cortex dispatch handler rejected the `arguments` string because JSON parsing failed. Replaces the prior bare `logger.warning` carve-out; the dispatch response carries `_CORTEX_FORMAT_HINT` so callers see the structural error, while consumers see this signal on the bus for population-level monitoring."
"mcp.cortex.entities.bulk.upserted" = "Entities bulk-upsert transaction committed. `count` is the total number of items in the batch (sum of `created` + `updated` + `skipped`). Fired AFTER `conn.commit()` so consumers do not see false signals on a rolled-back batch."
"mcp.cortex.relationships.bulk.upserted" = "Relationships bulk-upsert transaction committed. Same post-commit ordering guarantee as the entities counterpart."
"mcp.cortex.relay.called" = "Entry to cortex-api UDS relay before HTTP request."
"mcp.cortex.relay.completed" = "Successful relay (`status_code < 400`)."
"mcp.cortex.relay.failed" = "Relay failure: `error` ∈ {`request_error`, `http_error`, `invalid_json`}; `status_code` present on HTTP errors."
"mcp.document.extract.called" = "`extract_document` invoked; path relative to `/data/files/`."
"mcp.document.extract.completed" = "Extraction finished and sidecar written. `canonical=true` when full-file extraction with default args (no page spec, no args override). `total_tokens` is `null` for deterministic-parser paths (text PDFs, DOCX, ODT, EML, plain text). `sidecar_path` relative to `/data/files/`."
"mcp.document.extract.empty" = "Extraction succeeded but returned empty text; no sidecar written. `format` is the detected document format (e.g. `pdf`, `docx`, `image`)."
"mcp.document.extract.idempotent" = "Existing sidecar found with matching source SHA, page spec, and args hash — extraction skipped, cached sidecar returned. `sidecar_path` is relative to `/data/files/`."
"mcp.document.extract.structured.called" = "`extract_document_structured` invoked; path relative to `/data/files/`."
"mcp.document.extract.structured.completed" = "Structured JSON extraction finished."
"mcp.document.extract.structured.error" = "Structured extraction failed (JSON parse, vision error, etc.)."
"mcp.document.ocr.called" = "Single-file OCR endpoint invoked; path relative to `/data/files/`. Emitted by cortex-api."
"mcp.document.ocr.completed" = "Single-file OCR finished. Emitted by cortex-api."
"mcp.document.ocr.directory.called" = "`extract_directory` MCP tool invoked, relay reached cortex-api. Directory path relative to `CORTEX_FILES_ROOT`. Emitted by cortex-api."
"mcp.document.ocr.directory.completed" = "Directory OCR batch finished. `file_count` is total scannable files discovered; `success_count`/`error_count` reflect per-file outcomes. Always emitted — even when `error_count > 0` (partial success is not a failure at the batch level). Emitted by cortex-api."
"mcp.document.ocr.file.failed" = "One file in an `extract_directory` batch failed to OCR. `path` is relative to `CORTEX_FILES_ROOT`. Emitted once per failed file before the batch-level signal. Emitted by cortex-api."
"mcp.evidence.promote.called" = "`promote_document_to_evidence` invoked; `path` relative to `/data/files/`, `entity_id` is the target `document:` entity."
"mcp.evidence.promote.completed" = "Source + sidecar atomically moved into `evidence/<date>_<hash>_<name>/` with `manifest.json`. `entity_created=true` when the `document:` entity was freshly created (idempotent re-promotion sets `false`). `bundle_path` is the evidence bundle directory relative to `/data/files/`."
"mcp.evidence.promote.failed" = "Promotion aborted with a structured `PromoteError`. `code` is the stable machine-readable failure reason (e.g. `entity_conflict`, `duplicate_evidence`, `source_sha_mismatch`, `sidecar_invalid`). Files remain in staging."
"mcp.fs.binary.detect.failed" = "`filetype.guess()` raised `OSError`/`ValueError` during the magic-byte probe; file falls through to text-mode read (silent binary may still corrupt if extension is also unrecognised)"
"mcp.fs.binary.magic.match" = "Magic-byte probe (`filetype.guess`, 261-byte read) identified a file as binary when its extension was absent or unrecognised by `BINARY_EXTENSIONS`; file was auto-routed to base64"
"mcp.fs.html.parse.failed" = "`html2text.handle()` raised while converting an HTML file to markdown in `_read_html`; exception re-raised"
"mcp.grokbuild.apidispatch.called" = "Api-path (`mcp=False`) dispatch admitted. Emitted AFTER tier validation passes, BEFORE the Stargate `/v1/chat/completions` POST. No subprocess, no MCP tooling inside dispatch; no git audit fields. Lifecycle counterpart to `mcp.grokbuild.dispatch.called` for the direct-API path."
"mcp.grokbuild.apidispatch.completed" = "Api-path dispatch succeeded; Stargate returned HTTP 2xx and the response JSON parsed cleanly. Usage fields parsed from the OpenAI-compatible `usage` block; ALL default to 0 when absent so downstream JOINs are safe."
"mcp.grokbuild.apidispatch.failed" = "Api-path dispatch failed. Covers all four failure modes: admission-phase `bad_tier`, transport `api_unreachable` (httpx.RequestError), upstream `api_error` (Stargate returned HTTP ≥400), and parse-phase `invalid_response` (response JSON missing `choices[0].message.content`). No CLI-side `.rejected` counterpart — api-path admission failures use the unified `.failed` signal."
"mcp.grokbuild.bearer.context.rejected" = "Build-dispatch bearer context admission rejected (missing or forbidden `X-Grokbuild-Dispatch-Id`)"
"mcp.grokbuild.create.called" = "`worktree_create_op` admitted (V2: emits **after** name/branch/source-repo validation, review W9)."
"mcp.grokbuild.create.completed" = "`git worktree add` succeeded."
"mcp.grokbuild.create.failed" = "`git worktree add` non-zero exit OR setup OSError."
"mcp.grokbuild.create.rejected" = "Admission failed."
"mcp.grokbuild.dispatch.called" = "Handler entered and dispatch admitted. Emitted AFTER validator and registry acquire pass; rejected dispatches emit only `.rejected`."
"mcp.grokbuild.dispatch.completed" = "Dispatch completed with `exit_code == 0`."
"mcp.grokbuild.dispatch.failed" = "Dispatch completed with non-zero exit OR sidecar `started`-write failed before subprocess spawn."
"mcp.grokbuild.dispatch.rejected" = "Validator or registry rejected admission. No subprocess spawned. Correlation fields travel inline so no `.called` join required (admission-phase contract)."
"mcp.grokbuild.dispatch.timeout" = "Subprocess exceeded `timeout_seconds`; SIGTERM → 5s → SIGKILL via `os.killpg`."
"mcp.grokbuild.dispatch.toolcalls" = "C.1(ii) sidecar parse summary. Emitted after every dispatch that produced stdout (completed or non-zero exit). `tool_count == len(tool_names)`. JOIN with `mcp.request.completed` on `dispatch_id` to detect header-vs-sidecar discrepancy. Empty (tool_count=0) on spawn-failed/timeout — those paths never reach `communicate()`."
"mcp.grokbuild.dispatch.zerotoolcalls" = "C.1(ii) anomaly. Fires when `tool_count == 0` AND `mode == 'edit'` AND `status == 'completed'`. In edit mode the grok subprocess is expected to call MCP tools; zero calls may indicate a silent HOME-override failure, the grok subprocess ignoring MCP, or a trivially-answerable task. Always co-emitted with `.toolcalls`."
"mcp.grokbuild.list.called" = "`worktree_list_op` admitted (V2: emits after root-existence check; fires whether root is missing or present, review W9)."
"mcp.grokbuild.list.completed" = "Enumeration succeeded. `count=0` is valid (missing or empty root)."
