"pipeline.frontier.dispatch.empty.completion" = "Fires when `frontier_dispatch_v1` returns empty/whitespace-only content on the non-exhausted branch. Distinct from `.exhausted` (intentional no-content on max-turns). Emitted immediately before `EmptyCompletionError` is raised so terminal state converts from `completed` to `failed`. (node-scoped)"
"pipeline.frontier.dispatch.exhausted" = "native-endpoint loop hit `max_tool_turns` without terminal content; `model_entity_id` is the canonical Cortex `model:<slug>` for the admitted model; `op` ∈ {`generate`, `to_thread`, ``} (node-scoped)"
"pipeline.frontier.dispatch.hydrated" = "`frontier_dispatch_v1` team-seat step loaded dispatched-agent Cortex boot; omitted in persona-free mode (node-scoped)"
"pipeline.frontier.dispatch.mismatch" = "Emitted when `frontier_dispatch_v1` rejects an agent + model combination. `mismatch_kind=\"provider\"` — model's provider doesn't match the agent's identity-bound provider family (e.g. oppie + anthropic model); suggests typo or wrong family. `mismatch_kind=\"variant\"` — provider matches but model fails the agent's variant requirement (e.g. oppie + non-multi-agent xAI model); suggests stale model pin or missing beta-gate access. Precedes `pipeline_execution_failed` with `code=agent_model_mismatch`. `model_entity_id` is the canonical Cortex `model:<slug>` for the requested model — present here (not only on `.started`) so correlators can recover it on the rejection path where `.started` never fires (node-scoped)"
"pipeline.frontier.dispatch.output.short" = "Team/full `frontier_dispatch_v1` dispatch returned <500 output tokens — captures first ~500 chars of content for triage of thinking-budget starvation, model confusion, or tool-loop misrouting. Emission is detector-gated on `boot_level ∈ {team, full}`; persona-free dispatches pass `boot_level='none'` and are filtered. Replaces the deprecated `mcp.frontier.output.short` signal as of Task-7 Phase 1 (node-scoped)"
"pipeline.frontier.dispatch.refusal.suspected" = "Post-loop heuristic fires when an inline-contract dispatch returns a short refusal-shaped completion after the model already made tool calls — gated on `output_tokens < 80` AND `tool_calls_made > 0` AND a refusal-marker hit on the lowercase content (\"i can't continue\", \"cannot comply\", \"i'm sorry\", etc.). Distinct from `.output.short` (broad short-output heuristic) and `.termination.shadow` (provider=google thought-trace pattern). Emitted alongside `pipeline.frontier.dispatch.completed`; consumers should retry on a higher-capability model or shorten the write loop. Not gated on `boot_level` — refusal detection runs on persona-free dispatches too. (node-scoped)"
"pipeline.frontier.dispatch.remotemcp.enabled" = "remote-MCP path selected for this execution; adapter attached provider-native MCP descriptor before the native call; implies client-side tool loop disabled (node-scoped)"
"pipeline.frontier.dispatch.remotemcp.misconfigured" = "`resolve_mcp_env()` raised because `MCP_PUBLIC_URL`/`MCP_AUTH_TOKEN` is unset in the Stargate container env; precedes `pipeline_execution_failed`. `model_entity_id` is the canonical Cortex `model:<slug>` — present here (not only on `.started`) so correlators can recover it on the race where misconfigured fires before `.started` (env resolution fails during admission) (node-scoped)"
"pipeline.frontier.dispatch.started" = "Fires once per `frontier_dispatch_v1` execution, after hydration (if persona) and before the native call. `model` is the wire/provider-routed id; `model_entity_id` is the canonical Cortex `model:<slug>`. `boot_level` is internal observability vocabulary derived from agent presence, not a caller-facing parameter. `remote_mcp` in the payload is internal observability (card-derived remote-connector selection), not a caller-facing parameter. `op` ∈ {`generate`, `to_thread`, ``}. `endpoint_request_id` joins to endpoint `dispatch.skills.*` rows by `request_id`. MCP callers reach this via `team_dispatch` relay (node-scoped)"
"pipeline.frontier.dispatch.termination.shadow" = "Advisory post-`pipeline.frontier.dispatch.completed` detection of likely silent-termination patterns (refusal / incapacity / policy / scope / loop / token_exhaustion) in the model's reasoning trace. v1 scope: provider=`google` + team-seat dispatch + thought summaries available. `.shadow` topic suffix marks v1 as NOT production-consumable during the calibration window — orchestrators MUST filter on suffix, not on a shadow boolean. Never replaces `.completed`, never fires on `.exhausted`. Replaces the deprecated `mcp.frontier.thought.termination.shadow` signal as of Task-7 Phase 1 (node-scoped)"
"pipeline.frontier.dispatch.tool.called" = "tool executed successfully inside native-endpoint tool-use loop (node-scoped)"
"pipeline.frontier.dispatch.tool.failed" = "tool call returned error envelope or raised inside loop; `arguments` / `full_error` / `retry_count` aid observability and deterministic-retry policy (node-scoped)"
"pipeline.frontier.dispatch.tool.requested" = "fired when the model begins generating a `tool_use` block in the streaming response (`content_block_start`), before tool execution; `tool_call_id` correlates with subsequent `.tool.called`/`.tool.failed` events — Anthropic: `content_block.id`; OpenAI/xAI: `item.id` or `item.call_id`; Google: `null` (no native id); emitted by `frontier_dispatch` handler `on_event` callback (node-scoped)"
"pipeline.frontier.dispatch.tool.suppressed" = "Emitted when the tool surface is coerced to empty or server-side built-ins are suppressed. Reason vocabulary (from `frontier_tools.py` + live callsites): `capability_tier_inline_only` — role demoted to inline-only substrate (`resolve_dispatch_tool_set`); `mcp_client_tool_loop_unsupported` — model card rejects client-side MCP tools (`admission_checks.py`); `server_tools_knob` — caller set `server_tools=False` while the card carries server-side built-ins (`gen_params.py`). Internal observability field, not caller-facing. (node-scoped)"
