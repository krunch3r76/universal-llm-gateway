# MCP server — internet-facing, TLS, bearer token auth
#
# Prerequisites (host):
#   - TLS certs populated by certbot (default /etc/letsencrypt)
#   - MCP_AUTH_TOKEN set in environment or .env.local
#   - MCP_PROJECT_DIR set to workspace root (required — no default)
#   - MCP_DATA_DIR defaults to ~/mcp-data
#
# Usage: docker compose -f docker/compose/mcp-server.yml up -d

services:
  mcp-server:
    build:
      context: ../../services/mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    user: "1000:1000"
    ports:
      - "443:443"
    volumes:
      # Mount entire letsencrypt dir so relative symlinks in live/ resolve correctly
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ${MCP_DATA_DIR:-~/mcp-data}/files:/data/files:rw
      - ${MCP_PROJECT_DIR:?MCP_PROJECT_DIR required}:/data/project:ro
      - /tmp/mcp-events:/tmp/mcp-events:rw
      # tasks mount mode: "ro" (default) or "rw"
      - ${MCP_PROJECT_DIR:?MCP_PROJECT_DIR required}/tasks:/data/tasks:${MCP_TASKS_MOUNT_MODE:-ro}
      - /tmp/universal-protocol:/tmp/universal-protocol
      # Optional: Firefox profile for authenticated browser sessions.
      # Set firefox_profile_dir in ~/.gateway/mcp.yaml to enable cookie injection.
      # If unset, browser tools still work but without host cookies.
      - ${FIREFOX_PROFILE_DIR:-/tmp/no-firefox-profile}:/data/firefox_profile:ro
      # SQLite databases + config for sqlite_* tools
      - ${MCP_DATA_DIR:-~/mcp-data}/sqlite.yaml:/data/sqlite-config.yaml:ro
      - ${MCP_DATA_DIR:-~/mcp-data}/databases:/data/databases:rw
    environment:
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - PROJECT_ROOT=/data/project
      - TASKS_ROOT=/data/tasks
      # Disable all tasks/ context tools with ENABLE_CONTEXT_TOOLS=false
      - ENABLE_CONTEXT_TOOLS=${ENABLE_CONTEXT_TOOLS:-true}
      # Additional app-level guard for write tools (recommended true with ro mount)
      - TASKS_READ_ONLY=${TASKS_READ_ONLY:-true}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - SQLITE_CONFIG_PATH=/data/sqlite-config.yaml
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, ssl; urllib.request.urlopen('https://localhost/health', context=ssl._create_unverified_context())",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
