# MCP server — internet-facing, TLS, bearer token auth
#
# Prerequisites (host):
#   - TLS certs populated by certbot (default /etc/letsencrypt)
#   - MCP_AUTH_TOKEN set in environment (e.g., via export or source .env.local)
#   - MCP_PROJECT_DIR set to project root (required — no default)
#   - MCP_TASKS_DIR set to tasks directory (required — no default)
#   - MCP_DATA_DIR defaults to ${HOME}/mcp-data
#   - `docker network create mcp-network` (shared with satellite containers)
#
# Usage: docker compose -f docker/compose/mcp-server.yml up -d

services:
  mcp-server:
    build:
      context: ../..
      dockerfile: services/mcp-server/Dockerfile
      args:
        SOURCE_VERSION: "0"
    image: universal-mcp-server:local
    container_name: mcp-server
    user: "1000:1000"
    ports:
      - "443:443"
    volumes:
      # Mount entire letsencrypt dir so relative symlinks in live/ resolve correctly
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ${MCP_DATA_DIR:-${HOME}/mcp-data}/files:/data/files:rw
      # project mount: "ro" (default) or "rw" — toggled via project_access in mcp.yaml
      - ${MCP_PROJECT_DIR:?MCP_PROJECT_DIR required}:/data/project:${MCP_PROJECT_MOUNT_MODE:-ro}
      # tasks mount: separate dir, independent access mode
      - ${MCP_TASKS_DIR:?MCP_TASKS_DIR required}:/data/tasks:${MCP_TASKS_MOUNT_MODE:-ro}
      - /tmp/universal-protocol:/tmp/universal-protocol
      # Optional: Firefox profile for authenticated browser sessions.
      # Set firefox_profile_dir in ~/.gateway/mcp.yaml (host-managed) to enable
      # cookie injection.
      # If unset, a dummy profile is mounted, and browser tools will work but without host cookies.
      - ${FIREFOX_PROFILE_DIR:-/tmp/no-firefox-profile}:/data/firefox_profile:ro
      # SQLite databases + config for sqlite_* tools
      - ${MCP_DATA_DIR:-${HOME}/mcp-data}/sqlite.yaml:/data/sqlite-config.yaml:ro
      - ${MCP_DATA_DIR:-${HOME}/mcp-data}/databases:/data/databases:rw
      - ~/.rag/store:/data/rag-store:ro
      - ~/.cortex:/data/cortex:rw
      - ~/.gateway:/home/mcp/.gateway:ro
    environment:
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN required}
      - PROJECT_ROOT=/data/project
      - TASKS_ROOT=/data/tasks
      # Browser tools (Playwright Firefox) are disabled by default.
      # Enable via the browser override: -f mcp-server-browser.override.yml
      - ENABLE_BROWSER_TOOLS=${ENABLE_BROWSER_TOOLS:-false}
      # Disable all tasks/ context tools with ENABLE_CONTEXT_TOOLS=false
      - ENABLE_CONTEXT_TOOLS=${ENABLE_CONTEXT_TOOLS:-true}
      # App-level write guards (recommended true with ro mounts)
      - TASKS_READ_ONLY=${TASKS_READ_ONLY:-true}
      - PROJECT_READ_ONLY=${PROJECT_READ_ONLY:-true}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - SQLITE_CONFIG_PATH=/data/sqlite-config.yaml
      - STARGATE_URL=${STARGATE_URL:-http://io:9999}
      - MCP_SHARED_IMAGE_DIR=/data/files/.shared-images
      # MCP_SHARED_IMAGE_HOST_ROOT is derived from MCP_DATA_DIR and MCP_SHARED_IMAGE_DIR within the application.
      # Event service socket — /tmp/universal-protocol is already mounted above
      - EVENTS_SOCK=/tmp/universal-protocol/events.sock
      - MCP_OAUTH_ENABLED=${MCP_OAUTH_ENABLED:-true}
      - MCP_OAUTH_ISSUER=${MCP_OAUTH_ISSUER:-https://mcp.k-1.me}
      - BRIDGE_TOKEN=${BRIDGE_TOKEN:-}
      - AGENT_BUS_TOKEN=${AGENT_BUS_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-}
      # Cortex deployment config — parameterizes personal references
      - CORTEX_DEFAULT_USER_ENTITY=${CORTEX_DEFAULT_USER_ENTITY:-}
      - CORTEX_OWNER_NAME=${CORTEX_OWNER_NAME:-the user}
      - CORTEX_DEPLOYMENT_VOCABULARY=${CORTEX_DEPLOYMENT_VOCABULARY:-}
      - CORTEX_PERSONA_SEEDS=${CORTEX_PERSONA_SEEDS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl,urllib.request; urllib.request.urlopen('https://localhost/health', context=ssl._create_unverified_context())",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - default
      - mcp-network
    restart: unless-stopped

networks:
  mcp-network:
    external: true
