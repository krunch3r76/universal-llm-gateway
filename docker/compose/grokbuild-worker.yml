# grokbuild-worker container fallback.
#
# Operator prefers bare-metal systemd (see services/grokbuild_worker/systemd/);
# this compose file exists so the FastAPI surface and Stargate proxy
# contract are identical when running containerized.
#
# Bind-mounts host paths at identical locations inside the container so
# the config defaults in services/grokbuild_worker/config.py remain
# unchanged across deploy shapes.

services:
  grokbuild-worker:
    container_name: grokbuild-worker
    build:
      context: ../..
      dockerfile: services/grokbuild_worker/Dockerfile
    image: grokbuild-worker:local
    restart: unless-stopped
    network_mode: host
    environment:
      GROKBUILD_WORKER_HOST: "127.0.0.1"
      GROKBUILD_WORKER_PORT: "8090"
      GROKBUILD_SIDECAR_DIR: "/var/lib/grokbuild-worker/sidecars"
      GROKBUILD_REGISTRY_PATH: "/var/lib/grokbuild-worker/registry.json"
      GROK_BIN_PATH: "/home/io/.local/bin/grok"
      GROK_AUTH_DIR: "/home/io/.grok"
      PROJECTS_ROOT: "/mnt/torus/projects"
    volumes:
      - /home/io/.grok:/home/io/.grok:ro
      - /home/io/.local/bin/grok:/home/io/.local/bin/grok:ro
      - /mnt/torus/projects:/mnt/torus/projects
      - /var/lib/grokbuild-worker:/var/lib/grokbuild-worker
      - /tmp/universal-protocol:/tmp/universal-protocol
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8090/api/v1/grokbuild/health',timeout=2); sys.exit(0)"
      interval: 10s
      timeout: 5s
      retries: 3
