# Event service — SQLite-backed event store with UDS ingest + query
#
# Survives TUI and service restarts (--restart=unless-stopped).
# No port exposure — all communication via UDS sockets.
#
# Usage: docker compose -f docker/compose/event-service.yml up -d

services:
  event-service:
    build:
      context: ../..
      dockerfile: services/event-service/Dockerfile
    image: universal-event-service:local
    container_name: event-service
    user: "1000:1000"
    volumes:
      - /tmp/universal-protocol:/tmp/universal-protocol
      - event-data:/data
    environment:
      - EVENT_DB_PATH=/data/events.db
      - UDS_PATH=/tmp/universal-protocol/events.sock
      - QUERY_UDS_PATH=/tmp/universal-protocol/events-query.sock
      - RETENTION_DAYS=${EVENT_RETENTION_DAYS:-2}
      - MAX_SESSIONS=${EVENT_MAX_SESSIONS:-2}
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,sys;s=socket.socket(socket.AF_UNIX);s.settimeout(3);s.connect('/tmp/universal-protocol/events-query.sock');s.sendall(b'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n');d=s.recv(512);s.close();first=d.split(b'\\r\\n',1)[0];sys.exit(0 if b' 200 ' in first else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  event-data:
