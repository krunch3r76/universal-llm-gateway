# TCP developer-mode overlay for event service.
# Included automatically when ~/.gateway/event-service.yaml has tcp.enabled: true.
#
# Manual: docker compose -f event-service.yml -f event-service-tcp.yml up -d

services:
  event-service:
    ports:
      - "${EVENT_TCP_BIND:-127.0.0.1}:${EVENT_INGEST_TCP_PORT:-7101}:${EVENT_INGEST_TCP_PORT:-7101}"
      - "${EVENT_TCP_BIND:-127.0.0.1}:${EVENT_QUERY_TCP_PORT:-7102}:${EVENT_QUERY_TCP_PORT:-7102}"
    environment:
      - EVENT_TCP_ENABLED=true
      - EVENT_INGEST_TCP_PORT=${EVENT_INGEST_TCP_PORT:-7101}
      - EVENT_QUERY_TCP_PORT=${EVENT_QUERY_TCP_PORT:-7102}
