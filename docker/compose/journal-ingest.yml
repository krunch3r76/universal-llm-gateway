# journal-ingest — Extracts assertions from journal diffs into Cortex
#
# Prerequisites (host):
#   - cortex-api running (UDS at /tmp/universal-protocol/cortex-api.sock)
#   - journal-bridge running (Docker, on mcp-network)
#   - ANTHROPIC_API_KEY set in environment
#   - BRIDGE_TOKEN set in environment
#
# Usage: docker compose -f docker/compose/journal-ingest.yml up -d

services:
  journal-ingest:
    build:
      context: ../..
      dockerfile: services/journal-ingest/Dockerfile
    container_name: journal-ingest
    user: "1000:1000"
    volumes:
      - /tmp/universal-protocol:/tmp/universal-protocol
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY required}
      - BRIDGE_URL=http://journal-bridge:8200
      - BRIDGE_TOKEN=${BRIDGE_TOKEN:-}
      - INGEST_MODEL=${INGEST_MODEL:-claude-sonnet-4-20250514}
    networks:
      - mcp-network
    restart: unless-stopped

networks:
  mcp-network:
    external: true
