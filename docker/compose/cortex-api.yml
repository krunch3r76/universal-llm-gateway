# cortex-api — REST gateway to cortex.db and todos.db
#
# Prerequisites (host):
#   - CORTEX_DATA_DIR defaults to ~/.cortex
#   - /tmp/universal-protocol/ must exist (created by Stargate or manage)
#
# Usage: docker compose -f docker/compose/cortex-api.yml up -d

services:
  cortex-api:
    build:
      context: ../..
      dockerfile: services/cortex-api/Dockerfile
    image: universal-cortex-api:local
    container_name: cortex-api
    user: "1000:1000"
    network_mode: none
    volumes:
      - ${CORTEX_DATA_DIR:-~/.cortex}:/data/cortex:rw
      - /tmp/universal-protocol:/tmp/universal-protocol
    environment:
      - CORTEX_DB_PATH=/data/cortex/cortex.db
      - TODOS_DB_PATH=/data/cortex/todos.db
      - AGENT_BUS_TOKEN=${AGENT_BUS_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket;s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM);s.connect('/tmp/universal-protocol/cortex-api.sock');s.sendall(b'GET /health HTTP/1.1\\r\\nHost: l\\r\\nConnection: close\\r\\n\\r\\n');d=s.recv(4096);s.close();assert b'200 OK' in d",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
