name: Documentation Check

on:
  pull_request:
    paths:
      - 'services/universal-stargate/**/*.py'
      - 'libs/**/*.py'

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for README_AI.md updates
        run: |
          # Find changed Python files in stargate
          CHANGED=$(git diff --name-only origin/main -- 'services/universal-stargate/**/*.py')
          
          if [ -n "$CHANGED" ]; then
            # Check if any README_AI.md was also changed
            README_CHANGED=$(git diff --name-only origin/main -- '**/README_AI.md')
            
            if [ -z "$README_CHANGED" ]; then
              echo "⚠️  WARNING: Stargate code changed without README_AI.md update"
              echo "Consider updating relevant README_AI.md files."
              # Make this a hard error to enforce docs:
              # exit 1
            fi
          fi
