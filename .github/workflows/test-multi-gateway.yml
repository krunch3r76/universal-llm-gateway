name: Multi-Gateway Tests

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  dispatch-anti-drift-lane-a:
    name: Dispatch Anti-Drift — Lane A (offline registry coherence)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Lane A — registry coherence + parity (offline, no network)
      run: pytest -m offline libs -q --tb=short
      env:
        PYTHONPATH: libs

  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r services/universal-stargate/requirements.txt
        pip install pytest pytest-asyncio aiohttp pytest-aiohttp
    
    - name: Run authentication tests
      run: |
        cd services/universal-stargate
        pytest tests/test_multi_gateway_auth.py -v
    
    - name: Run failover tests
      run: |
        cd services/universal-stargate
        pytest tests/test_multi_gateway_failover.py -v
    
    - name: Run integration tests (if in full environment)
      if: false  # Disable integration tests in CI (require full services)
      run: |
        bash services/universal-stargate/tests/test_multi_gateway_integration.sh

