[project]
name = "universal-llm-gateway"
version = "2.0.0"
description = "High-performance LLM inference gateway with worker process management and RPC communication"
readme = "README.md"
authors = [
    {name = "krunch3r76", email = "biz@u26a4.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "tmp",
    "*.egg-info",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line-too-long

[tool.ruff.lint.per-file-ignores]
# Verbatim copy from agent-bus repo — exception names omit *Error suffix by design.
"services/agent-bus/src/db/turns.py" = ["N818"]
"services/agent-bus/src/db/threads.py" = ["N818"]
# Hyphenated service directory — N999 invalid-module-name for paths under event-service/.
"services/event-service/**/*.py" = ["N999"]
# Squashed git-subtree layout — directory name is not an importable module name.
"services/_universal-llm-gateway/**/*.py" = ["N999"]
"libs/process_ipc/core/serialization.py" = ["N802"]  # protobuf-shaped mock API
"services/_universal-llm-gateway/src/core/workers/process/communication/cleanup.py" = [
    "N802",
]  # event_factory PascalCase signal names
"services/_universal-llm-gateway/src/core/errors.py" = ["N818"]  # SyntaxErrorException

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
markers = [
    "offline: hermetic Lane A test (no network/services; stdlib + pytest + llm_adapters only)",
]

[tool.pyright]
# Add paths for pipeline handlers in pipelines.local/
extraPaths = [
    "services/universal-stargate",
    "libs",
]
