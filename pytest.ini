[pytest]
addopts = --import-mode=importlib
pythonpath = . libs services/universal-stargate
python_files = test_*.py *_test.py
norecursedirs = .git __pycache__ .pytest_cache .venv venv node_modules tmp
markers =
    integration: live-service tests (opt-in via ULG_DISPATCH_INTEGRATION=1)
    offline: hermetic Lane A test (no network/services; stdlib + pytest + llm_adapters only)
    live_x_display: do not stub count_x11_unix_clients (unit tests inject the table)
