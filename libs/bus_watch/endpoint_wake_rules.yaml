# First-match-wins endpoint wake qualification (top → bottom).
# Evaluated by qualify() in endpoint_wake_dispatcher.py; order is load-bearing.
rules:
  - id: drop_self_or_broadcast
    action: suppress
  - id: drop_orion_echo
    action: suppress
  - id: drop_stage_mgr_echo
    action: suppress
  # Pure ACK|/ROUTE| to stage mgr / grok-bot / web-anthropic / maestro only; compound
  # tails (+ REQUEST|… or pipe segments after the first clause) fall through below.
  - id: drop_ack_route_coord
    action: suppress
  - id: wake_maestro_ack_batch
    action: wake
  - id: wake_maestro_direct_address
    action: wake
  - id: wake_by_address
    action: wake
  - id: wake_by_name
    action: wake
  - id: refuse_address_mismatch
    action: suppress
  - id: drop_maestro_telemetry
    action: suppress
  - id: wake_cursor_gate_on_interm
    action: wake
  - id: drop_dispatch_intermediate
    action: suppress
  - id: wake_peer_sender
    action: wake
  - id: drop_routine_hop_closeout
    action: suppress
  - id: wake_gate_or_directive
    action: wake
  - id: wake_cse_allowlist
    action: wake
  - id: wake_grok_allowlist
    action: wake
  - id: default_suppress
    action: suppress
  # Post-qualify delivery refusal in scan_once, not a qualify() branch.
  - id: refuse_tab_unaddressed
    action: suppress
