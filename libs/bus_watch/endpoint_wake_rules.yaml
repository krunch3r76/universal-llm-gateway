# First-match-wins endpoint wake qualification (top → bottom).
# Evaluated by qualify() in endpoint_wake_dispatcher.py; order is load-bearing.
#
# Visibility policy (summarizer-5 / a:43648): ``default_suppress`` and
# ``drop_dispatch_intermediate`` still do not wake, but when ``scan_once`` resolves a
# subscribed route the ledger records a skipped tombstone with that rule id.
# Subject head COORD to a non-alias subscribed agent wakes (60s per-agent/thread
# cooldown on wake_coord_subscriber ledger rows); POINTER and subjects matching
# intermediate tokens (progress/admitted/…) stay suppressed but ledger-visible.
# Scan-only observation rule ids (not in this list): wake_worker_label_thread_subscriber.
rules:
  - id: drop_self_or_broadcast
    action: suppress
  - id: drop_orion_echo
    action: suppress
  - id: drop_stage_mgr_echo
    action: suppress
  # Pure ACK|/ROUTE| to stage mgr / grok-bot / web-anthropic / maestro only; compound
  # tails (+ REQUEST|… or pipe segments after the first clause) fall through below.
  - id: drop_ack_route_coord
    action: suppress
  - id: wake_maestro_ack_batch
    action: wake
  - id: wake_maestro_direct_address
    action: wake
  - id: wake_by_address
    action: wake
  - id: wake_by_name
    action: wake
  - id: refuse_address_mismatch
    action: suppress
  - id: drop_maestro_telemetry
    action: suppress
  - id: wake_cursor_gate_on_interm
    action: wake
  - id: drop_dispatch_intermediate
    action: suppress
  - id: wake_on_behalf_execution_reply
    action: wake
  - id: wake_peer_sender
    action: wake
  - id: drop_routine_hop_closeout
    action: suppress
  - id: wake_coord_subscriber
    action: wake
  - id: wake_gate_or_directive
    action: wake
  - id: wake_cse_allowlist
    action: wake
  - id: wake_grok_allowlist
    action: wake
  - id: default_suppress
    action: suppress
