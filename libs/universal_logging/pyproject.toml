[project]
name = "universal_logging"
version = "2.0.0"
description = "Production-ready, auto-initializing logging framework with zero-configuration setup, intelligent context detection, and comprehensive error handling"
readme = "README.md"
authors = [
    {name = "krunch3r76", email = "biz@u26a4.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]


