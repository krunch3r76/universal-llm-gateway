# Pin edits go live on Jupiter only — from io run: services/jupiter-cdp/pin-go-live [lane ...]
# See runbook:walgreens-sync-shift § Leg B (Pin go-live).

[lanes.fleet]
port = 9222
display = ":2"
profile = "~/.gateway/claude-ai-chrome-profile"
standing = true
lapsed_url_prefixes = []
extra_args = []

[lanes.messages]
port = 9250
display = ":3"
profile = "~/sms-bridge/profiles/messages-web"
standing = true
lapsed_url_prefixes = ["/web/welcome", "/web/authentication"]
extra_args = [
    "--ozone-platform=x11",
    "--disable-background-timer-throttling",
    "https://messages.google.com/web/u/0/conversations",
]

[lanes.ess]
port = 9260
display = ":3"
profile = "~/sms-bridge/profiles/ess-walgreens"
standing = true
lapsed_url_prefixes = []
extra_args = [
    "--ozone-platform=x11",
    "--disable-background-timer-throttling",
]

[lanes.gopuff]
port = 9270
display = ":3"
profile = "~/sms-bridge/profiles/gopuff"
standing = false
lapsed_url_prefixes = []
extra_args = ["--ozone-platform=x11", "--disable-background-timer-throttling", "https://www.gopuff.com/"]

[lanes.uber]
port = 9280
display = ":3"
profile = "~/sms-bridge/profiles/uber-web"
standing = false
lapsed_url_prefixes = []
extra_args = ["--ozone-platform=x11", "--disable-background-timer-throttling", "https://auth.uber.com/v2/"]

[lanes.calendar]
port = 9290
display = ":3"
profile = "~/.gateway/chrome-messages"
standing = true
lapsed_url_prefixes = ["workspace.google.com/intl", "accounts.google.com/signin"]
extra_args = [
    "--ozone-platform=x11",
    "--disable-background-timer-throttling",
    "https://calendar.google.com/calendar/u/0/r/week",
]
