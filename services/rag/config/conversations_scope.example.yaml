# Example fragment for ~/.gateway/rag.yaml (merge on the hub seat).
# Scope `conversations` indexes sealed continuity message envelopes only.

watch_directories:
  - path: /mnt/torus/mcp-data/files/notes/system/seals
    extensions: [.json, .messages.json]
    recursive: true
    exclude:
      - "*.source.jsonl"
      - "*.lock.*"
      - ".lock.*"
  - path: /mnt/torus/mcp-data/files/notes/system/transcripts
    extensions: [.md, .json]
    recursive: true

scopes:
  conversations:
    description: "Sealed operator/model dialogue tapes (L2 messages envelopes)"
    prefixes:
      - /mnt/torus/mcp-data/files/notes/system/seals/
    exclude_from_union: true
    vocab_mode: none
  session_transcripts:
    description: "Rendered transcript markdown (work-state; not in union all)"
    prefixes:
      - /mnt/torus/mcp-data/files/notes/system/transcripts/
    exclude_from_union: true
  all:
    union: true
    description: "Union of explicit scopes (excludes exclude_from_union scopes)"

knowledge_extraction:
  exclude_scopes:
    - conversations
