openapi: 3.1.0
info:
  title: Cortex API
  version: 1.0.0
  description: Contract snapshot for cortex-api HTTP surface (authoritative impl in libs/cortex_store).
paths:
  /assertions:
    get:
      summary: List assertions
      operationId: listAssertions
      parameters:
        - name: entity_id
          in: query
          schema:
            type: string
        - name: entity_id_prefix
          in: query
          schema:
            type: string
        - name: filter
          in: query
          schema:
            type: string
          description: Case-insensitive substring filter on claim text (LIKE)
        - name: seeded_by
          in: query
          schema:
            type: string
        - name: confidence
          in: query
          schema:
            type: string
        - name: review_status
          in: query
          schema:
            type: string
        - name: superseded
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: include_compaction_pointers
          in: query
          schema:
            type: boolean
            default: false
        - name: intent
          in: query
          schema:
            type: string
            enum: [summary, full]
            default: summary
          description: >-
            Response projection. summary (default): sparse hooks with truncated
            claim; full: enrichment rows with §6.10 compaction pipeline.
        - name: compact
          in: query
          schema:
            type: boolean
            default: false
          description: Boot-internal compact projection; bypasses intent.
      responses:
        "200":
          description: Assertion list (summary or full projection)
  /api/v1/doctrine/vision-digest:
    get:
      summary: Posture-stack vision digest
      operationId: getVisionDigest
      description: >-
        Live served projection of the foundation MAP with verbatim pillar law
        sentences, sha-pinned to the MAP bytes under CORTEX_FILES_ROOT.
      responses:
        "200":
          description: Vision digest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisionDigest"
        "404":
          description: MAP file missing under CORTEX_FILES_ROOT
        "400":
          description: MAP path resolves outside CORTEX_FILES_ROOT
components:
  schemas:
    VisionPillar:
      type: object
      required:
        - id
        - law_verbatim
        - must_not_redecide
        - falsifier
        - sot_uris
      properties:
        id:
          type: string
          description: Stable pillar id (pillar-1 … pillar-4)
        law_verbatim:
          type: string
          description: Byte-for-byte MAP **Law:** sentence (strip only)
        must_not_redecide:
          type: array
          items:
            type: string
          description: Clauses from Child arcs must not re-decide (split on ;)
        falsifier:
          type: string
        sot_uris:
          type: array
          items:
            type: string
          description: cortex:// and http(s) URIs from the SoT bullet
    VisionDigest:
      type: object
      required:
        - pillars
        - map_uri
        - map_sha256
        - generated_at
        - stale
        - source
      properties:
        pillars:
          type: array
          items:
            $ref: "#/components/schemas/VisionPillar"
          minItems: 4
          maxItems: 4
        map_uri:
          type: string
        map_sha256:
          type: string
        generated_at:
          type: string
          format: date-time
        stale:
          type: boolean
        source:
          type: string
          enum: [live]
