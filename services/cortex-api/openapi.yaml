openapi: "3.1.0"
info:
  title: cortex-api
  version: "1.0.0"
  description: >
    REST API for the Cortex knowledge system. Cortex holds entities and
    relationships (graph), epistemic state (confidence taxonomy), operational
    intent (todos), episodic memory (session journals), temporal awareness
    (deadlines with urgency), and provenance (evidence URIs). cortex-api is
    the sole access path to cortex.db and todos.db — no direct
    sql(db="cortex") from agents.

servers:
  - url: http://localhost
    description: >
      HTTP target for request paths below. The live service binds a Unix domain
      socket only at /tmp/universal-protocol/cortex-api.sock (see
      docker/compose/cortex-api.yml). Example:
      curl --unix-socket /tmp/universal-protocol/cortex-api.sock http://localhost/health

components:
  schemas:
    TodoCreate:
      type: object
      required: [id, title, domain]
      properties:
        id: { type: string }
        title: { type: string }
        domain:
          type: string
          description: >
            Domain within the context. Meaning shifts per context — service
            name in a software project, matter name in legal, lead type in
            job search, area in personal.
        context:
          type: string
          default: "universal-llm-gateway"
          description: >
            Life domain that generates this work. Not project-scoped — any
            trackable domain of life (e.g. "legal-case", "job-search",
            "personal", "universal-llm-gateway").
        priority: { type: string, default: "short_term" }
        description: { type: string, default: "" }
        refs: { type: object, default: {} }

    TodoStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [done, deferred, open]

    TodoItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
        priority: { type: string }
        domain:
          type: string
          description: Domain within the context (service, matter, lead type, area).
        context:
          type: string
          description: Life domain that generated this work.
        description: { type: string }
        refs:
          type: object
          additionalProperties: { type: string }
          default: {}
        notes: { type: string }
        created_at: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }

    TodoList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TodoItem" }

    EntityCreate:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        aliases:
          type: array
          items: { type: string }
          nullable: true
        attributes:
          type: object
          additionalProperties: true
          nullable: true
        notes: { type: string, nullable: true }
        source_uri: { type: string, nullable: true }

    EntitySummary:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        created_at: { type: string }

    EntityDetail:
      type: object
      properties:
        intent:
          type: string
          enum: [full]
          description: Discriminator field — always "full". Absent on legacy responses.
        id: { type: string }
        type: { type: string }
        name: { type: string }
        aliases:
          type: array
          items: { type: string }
          nullable: true
        attributes:
          type: object
          additionalProperties: true
          nullable: true
        notes: { type: string, nullable: true }
        source_uri: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
        assertions:
          type: array
          items: { $ref: "#/components/schemas/AssertionItem" }

    EntityCard:
      type: object
      description: |
        Card v0 (cortex-v2.4 §6.3). Stable, deterministic, bounded
        (~5–10KB target). Returned by `entity_get` when `intent=card`.
        The `predicate_summary` slot is populated via edge-derived heuristic
        synthesis (§6.7 fallback) and will be null only for tombstoned entities
        with no archival children.
      required: [intent]
      properties:
        intent: { type: string, enum: [card] }
        id: { type: string }
        type: { type: string }
        name: { type: string }
        summary_row: { type: string, nullable: true }
        status_summary:
          type: object
          additionalProperties: true
          nullable: true
        top_k_assertions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              claim: { type: string }
              confidence: { type: string }
              derivation_type: { type: string, nullable: true }
              valid_from: { type: string, nullable: true }
              observed_at: { type: string, nullable: true }
        edge_type_summary:
          type: array
          items:
            type: object
            properties:
              type_id: { type: string }
              count: { type: integer }
        archives_to_count: { type: integer }
        section_manifest:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              count: { type: integer }
        predicate_summary: { type: string, nullable: true }
        freshness:
          type: object
          additionalProperties: { type: string }
          nullable: true
        debug:
          type: object
          nullable: true
          properties:
            fetch_plan_row_volume: { type: integer }

    EntityList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EntitySummary" }

    AssertionCreate:
      type: object
      required: [entity_id, claim, confidence, evidence]
      properties:
        entity_id: { type: string }
        claim: { type: string }
        confidence:
          type: string
          enum: [confirmed, believed, suspected, hypothesized]
        evidence: { type: string }
        evidence_uris:
          type: array
          items: { type: string }
          nullable: true

    AssertionItem:
      type: object
      properties:
        id: { type: integer }
        entity_id: { type: string, nullable: true }
        claim: { type: string }
        confidence: { type: string }
        evidence: { type: string, nullable: true }
        evidence_uris:
          type: array
          items: { type: string }
          nullable: true
        predicate_form:
          type: string
          nullable: true
          description: |
            Peer projection of `claim` for FOL-B retrieval (Cortex v2.4 §6.7).
            Async-extracted by pipelines/predicate_extract/. NULL = not yet
            extracted; non-NULL = the projector's last successful output.
        created_at: { type: string }

    AssertionList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AssertionItem" }

    DeadlineItem:
      type: object
      properties:
        matter_id: { type: string }
        matter_name: { type: string }
        deadline_name: { type: string }
        deadline_date: { type: string, nullable: true }
        deadline_description: { type: string, nullable: true }

    DeadlineList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeadlineItem" }

    SessionJournalCreate:
      type: object
      required: [timestamp, agent, summary]
      properties:
        timestamp: { type: string }
        agent: { type: string }
        summary: { type: string }
        domains:
          type: array
          items: { type: string }
          nullable: true
        decisions:
          type: array
          items: { type: string }
          nullable: true
        open_items:
          type: array
          items: { type: string }
          nullable: true
        file_path: { type: string, nullable: true }

    SessionJournalItem:
      type: object
      properties:
        id: { type: integer }
        timestamp: { type: string }
        agent: { type: string }
        summary: { type: string }
        domains:
          type: array
          items: { type: string }
          nullable: true
        decisions:
          type: array
          items: { type: string }
          nullable: true
        open_items:
          type: array
          items: { type: string }
          nullable: true
        file_path: { type: string, nullable: true }

    SessionJournalList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionJournalItem" }

    SessionCloseRequest:
      type: object
      required: [session_id, agent, transcript_jsonl_path, session_summary_md, summary]
      properties:
        session_id:
          type: string
          description: "Pattern: {agent}-YYYY-MM-DD-HHMM"
        agent: { type: string }
        transcript_jsonl_path:
          type: string
          description: >
            Absolute path under CURSOR_AGENT_TRANSCRIPTS_ROOT (default
            ~/.cursor/projects/mnt-torus-projects-universal-llm-gateway/agent-transcripts),
            or relative to that root. The server reads the Cursor agent-transcripts
            JSONL at this path and assembles the verbatim layer. Paths outside the
            sandbox return 422 transcript_jsonl.invalid.
        session_summary_md:
          type: string
          description: >
            Agent-composed structural layer. MUST start with a "## Session Summary"
            heading and include decisions, files modified, continuation state.
            Concatenated to the assembled verbatim layer to produce the on-disk
            transcript.
        summary:
          type: string
          description: ">= 20 chars; synthesis of session"
        domains:
          type: array
          items: { type: string }
          nullable: true
        decisions:
          type: array
          items: { type: string }
          nullable: true
        open_items:
          type: array
          items: { type: string }
          nullable: true
        entity_ids:
          type: array
          items: { type: string }
          nullable: true
        prior_session_id:
          type: string
          nullable: true
          description: >
            Previous same-agent session id; creates a `continues` edge from
            this transcript to the prior. Omit only when this is the first
            session in an arc.
        handoff_prompt:
          type: string
          nullable: true
          description: >
            Agent-authored continuation prompt for the next session. Lands
            server-side as a reflective journal entry (kind="handoff",
            register="self") linked to this transcript via
            link_type="handoff_for".
        assistant_label:
          type: string
          nullable: true
          description: >
            H3 heading label for assistant blocks in the assembled verbatim
            layer. Defaults to "Assistant".
        dry_run:
          type: boolean
          default: false
          description: "Validate-only — assembles + composes in memory; no file or DB write."

    SessionCloseResponse:
      type: object
      required:
        [transcript_entity_id, transcript_path, journal_row_id, session_id, content_hash, turn_count, byte_count]
      properties:
        transcript_entity_id:
          type: string
          description: "e.g. transcript:cursor-2026-05-04-0844"
        transcript_path: { type: string }
        journal_row_id: { type: integer }
        session_id: { type: string }
        content_hash:
          type: string
          description: >
            SHA-256 of the on-disk composed transcript markdown
            (format: "sha256:<64 hex chars>"). Agents quote this in the
            user-facing completion line as response-payload provenance evidence
            (per provenance-discipline.mdc rule 1) instead of re-reading the file.
        turn_count:
          type: integer
          description: "Number of `## Turn N` blocks in the assembled verbatim layer."
        byte_count:
          type: integer
          description: "UTF-8 byte length of the on-disk composed transcript."
        handoff_entry_id:
          type: integer
          nullable: true
          description: >
            Reflective journal entry id when handoff_prompt was provided;
            null otherwise.
        transcript_warnings:
          type: array
          items: { type: string }
          description: "Advisory structural warnings (non-blocking)"
        _warning:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Audit warnings from pre-close gate (warn mode) and/or post-close
            detectors.

    BootContinuityResponse:
      type: object
      properties:
        last_session:
          type: object
          properties:
            session_id: { type: string }
            agent: { type: string }
            timestamp: { type: string }
            summary: { type: string }
            transcript_entity_id: { type: string }
          nullable: true
        handoff:
          type: object
          properties:
            entry_id: { type: integer }
            text: { type: string }
          nullable: true
          description: "Verbatim handoff prompt from prior session"
        continuity_chain:
          type: array
          items: { type: string }
          description: "Ordered session_ids forming the recent chain"
        continuations:
          type: array
          items: { type: string }
          description: "Sibling continuations from the prior session, if any"
        hints:
          type: array
          items: { type: string }
          description: 'Continuity provenance hints (e.g. "prior_session_id_omitted")'

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }

paths:
  /health:
    get:
      operationId: health
      summary: Health check (no auth)
      security: []
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  cortex_db: { type: string }
                  todos_db: { type: string }

  /todos:
    get:
      operationId: listTodos
      summary: List todos with optional filters
      parameters:
        - name: status
          in: query
          schema: { type: string, default: "open" }
        - name: context
          in: query
          description: >
            Filter by life domain (e.g. "universal-llm-gateway",
            "legal-case", "job-search", "personal"). Exact match.
            Examples: "universal-llm-gateway", "legal-case".
          schema: { type: string }
        - name: domain
          in: query
          description: >
            Filter by domain within context (substring match). Meaning
            varies by context — service name, matter name, lead type, etc.
            Examples: "cortex-api", "Acme acquisition", "AI lead".
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Filtered todo list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TodoList" }
    post:
      operationId: createTodo
      summary: Create a new todo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TodoCreate" }
      responses:
        "201":
          description: Created todo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TodoItem" }
        "409":
          description: A todo with the provided ID already exists.

  /todos/{todo_id}:
    patch:
      operationId: updateTodoStatus
      summary: Update todo status (done, deferred, open)
      parameters:
        - name: todo_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TodoStatusUpdate" }
      responses:
        "200":
          description: Updated todo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TodoItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /entities:
    get:
      operationId: listEntities
      summary: List entities with optional type filter
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Entity list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityList" }
    post:
      operationId: createEntity
      summary: Create a new entity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntityCreate" }
      responses:
        "201":
          description: Created entity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityDetail" }
        "409":
          description: An entity with the provided ID already exists.

  /entities/{entity_id}:
    get:
      operationId: getEntity
      summary: Get entity at requested read intent (v2.4 §6.1)
      parameters:
        - name: entity_id
          in: path
          required: true
          schema: { type: string }
        - name: intent
          in: query
          required: false
          description: |
            v2.4 §6.1 read intent. `full` (default) preserves the EntityDetail
            payload. `card` returns Card v0 (§6.3) via a projection-aware fetch.
            `cluster` and `impact` are reserved but not implemented in Slice 1
            (501).
          schema:
            type: string
            enum: [full, card, cluster, impact]
            default: full
        - name: include_edges
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: edge_limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: include_compaction_pointers
          in: query
          required: false
          description: §6.10 (full intent only)
          schema: { type: boolean, default: false }
        - name: debug
          in: query
          required: false
          description: §7.8 — attaches fetch_plan_row_volume on intent=card
          schema: { type: boolean, default: false }
        - name: top_k
          in: query
          required: false
          description: v2.4 §6.3 — top-K active assertions in Card v0 (intent=card only)
          schema: { type: integer, default: 7, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: |
            Entity detail (intent=full) or Card v0 (intent=card). Discriminated
            by the `intent` field on the card payload; `full` responses do not
            carry an `intent` key.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/EntityDetail"
                  - $ref: "#/components/schemas/EntityCard"
                discriminator:
                  propertyName: intent
                  mapping:
                    full: "#/components/schemas/EntityDetail"
                    card: "#/components/schemas/EntityCard"
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          description: intent reserved but not implemented (cluster, impact)

  /assertions:
    get:
      operationId: listAssertions
      summary: List assertions with optional filters
      parameters:
        - name: entity_id
          in: query
          schema: { type: string }
        - name: confidence
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Assertion list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssertionList" }
    post:
      operationId: createAssertion
      summary: Create a new assertion about an entity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssertionCreate" }
      responses:
        "201":
          description: Created assertion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssertionItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Referenced entity not found

  /deadlines:
    get:
      operationId: listDeadlines
      summary: Get matters with deadlines view
      responses:
        "200":
          description: Deadline list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeadlineList" }

  /session-journals:
    get:
      operationId: listSessionJournals
      summary: List recent session journals
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 3 }
      responses:
        "200":
          description: Session journal list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionJournalList" }
    post:
      operationId: createSessionJournal
      summary: Create a session journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionJournalCreate" }
      responses:
        "201":
          description: Created session journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionJournalItem" }

  /session-journals/close:
    post:
      operationId: closeSession
      summary: Atomic session close (transcript + entity + journal + continues edge + optional handoff)
      description: >
        Single-transaction session close. Writes transcript file, creates
        `transcript:{session_id}` entity, inserts the session journal row,
        creates a `continues` edge to `prior_session_id` if provided, and
        optionally inserts a reflective journal handoff entry linked to the
        transcript. Rejects stub transcripts and dual-layer-hollow transcripts
        with 422. Post-close detector (`prior_session_id_omitted`) attaches
        warnings to `_warning` but does not block (`missing_handoff` retired
        — handoff absence is not a gap). See agent-skills/web-session-close.md and
        agent-skills/session-close-audit.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionCloseRequest" }
      responses:
        "201":
          description: Session closed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCloseResponse" }
        "422":
          description: >
            Validation failed. Reason codes: transcript.hollow,
            transcript.missing_structure, summary.too_short, session_id.invalid,
            transcript_jsonl.invalid (path missing, outside sandbox, or JSONL
            parse error), session_summary.invalid (missing '## Session Summary'
            heading), session.already_closed (carries prior IDs in detail
            object — treat as success).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  reason: { type: string }

  /boot-continuity:
    get:
      operationId: getBootContinuity
      summary: Continuity payload for an agent's next boot card
      description: >
        Returns the prior session's handoff prompt (if captured), the
        recent continuity chain, and any sibling continuations. Used for
        explicit handoff retrieval by agents moving to a fresh context.
        The boot card renders the session summary, not handoff prose;
        handoffs are not auto-surfaced at boot.
      parameters:
        - name: agent
          in: query
          required: true
          schema: { type: string }
          description: "Agent whose latest session continuity to render"
      responses:
        "200":
          description: Continuity payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootContinuityResponse" }
