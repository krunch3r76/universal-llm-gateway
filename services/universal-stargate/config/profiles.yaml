# Generation Parameter Profiles
# 
# This file defines generation parameter profiles for different use cases.
# Profiles are structured with shared parameters (work across all engines)
# and engine-specific parameters (llama_cpp, vllm).
#
# Structure:
#   profiles:
#     profile-name:
#       description: "Profile description"
#       system_prompt: "Optional system prompt for this profile"
#       # Shared parameters (all engines)
#       temperature: 0.7
#       top_p: 0.9
#       top_k: 50
#       # Engine-specific parameters
#       llama_cpp:
#         repeat_penalty: 1.1
#         min_p: 1.0
#       vllm:
#         presence_penalty: 0.1  # auto-converted if empty
#
# If 'vllm' section is empty or missing, parameters will be auto-converted
# from the llama_cpp section at runtime.
#

profiles:
  general-chat:
    description: Balanced, natural conversation - good for general chat interactions
    system_prompt: |
      You are a helpful, friendly, and knowledgeable AI assistant.
      
      **Communication Style:**
      - Use clear, standard American English unless the user requests another language.
      - Match the user's formality level (casual for informal queries, professional for business/technical topics).
      - Maintain a conversational tone while prioritizing clarity and accuracy.
      - Be concise but thorough. Acknowledge uncertainty rather than guessing.
      
      **Technical Content:**
      - Preserve code snippets, identifiers, and technical terms exactly as provided.
      - Explain technical concepts in accessible language while maintaining accuracy.
      - Provide clear, accurate, and engaging responses.
    temperature: 0.7
    top_p: 0.9
    top_k: 50
    llama_cpp:
      min_p: 1.0
      typical_p: 1.0
      repeat_penalty: 1.1
      tfs_z: 1.0
      mirostat_mode: 0
    vllm:
      presence_penalty: 0.1  # Converted from repeat_penalty: 1.1
      frequency_penalty: 0.0  # Optional: can add if you want to penalize repetition more
  
  factual-qa:
    description: Conservative, low hallucination - optimized for factual question answering
    system_prompt: "You are a precise and accurate AI assistant focused on providing factual information. Always base your responses on verified knowledge. If you're uncertain about something, clearly state your uncertainty. Avoid speculation and prioritize accuracy over creativity."
    temperature: 0.3
    top_p: 0.92
    top_k: 40
    llama_cpp:
      min_p: 1.0
      typical_p: 1.0
      repeat_penalty: 1.12
      tfs_z: 1.0
      mirostat_mode: 0
    vllm:
      presence_penalty: 0.12  # Converted from repeat_penalty: 1.12
      frequency_penalty: 0.1  # Additional penalty to reduce repetition in factual content
  code-generation:
    description: Tight structure, deterministic-ish - best for code generation tasks
    system_prompt: ""
    temperature: 0.2
    top_p: 0.9
    top_k: 50
    llama_cpp:
      min_p: 1.0
      typical_p: 1.0
      repeat_penalty: 1.15
      tfs_z: 1.0
      mirostat_mode: 0
    vllm:
      presence_penalty: 0.0
      frequency_penalty: 0.1
  json-output:
    description: Structured output friendly - optimized for JSON and structured data
    system_prompt: "You are a structured data assistant. Always respond with valid, well-formatted JSON. Ensure proper syntax, consistent field naming, and logical data organization. Include all requested fields and use appropriate data types. Validate your JSON output for correctness."
    temperature: 0.2
    top_p: 1.0
    top_k: 40
    response_format:
      type: "json_object"
    llama_cpp:
      min_p: 1.0
      typical_p: 1.0
      repeat_penalty: 1.1
      tfs_z: 1.0
      mirostat_mode: 0
    vllm:
      presence_penalty: 0.1  # Converted from repeat_penalty: 1.1
  creative:
    description: High entropy storytelling - ideal for creative writing and narratives
    system_prompt: "You are a creative writing assistant with a vivid imagination. Craft engaging, original stories with rich descriptions, compelling characters, and immersive narratives. Use varied vocabulary, creative metaphors, and dynamic storytelling techniques. Embrace creativity while maintaining narrative coherence."
    temperature: 0.9
    top_p: 0.95
    top_k: 60
    llama_cpp:
      min_p: 1.0
      typical_p: 1.0
      repeat_penalty: 1.05
      tfs_z: 1.0
      mirostat_mode: 0
    vllm:
      presence_penalty: 0.05  # Converted from repeat_penalty: 1.05 (low for creativity)
      frequency_penalty: 0.0  # Allow repetition for stylistic effect
  mirostat:
    description: Steady long-form with Mirostat v2 - consistent quality for long outputs
    system_prompt: "You are an AI assistant optimized for long-form content generation. Maintain consistent quality, coherent structure, and steady pacing throughout extended responses. Focus on comprehensive coverage while avoiding repetition and maintaining reader engagement across lengthy outputs."
    temperature: 0.6
    top_p: 1.0
    top_k: 0
    llama_cpp:
      min_p: 1.0
      typical_p: 1.0
      repeat_penalty: 1.1
      tfs_z: 1.0
      mirostat_mode: 2
      mirostat_tau: 5.5
      mirostat_eta: 0.12
    vllm:
      presence_penalty: 0.1  # Converted from repeat_penalty: 1.1
      # Note: mirostat_mode not supported in vLLM, using standard penalties instead
  summarization:
    description: Concise, faithful - optimized for text summarization
    system_prompt: "You are a summarization specialist. Create concise, accurate summaries that capture the essential information and key points. Maintain the original meaning while eliminating redundancy. Structure summaries logically and ensure they are self-contained and informative."
    temperature: 0.3
    top_p: 0.9
    top_k: 40
    llama_cpp:
      min_p: 1.0
      typical_p: 1.0
      repeat_penalty: 1.1
      tfs_z: 1.0
      mirostat_mode: 0
    vllm:
      presence_penalty: 0.1  # Converted from repeat_penalty: 1.1
      frequency_penalty: 0.1  # Reduce redundancy in summaries
  translation:
    description: Literal, low drift - best for translation tasks
    system_prompt: "You are a professional translator focused on accuracy and cultural sensitivity. Provide precise translations that preserve the original meaning, tone, and context. Maintain consistency in terminology and style. When cultural adaptation is needed, explain your choices while staying faithful to the source material."
    temperature: 0.2
    top_p: 0.9
    top_k: 40
    llama_cpp:
      min_p: 1.0
      typical_p: 1.0
      repeat_penalty: 1.05
      tfs_z: 1.0
      mirostat_mode: 0
    vllm:
      presence_penalty: 0.05  # Converted from repeat_penalty: 1.05 (low for literal translation)
  rag:
    description: Don't hallucinate outside context - optimized for RAG and context-grounded QA
    system_prompt: "You are a context-aware AI assistant. Base your responses strictly on the provided context and documents. If information is not available in the given context, clearly state this limitation. Avoid speculation beyond the provided materials and cite relevant sections when possible."
    temperature: 0.3
    top_p: 0.9
    top_k: 40
    llama_cpp:
