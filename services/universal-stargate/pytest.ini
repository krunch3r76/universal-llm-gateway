[pytest]
# Pytest configuration to avoid root __init__.py discovery issues
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests
norecursedirs = .git __pycache__ .pytest_cache .venv venv node_modules
# `.` stays first (pytest inserts pythonpath in reverse). `../../libs` is this
# checkout, and must precede the hub libs sitecustomize already put on sys.path.
# Without it, `import job_vocab` binds the hub JobRecord.
pythonpath = . ../.. ../../libs
# Prevent pytest from importing package __init__.py
addopts = --import-mode=importlib
markers =
    offline: hermetic Lane A test (no network/services; stdlib + pytest + llm_adapters only)
    live_giw: opt-in tests that require the live git-integration-worker registry

