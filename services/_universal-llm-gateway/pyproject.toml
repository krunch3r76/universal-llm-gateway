[project]
name = "universal-llm-gateway"
version = "2.0.0"
description = "High-performance gateway for serving Large Language Models with advanced queuing, streaming, and resource management"
readme = "README.md"
authors = [
    {name = "krunch3r76", email = "biz@u26a4.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "tmp",
    "*.egg-info",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
