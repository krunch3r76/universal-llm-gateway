# Gateway settings (timeouts and resource management only)
# Note: gateway.url removed - use federation.local_gateway.socket_path instead
gateway:
  timeout: 30.0
  connectivity_timeout: 10.0
  health_timeout: 2.0
  request_timeout: 1800
  streaming_timeout: 1800
  resource_management:
    max_concurrent_model_loads: 1
    model_loading_slot_acquisition_timeout: 0.25
    reservation_timeout: 300
    reservation_cleanup_interval: 30
    enable_reservation_monitoring: true
  capabilities:
    cpu_performance: high
    hybrid_performance: high
  max_concurrent_cpu_models: 50
  max_concurrent_gpu_models: 10

# Proxy settings
proxy:
  port: 9999
  host: "0.0.0.0"  # Listen on all interfaces for master connection
  cors_enabled: true

# Federation: Remote mode (connects TO Master)
# REQUIRED Environment Variables:
#   FEDERATION_KEY - API key for Master authentication
federation:
  mode: "remote"
  stargate_id: "jupiter"
  protocol_version: "1.0"
  
  # Master to connect TO (Remote-initiates WebSocket)
  master:
    stargate_id: "io"
    url: "http://io:9999"  # Master's base URL (for WebSocket connection)
    api_key: "${FEDERATION_KEY}"
  
  local_gateway:
    socket_path: "/sockets/gateway.sock"  # Unix socket for local Stargate → Gateway
    url: null  # Socket mode, not HTTP
    gateway_id: "jupiter/gateway"
    public_url: "http://jupiter:9999"  # CRITICAL: URL for Master to reach this Stargate
  
  max_hops: 3
  require_tls: false
  ping_interval_ms: 15000
  
  # CRITICAL: Bounded backoff (30s max)
  reconnect_interval_ms: 1000
  max_reconnect_delay_ms: 30000
  max_reconnect_attempts: 10

# Logging
logging:
  level: "DEBUG"
  enable_console: true
  enable_file: true
  log_dir: "/tmp/logs/universal-stargate"  # Local stargate log directory