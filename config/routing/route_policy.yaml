policy_source: consult-routing
policy_version: '2026-09-30'
lead_claim_authority: server_contract_overrides_packet_prose
cdp_reroute:
  enabled: true
  target_model: cursor/gemini-4-argon
  effort: high
  match_prefixes:
  - cdp/opus
  - cdp/fable
default_seat: cursor-sdk
dispatch_lane:
  code:
    platform: sdk
    seat: cursor-sdk
    work:
    - recon
    - review-on-source
    - implement
    - sketch
    - pure-mechanical
  non_code:
    substrate: api
    roles:
    - reviewer
    - skeptic
    - synthesizer
    - artisan
    work:
    - adversarial
    - life-domain
    - correspondence
    - analysis
  overrides:
    code_on_api:
      description: "API reviewer over a pasted diff or checkout-free self-contained\
        \ recon; advisory dispatch_lane label only \u2014 does not change role identity."
  substrate_guard:
    rule: cursor/* models never appear under allowed_models on API roles
    enforcement: "route ordering \u2192 is_auto_seat_generate_admission \u2192 resolve_auto_seat_generate_target\
      \ \u2192 sdk_substrate_required (422) when seat= is absent and cursor/* is requested\
      \ on an API role"
routes:
  implement:
    cursor-sdk:
      dispatch_kind: implement
      transport: team_dispatch
      autonomy: auto_executed
      operator_pickup_required: false
    cursor-implement:
      dispatch_kind: implement
      transport: team_dispatch
      autonomy: manual_pickup
      operator_pickup_required: true
    web-implement:
      dispatch_kind: implement
      transport: team_dispatch
      autonomy: manual_pickup
      operator_pickup_required: true
  wrap:
    cursor-sdk:
      dispatch_kind: wrap
      transport: team_dispatch
      autonomy: auto_executed
      operator_pickup_required: false
  sketch:
    cursor-sdk:
      dispatch_kind: sketch
      transport: team_dispatch
      autonomy: auto_executed
      operator_pickup_required: false
  conductor:
    cursor-sdk:
      dispatch_kind: conductor
      transport: team_dispatch
      autonomy: auto_executed
      operator_pickup_required: false
  pure-mechanical:
    cursor-sdk:
      dispatch_kind: pure-mechanical
      transport: team_dispatch
      autonomy: auto_executed
      operator_pickup_required: false
workflows:
  mechanical_implement:
    seat: cursor-sdk
    model: cursor/composer-2.5
    jobs:
    - implement
  investigate:
    seat: cursor-sdk
    model: cursor/grok-4.7
    jobs:
    - investigate
    - recon
    - seed
  auto_judgment:
    seat: cursor-sdk
    model: cursor/grok-4.7
    jobs:
    - answer
    - confer
    - ask
    - verify
    - execute
    - propagate
    - sketch
    - none
    - conductor
  check_review:
    seat: cursor-sdk
    model: cursor/grok-4.7
    contracts: []
models:
  composer-2.5:
    roaming: true
  grok-4.7:
    roaming: true
contract_effort:
  investigate: high
  confer: high
  seed: low
  conductor: low
  freeform: low
  verify: high
  execute: high
  propagate: high
  implement: medium
  recon: medium
  ask: high
  answer: high
