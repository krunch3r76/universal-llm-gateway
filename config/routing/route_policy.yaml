# Machine-readable routing policy — single source for resolver + consult-routing drift check.
policy_source: consult-routing
policy_version: "2026-09-02"
lead_claim_authority: server_contract_overrides_packet_prose

# Auto-dispatch default seat for code-lane generate (seat= selector, not role=).
default_seat: cursor-sdk

# Check/review standing default (decision:code-review-panel-cursor-substrate).
# Code-lane automated review → cursor/* (checkout present). Explicit model=openai/*
# on role=reviewer still admits API (life / checkout-free). Omit-model on
# role=reviewer coerces to seat=cursor-sdk + this key when the key is cursor/*.
# CDP (cdp/opus-5 / Fable) remains judgment / path-sim R-admit — not this default.
# Prior API-default bind: assertion:23920 (superseded for code-lane default).
check_review_default_model: cursor/gpt-5.6-terra  # decision:code-review-panel-cursor-substrate

# Doc-layer dispatch_lane (advisory, not a RoleProfile or hard gate).
# Derive code vs non-code from platform: sdk ⇒ code (checkout present);
# API roles (reviewer/skeptic/synthesizer/artisan) ⇒ non-code.
dispatch_lane:
  code:
    platform: sdk
    seat: cursor-sdk
    work: [recon, review-on-source, implement, light-bounded, pure-mechanical]
  non_code:
    substrate: api
    roles: [reviewer, skeptic, synthesizer, artisan]
    work: [adversarial, life-domain, correspondence, analysis]
  overrides:
    code_on_api:
      description: >-
        API reviewer over a pasted diff or checkout-free self-contained recon;
        advisory dispatch_lane label only — does not change role identity.
  substrate_guard:
    rule: cursor/* models never appear under allowed_models on API roles
    enforcement: >-
      route ordering → is_auto_seat_generate_admission →
      resolve_auto_seat_generate_target → sdk_substrate_required (422) when
      seat= is absent and cursor/* is requested on an API role

routes:
  # Advisory preferred_model (doc/comment only — resolver does not enforce):
  #   implement → cursor/composer-2.5 (seat default)
  #   recon / investigate-emphasis light-bounded → cursor/grok-4.6 via contract=investigate|recon|seed
  #   pure-mechanical inventory → Composer OK
  #   resident task-class→model table → consult-routing § Task-class model reference
  implement:
    cursor-sdk:
      dispatch_kind: implement
      transport: team_dispatch
      autonomy: auto_executed
      operator_pickup_required: false
    cursor-implement:
      dispatch_kind: implement
      transport: team_dispatch
      autonomy: manual_pickup
      operator_pickup_required: true
    web-implement:
      dispatch_kind: implement
      transport: team_dispatch
      autonomy: manual_pickup
      operator_pickup_required: true
  wrap:
    cursor-sdk:
      dispatch_kind: wrap
      transport: team_dispatch
      autonomy: auto_executed
      operator_pickup_required: false
  light-bounded:
    cursor-sdk:
      dispatch_kind: light-bounded
      transport: team_dispatch
      autonomy: auto_executed
      operator_pickup_required: false
  pure-mechanical:
    cursor-sdk:
      dispatch_kind: pure-mechanical
      transport: team_dispatch
      autonomy: auto_executed
      operator_pickup_required: false

# Workflow → {seat, model} registry (todo:model-workflow-config-first, P0).
# Sole authority for every GIW cursor-auto omit-model resolution. Readers cache
# at process start: edit here → verify_workflow_registry_conformance() →
# `manage sync_restart git_integration_worker`. Loader rejects the file when
# any Auto contract is unclaimed or claimed twice.
workflows:
  mechanical_implement:
    # Compose leg of bind-then-compose: redirect_mechanical_executor lands here
    # whatever model the orchestrator named (unless that model is roaming).
    seat: cursor-sdk
    model: cursor/composer-2.5
    contracts: [implement]
  investigate:
    seat: cursor-sdk
    model: cursor/composer-2.5
    contracts: [investigate, recon, seed]
  auto_judgment:
    seat: cursor-sdk
    model: cursor/composer-2.5
    contracts: [answer, confer, ask, verify, execute, propagate, light-bounded]

# Per-model policy keyed by bare cursor id (CURSOR_MODEL_CAPABILITIES key).
# roaming: cheap enough per agent step that a contract: override may waive the
# empty-scope refusal (dispatch_bounds.scope_waiver_allowed).
# deprecated: true + allowed_workflows: [slug, …] → loader rejects any other
# workflows.*.model reference to it. Re-enable = drop the flag or add the slot.
models:
  composer-2.5:      {roaming: true}
  composer-2.5-fast: {roaming: true}
  grok-4.6:          {roaming: true}
