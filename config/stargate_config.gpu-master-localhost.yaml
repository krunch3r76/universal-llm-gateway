# PRODUCTION: Multi-Host GPU Deployment Configuration
# 
# USE CASE: Production deployment spanning multiple physical GPU workstations
# SCRIPT: ./scripts/deploy-gpu-relay.sh
#
# ARCHITECTURE:
#   Master Stargate (localhost:9999, host process)
#     ├─ Local Edge+Gateway (Unix socket → Docker container on localhost)
#     │  Socket: /tmp/universal-protocol/edge-localhost.sock
#     │
#     └─ Remote Relay Stargate (TCP → Jupiter physical machine at jupiter:9999)
#        └─ Remote Edge+Gateway (Docker container on Jupiter)
#
# DISTINCTION FROM dev-localhost-only.yaml:
#   - Multi-machine: localhost + Jupiter (physical GPU workstation)
#   - Local connection: Unix socket (high performance)
#   - Remote connection: TCP across network
#   - Authentication: Separate federation keys per remote host

# Proxy settings - client-facing endpoint
proxy:
  port: 9999
  host: "0.0.0.0"
  cors_enabled: true

# Federation: Master mode (Router-Only)
federation:
  mode: master
  stargate_id: master-localhost
  
  # Relay topology: WebSocket telemetry (default)
  ping_interval_ms: 15000
  
  # Orchestration configuration
  orchestration:
    load_timeout: 180  # Wall-clock timeout for Remote load (seconds)
    telemetry_staleness_threshold: 30  # Telemetry trust window (seconds)
    # NOTE: Should be > ping_interval to avoid spurious stale detection
  
  # Local Edge Stargate (Unix socket to container on same host)
  local_edge:
    socket_path: "/tmp/universal-protocol/edge-localhost.sock"
    stargate_id: "edge-localhost"
    api_key: "${FEDERATION_KEY_EDGE_LOCALHOST}"
  
  # Remote Relay Stargate endpoints (other workstations)
  remotes:
    # Jupiter Relay (remote workstation)
    - stargate_id: relay-jupiter
      url: "http://jupiter:9999"
      api_key: "${FEDERATION_KEY_JUPITER}"
      telemetry_log_level: "DEBUG"

# Logging
logging:
  level: "DEBUG"
  enable_console: true
  enable_file: true
  log_dir: "/tmp/logs/universal-stargate-gpu-master"

# Debug event persistence for post-mortem debugging
debug_events:
  persistence:
    enabled: true
    directory: "/tmp/stargate-events"
    max_file_size_mb: 50
    max_files: 3
    flush_interval_seconds: 1.0

# Model routing - default configuration
model_routing:
  default_sticky: true
  sticky_overrides:
    zyphra-zr1-1-5b-q8-0-16384-cpu: false

# Request queue
request_queue:
  max_size: 1000
  default_timeout: 300
  queue_timeout: 1800  # Unified capacity queue timeout (30 min)
  upstream_retry_timeout: 120  # Retry budget for retryable upstream 502 errors (seconds)
  non_sticky:
    enabled: true

# Pipeline configuration
pipelines:
  search_paths:
    - "pipelines"
    - "pipelines.local"
    - "~/.pipelines"
  hot_reload:
    enabled: true
    debounce_ms: 2000
  defaults:
    save_execution_summary: true
    summary_format: markdown
    timeout_seconds: 180

# Routing configuration
routing:
  scoring:
    warm_weight: 100
    slack_weight: 10
    contention_weight: 50
    staleness_weight: 30
    eviction_weight: 20
    affinity_weight: 200
    stability_weight: 40
    eviction_margin: 50
    capacity: {}
  affinity:
    - match: "hermes3-llama-3.1-70b-uncensored-16384-hybrid"
      stargate: "edge-jupiter-gateway"
      strength: "hard"
      evict_if_needed: true
    
    - match: "hermes3-*"
      stargate: "edge-jupiter-gateway"
      strength: "soft"
      bonus: 50
