# Relay Stargate Configuration Template
# Host process that connects TO Master via WebSocket and manages a local Edge container.
# Router-only — no local Gateway (execution is on the Edge).
#
# Required environment variables:
#   RELAY_ID               - Relay identifier (e.g., relay-jupiter)
#   MASTER_HOST            - Master's network address (e.g., io, 192.168.1.10)
#   FEDERATION_KEY_RELAY   - Key for authenticating TO Master
#   NODE_ID                - Local hostname (e.g., jupiter) — derives socket path
#   FEDERATION_KEY_EDGE    - Key for authenticating TO local Edge container

gateway:
  url: null

proxy:
  port: 9999
  host: "0.0.0.0"
  cors_enabled: true

federation:
  mode: remote
  stargate_id: "${RELAY_ID}"

  master:
    stargate_id: "master-localhost"
    url: "http://${MASTER_HOST}:9999"
    api_key: "${FEDERATION_KEY_RELAY}"

  local_edge:
    socket_path: "/tmp/universal-protocol/edge-${NODE_ID}.sock"
    stargate_id: "edge-${NODE_ID}"
    api_key: "${FEDERATION_KEY_EDGE}"

  reconnect_interval_ms: 1000
  max_reconnect_delay_ms: 30000
  ping_interval_ms: 15000

logging:
  level: "DEBUG"
  enable_console: true
  enable_file: true
  log_dir: "/tmp/logs/universal-stargate-relay"

debug_events:
  persistence:
    enabled: true
    directory: "/tmp/stargate-events"
    max_file_size_mb: 50
    max_files: 3
    flush_interval_seconds: 1.0

model_routing:
  default_sticky: true

request_queue:
  max_size: 1000
  default_timeout: 300

routing:
  scoring:
    capacity: {}
