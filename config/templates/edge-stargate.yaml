# Edge Stargate Configuration Template
# Network-isolated container running Edge Stargate + Gateway.
# Communicates ONLY via Unix socket — no TCP ports exposed.
#
# Required environment variables (set by compose):
#   REMOTE_ID              - Edge identifier (e.g., edge-localhost)
#   STARGATE_SOCKET_PATH   - Unix socket path
#   FEDERATION_KEY_EDGE    - Federation authentication key (optional when auth disabled)

gateway:
  url: "http://localhost:9998"
  timeout: 30.0
  connectivity_timeout: 10.0
  health_timeout: 2.0
  request_timeout: 1800
  streaming_timeout: 1800
  resource_management:
    max_concurrent_model_loads: 1
    model_loading_slot_acquisition_timeout: 0.25
    reservation_timeout: 300
    reservation_cleanup_interval: 30
    enable_reservation_monitoring: true
  capabilities:
    cpu_performance: high
    hybrid_performance: high
  max_concurrent_cpu_models: 50
  max_concurrent_gpu_models: 10

proxy:
  port: null
  host: null
  socket_path: "${STARGATE_SOCKET_PATH}"
  cors_enabled: false

federation:
  mode: edge
  stargate_id: "${REMOTE_ID}"

# Network-isolated edge — auth unnecessary (Unix socket from trusted host only)
authorization:
  enabled: false

logging:
  level: "DEBUG"
  enable_console: true
  enable_file: true
  log_dir: "/golem/logs/stargate"

debug_events:
  persistence:
    enabled: true
    directory: "/tmp/stargate-events"
    max_file_size_mb: 50
    max_files: 3
    flush_interval_seconds: 1.0

model_routing:
  default_sticky: true

request_queue:
  max_size: 1000
  default_timeout: 300

routing:
  scoring:
    capacity: {}
