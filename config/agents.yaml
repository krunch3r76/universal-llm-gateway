# config/agents.yaml — agent capability and role configuration
#
# Single source of truth for CapabilityProfile (family × platform cells),
# RoleProfile (functional team roles), and lead_seats (operator lead slugs).
# Loaded at runtime by libs/agent_seat/profiles.py.
#
# Profile keys: "<family>/<platform>"
# Profile fields map 1:1 to CapabilityProfile dataclass fields.
# Optional fields omitted here use their dataclass defaults:
#   allowed_models: []  model_requirement: null  capability_tier: null
#   api_dispatchable: false  auto_dispatchable: false  manual_handoff: false
#   session_limit: 3  self_reflections_limit: 5

# Operator lead seats — material-decision posture (consensus-steelman rule 0).
# Claude + GPT Cursor today. Add gemini-cursor after gemini MCP wiring verify.
lead_seats:
  - claude-web
  - claude-cursor
  - gpt-cursor


# Eager skill-body injection budgets (libs/agent_seat/inject_budget.py).
# Typed repository config — not environment-tunable.
skill_delivery:
  body_budget_bytes: 50000
  handoff_inline_budget_bytes: 131072
  index_timeout_ms: 300
  body_timeout_ms: 300
  total_deadline_ms: 1500

profiles:

  claude/cursor:
    # Manual IDE seat — team_dispatch(op="handoff", seat="claude-cursor", contract="consult"|"implement", ...)
    # creates an agent-bus thread for a dedicated Cursor session (e.g. Opus). Not a
    # team_dispatch generate target (manual_handoff: true), same admission as claude/web.
    provider: anthropic
    default_model: anthropic/claude-sonnet-4-6
    tool_surface: mcp
    mcp_surface: code
    delivery: manual
    manual_handoff: true
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda:
      - session-close-pointer-cursor
      - session-close-markdown-audit
      - session-close-transcript
    allowed_models:
      - anthropic/claude-sonnet-4-6
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8

  claude/api:
    provider: anthropic
    default_model: anthropic/claude-sonnet-4-6
    tool_surface: mcp
    mcp_surface: code
    delivery: auto
    api_dispatchable: true
    include_deadlines: true
    include_review_queue: false
    confirm_and_proceed: true
    addenda: []
    allowed_models:
      - anthropic/claude-sonnet-4-6
      - anthropic/claude-opus-4
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
      - anthropic/claude-3-5-sonnet

  claude/web:
    # Preferred reviewer when reviews go to agent-bus (web-anthropic + operator push).
    # Not a team_dispatch *generate* target (manual_handoff: true); reachable via
    # team_dispatch(op="handoff", ...) which creates the bus thread + returns thread_id.
    provider: anthropic
    default_model: null
    tool_surface: mcp
    mcp_surface: life
    delivery: manual
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    manual_handoff: true
    addenda:
      - claude-web-tool-surface
      - session-close-pointer-web
      - session-close-markdown-audit
      - session-close-transcript

  gpt/cursor:
    provider: openai
    default_model: openai/gpt-5.4
    tool_surface: mcp
    mcp_surface: code
    delivery: manual
    manual_handoff: true
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda:
      - session-close-pointer-cursor
      - session-close-markdown-audit
      - session-close-transcript

  gpt/api:
    # Default for automated team_dispatch roles assigned to GPT (e.g. reviewer).
    # Standing default = Terra (panel family shift 2026-07-09); gpt-5.5 OPERATOR-GATED
    # (explicit operator authorization — not standing default; writing uses Terra±Gemini).
    provider: openai
    default_model: openai/gpt-5.6-terra
    tool_surface: mcp
    mcp_surface: code
    delivery: auto
    api_dispatchable: true
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda: []
    allowed_models:
      - openai/gpt-5.6-terra
      - openai/gpt-5.6-sol
      - openai/gpt-5.6-luna
      - openai/gpt-5.5
      - openai/gpt-5.4
      - openai/gpt-5.4-mini
      - openai/o4-mini
      - openai/o3

  grok/cursor:
    provider: xai
    default_model: xai/grok-4.5
    tool_surface: mcp
    mcp_surface: code
    delivery: manual
    manual_handoff: true
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda:
      - session-close-pointer-cursor
      - session-close-markdown-audit
      - session-close-transcript
    allowed_models:
      - xai/grok-4.5
      - xai/grok-4.20-0309-reasoning
      - xai/grok-4.20-multi-agent-0309

  grok/api:
    provider: xai
    default_model: xai/grok-4.5
    tool_surface: mcp
    mcp_surface: code
    delivery: auto
    api_dispatchable: true
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda: []
    allowed_models:
      - xai/grok-4.5
      - xai/grok-4.20-0309-reasoning
      - xai/grok-4.20-multi-agent-0309

  # Legacy platform slug retained for seat identity; model migrated to grok-4.5
  # standard (tool-loop) card — no multi-agent / inline-only variant exists.
  grok/api-multi:
    provider: xai
    default_model: xai/grok-4.5
    tool_surface: mcp
    mcp_surface: code
    delivery: auto
    api_dispatchable: true
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda: []
    allowed_models:
      - xai/grok-4.5
      - xai/grok-4.20-0309-reasoning
      - xai/grok-4.20-multi-agent-0309

  grok/web:
    provider: xai
    default_model: null
    tool_surface: mcp
    mcp_surface: life
    delivery: manual
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    manual_handoff: true
    addenda:
      - grok-web-tool-surface
      - session-close-pointer-web-generic
      - session-close-markdown-audit
      - session-close-transcript

  gemini/api:
    # CANDIDATE SEAT — declared tool_surface=mcp. MCP tool loop verified by
    # smoke (catalog=15, cortex round-trip) but seat-attributed wiring not
    # confirmed under the gemini-api slug. Seat ≡ MCP-wired runtime:
    # see `.cursor/rules/agent-identity-signoff.mdc` +
    # `decision:identity-doctrine-endpoint-provenance`.
    # Gemini MCP ON: full catalog (inc. writes); model discretion applies.
    provider: google
    default_model: google/gemini-3.6-flash
    tool_surface: mcp
    mcp_surface: code
    delivery: auto
    api_dispatchable: true
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda: []
    allowed_models:
      - google/gemini-3.6-flash
      - google/gemini-3.5-flash
      - google/gemini-3.1-pro-preview
      - google/gemini-2.5-flash
      - google/gemini-2.5-pro
      - google/gemini-2.5-flash-lite

  gemini/cursor:
    # Cursor seat for Gemini. MCP is wired for IDE use; prefer claude-cursor for
    # durable cortex/fs/workspace writes — Gemini often fails or no-ops mutations.
    provider: google
    default_model: google/gemini-3.6-flash
    tool_surface: mcp
    mcp_surface: code
    delivery: manual
    manual_handoff: true
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda:
      - session-close-pointer-cursor
      - session-close-markdown-audit
      - session-close-transcript
    allowed_models:
      - google/gemini-3.6-flash
      - google/gemini-3.5-flash
      - google/gemini-3.1-pro-preview
      - google/gemini-2.5-flash
      - google/gemini-2.5-pro
      - google/gemini-2.5-flash-lite

  gemini/web:
    # CANDIDATE SEAT — tool_surface=mcp is ASPIRATIONAL until a round-trip MCP
    # call is verified under the gemini-web slug. Gemini's web app
    # (gemini.google.com) remote-MCP/connector support is unconfirmed; treat as
    # candidate, not seat. Criterion: `.cursor/rules/agent-identity-signoff.mdc`
    # + `decision:identity-doctrine-endpoint-provenance`.
    provider: google
    default_model: null
    tool_surface: mcp
    mcp_surface: life
    delivery: manual
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    manual_handoff: true
    addenda:
      - gemini-web-tool-surface
      - session-close-pointer-web-generic
      - session-close-markdown-audit
      - session-close-transcript

  cursor/sdk:
    # Automated SDK executor — team_dispatch(op=generate, seat=cursor-sdk) routes
    # to git_integration_worker (platform=sdk); NOT cloud CapabilityDispatch.
    provider: cursor
    default_model: cursor/composer-2.5
    tool_surface: sdk
    mcp_surface: code
    delivery: auto
    include_deadlines: false
    include_review_queue: false
    confirm_and_proceed: false
    addenda: []
    auto_dispatchable: true
    # F-2: intentional empty — cursor/sdk admission checks CURSOR_DENIED_MODELS only
    # (deny-list, admit-rest); knob trust lives on CURSOR_MODEL_CAPABILITIES, not here.
    # Trusted cursor-sdk models include cursor/grok-4.5 — see
    # libs/cursor_capabilities/cursor_capabilities.py (replaces all Grok 4.x).
    # Live catalog default is fast=true; pass model_knobs={"fast":"false"} for non-fast.
    # WHEN to override model=: recon+investigate (judgment / root-cause / suggest /
    # densify inputs) → model=cursor/grok-4.5, typically contract=light-bounded.
    # Keep default Composer for contract=implement and pure mechanical inventory
    # (grep/list only). Do not flip default_model; do not conflate with API xai/grok-4.5.
    allowed_models: []

  subagent/subagent:
    provider: anthropic
    default_model: null
    tool_surface: mcp
    mcp_surface: code
    delivery: manual
    include_deadlines: false
    include_review_queue: false
    confirm_and_proceed: false
    manual_handoff: true
    addenda:
      - session-close-pointer-subagent


# Role dispatch policy — permanent (seat, contract) shorthands (option b):
#   Primary handoff surface: team_dispatch(op="handoff", seat="web-anthropic"|"cursor", …).
#   Legacy aliases claude-web / claude-cursor still resolve to those bus addresses.
#   Contract is derived server-side (source_ref dispatch_lane → packet front-matter → default consult).
#   The four roster slugs below remain accepted shorthands encoding (seat, contract):
#   web-consult / web-implement → web-anthropic; cursor-consult / cursor-implement → cursor.
#   Web consult shorthand: team_dispatch(op="handoff", role="web-consult") → web-anthropic + operator push.
#   Cursor consult: team_dispatch(op="handoff", seat="cursor") → cursor IDE mailbox.
#   Bound implement (DEFAULT, automated): team_dispatch(op="generate", seat="cursor-sdk",
#     packet_path=…, contract="implement") → auto Composer (cursor/composer-2.5), no IDE
#     pickup; poll poll_hint (agent-bus wait). PRECONDITION — DENSE INSTRUCTIONS: the packet
#     must be dense/complete (Composer executes mechanically, no design judgment). cursor-sdk
#     is platform=sdk on the Cursor subscription, NOT an Anthropic-API generate lane.
#   Recon+investigate (judgment/root-cause/suggest): same seat=cursor-sdk but override
#     model=cursor/grok-4.5 with contract=light-bounded (keep default_model=Composer for
#     implement volume). Pure mechanical inventory may stay on Composer.
#   Bound implement (operator-attended FALLBACK): team_dispatch(op="handoff", seat="cursor", contract="implement") →
#     cursor from any dispatching seat; packet + acceptance criteria required. Use only
#     when SDK worker unavailable or attended IDE execution is explicitly wanted.
#   Bound implement (Web): team_dispatch(op="handoff", role="web-implement") →
#     web-anthropic + operator push; packet + acceptance criteria required. Symmetric
#     with cursor-implement — web's path to the implement contract (web-consult is
#     consult-only; it cannot raise the implement guardrails).
#   Review / MCP writes (automated): team_dispatch role=reviewer → gpt-5.6-terra.
#   Analysis (no substrate writes): role=synthesizer → gemini-3.1-pro-preview (MCP tool loop).
#   Reliable MCP writers (automated generate): gpt-5.6-terra, anthropic API (last — cost).
#   web-anthropic: /mcp/life is ON and /mcp/code is OFF. Handoff packets must name
#   that split explicitly: life reads/writes are available when packet-authorized;
#   workspaces, checkout/source access, and code-only tools are not
#   (todo:web-anthropic-handoff-mcp-off-default).

roles:

  web-consult:
    description: "Web consult handoff — review, dialectic, architecture on web-anthropic; operator pushes agent-bus"
    default_family: claude
    default_platform: web
    default_model: null
    default_contract: consult

  web-implement:
    description: "Web bound-implement handoff — packet-bound implementation on web-anthropic with acceptance criteria and quality gates; operator pushes agent-bus. Symmetric with cursor-implement; distinct from web-consult."
    default_family: claude
    default_platform: web
    default_model: null
    default_contract: implement

  cursor-consult:
    description: "Cursor consult handoff — fresh packet context + operator tier (Opus); reviews, projects, exploration, architecture"
    default_family: claude
    default_platform: cursor
    default_model: null
    default_contract: consult

  cursor-implement:
    description: "Cursor bound-implement handoff — packet-bound code execution with acceptance criteria and quality gates; distinct from cursor-consult"
    default_family: claude
    default_platform: cursor
    default_model: null
    default_contract: implement

  reviewer:
    description: "Review and audit with reliable MCP writes. Engineering default: gpt-5.6-terra. Life/writing: Terra standing, or google/gemini-3.6-flash as MCP-capable peer (same tool surface as Terra; writing pair with synthesizer per decision:writing-consult-model-routing). Anthropic API last resort (cost). web-anthropic via agent-bus is a life/Cortex MCP writer with code/workspaces MCP off. gpt-5.5 OPERATOR-GATED (explicit auth; not standing default)."
    default_family: gpt
    default_platform: api
    default_model: openai/gpt-5.6-terra
    allowed_models:
      - openai/gpt-5.6-terra
      - openai/gpt-5.6-sol
      - openai/gpt-5.6-luna
      - openai/gpt-5.5
      - anthropic/claude-sonnet-4-6
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
      - cursor/claude-opus-5
      - google/gemini-3.6-flash
      - google/gemini-3.5-flash
      - google/gemini-3.1-pro-preview
      - google/gemini-2.5-pro

  synthesizer:
    description: "Analysis/synthesis via MCP tools. Full catalog access; writes allowed by model discretion. For guaranteed code-surface writes use reviewer (gpt-5.6-terra). Writing second family with Terra (Terra+Gemini; ¬ Grok). web-anthropic can write through life/Cortex MCP but has no code/workspaces surface."
    default_family: gemini
    default_platform: api
    default_model: google/gemini-3.6-flash
    allowed_models:
      - google/gemini-3.1-pro-preview
      - google/gemini-3.6-flash
      - google/gemini-3.5-flash
      - google/gemini-2.5-flash
      - google/gemini-2.5-pro
      - google/gemini-2.5-flash-lite

  artisan:
    description: "Inline reasoning specialist; structured execution at frontier-grade reasoning. Engineering default Grok; PROHIBITED for writing/correspondence — see decision:writing-consult-model-routing."
    default_family: grok
    default_platform: api
    default_model: xai/grok-4.5
    allowed_models:
      - xai/grok-4.5

  skeptic:
    description: "Adversarial / dialectical seat; pushback on consensus framing.
      Engineering panels only (standing panel family with Terra reviewer). Writing
      uses Terra+Gemini, not default panel_dispatch. Family MUST differ from the
      artifact's author (independence). Default xai/grok-4.5; allowlist carries
      OpenAI/Anthropic for author-dependent selection. gpt-5.5 OPERATOR-GATED on
      this role. MCP-on is inherent to grok/api."
    default_family: grok
    default_platform: api
    default_model: xai/grok-4.5
    allowed_models:
      - xai/grok-4.5
      - xai/grok-4.20-0309-reasoning
      - openai/gpt-5.6-terra
      - openai/gpt-5.5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
