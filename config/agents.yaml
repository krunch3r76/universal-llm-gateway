# config/agents.yaml — agent capability and role configuration
#
# Single source of truth for CapabilityProfile (family × platform cells)
# and RoleProfile (functional team roles). Loaded at runtime by
# libs/agent_seat/profiles.py via load_profiles() and load_roles().
#
# Profile keys: "<family>/<platform>"
# Profile fields map 1:1 to CapabilityProfile dataclass fields.
# Optional fields omitted here use their dataclass defaults:
#   allowed_models: []  model_requirement: null  capability_tier: null
#   dispatchable: true  session_limit: 3  self_reflections_limit: 5

profiles:

  claude/cursor:
    # Manual IDE seat — team_dispatch(op="handoff", role="claude-cursor"|"cursor-lead", ...)
    # creates an agent-bus thread for a dedicated Cursor session (e.g. Opus). Not a
    # team_dispatch generate target (dispatchable: false), same admission as claude/web.
    provider: anthropic
    default_model: anthropic/claude-sonnet-4-6
    tool_surface: mcp
    delivery: manual
    dispatchable: false
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda:
      - session-close-pointer-cursor
      - session-close-markdown-audit
      - session-close-transcript
    allowed_models:
      - anthropic/claude-sonnet-4-6
      - anthropic/claude-opus-4-8

  claude/api:
    provider: anthropic
    default_model: anthropic/claude-sonnet-4-6
    tool_surface: mcp
    delivery: auto
    include_deadlines: true
    include_review_queue: false
    confirm_and_proceed: true
    addenda: []
    allowed_models:
      - anthropic/claude-sonnet-4-6
      - anthropic/claude-opus-4
      - anthropic/claude-opus-4-8
      - anthropic/claude-3-5-sonnet

  claude/web:
    # Preferred reviewer when reviews go to agent-bus (claude-web + operator push).
    # Not a team_dispatch *generate* target (dispatchable: false); reachable via
    # team_dispatch(op="handoff", ...) which creates the bus thread + returns thread_id.
    provider: anthropic
    default_model: null
    tool_surface: mcp
    delivery: manual
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    dispatchable: false
    addenda:
      - claude-web-tool-surface
      - session-close-pointer-web
      - session-close-markdown-audit
      - session-close-transcript

  gpt/cursor:
    provider: openai
    default_model: openai/gpt-5.4
    tool_surface: mcp
    delivery: manual
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda:
      - session-close-pointer-cursor
      - session-close-markdown-audit
      - session-close-transcript

  gpt/api:
    # Default for automated team_dispatch roles assigned to GPT (e.g. reviewer).
    provider: openai
    default_model: openai/gpt-5.5
    tool_surface: mcp
    delivery: auto
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda: []
    allowed_models:
      - openai/gpt-5.5
      - openai/gpt-5.4
      - openai/gpt-5.4-mini
      - openai/o4-mini
      - openai/o3

  grok/cursor:
    provider: xai
    default_model: xai/grok-4.20-0309-reasoning
    tool_surface: mcp
    delivery: manual
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda:
      - session-close-pointer-cursor
      - session-close-markdown-audit
      - session-close-transcript
    allowed_models:
      - xai/grok-4.20-0309-reasoning
      - xai/grok-4.3

  grok/api:
    provider: xai
    default_model: xai/grok-4.20-0309-reasoning
    tool_surface: mcp
    delivery: auto
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda: []
    allowed_models:
      - xai/grok-4.20-0309-reasoning
      - xai/grok-4.3

  grok/api-multi:
    provider: xai
    default_model: xai/grok-4.20-multi-agent-0309
    tool_surface: inline-only
    delivery: auto
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda: []
    allowed_models:
      - xai/grok-4.20-multi-agent-0309
    model_requirement: multi-agent
    capability_tier: inline-only

  grok/web:
    provider: xai
    default_model: null
    tool_surface: mcp
    delivery: manual
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    dispatchable: false
    addenda:
      - grok-web-tool-surface
      - session-close-pointer-web-generic
      - session-close-markdown-audit
      - session-close-transcript

  grok/direct:
    provider: xai
    default_model: xai/grok-4.20-0309-reasoning
    tool_surface: mcp
    delivery: manual
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    dispatchable: false
    addenda:
      - session-close-pointer-grok-direct
      - session-close-markdown-audit
      - session-close-transcript
    allowed_models:
      - xai/grok-4.20-0309-reasoning
      - xai/grok-4.3

  grok/build-dispatch:
    # Subprocess seat for grokbuild dispatches. The grok CLI subprocess spawned
    # by the grokbuild runner connects to /mcp/grok with a distinct bearer token
    # (MCP_GROK_BUILD_DISPATCH_TOKEN) and X-Grokbuild-Dispatch-Id header so
    # inner MCP traffic is attributed to seat=grok-build-dispatch rather than
    # to grok-direct. Verified seat per four-layer criterion (assertion 10991):
    # promoted from candidate once cortex(tool='assert') succeeds under this slug.
    provider: xai
    default_model: xai/grok-4.20-0309-reasoning
    tool_surface: mcp
    delivery: auto
    include_deadlines: false
    include_review_queue: false
    confirm_and_proceed: false
    dispatchable: false
    addenda: []
    allowed_models:
      - xai/grok-4.20-0309-reasoning
      - xai/grok-4.3

  gemini/api:
    # CANDIDATE SEAT — declared tool_surface=mcp, but end-to-end MCP wiring
    # has not been verified by a round-trip dispatch. Treat as a dispatch
    # target until todo:gemini-api-mcp-wiring-verify confirms cortex
    # participation under the gemini-api slug. See agent-identity-signoff.mdc
    # "Four-layer model" for the seat ≡ MCP-wired runtime criterion.
    # team_dispatch uses inline-only: Gemini API is unreliable on cortex/fs
    # workspace writes; analysis consults only (substrate inlined in prompt).
    provider: google
    default_model: google/gemini-3.5-flash
    tool_surface: mcp
    capability_tier: inline-only
    delivery: auto
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda: []
    allowed_models:
      - google/gemini-3.5-flash
      - google/gemini-2.5-pro
      - google/gemini-2.5-flash
      - google/gemini-3-flash-preview
      - google/gemini-3.1-pro-preview

  gemini/cursor:
    # Cursor seat for Gemini. MCP is wired for IDE use; prefer claude-cursor for
    # durable cortex/fs/workspace writes — Gemini often fails or no-ops mutations.
    provider: google
    default_model: google/gemini-3.5-flash
    tool_surface: mcp
    delivery: manual
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    addenda:
      - session-close-pointer-cursor
      - session-close-markdown-audit
      - session-close-transcript
    allowed_models:
      - google/gemini-3.5-flash
      - google/gemini-2.5-pro
      - google/gemini-2.5-flash
      - google/gemini-3-flash-preview
      - google/gemini-3.1-pro-preview

  gemini/web:
    # CANDIDATE SEAT — tool_surface=mcp is ASPIRATIONAL until a round-trip MCP
    # call is verified under the gemini-web slug. Gemini's web app
    # (gemini.google.com) remote-MCP/connector support is unconfirmed; treat as
    # candidate, not seat. See agent-identity-signoff.mdc "Four-layer model".
    provider: google
    default_model: null
    tool_surface: mcp
    delivery: manual
    include_deadlines: true
    include_review_queue: true
    confirm_and_proceed: true
    dispatchable: false
    addenda:
      - gemini-web-tool-surface
      - session-close-pointer-web-generic
      - session-close-markdown-audit
      - session-close-transcript

  subagent/subagent:
    provider: anthropic
    default_model: null
    tool_surface: mcp
    delivery: manual
    include_deadlines: false
    include_review_queue: false
    confirm_and_proceed: false
    dispatchable: false
    addenda:
      - session-close-pointer-subagent


# Role dispatch policy:
#   Review (preferred): claude-web via agent-bus + operator push.
#   Web handoff (automated): team_dispatch(op="handoff", role="lead"|"investigator", ...)
#     → creates bus thread for the role's web seat; returns thread_id + push_reminder.
#   Cursor handoff (automated): team_dispatch(op="handoff", role="claude-cursor"|"cursor-lead", ...)
#     → bus thread for claude-cursor; operator works the thread in Cursor (Opus optional).
#   Review / MCP writes (automated): team_dispatch role=reviewer → gpt-5.5.
#   Analysis (no substrate writes): role=synthesizer → gemini-3.5-flash (inline-only).
#   Reliable MCP writers: claude-web, gpt-5.5, anthropic API. Anthropic API last (cost).

roles:

  lead:
    description: "Strategic advisor; senior architectural review; cross-session direction"
    default_family: claude
    default_platform: web
    default_model: null

  cursor-lead:
    description: "Cursor→cursor consult via team_dispatch handoff — fresh packet context + operator tier (Opus); reviews, projects, exploration, architecture (not review-only)"
    default_family: claude
    default_platform: cursor
    default_model: null

  implementer:
    # Packet-bound code execution in a dedicated Cursor session. Option A alias:
    # resolves to the manual (claude, cursor) profile (delivery=manual,
    # dispatchable=false), so it is handoff-only — op=generate → 422
    # web_seat_not_generate_target automatically, no admission code change.
    # Distinct from cursor-lead (fresh-Opus consult/architecture): implementer
    # carries a bound todo/spec + acceptance criteria + quality gates (Phase 3
    # packet contract), not a reasoning consult.
    description: "Packet-bound Cursor code execution (handoff-only) — implements a bound todo/spec with acceptance criteria and quality gates; distinct from cursor-lead consult"
    default_family: claude
    default_platform: cursor
    default_model: null
    default_contract: implement

  reviewer:
    description: "Review and audit with reliable MCP writes. Preferred: claude-web via agent-bus. Automated team_dispatch: gpt-5.5. Anthropic API last resort (cost)."
    default_family: gpt
    default_platform: api
    default_model: openai/gpt-5.5
    allowed_models:
      - openai/gpt-5.5
      - anthropic/claude-sonnet-4-6
      - anthropic/claude-opus-4-8

  gatherer:
    description: "Context gathering, structured extraction, broad research"
    default_family: gpt
    default_platform: api
    default_model: openai/gpt-5.4
    allowed_models:
      - openai/gpt-5.4
      - openai/gpt-5.4-mini
      - openai/o4-mini
      - openai/o3

  synthesizer:
    description: "Analysis/synthesis on inline substrate only (no MCP writes). Mutations: claude-web, team_dispatch reviewer (gpt-5.5), or cursor-claude"
    default_family: gemini
    default_platform: api
    default_model: google/gemini-3.5-flash
    allowed_models:
      - google/gemini-3.5-flash
      - google/gemini-2.5-pro
      - google/gemini-2.5-flash
      - google/gemini-3-flash-preview
      - google/gemini-3.1-pro-preview

  artisan:
    description: "Inline reasoning specialist; structured execution at frontier-grade reasoning"
    default_family: grok
    default_platform: api
    default_model: xai/grok-4.20-0309-reasoning
    allowed_models:
      - xai/grok-4.20-0309-reasoning
      - xai/grok-4.3

  skeptic:
    description: "Adversarial / dialectical seat; pushback on consensus framing"
    default_family: grok
    default_platform: api-multi
    default_model: xai/grok-4.20-multi-agent-0309
    allowed_models:
      - xai/grok-4.20-multi-agent-0309

  investigator:
    description: "Deep manual research; heavy thinking on operator-driven web sessions"
    default_family: grok
    default_platform: web
    default_model: null
