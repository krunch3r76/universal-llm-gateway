# Note: Master is a pure orchestrator with NO local gateway.
# All execution happens on Edge Stargates (federation remotes).

# Proxy settings
proxy:
  port: 9999
  host: "0.0.0.0"  # Listen on all interfaces for federation
  cors_enabled: true

# Federation: Master mode (accepts connections FROM Remotes)
# REQUIRED Environment Variables:
#   FEDERATION_KEY - API key for Remote authentication
federation:
  mode: "master"
  stargate_id: "io"
  protocol_version: "1.0"
  
  # Local Edge Stargate (Unix socket to container on same host)
  local_edge:
    socket_path: "/tmp/universal-protocol/edge-localhost.sock"
    stargate_id: "edge-localhost"
    api_key: "${FEDERATION_KEY_EDGE_LOCALHOST}"
  
  # Remote Stargates allowed to connect (Master accepts these)
  remotes:
    - stargate_id: "jupiter"
      url: "http://jupiter:9999"  # For HTTP request forwarding to Remote
      api_key: "${FEDERATION_KEY}"  # Remote must use this key to auth
  
  # WebSocket server config (accepts connections)
  ws_server:
    path: "/ws/federation/master"
    max_connections: 100
    auth_deadline_seconds: 5
  
  # Connection settings
  ping_interval_ms: 15000
  telemetry_stale_threshold_ms: 5000
  telemetry_unreachable_threshold_ms: 10000

# Routing configuration with affinity rules
routing:
  affinity:
    - match: "hermes3-llama-3.1-70b-uncensored-16384-hybrid"
      node: "jupiter"
      strength: "hard"
      evict_if_needed: true
    
    - match: "hermes3-*"
      node: "jupiter"
      strength: "soft"
      bonus: 50

# Pipeline configuration
pipelines:
  search_paths:
    - "pipelines"
    - "pipelines.local"
    - "~/.pipelines"
  hot_reload:
    enabled: true
    debounce_ms: 2000

# Request Queue Configuration
# CRITICAL: max_concurrent_processing must be high enough to not throttle
# concurrent requests to models with parallel_slots
request_queue:
  max_size: 1000
  max_concurrent_processing: 100  # Allow 100 concurrent requests (was defaulting to 10)
  request_timeout: 300
  queue_timeout: 1800.0
  upstream_retry_timeout: 120  # Retry budget for retryable upstream 502 errors (seconds)
  non_sticky:
    enabled: true

# Logging
logging:
  level: "DEBUG"
  enable_console: true
  enable_file: true
  log_dir: "/tmp/logs/universal-stargate"  # Local stargate log directory