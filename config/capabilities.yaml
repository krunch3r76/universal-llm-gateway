categories:
  observability:
    description: Event Service telemetry, traces, request snapshots, delivery audit and dispatch economics
    implementation: satellite
    upstream: events_query
    origin_prefix: /api/v1/observability
  jobs:
    description: Host-bound operator jobs (bounded registry; operator-only)
    implementation: satellite
    upstream: jobs
    origin_prefix: /api/v1/jobs
    auth_env: JOBS_TOKEN
  web_fetcher:
    description: Browser fetch and binary download on the web-fetcher host
    implementation: satellite
    upstream: web_fetcher
    origin_prefix: /fetch
