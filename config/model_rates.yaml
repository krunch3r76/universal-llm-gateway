# Manual seed + override rows for dispatch economics dollar equivalents.
# Catalog refresh upserts OpenRouter pricing to ~/.gateway/model_rates_catalog.yaml
# (MODEL_RATES_CATALOG_PATH override); pinned rows here win over catalog projection
# (non-pinned seeds fill gaps only).
#
# cursor/* rates: SOT = https://cursor.com/docs/models-and-pricing (API pool table).
# Optional cache_*_rate_per_m omitted when docs list "-" for that tier.

aliases:
  # Pipeline ids reach the rollup as model_id (pipeline-as-service virtual model);
  # map to the backing model, or to local/zero-cost when the pipeline runs no
  # inference step at all.
  assertion-enrichment: qwen3-14b-q4-k-m-40960
  composer-2.5: cursor/composer-2.5
  implement-closeout: local/zero-cost
  predicate-extract: openai/gpt-4o-mini
  rag-contextualize: qwen3-5-9b-q8-0-131072
  todo-close: local/zero-cost
  vocab-classify-v1: qwen3-14b-q4-k-m-40960
  # Bare provider ids (rollup) → priced openrouter catalog keys (hyphen/dot + dated).
  anthropic/claude-opus-5: openrouter/anthropic/claude-opus-5
  anthropic/claude-opus-4-8: openrouter/anthropic/claude-opus-4.8
  openai/gpt-5.4-mini-2026-03-17: openrouter/openai/gpt-5.4-mini

models:
  - model_id: cursor/composer-2.5
    input_rate_per_m: 0.5
    cache_read_rate_per_m: 0.2
    output_rate_per_m: 2.5
    source: manual_seed
    pinned: true
  # Composer Fast is a distinct model_id (roaming-tier slug). Grok Fast is not —
  # see knob_variants. Leave this pin; G7 does not restamp Composer rates.
  - model_id: cursor/composer-2.5-fast
    input_rate_per_m: 0.625
    output_rate_per_m: 3.0
    source: manual_seed
    pinned: true
  # Non-fast Grok 4.6. Cursor pool table 2026-08-13: $2 / - / $0.5 / $6.
  # Fast is a knob on this id (cursor_capabilities grok-4.6 default_variant),
  # not a cursor/grok-4.6-fast model_id — nothing would join a fake -fast slug.
  - model_id: cursor/grok-4.6
    input_rate_per_m: 2.0
    cache_read_rate_per_m: 0.5
    output_rate_per_m: 6.0
    source: manual_seed
    pinned: true
