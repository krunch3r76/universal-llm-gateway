# Golem Node Configuration - Single Container (Gateway + Relay Stargate + Edge Stargate)
#
# This configuration is for a complete Golem node running:
# - Gateway (TCP localhost:9998)
# - Relay Stargate (TCP 0.0.0.0:9999)  [Master connects here]
# - Edge Stargate (Unix socket)        [Relay forwards to Edge via federation protocol]
#
# The Edge Stargate is started by `golem-start.sh both` when:
#   EDGE_STARGATE_CONFIG + EDGE_STARGATE_SOCKET are set in the environment.
#
# Environment variables:
#   REMOTE_ID - Node identifier (e.g., "golem-remote-1")
#   FEDERATION_API_KEY - API key for Master authentication

# Local Gateway connection (same container, localhost)
gateway:
  url: "http://localhost:9998"  # Gateway runs on localhost in same container
  timeout: 30.0
  connectivity_timeout: 10.0
  health_timeout: 2.0
  request_timeout: 1800
  streaming_timeout: 1800
  resource_management:
    # max_concurrent_model_loads: 1 # not enforced
    # model_loading_slot_acquisition_timeout: 0.25 # not enforced
    reservation_timeout: 300
    reservation_cleanup_interval: 30
    enable_reservation_monitoring: true
  capabilities:
    cpu_performance: high
    hybrid_performance: high
  max_concurrent_cpu_models: 50
  max_concurrent_gpu_models: 10

# Proxy settings - receives requests from Master
proxy:
  port: 9999
  host: "0.0.0.0"
  cors_enabled: true

# Federation: Remote mode (HTTP-only, no WebSocket)
federation:
  mode: remote  # lowercase (StargateMode enum)
  stargate_id: "${REMOTE_ID}"  # Set via environment variable
  disable_websocket: true
  
  # Local Edge Stargate (federation protocol over Unix socket)
  # Relay forwards inference to Edge via /api/v1/federation/* on this socket.
  local_edge:
    socket_path: "/tmp/universal-protocol/edge-${REMOTE_ID}.sock"
    stargate_id: "edge-${REMOTE_ID}"
    api_key: "${FEDERATION_API_KEY}"
  
  # Master configuration
  # In HTTP-only mode (disable_websocket: true), Master polls Remote via HTTP
  # Remote does NOT establish outbound connection to Master
  master:
    stargate_id: "master-local"
    url: "http://localhost:9999"  # Not used (HTTP-only mode)
    api_key: "${FEDERATION_API_KEY}"  # Master authenticates with this key

# Logging
logging:
  level: "DEBUG"
  enable_console: true
  enable_file: true
  log_dir: "/golem/logs/stargate"  # Golem volume path

# Model routing - default configuration
model_routing:
  default_sticky: true

# Request queue
request_queue:
  max_size: 1000
  default_timeout: 300

# Routing scoring configuration
routing:
  scoring:
    capacity: {}
