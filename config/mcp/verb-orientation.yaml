      - cdp-operator-proxy
      - directive-authoring-standard
      - dispatch-shape
      - consult-posture
  manage:
    cursor_only:
      - service-lifecycle
      - ulg-architecture
      - pre-deploy-gate-discipline
      - mcp-surface-change
    shared_sync:
      - landed-not-live
  observability:
    cursor_only:
      - debug-with-events
      - ulg-architecture
      - mcp-tool-loop-trace-matrix
    shared_sync:
      - event-instrumentation-discipline
      - completion-provenance-discipline
  agent_bus_read:
    cursor_only:
      - agent-bus-multitask
      - cursor-sdk-thread-consolidation
    shared_sync:
      - agent-bus-discipline
      - dispatch-shape
      - handoff-pickup
