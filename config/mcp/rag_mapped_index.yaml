# through the identical search envelope; miss falls through to live rag-context.
#
# Pack files are pure `context` bodies (Source / Body evidence blocks only) —
# no frontmatter. Retrieval metadata comes from this index, not the file.
#
# Reload: mcp-server restart (index is process-cached).

