  flat_call_shape:
    tool: cortex_entities
    substrate_qualified: user-vortex__cortex_entities
  fol_descriptor: |
    ProjectedRow: id always present; base columns pass through; other names
    resolve via json_extract(attributes,'$.<name>').
    See agent_skill:cortex.
  json_schema:
    type: object
    properties:
      type: {type: string}
      workflow_state: {type: string}
      limit: {type: integer}
