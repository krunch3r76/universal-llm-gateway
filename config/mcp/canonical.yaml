# Canonical Tool Name Registry — single source of truth for /mcp (Claude dispatcher).
#
# Phase A skeleton — 2026-05-22.
# Authorship policy: YAML-only (D7); no separate Python loader module.
# FOL descriptor invariant: ≥1 of ∀/∃/⟹/¬/∈ in every fol_descriptor (G6).
# Naming invariant: canonical_name matches ^[a-z][a-z0-9]*(_[a-z0-9]+)+$ (G8).
# Cap invariant: len(domains) ≤ 24 for Claude /mcp dispatcher surface (G3).
# Cache-invariance window (D5): fol_descriptor edits frozen for 30 days after
# each rollout phase unless labelled bugfix: (G7).
#
# Derivation rules (Phase B):
#   /mcp  (Claude)  → one dispatcher tool per domain; op enumeration via inputSchema.
#
# dispatcher_call_shape.dispatch_key: normalized to 'op' (D8).
# All existing heterogeneous keys (tool=, action=, operation=) migrate to op= at cutover.

schema_version: 1
generated_by: hand-edit
last_audited: "2026-05-22"
# Phase A FOL-pass complete: all entries below carry fol_descriptor.
# Ordering controls dispatcher-listing order on the Claude /mcp surface.
domains:
- cortex
- agent_bus
- fs
- pipeline
- rag
- git_integrate
- git_land
- git_status
- git_diff
- git_commit
- observability
- manage
- dispatch
- retrieve
- tool_search
- team_dispatch
- panel_dispatch

- cortex_boot

tools:

  # ─── domain: cortex ──────────────────────────────────────────────────────────
  # Current dispatch: cortex(tool="<op>", arguments='...')
  # D8-normalized dispatch: cortex(op="<op>", arguments='...')
  # Flat (grok): cortex_<op>(...)

- canonical_name: cortex_entities
  domain: cortex
  operation: entities
  dispatcher_call_shape:
    tool: cortex
    dispatch_key: op
    dispatch_value: entities
  flat_call_shape:
    tool: cortex_entities
    substrate_qualified: user-vortex__cortex_entities
  fol_descriptor: |
    ∀ args ∈ EntitiesArgs: entities(args) ⟹
      (args.fields = ∅ ⟹ result ∈ List[EntitySummary]
       ∧ args.fields ≠ ∅ ⟹ result ∈ List[ProjectedRow]
       ∧ ∀ k ∈ keys(result[0]): k ∈ {id} ∪ args.fields)
      ∧ args.type ≠ ∅ ⟹ ∀ e ∈ result: e.type = args.type
      ∧ args.workflow_state ≠ ∅ ⟹ ∀ e ∈ result: e.workflow_state = args.workflow_state
      ∧ args.content_hash ≠ ∅ ⟹ ∀ e ∈ result: e.content_hash = args.content_hash.
    ProjectedRow: id always present; base columns pass through; other names
    resolve via json_extract(attributes,'$.<name>'). Read-only. ¬side-effects.
    See agent_skill:cortex.
  json_schema:
    type: object
    properties:
      type: {type: string}
      workflow_state: {type: string}
      limit: {type: integer}
      query: {type: string}
      for_agent: {type: string}
      content_hash: {type: string, description: "Exact-match on content_hash column. Accepts raw hex or sha256:<hex> form."}
      fields: {type: array, items: {type: string}, description: "Project only these fields. Base columns pass through; other names resolve from attributes JSON (e.g. applicable_agents). Collapses an N+1 attribute audit to one query."}
  skill_uri: agent_skill:cortex
  seat_visibility: [mcp, mcp_claude]
  mandate_safety: read_only
  cache_priority: always_loaded
  introduced: 2026-05-22

- canonical_name: cortex_entities_by_content_hash
  domain: cortex
  operation: entities_by_content_hash
  dispatcher_call_shape:
    tool: cortex
    dispatch_key: op
    dispatch_value: entities_by_content_hash
  flat_call_shape:
    tool: cortex_entities_by_content_hash
    substrate_qualified: user-vortex__cortex_entities_by_content_hash
  fol_descriptor: |
    ∀ content_hash ∈ str ∧ content_hash ≠ ∅:
      entities_by_content_hash(content_hash) ⟹
        result ∈ List[Entity]
        ∧ ∀ e ∈ result: e.content_hash = content_hash.removeprefix("sha256:")
        ∧ |result| ≤ (limit ∨ 5).
    ∀ content_hash = ∅ ⟹ error("content_hash is required").
    Read-only. Dedicated lookup op for duplicate-detection callers
    (default limit=5, no full-list semantics). See agent_skill:cortex.
  json_schema:
    type: object
    properties:
      content_hash: {type: string, description: "Required. Exact-match on content_hash column. Accepts raw hex or sha256:<hex> form."}
      type: {type: string, description: "Optional entity type filter (e.g. \"document\")."}
      limit: {type: integer, description: "Result cap (default 5)."}
    required: [content_hash]
  skill_uri: agent_skill:cortex
  seat_visibility: [mcp, mcp_claude]
  mandate_safety: read_only
  cache_priority: on_demand
  introduced: 2026-05-24

- canonical_name: cortex_assertion_state
  domain: cortex
  operation: assertion_state
  dispatcher_call_shape:
    tool: cortex
    dispatch_key: op
    dispatch_value: assertion_state
  flat_call_shape:
    tool: cortex_assertion_state
    substrate_qualified: user-vortex__cortex_assertion_state
  fol_descriptor: |
    ∀ entity_id ∈ str ∧ entity_id ≠ ∅:
      assertion_state(entity_id) ⟹
        result = {entity_id, ratified, confirmed_count, latest_confirmed_assertion_id}
        ∧ confirmed_count = |{a : a.entity_id = resolve(entity_id)
            ∧ a.confidence = 'confirmed' ∧ a.superseded_by IS NULL}|
        ∧ ratified = (confirmed_count ≥ 1)
        ∧ latest_confirmed_assertion_id = argmax_{created_at}(that set) ∨ null.
    ∀ entity_id = ∅ ⟹ error("entity_id is required").
    Read-only. Lightweight ratification/count projection; mirrors
    preflight.py::require_decision_asserted (no review_status filter).
    See agent_skill:cortex.
  json_schema:
    type: object
    properties:
      entity_id: {type: string, description: "Required. Entity to project (alias-resolved, like entity_get)."}
    required: [entity_id]
  skill_uri: agent_skill:cortex
  seat_visibility: [mcp, mcp_claude]
  mandate_safety: read_only
  cache_priority: on_demand
  introduced: 2026-06-11

