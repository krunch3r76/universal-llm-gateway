    (and only paths like it): the reader is\nthe human operator, so write human register here
    even when the session is\nagent-operated (web automation ⇏ agent audience — the path decides,
    not the session).\nArchitecture-first: name ULG systems and where they sit when that is
    the point;\nground in vision (what this serves); so-what first. The distinction is architecture\n\
    vs implementation — ¬ lead with file paths, SHAs, function names, test names, or\ninteragent
    closeout shape (status:, paths, evidence); those belong in ref. Subject\nCOME TO IDE =
    interrupt (problem, options exhausted); any other subject is awareness\nand ¬ implies
    he must open Cursor. Inverse binds: ¬ human register on bus turns,\npackets, or bodies
    addressed to model seats. See agent_skill:pager-notify\n(when-to-page classes).\n"
