- canonical_name: cortex_session_close
  domain: cortex
  operation: session_close
  dispatcher_call_shape:
    tool: cortex
    dispatch_key: op
    dispatch_value: session_close
  flat_call_shape:
    tool: cortex_session_close
    substrate_qualified: user-vortex__cortex_session_close
  fol_descriptor: "∀ session_id ∈ str ∧ agent ∈ str ∧ (transcript_jsonl_path ∨ transcript_md) ≠ ∅:\n  session_close(...) ⟹\n    transcript_entity_id ∈ Cortex ∧ journal_row_id ∈ ℕ ∧ content_hash ∈ sha256.\nAtomic. Mutating. Idempotent by session_id (second close → 422 session.already_closed).\nRequires validate_attestation from doc_validate(session_close) PASS before atomic write.\nBEFORE close: Use the `session-close-kernel` skill (+ skill `session-close-audit` for web/API).\nCursor: session-close.mdc. See agent_skill:session-close-kernel.\n"
  json_schema:
    type: object
    properties:
      session_id:
        type: string
      agent:
        type: string
      transcript_jsonl_path:
        type: string
      transcript_md:
        type: string
      session_summary_md:
        type: string
      session_summary_md_path:
        type: string
        description: 'Optional CORTEX_FILES_ROOT-relative path to the structural summary. When set, file contents populate session_summary_md (path wins if both are supplied). Prefer for light closes with quote-heavy markdown.

          '
      summary:
        type: string
      promote_todos:
        type: array
        description: 'Opt-in recon-pending todo promotions seeded from named session objectives at close. Each item: {slug, name, required_skills?, source_uri?}. Malformed items (missing slug/name) are reported as explicit drop diagnostics, not silently skipped.

          '
        items:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
            required_skills:
              type: array
              items:
                type: string
            source_uri:
              type: string
          required:
          - slug
          - name
      validate_attestation:
        type: array
        description: 'Attestation tokens from doc_validate(doc_type=session_close) PASS — must include session_close_validate:pass and session_id:{id}.

          '
        items:
          type: string
    required:
    - session_id
    - agent
    - summary
  skill_uri: rule:session-close
  seat_visibility:
  - mcp
  - mcp_claude
  mandate_safety: write
  cache_priority: always_loaded
  introduced: 2026-05-22
  family: session
