# Canonical Tool Name Registry — single source of truth for /mcp (Claude dispatcher).
#
# Phase A skeleton — 2026-05-22.
# Authorship policy: YAML-only (D7); no separate Python loader module.
# FOL descriptor invariant: ≥1 of ∀/∃/⟹/¬/∈ in every fol_descriptor (G6).
# Naming invariant: canonical_name matches ^[a-z][a-z0-9]*(_[a-z0-9]+)+$ (G8).
# Cap invariant: len(domains) ≤ 24 for Claude /mcp dispatcher surface (G3).
# Cache-invariance window (D5): fol_descriptor edits frozen for 30 days after
# each rollout phase unless labelled bugfix: (G7).
#
# Derivation rules (Phase B):
#   /mcp  (Claude)  → one dispatcher tool per domain; op enumeration via inputSchema.
#
# dispatcher_call_shape.dispatch_key: normalized to 'op' (D8).
# All existing heterogeneous keys (tool=, action=, operation=) migrate to op= at cutover.

schema_version: 1
generated_by: hand-edit
last_audited: "2026-05-22"
# Phase A FOL-pass complete: all entries below carry fol_descriptor.
# Ordering controls dispatcher-listing order on the Claude /mcp surface.
domains:
- cortex
- agent_bus
- fs
- pipeline
- rag
- git_integrate
- git_land
- git_status
- git_diff
- git_commit
- observability
- manage
- dispatch
- retrieve
- tool_search
- team_dispatch
- panel_dispatch

- cortex_boot

tools:

  # ─── domain: cortex ──────────────────────────────────────────────────────────
  # Current dispatch: cortex(tool="<op>", arguments='...')
  # D8-normalized dispatch: cortex(op="<op>", arguments='...')
  # Flat (grok): cortex_<op>(...)

- canonical_name: cortex_entities
  domain: cortex
