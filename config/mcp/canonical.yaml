# IMPLEMENT_GATE_TRIAGE (implement-lane todo attrs) is a strict subset — see
# libs/implement_admission/density_triage_gate.py.

contract_vocabulary:
  density_triage:
    fol_descriptor: |
      ∀ v ∈ density_triage: v ∈ {mechanical, judgment_required, cross_cutting,
      dispatch_surface, admission_path, trivial, recon_pending}.
      IMPLEMENT_GATE_TRIAGE ⊂ density_triage — implement-lane todo attrs only.
    accepted_values:
      - mechanical
      - judgment_required
      - cross_cutting
      - dispatch_surface
      - admission_path
      - trivial
      - recon_pending
    introduced: '2026-06-29'
