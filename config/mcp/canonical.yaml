  fol_descriptor: |
    ∀ args: (new_slug ∈ args XOR thread ∈ args) ∧ from_agent ∈ args ∧ to ∈ args
      ⟹ TurnSendCreated ∧ send_path ∈ {new_thread, continue}.
    new_slug ∈ args ∧ slug_collision ⟹ 409 slug_exists.
    ¬(new_slug ∈ args XOR thread ∈ args) ⟹ 400 send_xor_violation.
    Mutating. ¬idempotent. Replaces post + reply (post/reply remove 2026-09-01).
    See agent_skill:agent_bus.
  json_schema:
    type: object
    properties:
      new_slug:
        type: string
        description: "Human label for NEW thread. Mutually exclusive with thread. Slug uniqueness enforced (409 on collision)."
      thread:
        type: string
        description: "ID of EXISTING thread to continue. Mutually exclusive with new_slug."
      to: {type: string}
      subject: {type: string}
      body: {type: string}
      from_agent:
        type: string
        description: "Seat authoring the turn (e.g. cursor, claude-web). No default."
      summary:
        type: string
        description: "Thread summary (new_slug path only; ignored on continue path)."
      tags: {type: array, items: {type: string}}
      lifecycle_state:
        type: string
        description: "Bus lifecycle (new_slug path only; 400 on continue path)."
      after_turn:
        type: integer
        description: "Concurrency guard. 0 = skip (default). Must be 0 or absent on new_slug path."
      status: {type: string}
      mark_read: {type: boolean}
      close:
        type: boolean
        description: "Close thread after posting (continue path only)."
      allow_long_body: {type: boolean}
    required: [to, subject, body, from_agent]
    oneOf:
      - required: [new_slug]
      - required: [thread]
  skill_uri: agent_skill:agent_bus
  seat_visibility: [mcp, mcp_claude]
  mandate_safety: write
  cache_priority: always_loaded
  introduced: 2026-06-14

