  flat_call_shape:
    tool: cortex_entities
    substrate_qualified: user-vortex__cortex_entities
  fol_descriptor: 'ProjectedRow: id always present; base columns pass through; other names

    resolve via json_extract(attributes,''$.<name>'').

    See agent_skill:cortex.

    '
  json_schema:
    type: object
    properties:
      type:
        type: string
      category:
        type: string
        description: Genus category filter. matter → work, finance, case, opportunity. Intersects with type when both supplied; unknown category returns error with known list.
      workflow_state:
        type: string
      limit:
        type: integer
      query:
        type: string
      for_agent:
        type: string
      content_hash:
        type: string
        description: Exact-match on content_hash column. Accepts raw hex or sha256:<hex> form.
      fields:
        type: array
        items:
          type: string
        description: Project only these fields. Base columns pass through; other names resolve from attributes JSON (e.g. applicable_agents). Collapses an N+1 attribute audit to one query.
      include_non_active:
        type: boolean
        description: Include inactive agent_skill rows (draft, deprecated, retired, merged, NULL lifecycle).
  skill_uri: rule:cortex
  seat_visibility:
  - mcp
  - mcp_claude
  mandate_safety: read_only
  cache_priority: always_loaded
  introduced: 2026-05-22
  family: read
