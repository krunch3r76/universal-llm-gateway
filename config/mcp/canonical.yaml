- canonical_name: cortex_entity_update
  domain: cortex
  operation: entity_update
  dispatcher_call_shape:
    tool: cortex
    dispatch_key: op
    dispatch_value: entity_update
  flat_call_shape:
    tool: cortex_entity_update
    substrate_qualified: user-vortex__cortex_entity_update
  fol_descriptor: |
    ∀ entity_id ∈ Cortex: entity_update(entity_id, Δ) ⟹
      entity.fields ← entity.fields ∪ Δ
      ∧ Δ.attributes ≠ ∅ ⟹ attributes' = attributes ⊎ Δ.attributes
        (shallow top-level merge; ¬deletes keys by omission).
    ¬creates. Partial-patch semantics. Mutating. See agent_skill:cortex.
  json_schema:
    type: object
    properties:
      entity_id: {type: string}
      name: {type: string}
      description: {type: string}
      workflow_state: {type: string}
      attributes: {type: object, description: "Shallow top-level merge into existing attributes; omitted keys are preserved. Cannot delete attribute keys via PATCH — use explicit null only where the API documents field clearing."}
    required: [entity_id]
  skill_uri: agent_skill:cortex
  seat_visibility: [mcp, mcp_claude, mcp_grok]
  mandate_safety: write
  cache_priority: always_loaded
  introduced: 2026-05-22

