  fol_descriptor: "Attention pager — server-side proxy to email-bridge /pager/notify.\nref
    (turn or cortex:// URI) is caller-mandatory; missing ref degrades to (unreferenced).\n\
    Server stamps from_agent + timestamp. Honors PAGER_NOTIFY_ENABLED=0. Delivery identity\n\
    stays in email-bridge config — never in agent prose. Cowork operator seat only;\nagent_skill:pager-notify
