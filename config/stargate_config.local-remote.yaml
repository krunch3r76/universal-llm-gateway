# Local Remote Stargate Configuration
# Runs in container, proxies to isolated Gateway via Unix socket
#
# REQUIRED Environment Variables:
#   REMOTE_ID - Remote identifier (e.g., "local-remote")
#   FEDERATION_API_KEY - API key for Master authentication
#
# Note: ${VAR} syntax uses fail-fast. No defaults (${VAR:-default}) supported.

# Gateway settings (timeouts and resource management only)
# Note: gateway.url removed - use federation.local_gateway.socket_path instead
gateway:
  timeout: 30.0
  connectivity_timeout: 10.0
  health_timeout: 2.0
  request_timeout: 1800
  streaming_timeout: 1800
  resource_management:
    max_concurrent_model_loads: 1
    model_loading_slot_acquisition_timeout: 0.25
    reservation_timeout: 300
    reservation_cleanup_interval: 30
    enable_reservation_monitoring: true
  capabilities:
    cpu_performance: high
    hybrid_performance: high
  max_concurrent_cpu_models: 50
  max_concurrent_gpu_models: 10

# Proxy settings - receives requests from Master
proxy:
  port: 9999
  host: "0.0.0.0"
  cors_enabled: true

# Federation: Remote mode (WebSocket telemetry)
federation:
  mode: remote
  stargate_id: "${REMOTE_ID}"
  
  # Local gateway info (for telemetry reporting)
  local_gateway:
    socket_path: "/sockets/gateway.sock"
    url: null  # Socket mode, not HTTP
    gateway_id: "${REMOTE_ID}/gateway"
    public_url: "http://localhost:10999"  # URL for Master to reach this Stargate
  
  # Master configuration (for WebSocket telemetry connection)
  master:
    stargate_id: "master"
    url: "http://host.docker.internal:9999"  # Host's Master Stargate (via extra_hosts)
    api_key: "${FEDERATION_API_KEY}"
  
  # WebSocket settings (Remote initiates connection to Master)
  websocket:
    ping_interval_ms: 30000  # Keep-alive (≤30s for VPS)
    max_reconnect_delay_ms: 30000  # Fast recovery
    initial_reconnect_delay_ms: 1000
    reconnect_backoff_multiplier: 1.5

# Logging
# Note: LOG_LEVEL env var MUST be set (no defaults supported)
# For defaults, hardcode value: level: "INFO"
logging:
  level: "INFO"
  enable_console: true
  enable_file: true
  log_dir: "/tmp/logs/universal-stargate/local-remote"

# Model routing
model_routing:
  default_sticky: true
  sticky_overrides:
    qwen2-5-math-1-5b-instruct-q8-0-4096-cpu: false

# Request queue
request_queue:
  max_size: 1000
  default_timeout: 300
