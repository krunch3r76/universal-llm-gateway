# GPU Localhost Relay Stargate Configuration
# Relay Stargate runs on localhost (local process)
# Connects to Master on localhost AND to local Edge+Gateway container

# Local gateway (NON-CONNECTION settings only for Remote mode)
# Note: socket_path/url NOT used for Remote mode - use federation.local_edge instead
gateway:
  timeout: 30.0
  connectivity_timeout: 10.0
  health_timeout: 2.0
  request_timeout: 1800
  streaming_timeout: 1800
  resource_management:
    max_concurrent_model_loads: 1
    model_loading_slot_acquisition_timeout: 0.25
    reservation_timeout: 300
    reservation_cleanup_interval: 30
    enable_reservation_monitoring: true
  capabilities:
    cpu_performance: high
    hybrid_performance: high
  max_concurrent_cpu_models: 50
  max_concurrent_gpu_models: 10

# Proxy settings - receives requests from Master
proxy:
  port: 9998
  host: "0.0.0.0"
  cors_enabled: true

# Federation: Remote mode (relay topology)
federation:
  mode: remote
  stargate_id: relay-localhost
  # Relay topology: WebSocket telemetry (default, no disable_websocket needed)
  
  # Master to connect TO (Remote-initiates WebSocket)
  master:
    stargate_id: master-localhost
    url: "http://localhost:9999"  # Master on same host
    api_key: "${FEDERATION_KEY_LOCALHOST}"
  
  # Local Edge Stargate (federation protocol over Unix socket)
  local_edge:
    socket_path: "/tmp/universal-protocol/edge-localhost.sock"  # Unix socket to Edge container
    stargate_id: "edge-localhost"
    api_key: "${FEDERATION_KEY_EDGE_LOCALHOST}"
  
  # Reconnection settings (bounded backoff)
  ping_interval_ms: 15000
  max_reconnect_delay_ms: 30000
  reconnect_interval_ms: 1000

# Logging
logging:
  level: "DEBUG"
  enable_console: true
  enable_file: true
  log_dir: "/tmp/logs/universal-stargate-gpu-relay-localhost"

# Model routing
model_routing:
  default_sticky: true

# Request queue
request_queue:
  max_size: 1000
  default_timeout: 300
