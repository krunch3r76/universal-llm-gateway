# config/skills.yaml — authoritative skill placement + MCP surface catalog
#
# One row per active SOT slug. Three orthogonal axes (do not conflate):
#
#   1. surface_class — Customize/Skills + SOT home (Claude.ai upload set):
#        cursor_only  → Cursor IDE / code seats; ¬ uploaded to Customize Skills
#        shared_sync  → Cursor + Claude.ai Customize
#        life_local   → Claude.ai / life only
#      cursor_only means ¬web Customize slug — NOT "hub-only".
#      Ecosystem Cursor satellites (vortex-code MCP) run cursor_only cascades
#      when bodies ship via ulg-ecosystem plugin census (SKILLS_CENSUS.txt).
#
#   2. mcp_surface_required — runtime MCP compatibility (code ⊇ life ⊇ none).
#
#   3. ecosystem plugin delivery — skill_shared ⊥ mcp_endpoint_ready:
#        ship skill/command bodies via cursor-plugins/ulg-ecosystem census now;
#        promote script transports (e.g. project-ask) to MCP only when
#        seat-agnostic invocation is required (decision:ecosystem-code-cascade-
#        vortex-implies-full). Web/life annex remains for non-code surfaces.
#
# Optional aliases canonicalize filesystem/entity name variants.
# Optional delivery_priority (lower = earlier) relocates former backfill overrides.
#
# Loader: libs/claude_bundles/catalog.py

