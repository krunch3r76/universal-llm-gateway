schema_version: 6
id: skill-suggest-rank
version: "1.0"
type: skill_suggest_rank
description: >
  Cheap-model rerank for skill_suggest Stage-B. Reorders/prunes within the
  Stage-A candidate set only; JSON-only output.
output: rank

options:
  timeout_seconds: 5

steps:
  - name: rank
    type: generate
    model_ref: ranker
    prompt_ref: skill_suggest_rank.v1.rank
    generation_parameters:
      temperature: 0.0
      max_tokens: 512
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            ranked:
              type: array
              items:
                type: object
                properties:
                  slug: {type: string}
                  reason: {type: string}
                required: [slug, reason]
          required: [ranked]
