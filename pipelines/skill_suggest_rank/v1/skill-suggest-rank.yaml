schema_version: 6
id: skill-suggest-rank
version: "1.0"
type: skill_suggest_rank
description: >
  Cheap-model rerank for skill_suggest Stage-B. Reorders/prunes within the
  Stage-A candidate set only; JSON-only output.
output: rank

options:
  timeout_seconds: 30

dispatch:
  idle:
    timeout_seconds: 120
  liveness:
    ack_window_seconds: 3
    idle_poll_interval_seconds: 2
  cortex:
    timeout_seconds: 30
  transport:
    mcp_relay_timeout_seconds: 330
    agent_bus_wait_chunk_seconds: 60
    agent_bus_client_timeout_seconds: 70
    agent_bus_max_wait_seconds: 60
    worker_probe_timeout_seconds: 10
    worker_dispatch_http_timeout_seconds: 10
    wait_retry_backoff_seconds: 1
  worker:
    outer_timeout_seconds: 1920

steps:
  - name: rank
    type: generate
    model_ref: ranker
    prompt_ref: skill_suggest_rank.v1.rank
    generation_parameters:
      temperature: 0.0
      # Gemini 2.5 shares maxOutputTokens between thinking + visible output;
      # 512 caused finish_reason=length after ~9 completion tokens on large
      # candidate sets (28+ slugs). Classification JSON needs headroom, not depth.
      max_tokens: 8192
      reasoning_effort: none
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            ranked:
              type: array
              items:
                type: object
                properties:
                  slug: {type: string}
                  description: {type: string}
                  reason: {type: string}
                required: [slug, description, reason]
          required: [ranked]
