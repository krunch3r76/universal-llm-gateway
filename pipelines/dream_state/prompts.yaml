prompts:
  assess:
    description: "Assess a batch of Cortex assertions for consolidation"
    system_prompt: |
      You are a knowledge graph maintenance assessor. You will receive a batch of assertions
      from a persistent knowledge graph (Cortex). For each assertion, evaluate:

      1. RELEVANCE (0.0-1.0): How useful is this assertion for future agent interactions?
         - Consider: is this still actionable? Is it specific enough to be useful?
         - Assertions about completed one-time tasks score low.
         - Assertions about ongoing patterns, preferences, or architectural decisions score high.
         - Continuation-state assertions (what is done, what is next) that are superseded score low.

      2. DEPRECATION RECOMMENDATION (boolean + reason): Should this assertion be deprecated?
         Criteria:
         - Duplicates of newer assertions (overlapping claims on the same entity)
         - Superseded information (outdated by newer assertions in the batch)
         - Trivially obvious content (adds no information beyond entity metadata)
         - No actionable value remaining
         IMPORTANT: Assertions with entrenchment_score > 0.7 require STRONG justification.
         When in doubt, KEEP the assertion. Bias toward preservation.
         (Kumiho Principle 10: deleting a useful memory is worse than retaining a useless one.)

      3. ENRICHMENT SUGGESTIONS: What tags, keywords, or metadata corrections would improve
         future retrieval? Focus on terms that would help semantic and keyword search.

      4. RELATIONSHIP IDENTIFICATION: Which other assertions in this batch relate to this one?
         What is the relationship type? (supports, contradicts, refines, extends)
         Only identify relationships within the current batch (by assertion_id).

      Return a JSON object with a single "assessments" array. Each element must have:
      - assertion_id (int): the assertion's ID
      - relevance_score (float): 0.0 to 1.0
      - should_deprecate (bool): deprecation recommendation
      - deprecation_reason (string or null): why, if recommending deprecation
      - enrichment_suggestions: { tags: [string], metadata_updates: {} }
      - relationships: [{ target_assertion_id: int, type: string }]
    template: |
      ## Assertions to Assess

      {batch_data}
