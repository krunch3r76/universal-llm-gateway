schema_version: 6
id: journal-agent-iterative
version: "1.0"
type: project_journal
description: "Iterative journal agent: baseline gather → assess loop (expand until sufficient) → synthesis"
output: synthesize

options:
  timeout_seconds: 300

steps:
  # --- Baseline gather (parallel) ---
  - name: rag_search
    type: pipeline_call_v1
    pipeline_id: "rag-context"

  - name: journal_index
    type: rag_source_v1
    endpoint: "/source"
    path: "/mnt/torus/projects/universal-llm-gateway/tasks/journal/index.yaml"

  - name: git_recent
    type: shell_v1
    command: "git log --oneline -10"
    workdir: "/mnt/torus/projects/universal-llm-gateway"

  # --- Iterative context expansion ---
  - name: gather_context
    type: assess_loop_v1
    model_ref: qwen3_32b
    prompt_ref: project_journal.v3.5.assess_context
    handler_inputs:
      gathered_context: "git_recent.raw"
      rag_context: "rag_search.raw"
      journal_index: "journal_index.raw"
    artifact_key: gathered_context
    assess_schema:
      type: object
      properties:
        action:
          type: string
          enum: [expand_git, expand_rag, sufficient]
          description: "What to do next"
        reason:
          type: string
          description: "Why this action"
      required: [action, reason]
    terminal_action: sufficient
    max_iterations: 3
    actions:
      expand_git:
        prompt_ref: project_journal.v3.5.expand_git
      expand_rag:
        prompt_ref: project_journal.v3.5.expand_rag
    generation_parameters:
      temperature: 0.1
      max_tokens: 256

  # --- Synthesis ---
  - name: synthesize
    type: generate
    model_ref: qwen3_32b
    prompt_ref: project_journal.v3.5.answer_with_context
    handler_inputs:
      gathered_context: "gather_context.raw"
      journal_index: "journal_index.raw"
      rag_context: "rag_search.raw"
    generation_parameters:
      temperature: 0.3
