schema_version: 6
id: code-review
version: "1"
type: code_review
description: "Code review: structured critique → cross-model validation → deterministic merge"
output: merge

options:
  timeout_seconds: 730

estimation:
  # budget_source_tokens = (source_code_chars / chars_per_token) * validate_amplification + fixed_overhead_tokens
  budget_source_tokens: 12000 # (source_code_chars / chars_per_token) * validate_amplification + fixed_overhead_tokens
  chars_per_token: 3.5
  validate_amplification: 1.3
  fixed_overhead_tokens: 1300
  large_file_warning_tokens: 20000

steps:
  - name: review
    type: generate
    model_ref: review_model
    model_requirements:
      task: code_review
      min_score: strong
      count: 1
      source: cloud
      max_latency_bucket: fast
      large_payload_latency_bucket: fast
      large_payload_threshold_tokens: 6000
    prompt_ref: code_review.review
    handler_inputs:
      source_code: sourceNs.text
    generation_parameters:
      temperature: 0.4
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            findings:
              type: array
              items:
                type: object
                properties:
                  category:
                    type: string
                    enum:
                      - dead_code
                      - duplication
                      - verbose_pattern
                      - type_issue
                      - api_inconsistency
                      - naming
                      - simplification
                      - race_condition
                      - resource_leak
                      - error_handling
                      - invariant_violation
                      - event_coverage
                      - correctness
                      - documentation
                  severity:
                    type: string
                    enum: [critical, warning, suggestion]
                  target:
                    type: string
                    description: "file:function, class name, or line range"
                  observation:
                    type: string
                    description: "What the issue is, with specific details"
                  action:
                    type: string
                    description: "Exactly what should be done to fix it"
                  current_code:
                    type: string
                    description: "Exact code from the source with the issue"
                  fixed_code:
                    type: string
                    description: "Exact replacement code"
                required: [category, severity, target, observation, action, current_code, fixed_code]
            clean_files:
              type: array
              items:
                type: string
              description: "Files or sections with no issues found — brief confirmation each"
            event_coverage:
              type: array
              items:
                type: object
                properties:
                  behavioral_change:
                    type: string
                    description: "Description of the state transition or decision point"
                  signal:
                    type: string
                    description: "Event signal name (e.g., request.completed)"
                  status:
                    type: string
                    enum: [exists, missing, needs_update]
                required: [behavioral_change, signal, status]
          required: [findings, clean_files, event_coverage]
    timeout_seconds: 360
    retry_policy:
      max_attempts: 3
      backoff_strategy: exponential
      initial_interval_seconds: 3.0
      max_interval_seconds: 15.0
      retry_on: ["ProxyClientError"]

  - name: validate
    type: generate
    model_ref: validate_model
    model_requirements:
      task: code_review
      min_score: good
      count: 1
      source: cloud
      health_scoring: true
      max_latency_bucket: fast
      large_payload_latency_bucket: fast
      large_payload_threshold_tokens: 6000
    prompt_ref: code_review.validate
    handler_inputs:
      source_code: sourceNs.text
      review_output: review.raw
    generation_parameters:
      temperature: 0.2
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            validated_findings:
              type: array
              items:
                type: object
                properties:
                  category:
                    type: string
                    enum:
                      - dead_code
                      - duplication
                      - verbose_pattern
                      - type_issue
                      - api_inconsistency
                      - naming
                      - simplification
                      - race_condition
                      - resource_leak
                      - error_handling
                      - invariant_violation
                      - event_coverage
                      - correctness
                      - documentation
                  original_severity:
                    type: string
                    enum: [critical, warning, suggestion]
                  validated_severity:
                    type: string
                    enum: [critical, warning, suggestion]
                  validator_status:
                    type: string
                    enum: [confirmed, downgraded, rejected, added]
                  validator_reasoning:
                    type: string
                    description: "Why the validator agrees, disagrees, or adds this finding"
                  target:
                    type: string
                  observation:
                    type: string
                  action:
                    type: string
                  current_code:
                    type: string
                  fixed_code:
                    type: string
                required:
                  - category
                  - original_severity
                  - validated_severity
                  - validator_status
                  - validator_reasoning
                  - target
                  - observation
                  - action
                  - current_code
                  - fixed_code
            clean_files:
              type: array
              items:
                type: string
            event_coverage:
              type: array
              items:
                type: object
                properties:
                  behavioral_change:
                    type: string
                  signal:
                    type: string
                  status:
                    type: string
                    enum: [exists, missing, needs_update]
                required: [behavioral_change, signal, status]
          required: [validated_findings, clean_files, event_coverage]
    timeout_seconds: 360
    retry_policy:
      max_attempts: 3
      backoff_strategy: exponential
      initial_interval_seconds: 3.0
      max_interval_seconds: 15.0
      retry_on: ["ProxyClientError"]

  - name: merge
    type: code_review_merge_findings
    handler_inputs:
      validated_output: validate.raw
    timeout_seconds: 10
