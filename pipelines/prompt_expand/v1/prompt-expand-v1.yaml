# prompt-expand v1 — two-key expand pipeline (contract·stage·tier retrieve).
# Authorship is outside the DAG: the prelude renders author_* prompts and
# dispatches read-only cursor/grok-4.7 (Cursor substrate, not chat completions).
#
# Invocation (operator TASK that does not name a contract):
#   pipeline(op="run", pipeline_id="prompt-expand",
#            messages=[{"role":"user","content":"<TASK>"}],
#            options={
#              "contract": "none",            # unnamed operator TASK → none
#              "stage": "none",               # pair with contract=none
#              "executor_tier": "frontier",   # default frontier
#              "target": "cursor",            # required; cdp|cursor (grok-bot → typed reject)
#              "delivery": "prompt",          # prompt|dispatch (default prompt)
#              "rag_fail": "abort",           # abort|stamp (default abort)
#              "follow_up": "none",           # caller hint only
#            })
# A TASK that already names a contract is not this door — do not copy
# implement/g5 as the default recipe. should_expand still skips generate
# contract=none (author/residual recurse-prevention); that skip is not
# this invocation.

schema_version: 6
id: prompt-expand
version: "1.0"
type: prompt_expand
description: >
  Two-key prompt expansion retrieve leg: target-invariant RAG (profile key)
  then a structured author bundle for the prelude Cursor-substrate author.
  Fire and authorship stay outside the DAG.
output: format_output

options:
  timeout_seconds: 600

steps:
  - name: validate_options
    type: prompt_expand_validate_options_v1

  - name: resolve_profile
    type: prompt_expand_profile_lookup_v1

  - name: retrieve_context
    type: prompt_expand_retrieve_v1
    consumer_model_ref: expand
    # Live rag-context retrieve_assemble is 126–241s (7154e190 child 455db37b
    # was 126s / 43k chars). 90s abandoned that child; a later retry returned
    # the 50-char no-results sentinel and classify stamped rag_status=ok.
    # per_attempt must outlive one assemble; wall ≥ 1×attempt (retry is timeout-only).
    per_attempt_timeout_seconds: 260
    timeout_seconds: 280

  - name: classify_retrieve
    type: prompt_expand_classify_retrieve_v1
    handler_inputs:
      retrieve_raw: retrieve_context.raw
      retrieve_json: retrieve_context.json

  - name: format_output
    type: prompt_expand_format_output_v1
    reads_from:
      - step: validate_options
        fields: [json]
      - step: resolve_profile
        fields: [json]
      - step: retrieve_context
        fields: [raw]
      - step: classify_retrieve
        fields: [json]
