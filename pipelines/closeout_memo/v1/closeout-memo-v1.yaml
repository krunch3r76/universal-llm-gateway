# closeout-memo — pointer paste into the operator Cowork tab.
#
# Ingress: POST /api/v1/capabilities/closeout_memo/closeout-memo
# Body model is closeout-memo; pipeline_options is a CloseoutMemoRequest.

schema_version: 6
id: closeout-memo
version: "1.0"
type: closeout_memo
category: closeout_memo
description: >
  Admit and dedupe a closeout memo, coalesce per wake lane, render a
  pointer-only paste, deliver via project-ask followup, and fall back
  to a bus turn plus a coalesced page.
output: fallback

options:
  timeout_seconds: 180

steps:
  - name: admit
    type: closeout_memo_admit_v1

  - name: coalesce
    type: closeout_memo_coalesce_v1
    condition: "not admit.json.get('deduped')"

  - name: deliver
    type: closeout_memo_deliver_v1
    condition: "not admit.json.get('deduped') and coalesce.json.get('rendered')"

  - name: fallback
    type: closeout_memo_fallback_v1
    condition: "deliver.json.get('needs_fallback') == True"
