schema_version: 6
id: orion-chat-wake
version: "1.0"
type: orion_chat_wake
category: orion_chat_wake
description: >
  Paste a pointer wake into the pinned Orion chatgpt.com conversation on CDP 9342.
  Never pastes turn bodies. Refuses when the conversation tab is missing, CDP is
  down, Orion is streaming, or the approval dialog is unrecognized.
output: orion-chat-wake

options:
  timeout_seconds: 45
  thread:
    type: string
    description: agent-bus thread id
    default: ""
  turn:
    type: integer
    description: bus turn number (pointer only)
    default: 0
  from_agent:
    type: string
    description: sender on the bus turn being woken
    default: ""
  conversation_url:
    type: string
    description: pinned https://chatgpt.com/c/<uuid> holder address
    default: ""
  cdp_url:
    type: string
    description: Orion Chromium CDP base URL
    default: ""

steps:
  - name: orion-chat-wake
    type: orion_chat_wake_v1
