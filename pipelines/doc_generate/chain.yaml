schema_version: 6
id: doc-generate
version: "1"
type: doc_generate
description: "Generate architecture docs from Python docstrings with verification"
output: result

options:
  timeout_seconds: 480

steps:
  - name: extract
    type: doc_generate_extract_docstrings
    handler_inputs:
      subsystem_path: sourceNs.text
    output_declarations:
      inventory:
        binding: raw
        type: str
        description: "JSON-serialized docstring inventory for the subsystem"
      existing_doc:
        binding: json.existing_doc
        type: str
        description: "Current architecture doc content (if exists)"
      error:
        binding: json.error
        type: str
        description: "Error message if extraction failed"
    timeout_seconds: 45

  - name: draft
    type: generate
    model_ref: draft_model
    prompt_ref: doc_generate.draft
    condition: "extract.json.get('error') is None"
    handler_inputs:
      subsystem_path: sourceNs.text
      inventory_json: extract.raw
      existing_doc: extract.json.existing_doc
    output_declarations:
      doc_markdown:
        binding: json.doc_markdown
        type: str
        description: "Draft architecture document markdown"
    generation_parameters:
      temperature: 0.2
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            doc_markdown:
              type: string
              description: "Draft architecture document markdown"
          required: [doc_markdown]
    timeout_seconds: 240
    retry_policy:
      max_attempts: 3
      backoff_strategy: exponential
      initial_interval_seconds: 3.0
      max_interval_seconds: 15.0
      retry_on: ["ProxyClientError"]

  - name: review
    type: generate
    model_ref: review_model
    prompt_ref: doc_generate.review
    condition: "extract.json.get('error') is None"
    handler_inputs:
      subsystem_path: sourceNs.text
      inventory_json: extract.raw
      draft_doc: draft.json.doc_markdown
    output_declarations:
      doc_markdown:
        binding: json.doc_markdown
        type: str
        description: "Verified architecture document markdown"
      unsupported_claims:
        binding: json.unsupported_claims
        type: list
        description: "Claims in draft not supported by extracted inventory"
      missing_coverage:
        binding: json.missing_coverage
        type: list
        description: "Modules/functions/classes that should be documented"
      human_markers:
        binding: json.human_markers
        type: list
        description: "HUMAN markers requiring manual synthesis"
      review_notes:
        binding: json.review_notes
        type: list
        description: "Verifier notes about scope limits and provenance"
    generation_parameters:
      temperature: 0.1
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            doc_markdown:
              type: string
              description: "Verified architecture document markdown"
            unsupported_claims:
              type: array
              items:
                type: string
              description: "Claims in draft_doc not supported by extracted inventory"
            missing_coverage:
              type: array
              items:
                type: string
              description: "Missing modules/functions/classes that should be documented"
            human_markers:
              type: array
              items:
                type: string
              description: "All HUMAN markers that require manual synthesis"
            review_notes:
              type: array
              items:
                type: string
              description: "Verifier notes about scope limits and provenance"
          required:
            - doc_markdown
            - unsupported_claims
            - missing_coverage
            - human_markers
            - review_notes
    timeout_seconds: 240
    retry_policy:
      max_attempts: 3
      backoff_strategy: exponential
      initial_interval_seconds: 3.0
      max_interval_seconds: 15.0
      retry_on: ["ProxyClientError"]

  - name: result
    type: select_output
    candidates:
      - review
      - extract
    handler_inputs:
      review_out: review.raw
      extract_out: extract.raw
