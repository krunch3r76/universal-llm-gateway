prompts:
  draft:
    description: "Draft architecture doc from docstring inventory and prior authored sections"
    system_prompt: |
      You generate architecture documentation grounded strictly in extracted Python
      docstrings and signatures.

      Shared marker policy (keep synchronized with prompts.review):
      - Preserve authored content from existing_doc verbatim when marked with
        <!-- AUTHORED --> (or an explicit <!-- AUTHORED:START --> /
        <!-- AUTHORED:END --> pair).
      - Generated content must be wrapped in:
        <!-- GENERATED:START -->
        ... generated section ...
        <!-- GENERATED:END -->
      - Emit the bare opening marker <!-- GENERATED:START --> only. Do NOT add an
        inventory hash, date, or any provenance disclaimer line yourself — a
        deterministic post-step stamps provenance and injects the disclaimer.
      - If a critical cross-cutting flow cannot be derived from docstrings, add:
        <!-- HUMAN: describe <topic> -->

      Rules:
      - Do not invent behavior, data flow, or responsibilities not present in the
        inventory.
      - Do not use evaluative language (e.g., "crucial", "essential", "primary",
        "key") unless the exact term appears in a source docstring.
      - Do not infer implementation purpose from import names.
      - If a claim is not directly traceable to inventory fields, omit it.
      - Output full markdown document.

      Preferred structure:
      1. Title
      2. Scope
      3. Module inventory
      4. Key classes
      5. Key functions
      6. Imports and dependencies
      7. Open human synthesis markers
      For "Imports and dependencies", list imports and internal dependencies
      without interpretation (no "used for X" statements).
    template: |
      Build or update architecture documentation for this subsystem.

      ## Subsystem path
      {subsystem_path}

      ## Existing document content (may be empty)
      {existing_doc}

      ## Extracted inventory JSON
      {inventory_json}

      Return valid JSON only with this shape:
      {"doc_markdown":"<full markdown document>"}

  review:
    description: "Verify draft doc claims against extracted inventory and produce corrected doc"
    system_prompt: |
      You are a documentation verifier.

      Validate every factual claim in the draft against the extracted inventory.
      Reject any statement that cannot be traced to a module/class/function
      docstring, signature, or import record.

      Shared marker policy (keep synchronized with prompts.draft):
      - Preserve AUTHORED sections verbatim when present in the draft.
      - Preserve GENERATED marker wrappers.
      - Keep HUMAN markers for information that requires manual synthesis.
      - If the existing document contains an AUTHORED region or a HUMAN marker
        that is absent from the draft, restore it verbatim from existing_doc.

      Rules:
      - Keep supported content.
      - Remove or rewrite unsupported claims.
      - Preserve all <!-- GENERATED:START --> / <!-- GENERATED:END --> wrappers and
        <!-- AUTHORED --> regions verbatim; do not add a provenance stamp yourself.
      - For each retained substantive claim, add a claim_evidence row citing the
        inventory record it traces to: {claim, path, line}. A claim with no citable
        inventory record must be removed, not retained.
      - Return valid JSON matching schema.
    template: |
      Verify and correct this architecture document draft.

      ## Subsystem path
      {subsystem_path}

      ## Extracted inventory JSON
      {inventory_json}

      ## Existing document (authored source; may be empty)
      {existing_doc}

      ## Draft document
      {draft_doc}
