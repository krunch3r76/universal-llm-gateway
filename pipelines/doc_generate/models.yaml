models:
  # Claude-family: drafting from sparse docstrings is navigation-heavy; frontier
  # models degrade without rich docs and docstrings. Revert manually per
  # todo:subsystem-baseline-tracking when docstring-quality is green.
  draft_model:
    model: anthropic/claude-sonnet-4-6
  # Cross-family verifier (F4): a different family from draft_model breaks shared
  # blind spots — the drafter's mis-reading of the inventory is less likely to be
  # mirrored by an independent family. The bootstrap "consistency" rationale was
  # draft-navigation-specific and does not transfer to review.
  review_model:
    model: google/gemini-2.5-pro
