# display-chat-wake — paste one BRIDGE_WAKE when the sidebar title matches.
#
# One step. Options: display, app, thread, slug, title, turn.
# A title mismatch finishes the run with ok false. It does not fail the pipeline.
#
#   pipeline(op="run", pipeline_id="display-chat-wake",
#            messages=[{"role":"user","content":"wake"}],
#            options={
#              "display": "9",
#              "app": "grok",
#              "thread": "15851",
#              "title": "Grok Coordinator 1",
#              "turn": 285,
#            })

schema_version: 6
id: display-chat-wake
version: "1.0"
type: display_chat_wake
category: display_chat_wake
description: >
  Paste BRIDGE_WAKE thread=<id> turn=<n> into the named display app when
  the active sidebar title matches the specified `title` (or "<thread> <slug>"
  when `title` is omitted). Any other gate result completes with ok false
  and pasted false.
output: display-chat-wake

options:
  timeout_seconds: 30
  display:
    type: string
    description: X11 display number, 8 or 9
    default: ""
  app:
    type: string
    description: cursor or grok
    default: ""
  thread:
    type: string
    description: agent-bus thread id for BRIDGE_WAKE thread=<id> turn=<n>
    default: ""
  slug:
    type: string
    description: thread slug when sidebar title is "<thread> <slug>" (optional if title is set)
    default: ""
  title:
    type: string
    description: exact sidebar title to match (overrides "<thread> <slug>" when set)
    default: ""
  turn:
    type: integer
    description: bus turn to wake; the paste does not include the turn body
    default: 0

steps:
  - name: display-chat-wake
    type: display_chat_wake_v1
