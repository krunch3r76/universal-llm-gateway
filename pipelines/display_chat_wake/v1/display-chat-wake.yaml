# display-chat-wake — select and paste one BRIDGE_WAKE into the target sidebar chat.
#
# One step. Options: display, app, thread, slug, title, agent_id, select, turn.
# When select is true (default), switches to the target sidebar row if the active
# chat is idle and its composer is empty. Any gate refusal finishes the run with
# ok false without failing the pipeline.
#
#   pipeline(op="run", pipeline_id="display-chat-wake",
#            messages=[{"role":"user","content":"wake"}],
#            options={
#              "display": "9",
#              "app": "grok",
#              "thread": "15851",
#              "title": "Coordinator Relay 2",
#              "agent_id": "5e5acdab-7081-4eef-ba5f-9c5a4fb0e071",
#              "turn": 286,
#            })

schema_version: 6
id: display-chat-wake
version: "1.1"
type: display_chat_wake
category: display_chat_wake
description: >
  Select (when needed and safe) and paste BRIDGE_WAKE thread=<id> turn=<n>
  into the named display app matching `agent_id` or `title` (or "<thread> <slug>"
  when both are omitted). Refuses with ok false when the active chat is
  generating, the composer holds draft text, or the target is missing.
output: display-chat-wake

options:
  timeout_seconds: 30
  display:
    type: string
    description: X11 display number, 8 or 9
    default: ""
  app:
    type: string
    description: cursor or grok
    default: ""
  thread:
    type: string
    description: agent-bus thread id for BRIDGE_WAKE thread=<id> turn=<n>
    default: ""
  slug:
    type: string
    description: thread slug when sidebar title is "<thread> <slug>" (optional if title or agent_id is set)
    default: ""
  title:
    type: string
    description: exact sidebar title to match (overrides "<thread> <slug>" when set)
    default: ""
  agent_id:
    type: string
    description: surface data-agent-id UUID to match first when set
    default: ""
  select:
    type: boolean
    description: automatically click the target sidebar row when not already active
    default: true
  turn:
    type: integer
    description: bus turn to wake; the paste does not include the turn body
    default: 0

steps:
  - name: display-chat-wake
    type: display_chat_wake_v1
