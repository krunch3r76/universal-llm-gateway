# Consensus v8.0 prompts
# Namespace: consensus.v8.0
#
# Self-contained prompt set for v7 pipeline.

prompts:
  analyze_question:
    description: "Classify question and extract structure hints for synthesis."
    system_prompt: |
      You analyze questions to extract structural metadata. Output valid JSON only.

      OUTPUT JSON SCHEMA:
      {
        "cleaned_question": "string - grammatically clean version of the question",
        "question_type": "string - one of: enumeration, comparison, definition, explanation, simple, proof",
        "required_items": [{"label": "string", "required": true}],
        "cardinality": "integer - expected count (0 if flexible)",
        "ordering": "string - canonical, alphabetical, or none",
        "structure_notes": "string - additional structural requirements"
      }

      QUESTION TYPE CLASSIFICATION:
      
      1. enumeration: Questions asking to list multiple distinct items
         - Patterns: "List X", "Name the X", "What are the X"
         - CRITICAL: "Explain [the] X layers/types/phases/steps" is ALWAYS enumeration
         - cardinality: count of items; ordering: "canonical" or "none"
      
      2. comparison: Questions comparing two or more entities
         - Patterns: "Compare X and Y", "What is the difference between X and Y"
         - cardinality: entity count
      
      3. definition: Questions asking for meaning/definition
         - Patterns: "Define X", "What is X"
         - cardinality: 1
      
      4. explanation: Questions about processes/mechanisms (NOT about layers/types/phases)
         - Patterns: "Explain how X works", "Explain why X happens"
         - cardinality: 0 (flexible)
      
      5. simple: Yes/no questions
         - Patterns: "Is X true?"
         - cardinality: 1
      
      6. proof: Questions requiring formal proof
         - Patterns: "Prove X", "Show that X is Y"
         - cardinality: 2 (claim + proof)


      REQUIRED_ITEMS RULES:
      
      RULE 1 (Well-known enumerations):
      If the question asks about a WELL-KNOWN ENUMERATION listed above,
      you MUST create a separate required_items entry for EACH specific item.
      
      Example: "Explain the four seasons of the year"
      required_items: [
        {"label": "Spring", "required": true},
        {"label": "Summer", "required": true},
        {"label": "Fall/Autumn", "required": true},
        {"label": "Winter", "required": true}
      ]
      cardinality: 4
      
      RULE 2 (Unknown enumerations):
      If the question asks to enumerate something NOT in the well-known list,
      use a single high-level label.
      
      Example: "List the benefits of exercise"
      required_items: [{"label": "benefits", "required": true}]
      cardinality: 0

      CARDINALITY EXAMPLES:
      - "N types of X" = N
      - "X model layers" = count(layers) if well-known, else 0
      - "Y layers/phases/steps" = count(items) if canonical, else 0
      - "steps of Z" = 0 if methodology-dependent
      - "Compare X and Y" = 2
    template: |
      {text}


  answer:
    description: "Generate a thorough answer to the question."
    system_prompt: |
      Answer the question thoroughly and accurately. Write in clear paragraphs.
      Cover all aspects the question asks about.
      Include specific examples, named methods, or concrete details where possible.
      Statements must be verifiable — but formal, structural, and foundational
      claims are equally valid as empirical ones.
      
      DEPTH OVER SURFACE:
      - When the question references a specific discipline, prioritize that
        field's core motivations, formal frameworks, and foundational concepts
      - For "why" questions: address the deeper theoretical motivations first,
        then practical implications if relevant
      - If a question uses specific technical framing but asks about broader
        concerns, recognize and address the underlying conceptual issue
      - Prefer foundational explanations (axioms, structural properties,
        formal distinctions) over applied consequences
      
      CRITICAL CONSTRAINT:
      If you do not have sufficient factual information to answer the question,
      state only what is unknown and STOP. Do not speculate, infer, or provide
      educated guesses. The words "likely", "perhaps", "probably", "based on",
      "suggests", and "speculation" are forbidden.
      
      WRITING STYLE - POSITIVE FRAMING:
      - State what IS true rather than what is NOT true
      - Avoid negative formulations unless they directly answer the question
      - Focus on positive properties and characteristics

      In response to technical questions, compare and contrast different approaches, schools of thought, or contrasting

    template: |
      {question}

  decompose:
    description: "Extract all factual claims with source sentence provenance."
    system_prompt: |
      Extract every independently verifiable claim from the numbered sentences below.
      Output a JSON object with a "claims" array. Each element is an object:
        "text": the claim (string)
        "source_sentences": array of integer indices of the sentence(s) this claim derives from

      RULES:
      - Each claim must be a complete, self-contained sentence
      - Each claim must be independently verifiable (true or false)
      - Do NOT combine multiple facts into one claim
      - When a sentence lists multiple examples (e.g., "X appears in A, B, and C"),
        extract ONE claim per listed item with the subject repeated explicitly
      - Each distinct verifiable fact in a comma-separated list must be its own claim
      - Do NOT add information not present in the text
      - Do NOT include opinions, hedging, or meta-commentary
      - Include ALL factual claims, even minor ones
      - For mathematical claims, preserve equations exactly
      - source_sentences MUST reference the bracketed index numbers shown in the input

      CRITICAL - RESOLVE ALL REFERENCES:
      - Replace pronouns (it, this, that, which, who, he, she) with explicit subjects
      - Replace demonstrative + noun phrases (these molecules, this process, that entity,
        those particles) with the specific entity they refer to
      - Replace implicit references with the entities they refer to
      - Each claim must mention all relevant entities explicitly
      - Test: cover the preceding text — does the claim still make sense alone?

      MECHANISM CLAUSES — EXTRACT AS SEPARATE CLAIMS (CRITICAL):
      When a sentence contains a mechanism clause ("by VERB-ing ENTITY",
      "through ENTITY", "via ENTITY"), the mechanism is a separately
      verifiable assertion and MUST become its own claim. Do NOT let it
      dissolve into pronoun resolution for the clause that follows.
        Input: "X decreases Y by inhibiting enzyme E, which converts A into B."
        → [{"text": "X decreases Y"},
           {"text": "X inhibits enzyme E"},
           {"text": "Enzyme E converts A into B"}]
        WRONG — the mechanism claim evaporates:
        ❌ [{"text": "X decreases Y"},
            {"text": "Enzyme E converts A into B"}]
      The mechanism subject is the sentence subject (X), not the entity named
      in the clause. "X inhibits E" must be produced explicitly even when the
      next clause correctly resolves "this enzyme" to E.

      SET MEMBERSHIP ENUMERATIONS:
      When a sentence lists items belonging to a set ("the factors are A, B, C",
      "the members include X, Y, Z"), extract each item as an individual
      MEMBERSHIP claim using the singular form:
        ✅ "A is a factor of N."  (individual membership)
        ❌ "The factors of N are A."  (reads as exhaustive — ambiguous)

      Examples (given numbered sentences as input):
      - "[0] Entity A has property X, which has value Y."
        → [{"text": "Entity A has property X", "source_sentences": [0]},
            {"text": "Property X has value Y", "source_sentences": [0]}]
      - "[2] System S performs operation O. [3] This produces result R."
        → [{"text": "System S performs operation O", "source_sentences": [2]},
            {"text": "Operation O produces result R", "source_sentences": [2, 3]}]
      - "[5] The official languages of Switzerland are German, French, Italian, and Romansh."
        → [{"text": "German is an official language of Switzerland", "source_sentences": [5]},
            {"text": "French is an official language of Switzerland", "source_sentences": [5]},
            {"text": "Italian is an official language of Switzerland", "source_sentences": [5]},
            {"text": "Romansh is an official language of Switzerland", "source_sentences": [5]}]

      QUESTION CONTEXT (for disambiguation only): {question}
    template: |

      {numbered_sentences}

  decompose_general_compound:
    description: "Decompose compound general claim into atomic sub-claims."
    system_prompt: |
      Decompose a compound statement that lists multiple facts into
      independently verifiable atomic sub-claims.

      RULES:
      - Each sub-claim must be independently verifiable as true or false
      - Preserve all specific details (names, dates, titles, numbers) exactly
      - Each sub-claim must name the subject explicitly (no pronouns, no "it",
        no "this", no anaphoric references like "the concept" or "the element")
      - Each sub-claim must be SELF-STANDING: a reader with no context must
        understand what it asserts without seeing the parent statement
      - Enumerated items ("such as A, B, and C") become one sub-claim per item
      - Adjective lists ("X is A, B, and C") become one sub-claim per adjective,
        each repeating the full subject and predicate
      - When a claim identifies an entity AND lists its properties or uses,
        split the identity from each property/use
      - If the statement is already atomic, return it as a single sub-claim
      - Do NOT add information not present in the original statement

      RESTRICTIVE RELATIVE CLAUSES — DO NOT SPLIT (CRITICAL):
      A restrictive relative clause ("that", "who", "where" WITHOUT a
      preceding comma) defines or narrows the noun. Splitting it off
      creates a meaningless fragment. Return the whole claim as one sub-claim.
      This includes INFINITIVAL relative clauses ("the first/smallest X
      TO verb ...") — the infinitive phrase restricts which X is meant.
        Input: "1729 is the smallest number that can be written as the
        sum of two cubes in two different ways."
        Output: {"sub_claims": ["1729 is the smallest number that can be
        written as the sum of two cubes in two different ways."]}
        WRONG — "1729 is the smallest number" is meaningless alone:
        ❌ {"sub_claims": ["1729 is the smallest number.",
        "1729 can be written as the sum of two cubes in two different ways."]}
        Input: "42 is the first number to have both the properties of
        being a product of a prime number and a practical number."
        Output: {"sub_claims": ["42 is the first number to have both the
        properties of being a product of a prime number and a practical
        number."]}
        WRONG — "42 is the first number" is absurd without the restriction:
        ❌ {"sub_claims": ["42 is the first number.", "42 is a product of
        a prime number.", "42 is a practical number."]}
      Superlative/ordinal + restrictive clause is ALWAYS a single claim:
      "the smallest/largest/first X that Y" and "the first/smallest X to Y"
      both identify a specific entity — NEVER split.

      MATHEMATICAL EXPRESSIONS — DO NOT SPLIT (CRITICAL):
      When a statement describes a mathematical operation (sum, product,
      factorization) with multiple operands, it is a SINGLE claim. The
      operands collectively form one verifiable assertion.
        Input: "42 can be expressed as the sum of 1, 2, 3, 6, 7, and 14."
        Output: {"sub_claims": ["42 can be expressed as the sum of 1, 2, 3,
        6, 7, and 14."]}
        WRONG — individual operands are meaningless without the operation:
        ❌ {"sub_claims": ["42 can be expressed as the sum of 1.",
        "42 can be expressed as the sum of 2."]}

      SET MEMBERSHIP ENUMERATIONS (CRITICAL):
      When a statement enumerates items belonging to a set (factors, members,
      ingredients, causes, components, capitals, etc.), each sub-claim MUST
      assert individual membership using the SINGULAR form — do NOT repeat
      the plural subject per item:
        ✅ "Hydrogen is a component of water."
        ❌ "The components of water are hydrogen."
      The plural phrasing ("the components are X") implies an exhaustive
      listing and will be read as false. The singular phrasing ("X is a
      component of Y") correctly asserts individual membership.

      EXAMPLES:
      Input: "Iron is a metallic element with various uses, including in
      construction and as a catalyst in industrial processes."
      Output: {"sub_claims": ["Iron is a metallic element.", "Iron is used in
      construction.", "Iron is used as a catalyst in industrial processes."]}

      Input: "HSLA steels are essential in industries such as construction,
      automotive, and aerospace."
      Output: {"sub_claims": ["HSLA steels are essential in the construction
      industry.", "HSLA steels are essential in the automotive industry.",
      "HSLA steels are essential in the aerospace industry."]}

      Input: "The primary ingredients of concrete are cement, water,
      sand, and gravel."
      Output: {"sub_claims": ["Cement is a primary ingredient of concrete.",
      "Water is a primary ingredient of concrete.",
      "Sand is a primary ingredient of concrete.",
      "Gravel is a primary ingredient of concrete."]}

      Input: "The founding members of ASEAN were Indonesia, Malaysia,
      the Philippines, Singapore, and Thailand."
      Output: {"sub_claims": ["Indonesia was a founding member of ASEAN.",
      "Malaysia was a founding member of ASEAN.",
      "the Philippines was a founding member of ASEAN.",
      "Singapore was a founding member of ASEAN.",
      "Thailand was a founding member of ASEAN."]}

      Input: "The number 42 symbolizes a quirky, enigmatic, and often
      misunderstood concept."
      Output: {"sub_claims": ["The number 42 symbolizes a quirky concept.",
      "The number 42 symbolizes an enigmatic concept.",
      "The number 42 symbolizes an often misunderstood concept."]}

      WRONG (dangling reference — "the concept" is meaningless without parent):
      ❌ {"sub_claims": ["The number 42 symbolizes a concept.",
      "The concept is quirky.", "The concept is enigmatic."]}

      OUTPUT: JSON object with a "sub_claims" field containing an array of strings.
    template: |
      {statement}

  classify_atomicity:
    description: "Batch-classify claims as atomic or compound for decomposition gate."
    system_prompt: |
      For each numbered claim, determine whether it is ATOMIC (one verifiable
      fact) or COMPOUND (multiple independently verifiable facts).

      A claim is COMPOUND when it contains TWO OR MORE INDEPENDENTLY
      VERIFIABLE assertions — facts that can each be checked on their own
      and whose truth values are independent.

      Compound indicators:
      - A non-restrictive relative clause (", where", ", which") introduces
        a NEW verifiable assertion beyond the main clause
      - Two independent facts joined by "and", "but", "while" — where
        each side is separately verifiable (NOT conjunctions inside titles,
        proper nouns, or enumerations that form a single reference)
      - A broad fact PLUS a separate specific detail that could
        independently be true or false

      EXAMPLES OF COMPOUND CLAIMS:
      - "X is used in Y, where it serves as Z" → compound (X used in Y;
        it serves as Z — each independently verifiable)
      - "A is featured in B, where C's identifier spells 'D' in ASCII"
        → compound (A in B; C's ID → ASCII = D — two separate facts)
      - "P was founded in 1990 and has 50 million users" → compound
        (founding date; user count — independent facts)

      MATHEMATICAL EXPRESSIONS WITH MULTIPLE OPERANDS:
      When a claim describes a mathematical operation (sum, product,
      factorization) listing multiple operands, it is ALWAYS ATOMIC.
      The operands collectively form one verifiable assertion — splitting
      them produces false claims.
      - "42 can be expressed as the sum of 1, 2, 3, 6, 7, and 14"
        → ATOMIC (one sum, not six independent claims)
      - "The prime factorization of 42 is 2 × 3 × 7" → ATOMIC

      EXAMPLES OF ATOMIC CLAIMS:
      - "Water boils at 100°C at sea level" → atomic (single fact)
      - "The Eiffel Tower is located in Paris" → atomic (single fact)
      - "DNA is a double helix structure" → atomic (single characterization)
      - "1729 is the smallest number that can be written as the sum of
        two cubes in two different ways" → atomic (superlative + restrictive
        clause defines WHICH smallest number — inseparable)
      - "42 is the smallest number expressible as the sum of three cubes
        in two different ways" → atomic (same pattern — single identification)
      - "42 is the first number to have both the properties of being a
        product of a prime number and a practical number" → atomic
        (ordinal + infinitival restrictive clause — "to have both..."
        defines which first number; "both...and" is INSIDE the restriction,
        not an independent conjunction)
      - "The first president who served two non-consecutive terms was
        Grover Cleveland" → atomic (restrictive clause narrows the subject)
      - "A prime number that is also a Fibonacci number" → atomic
        (restrictive clause defines the category)
      - "In Douglas Adams' work, 42 is the Answer to the Ultimate Question
        of Life, the Universe, and Everything" → atomic (single fact about
        a number's role; "and" is part of the title, not a conjunction
        between independent assertions)
      - "In Python, the constant __debug__ is set to True in non-debug
        mode" → atomic (single fact: one constant, one value, one context)
      - "The Planck temperature can be equated to 42 on a logarithmic
        scale" → atomic (single approximate equivalence)

      RESTRICTIVE vs NON-RESTRICTIVE RELATIVE CLAUSES (CRITICAL):
      A RESTRICTIVE relative clause (using "that", "who", "where" WITHOUT
      a preceding comma) narrows or defines the noun it modifies. This
      includes INFINITIVAL relative clauses ("the first/smallest X TO verb
      ...") — the infinitive phrase restricts which X is meant. Removing
      it fundamentally changes WHAT the sentence is about, not just adding
      an independent fact. These are ALWAYS atomic.
        - "X is the Y that Z" → ATOMIC ("that Z" defines which Y)
        - "X is the first Y to Z" → ATOMIC ("to Z" defines which Y)
        - "X is the Y, which Z" → likely COMPOUND (", which Z" adds info)
      Superlative/ordinal + restrictive clause is a single identification
      claim — NEVER compound. This applies to BOTH finite ("that Y") and
      infinitival ("to Y") forms.

      A claim is ATOMIC when:
      - It makes exactly one verifiable assertion
      - Any subordinate clause merely restates or clarifies the same fact
      - A relative clause restricts or defines the noun (not comma-separated)
      - Removing any clause would change the core meaning rather than
        removing an independent fact
      - It states a single value, property, or role of an entity — even
        with qualifying context (language, work, domain, conditions)

      DEFAULT TO ATOMIC. Only classify as compound when you can clearly
      identify two independently verifiable facts. If in doubt, it is atomic.

      Output a JSON object:
        {"compound_indices": [list of integer indices that are compound]}
      If all claims are atomic, return {"compound_indices": []}
    template: |

      {numbered_claims}


  classify_math:
    description: "Batch classify statements as math, medical, or general domain."
    system_prompt: |
      Classify each statement's verification domain: math, medical, or general.

      math — needs calculation, proof, unit conversion, or formal mathematical properties.
      medical — needs biomedical/clinical/pharmacology knowledge (diseases, drugs, mechanisms, physiology, treatment).
      general — everything else; numeric facts that are looked up rather than derived.

      Edge cases:
      - Numbers alone ≠ math. If the value is a constant or statistic you would look up, use general or medical.
      - Biological measurements without clinical context → general; clinical/therapeutic claims → medical.

      Output: {"classifications":[{"index":<int>,"domain":"math"|"medical"|"general"},...]}

    template: |
      Domains: math | medical | general

      {statements}


  # Specificity-anchored verification: rejects claims that are generically true
  # but not specific to the question topic.  Catches "verification-resistant
  # generic truisms" that slip through standard binary truth checks.
  verify_specific:
    description: "Single-claim verification with topic-anchored specificity check."
    system_prompt: |
      Verify this claim for factual accuracy and topic specificity.
      Output JSON with exactly these four fields:
      {
        "factual": true or false,
        "factual_reasoning": "explain the factual verdict",
        "specific": true or false,
        "specific_reasoning": "explain the specificity verdict"
      }
      The claim passes only when BOTH factual and specific are true.
      Evaluate ONLY the <claim> content; the <topic> attribute disambiguates but must NOT bias toward acceptance.

      Claims are verified in isolation — the original answer text is not provided.
      Do NOT reject a claim because surrounding explanation or supporting context is absent.
      Assess factual correctness based solely on the assertion as stated.

      FACTUAL CHECK — mark "factual": false if:
      - Speculative language: "likely", "perhaps", "probably", "based on", "suggests".
        Do NOT treat mechanistic verbs (verbs asserting a direct causal or functional
        relationship) as speculative — they are direct factual assertions, not hedges.
      - Load-bearing modal ("can/may/might/could") where removing it would make the claim false
        (exception: modals asserting inherent capability, e.g. "TCP can retransmit packets")
      - Inference or educated guess presented as fact
      - Contains a false assertion ("partially true" means an assertion within the claim is
        wrong — not that the claim addresses only one of several valid answers; a claim that
        accurately describes one valid answer is TRUE even if other valid answers also exist)

      SPECIFICITY CHECK — mark "specific": false if:
      - Applies equally to 3+ other entities in the same field without modification
      - Vague characterization with no topic-specific content (e.g., "improves performance")

      QUESTION: {cleaned_question}

      {parent_claim_context}
    template: |
      {claim_text}

  verify_batch_specific:
    description: "Multi-claim batch verification with topic-anchored specificity check."
    system_prompt: |
      You verify the given list of claims for factual accuracy and topic specificity.
      Output a JSON object with an "evaluations" field containing an array with one entry per claim in order.
      Each entry has exactly five fields:
        "index": integer (the numbered container tag, e.g., <0>, <1>, <2>, ...)
        "factual": true or false
        "factual_reasoning": explain why the claim is or is not factually accurate
        "specific": true or false
        "specific_reasoning": explain why the claim is or is not specific to the topic

      The claim passes only when BOTH factual and specific are true.

      Claims are verified in isolation — the original answer text is not provided.
      Do NOT reject a claim because surrounding explanation or supporting context is absent.
      Assess factual correctness based solely on the assertion as stated.

      CLAIM FORMAT:
      Claims are nested inside <topic name="..."> containers that provide
      the subject area for disambiguation. Each claim is in a numbered
      container tag (<0>...</0>, <1>...</1>, etc.) inside its topic,
      with a <claim> tag holding the assertion you must evaluate.
      Treat each numbered container as an INDEPENDENT verification task.
      Evaluate ONLY the <claim> content. The topic attribute helps you
      understand what the claim refers to — it must NOT bias your
      evaluation toward acceptance.

      FACTUAL CHECK — mark "factual": false if the claim:
      - Is not factually accurate or contains a false assertion ("partial truth"
        means the claim contains a false assertion — a claim that accurately
        describes one of several valid answers is fully TRUE)
      - Contains speculation markers: "likely", "perhaps", "probably", "based on", "suggests".
        Do NOT treat mechanistic verbs (verbs asserting a direct causal or functional
        relationship) as speculative — they are direct factual assertions, not hedges.
      - Uses load-bearing possibility/conditionality modals: "can", "may", "might", or "could"
        where the modal is essential to accuracy — i.e., removing it would make the claim
        overstated or false (e.g., "X can invalidate Y" — without "can", the claim would
        be false; the modal signals a conditional relationship, not an established fact)
        EXCEPTION: modals expressing an inherent capability or mechanism are fine
        (e.g., "TCP can retransmit packets" asserts a definite capability, not conditionality)
      - Makes inferences not directly stated in source material
      - Presents educated guesses as facts

      SPECIFICITY CHECK — mark "specific": false if the claim:
      - Could equally apply to 3+ other entities in the same field without modification
      - Is a vague characterization with no topic-specific content
        (e.g., "improves performance and efficiency" for any technology)

      Some claims may include a [PARENT CLAIM: ...] annotation on the line below.
      This is the original compound claim the sub-claim was extracted from.
      Use it for context when verifying the sub-claim, but verify ONLY the sub-claim itself.

      You MUST return exactly {claim_count} evaluations, one per numbered claim so no indices repeat.

      QUESTION CONTEXT: {cleaned_question}
    template: |

      {numbered_claims}


  filter_negatives:
    description: "Identify and remove universal negatives from verified facts."
    system_prompt: |
      You are given a numbered list of verified claims. Your ONLY task is to identify
      which claims are UNIVERSAL NEGATIVES and return their indices.

      A UNIVERSAL NEGATIVE is a claim that asserts a subject has NO properties,
      significance, or relevance across an ENTIRE domain. These are unfalsifiable
      because proving the complete absence of all possible properties is impossible.

      UNIVERSAL NEGATIVES (return their indices):
      - "X has no significance in any domain or context"
      - "The event has no bearing on any outcome whatsoever"
      - "This substance has no role in any physical, chemical, or biological process"

      NOT universal negatives (do NOT return their indices):
      - "The treaty was not ratified in 1919" — specific historical fact
      - "Water does not boil at 90°C at sea level" — specific physical property
      - "The algorithm does not run in O(n)" — specific complexity claim
      - "Aspirin is not classified as an antibiotic" — specific classification
      - "The reaction does not produce carbon dioxide" — specific chemical outcome

      The key distinction: a universal negative claims TOTAL ABSENCE of significance
      or properties across a whole domain. A specific negative denies ONE particular
      property and is perfectly fine.

      QUESTION CONTEXT (for reference only): {question}

      Return a JSON object: {"negative_indices": [indices of universal negatives]}

      If none found, return an empty array: {"negative_indices": []}
    template: |

      {numbered_facts}

  filter_orphans:
    description: "Identify and remove orphaned sub-claims that lost their subject through compound decomposition."
    system_prompt: |
      You are given a numbered list of verified claims. Your ONLY task is to identify
      which claims are ORPHANED SUB-CLAIMS and return their indices.

      An ORPHANED SUB-CLAIM is a claim whose grammatical subject is a vague pronoun
      or indefinite determiner (e.g. "It", "They", "Some factors"), not a specific
      named entity.

      IMPORTANT: Do not flag a claim just because it seems redundant or less detailed
      than another. Base your decision ONLY on the grammatical subject.

      Your decision follows a strict hierarchy based on the grammatical subject.

      THE MOST IMPORTANT RULE: claims with named-entity subjects are NEVER orphaned.
      If the subject is a specific named entity — a substance, system, organization,
      actor, mechanism, test, process, law, treaty, algorithm, or any other specific
      named thing — it is NOT orphaned. Do NOT return its index.

      Only if a claim does NOT have a named-entity subject should you consider whether
      it is orphaned.

      RULE 1 — NOT ORPHANED (do NOT return their indices):
      - "TCP retransmits lost packets" — NOT orphaned, subject is the protocol
      - "Rust enforces memory safety at compile time" — specific language named
      - "The Clean Air Act limits emissions" — specific law named
      - "Quicksort runs in O(n log n) average time" — specific algorithm named
      - "Silicon has a band gap of 1.1 eV" — specific element named
      - "OPEC controls oil production quotas" — specific organization named

      RULE 2 — ORPHANED, only when no named entity is the subject (return their indices):
      A claim is ORPHANED if its subject is a vague pronoun or indefinite determiner
      with no specific referent ("It", "They", "This", "These conditions",
      "Some factors", "Various interactions", "This process", "Certain components")
      AND the claim does not otherwise name a specific entity or actor.

      ORPHANED (return their indices):
      - "It is important to consider this further" — subject is "It", no specific entity named
      - "These conditions may increase the risk" — which conditions?
      - "Some factors can affect absorption" — which factors?
      - "Certain medications interact with this pathway" — which medications?
      - "This process requires specific enzymes" — which process?

      QUESTION CONTEXT (for reference only): {question}

      Return a JSON object: {"orphaned_indices": [indices of orphaned sub-claims]}

      If none found, return an empty array: {"orphaned_indices": []}
    template: |

      {numbered_facts}

  verify_math:
    description: "Mathematical verification with minimal disambiguation context"
    system_prompt: |
      Verify T/F whether a given mathematical claim is accurate.
      
      If context is provided (previous statement), use it ONLY to resolve pronouns or ambiguous references.
      Do NOT let narrative context bias your mathematical verification - verify the math itself.

      Output your final answer as \boxed{T} for TRUE or \boxed{F} for FALSE

    template: |
      {claim}

  contextualize:
    description: "Add topic-anchoring context prefix to claims without modifying claim text."
    system_prompt: |
      You are given a list of claims extracted from an answer to a question.
      Your task is to produce a SHORT context prefix for each claim that
      anchors it to the question's topic, so a reader can understand what
      the claim refers to without seeing the original answer.

      QUESTION: {cleaned_question}

      RULES:
      - Output a BARE TOPIC string — just the subject noun phrase, not a
        full sentence or prefix phrase
        (e.g. "TCP", "quantum mechanics", "natural selection",
         "the French Revolution", "TCP's flow control mechanism")
      - PREFER THE QUESTION'S PRIMARY SUBJECT as the topic. Most claims
        from an answer about a specific subject should share that subject
        as their topic, not sub-topics like incidental mechanisms or side
        entities. Use the same topic for claims about properties, mechanisms,
        or effects of the primary subject. Only use a different topic when a
        claim genuinely belongs to a separate domain (e.g. a comparison entity).
      - Claims are grouped by topic for batch verification — consistent
        topics allow claims to collate under a single heading
      - Do NOT include framing words like "In the context of" or "Regarding"
        — the handler adds structural markup automatically
      - Do NOT repeat, rephrase, or rewrite the claim itself — only provide
        the topic
      - Do NOT add new factual information or definitions
      - Do NOT elaborate on the claim's content
      - If a claim is already self-standing and names the primary subject
        explicitly, return an empty string for its context field
      - Resolve pronoun ambiguity by naming the subject in the topic
        (e.g. use the question's primary subject when the claim says "It ...")

      Return a JSON object with a "claims" array containing exactly
      {claim_count} entries, one per input claim in order.
      Each entry has:
        "index": integer (JSON number, e.g., 0, 1, 2; do NOT use [0] or "0")
        "context": string (the bare topic, or "" if the claim is already self-standing)

    template: |

      {numbered_claims}

  synthesize_context:
    description: "System instructions for batched grounded answer synthesis."
    system_prompt: ""
    template: |
      You are synthesizing a definitive answer from a set of verified facts.

      RULES:
      - Group related facts into thematic paragraphs (one per subtopic); separate with blank lines
      - Order paragraphs from upstream/unifying mechanisms to downstream effects: if one mechanism causes or enables another, introduce the cause first
      - Cite each incorporated fact inline as [N] — standalone or merged (e.g. [3, 7, 12]); only use indices that appear in the VERIFIED FACTS list — do not invent or hallucinate any index
      - When multiple facts contribute to one sentence, cite ALL their indices — do not omit any
      - Deduplicate within and across paragraphs: when multiple facts share the same meaning (even with different phrasing), write ONE sentence and cite all their indices — never write two sentences about the same idea
      - Before writing each new sentence, check: does this answer already state this concept anywhere? If yes, add the citation to the existing sentence instead of writing a new one
      - Every sentence must express a specific claim that all its cited facts directly support; do not write a vague filler sentence to attach leftover citations
      - Do not assert claims not supported by the facts
      - Do not list facts verbatim

      OUTPUT FORMAT:
      Your answer only — multiple paragraphs with inline citations, separated by blank lines.
      Do not include a DROPPED FACTS section.

  synthesize_initial:
    description: "Generate initial grounded answer from scratch using verified facts."
    system_prompt: ""
    template: |
      QUESTION: {question}

      VERIFIED FACTS:
      {verified_facts}

      Write a comprehensive answer using only the facts above.

      Structure:
      - Multiple paragraphs, one per subtopic, separated by blank lines
      - Order paragraphs from upstream/unifying mechanisms to downstream effects
      - Cite facts inline as [N]; only use indices from the VERIFIED FACTS list above — do not invent indices
      - When multiple facts contribute to one sentence, cite ALL their indices — do not omit any
      - Deduplicate within and across paragraphs: when two facts express the same idea, fold into ONE sentence with all their indices
      - Before writing each new sentence, check: does this answer already state this concept anywhere? If yes, extend the existing sentence with the new citation instead
      - Every sentence must express a specific claim that all its cited facts directly support

      Output your answer only. Do not include a DROPPED FACTS section.

  classify_drops:
    description: "Classify why each uncited verified fact was not incorporated into the synthesized answer."
    system_prompt: ""
    template: |
      SYNTHESIZED ANSWER:
      {answer}

      UNACCOUNTED FACTS (present in the input but NOT cited anywhere in the answer above):
      {uncited_facts}

      For each unaccounted fact, search the SYNTHESIZED ANSWER above for related content and classify the reason it was not cited.

      Classification rules:
      - "redundant with [K]" — the answer already expresses this fact's meaning in a sentence that cites [K]; [K] must appear in the answer
      - "subsumed by [K]" — this fact's content is entirely contained within a sentence citing [K]; [K] must appear in the answer
      - "too vague" — this fact is too generic to add specific value beyond what the answer already states
      - "silent drop" — this fact's content is genuinely absent from the answer

      Output: {"drops": {"N": "reason", "M": "reason"}} using the exact index numbers shown above.
      Every index in UNACCOUNTED FACTS must appear in the output.

  synthesize:
    description: "Revise a grounded answer to add missing inline citations."
    system_prompt: ""
    template: |
      Revise the answer to add the missing inline citations.

      {assess_reason}

      Rules:
      - Keep all existing prose and inline citations unchanged
      - For each missing index, insert [N] into an existing sentence where it fits,
        or add a new sentence if none fits — do not remove or rewrite other sections
      - Do not add claims beyond the provided facts

      Current draft:
      {artifact}

  extract_cited_sentences:
    description: "Mechanically extract every cited sentence from a sectioned draft."
    system_prompt: |
      Extract every sentence that contains at least one citation index from the draft.
      The draft is divided into sections marked === SECTION N ===.
      Numbers in brackets [N] are citation indices.

      For each sentence with citations, output:
        - "section": the section number (integer)
        - "text": the sentence text with citation indices removed
        - "citations": list of citation integers from that sentence only

      Output {"sentences": [...]}. Include only sentences that contain citations.
      Do not combine citations across sentences.
    template: |
      {artifact}

  identify_redundancy_context:
    description: "System instructions for cross-section redundancy identification."
    system_prompt: ""
    template: |
      You are given a list of cited sentences grouped by section.
      Find all groups where 2+ sentences from DIFFERENT sections express the same factual claim.

      RULES:
      - Only merge sentences from DIFFERENT sections
      - Same mechanism/property stated differently counts as duplicate
      - Output merge_groups with theme, sections list, and combined citations

      OUTPUT FORMAT:
      {"merge_groups": [{"theme": "...", "sections": [1,3], "citations": [1,2,16]}]}
      If none: {"merge_groups": []}

  identify_redundancy_initial:
    description: "Identify semantically duplicate claims across batched synthesis sections."
    system_prompt: ""
    template: |
      QUESTION: {question}

      CITED SENTENCES BY SECTION:
      {answer}


  reorganize_context:
    description: "System instructions for post-synthesis answer reorganization."
    system_prompt: ""
    template: |
      You are an editor improving thematic coherence.
      - First execute MERGE PLAN: for each group, write ONE sentence combining those claims and citing exactly that group's indices.
      - Then reorganize: merge same-topic paragraphs, split mixed-topic paragraphs, reorder by dependency (background→mechanism→outcomes→risks/caveats).
      - Fold orphan one-sentence paragraphs into the nearest related paragraph.
      - Preserve all draft claims and all [N] indices (repeats allowed); do not renumber, delete, or invent citations or facts.
      Output only revised prose.

  reorganize_initial:
    description: "Reorganize a batched synthesis draft for thematic coherence."
    system_prompt: ""
    template: |
      QUESTION: {question}

      MERGE PLAN:
      {merge_plan}

      DRAFT ANSWER:
      {answer}

      Execute the MERGE PLAN first, then reorganize the draft for thematic coherence:
      apply topical grouping (merge same-topic paragraphs, split multi-topic paragraphs),
      reorder by logical dependency, fold orphan sentences.
      Keep all [N] indices from the draft and MERGE PLAN; repeats across sentences are allowed. Do not renumber, delete, or invent indices.

  citation_repair:
    description: "Ensure every sentence ends with a trailing [N] citation. Single-objective pass — no reorganization."
    system_prompt: |
      You are a citation formatter. Do NOT change facts, sentence order, paragraph structure, or non-citation wording.
      Preserve markdown/text exactly (including **, headings, punctuation, spaces, and line breaks); only move citation bracket groups.

      RULES (deterministic):
      - Every sentence must end with exactly one citation bracket group immediately before the final period.
      - No citation bracket groups may appear earlier in the same sentence.
      - Citation brackets must contain digits only (examples: [12], [3, 7, 21]). Placeholder brackets like [N] are forbidden.
      - If a sentence has one or more citation bracket groups but none at the end, move the rightmost existing bracket group unchanged to immediately before the final period (cut-paste, do not duplicate).
      - If a sentence has no citation anywhere, copy the citation bracket from the nearest preceding sentence in the same paragraph; if none exists, use the nearest following sentence.
      - If no citation bracket can be located in the same paragraph, leave the sentence unchanged.
      - Never merge, split, reorder, expand, compress, add, or delete sentences.
      - Do not invent, renumber, or delete citation indices.
      - Output only the corrected prose — no preamble, no explanation, no notes, no section labels.
    template: |
      IMPORTANT: Preserve markdown, wording, spacing, and line breaks exactly as written; only add the minimum trailing citations required.

      {artifact}

      Corrected draft (every sentence must end with a numeric citation bracket like [12] or [3, 7] immediately before the period; never output [N]):

  classify_restrictions:
    description: "Identify restriction language in the draft to guide the coherence assessor."
    system_prompt: |
      Read the draft and list any words or short phrases that indicate a prohibition,
      ban, or restriction — language that blocks or forbids an action rather than
      recommending or advising one.

      Return only the specific words or phrases you actually see in the draft.
      Copy them verbatim — do not paraphrase, reword, or alter any character.
      Do not invent or add terms not present. If you see none, return an empty list.

      Output JSON only:
      {"restriction_cues": ["phrase1", "phrase2", ...]}
    template: |
      {artifact}

  find_uncited_scan:
    description: "Segment draft into sentences and classify each as CITED or UNCITED based on last 1-2 characters."
    system_prompt: |
      You are a sentence-scanning bot. Output JSON only.

      Follow these steps EXACTLY in order.

      Step 1 (SEGMENTATION RULE): Split the draft into sentences.
      - A sentence ends at the first ".", "!", or "?" that is NOT inside square brackets "[" ... "]",
        and is followed by a space, newline, or end-of-text.
      - FORBIDDEN: Do NOT split sentences on commas.
      - FORBIDDEN: Do NOT split inside bracket groups like "[20, 3, 11]".

      Step 2 (TRIM): For each sentence, define TRIMMED = the sentence with trailing whitespace removed.

      Step 3 (ENDING EXTRACTION): For each TRIMMED sentence compute:
      - last1  = last 1 character of TRIMMED
      - last2  = last 2 characters of TRIMMED (or shorter if length < 2)
      - last12 = last 12 characters of TRIMMED (or the whole sentence if shorter)

      Step 4 (CITED RULE — use ONLY last1/last2, no digit parsing):
      - If last1 is "]" OR last2 is "]." then verdict = "CITED".
      - Otherwise verdict = "UNCITED".

      Step 5 (OUTPUT): Create one object per sentence in order.
      Return exactly:
      {"sentence_checks": [
        {"sentence": "<verbatim>", "last12": "<last12>", "last2": "<last2>", "last1": "<last1>", "verdict": "CITED|UNCITED"},
        ...
      ]}

      FORBIDDEN:
      - Do not paraphrase or modify any sentence text.
      - Do not add extra keys.
      - Do not output any non-JSON text.

      EXAMPLE INPUT:
      The sky is blue [1]. The grass is green. The sun is bright [2, 3].

      EXAMPLE OUTPUT:
      {"sentence_checks":[
        {"sentence":"The sky is blue [1].","last12":" blue [1].","last2":"].","last1":".","verdict":"CITED"},
        {"sentence":"The grass is green.","last12":"s is green.","last2":"n.","last1":".","verdict":"UNCITED"},
        {"sentence":"The sun is bright [2, 3].","last12":"ht [2, 3].","last2":"].","last1":".","verdict":"CITED"}
      ]}
    template: |
      {artifact}

  # SUPERSEDED: find_uncited_filter step now uses consensus_find_uncited_filter_v8_0
  # (deterministic regex handler in handlers/find_uncited_filter.py). This prompt is
  # retained for reference but is no longer wired into synthesize/synthesize.yaml.
  find_uncited_filter:
    description: "Extract only UNCITED sentences from the sentence_checks produced by find_uncited_scan."
    system_prompt: |
      You are a JSON filtering bot. Output JSON only.

      You will receive a numbered list. Each line has the format:
      N: sentence: <text>, last12: <chars>, last2: <chars>, last1: <char>, verdict: CITED
      OR
      N: sentence: <text>, last12: <chars>, last2: <chars>, last1: <char>, verdict: UNCITED

      Follow these steps EXACTLY in order.

      Step 1 (EARLY EXIT): If there are ZERO lines where verdict is UNCITED,
      output {"uncited_sentences": []} and STOP.

      Step 2 (COPY RULE): For each line in order:
      - If the line contains "verdict: UNCITED", copy the sentence text verbatim into uncited_sentences.
      - If the line contains "verdict: CITED", do nothing.

      Step 3 (OUTPUT): Return exactly:
      {"uncited_sentences": ["verbatim sentence", ...]}

      FORBIDDEN:
      - Do not include any sentence from a line with "verdict: CITED".
      - Do not edit, trim, paraphrase, or re-punctuate any sentence. Copy it exactly.
      - Do not output any non-JSON text.

      EXAMPLE INPUT:
      0: sentence: The sky is blue [1]., last12:  blue [1]., last2: ]., last1: ., verdict: CITED
      1: sentence: The grass is green., last12: s is green., last2: n., last1: ., verdict: UNCITED
      2: sentence: The sun is bright [2, 3]., last12: ht [2, 3]., last2: ]., last1: ., verdict: CITED

      EXAMPLE OUTPUT:
      {"uncited_sentences":["The grass is green."]}
    template: |
      {sentence_checks}

  find_duplicates:
    description: "Identify candidate duplicate sentence pairs to guide the coherence assessor on C3."
    system_prompt: |
      Read the draft and list pairs of sentences that appear to express the same core
      claim or idea using different wording. Focus on substantive claims — not generic
      topic sentences or background definitions.

      Return only pairs where both sentences are verbatim quotes from the draft.
      Do not invent or paraphrase. If you find no duplicates, return an empty list.

      Output JSON only:
      {"duplicate_pairs": [{"a": "verbatim sentence", "b": "verbatim sentence"}, ...]}
    template: |
      {artifact}

  # REGRESSION NOTE (2026-03-01, fixture consensus-chain-v7.1_4b37483b):
  #   Stepped N/A gate (STEP 0–4) caused severe false positives on mechanistic/descriptive sentences
  #   (e.g. "lowers blood glucose by reducing...") — 7B model pattern-matched UNCONDITIONAL on any
  #   declarative sentence lacking an if/when clause, ignoring the keyword gate entirely.
  #   Reverted to prose version: semantic anchor "language that blocks an action" is required.
  # WORKING EXAMPLE — stepped variant confirmed on fixture consensus-chain-v7.1_58285118
  #   (valid on that draft because it had real prohibition wording; gate failed when none present)
  # CONVERGENCE FIX (2026-03-01, fixture consensus-chain-v7.1_39247117):
  #   Criterion 1 misfired on correctly-ordered content (unconditional before conditional) —
  #   7B anchored on "both types present → flag" before reaching the ordering check (instruction
  #   salience issue, per consult with openai/gpt-5.2-pro). Fix: restructured criterion 1 as
  #   PASS-first rule; FLAG is the named exception. Reviser also given explicit mechanical action
  #   for criterion-1 violations (move conditional sentences after unconditional ones).
  # PARAGRAPH HALLUCINATION FIX (2026-03-01, fixtures consensus-chain-v7.1_f74c2042 + 17c73042):
  #   7B hallucinated paragraph numbers (P5/P10 in a 3-paragraph document), ignoring the negative
  #   constraint "do not reference paragraph numbers greater than N". Fix: changed to positive
  #   procedural instruction — "count first, let this be N, all refs must be 1..N".
  # NAMED-SUBJECT-GROUP EXAMPLE FIX (2026-03-01, same fixtures):
  #   7B treated "metformin is contraindicated in patients with eGFR < 45" as UNCONDITIONAL despite
  #   explicit "eGFR < X" in the named-subject-group rule. Root cause: "contraindicated" overrides
  #   the scoping clause. Fix: added concrete in-prompt example ("Metformin is contraindicated in
  #   patients with eGFR < 45 is CONDITIONAL") directly mirroring the failure case.
  # TIE-BREAKER + BLANK-LINE + OUTPUT-DISCIPLINE FIX (2026-03-01, consult openai/gpt-5.2-pro + RAG):
  #   Named-subject-group rule still failed after example. Two remaining sub-cases:
  #   (a) sentence-per-line draft: 7B counted newlines as paragraph breaks → hallucinated para count.
  #       Fix: added "do NOT treat single-newline wrapping as paragraph breaks".
  #   (b) "In all cases, … if …" opener: 7B read "In all cases" as unconditional despite the "if".
  #       Fix: added tie-breaker rule — any trigger clause or named group in the same sentence
  #       classifies it as CONDITIONAL regardless of the opener. Also added explicit PASS rule
  #       when paragraph contains ONLY conditional restrictions (no ordering issue possible).
  #   Output discipline: added to enforce single-sentence "reason" and all failures in "target".
  # MONITORING-SENTENCE FP + EVIDENCE BYPASS + C4/C5 FP FIX (2026-03-01, fixture 1330801a,
  #   consult google/gemini-2.5-pro → openai/gpt-5.2-pro chained):
  #   Three failure modes on P3 where all prohibitions are conditional (named patient groups +
  #   eGFR thresholds) but 7B still flags C1: (1) hard-gate bypass — monitoring sentence
  #   "Routine monitoring... is essential for all patients" misread as unconditional restriction;
  #   (2) evidence-requirement bypass — 7B ignores soft quoting instruction, producing generic
  #   "Reorder sentences" targets without evidence; (3) C4/C5 FP — sentences with citations
  #   flagged as uncited, substantive final sentence flagged as meta-commentary.
  #   Fixes (7 changes, A–G): (A) explicit monitoring/recommendation/dose-adjustment/therapy-
  #   selection exclusion from restriction classification; (B) hard gate restructured as 4-step
  #   sequential process (scan → identify → gate → flag); (C) evidence requirement changed from
  #   soft instruction to mandatory target-line template with quoted sentences; (D) final
  #   example updated to reference new evidence format; (E) C4 trailing-citation definition +
  #   evidence requirement + no-flag-on-cited guard; (F) C5 tightened with concrete meta-
  #   commentary examples + positive guard for substantive claims with citations; (G) output
  #   discipline strengthened — "reason" must use criterion numbers only.
  # EXAMPLE-CONTAMINATION FIX (2026-03-01, fixture 32700668):
  #   7B copy-pasted the domain-neutral C1 examples ("Revoke all access.", "Do not share
  #   your password") as literal artifact sentences in target field; reviser then inserted
  #   them verbatim into the draft (P2 gained "Revoke all access in patients with severe
  #   renal impairment" and "Do not use metformin..." as back-to-back sentences).
  #   Fix: removed ALL domain-neutral sentence examples from C1. The rules are sufficient;
  #   examples at 12k system-prompt depth are contamination vectors for 7B models.
  # PRE-STEP ARTIFACT + C1/C3/C4 FIX (2026-03-01, fixture 709d52b6,
  #   consult google/gemini-2.5-pro chained):
  #   Three failure modes:
  #   (1) reorganize_answer artifact: model emitted "Each [N] citation appears exactly
  #       once, and every sentence retains at least one unique citation." as the last
  #       sentence of output (Final-pass instruction interpreted as prose to write).
  #       Fix: "Final pass" reworded as "(silent mental check only — do not write as
  #       output prose)"; output discipline bullet extended to explicitly prohibit
  #       citation-coverage summaries.
  #   (2) find_uncited false negative: artifact sentence contains [N] placeholder +
  #       false assertion "every sentence retains at least one unique citation" →
  #       7B returned [] despite 3 genuinely uncited sentences. Fix: added "A valid
  #       citation marker contains only numbers inside the brackets — placeholders
  #       like [N] are not citations" + "Disregard any sentences that make general
  #       claims about citation coverage; apply the check to every sentence individually."
  #   (3) C1 false positive: 7B treated "must be discontinued immediately if acute
  #       kidney injury develops" as UNCONDITIONAL, ignoring the trailing if-clause.
  #       Fix: replaced "Any of these patterns make it conditional: ..." with "A
  #       restriction is conditional if a limiting phrase or clause (...) appears
  #       anywhere in the same sentence, even after the cue word."
  #   (4) C3/C4 false positives: 7B self-scanned draft despite empty pre-step lists,
  #       overriding the PASSES rule. Fix: added "You MUST stop and not scan the
  #       draft for this criterion." after each empty-list PASSES instruction; changed
  #       "for each pair/sentence verify" → "for each pair/sentence in the list, verify"
  #       to reinforce that scope is limited to the provided inputs.
  # DEONTIC-PASSIVE REGRESSION FIX (2026-03-01, fixture 5b790c13):
  #   Round-5 introduced "deontic passive constructions" framing which caused the 7B to
  #   generalize beyond the explicit list — treating "is mandated" and mechanism verbs
  #   ("suppresses", "inhibits") as restriction cues, triggering cross-paragraph C1 FPs
  #   and reviser structural damage that degraded output coherence to 6/10.
  #   Fix: merged the six deontic passive verbs directly into the explicit verb list;
  #   removed the framing sentence that primed open-ended passive pattern-matching.
  #   Also added "is mandated", "is warranted", "is necessary" to the NOT-a-restriction
  #   exclusion list.
  # ROUND-9 FIXES (2026-03-01, fixture consensus-chain-v7.1_1a953400):
  #   (1) find_uncited false positive: "placeholders like [N]" framing caused 7B to
  #       treat multi-number citations like [11, 25, 26] as [N]-style placeholders.
  #       Fix: define placeholder by ABSENCE of digits; any bracketed group with ≥1
  #       digit is a valid citation regardless of count.
  #   (2) C1 false positive ("in these scenarios" → UNCONDITIONAL): anaphoric scope
  #       phrases not covered by existing "in [group/condition]" examples. 7B failed
  #       to classify "in these scenarios" as conditional. Fix: added explicit whitelist
  #       of anaphoric scope phrases ("in these scenarios", "in these cases", etc.).
  #   (3) C3 self-scan: "You MUST stop" is a control-flow instruction the 7B ignores
  #       when the draft is present and scanning behavior is trained in. Fix (Option B):
  #       replaced stop-framing with scope restriction — "You may ONLY evaluate
  #       duplication using the provided list; you are forbidden to search the draft
  #       for any other duplicates." Removes fragile imperative in favor of constraint.
  #   (4) C4 verification failure: prompt said "verify it truly lacks a trailing [N]
  #       marker" but didn't define what counts as a citation or instruct the model to
  #       override the upstream list. Fix: explicit digit-presence rule + "IGNORE the
  #       upstream label and re-check yourself" instruction. Upstream F1 fix also
  #       eliminates the false positive that triggered C4 in the first place.
  review_coherence_assess:
    description: "Assess draft for four structural criteria; return revise or accept with issues."
    system_prompt: |
      You are a structural checker verifying that a draft satisfies four criteria. Output exactly one JSON object.

      C1 PROCEDURE — restriction ordering (complete all steps before writing action):
      Step 1 (CUE SCAN): For EACH cue in restriction_analysis, write one line:
        "CUE i: \"<cue>\" | FOUND = YES | SENTENCE: \"<full sentence containing the cue>\""
        OR "CUE i: \"<cue>\" | FOUND = NO | SENTENCE: \"\""
      After all cues write: FOUND_COUNT = K
      If FOUND_COUNT = 0, also write: EARLY_EXIT = TRUE
      Step 2 (EARLY EXIT): If EARLY_EXIT = TRUE, write EXACTLY: "C1 PASS" then STOP — skip Steps 3–5.
      Step 3: For each FOUND = YES sentence — if its primary verb is recommend/advise/suggest/encourage, write SKIP.
      Step 4: For each non-skipped sentence write CONDITIONAL or UNCONDITIONAL with a one-phrase reason.
        CONDITIONAL: restriction limited to a group, situation, or threshold. Any "in [group/condition]",
        "for [group]", "when [X]", "if [X]", "below/above [N]", "in these scenarios/cases/situations/
        conditions/setting" makes it CONDITIONAL. Also CONDITIONAL: "X are absolute contraindications"
        or "X should avoid Y" where X is a condition, patient group, or numeric threshold.
        UNCONDITIONAL: no limiting clause of any kind.
      Step 5: State which type appears first in the paragraph.
      Step 6 (REQUIRED): End c1_analysis with EXACTLY "C1 PASS" or "C1 FAIL".
        FAIL ONLY if a CONDITIONAL restriction sentence appears BEFORE an UNCONDITIONAL restriction
        sentence in the SAME paragraph. Unconditional first, or all same type = PASS.
        If you flag: target line MUST contain UNCONDITIONAL: "<full sentence>" / CONDITIONAL: "<full
        sentence>" / Order: CONDITIONAL appears before UNCONDITIONAL in Paragraph N.

      OUTPUT SCHEMA:
      {
        "c1_analysis": "<Complete all six C1 steps above.>",
        "action": "revise" | "accept",
        "reason": "<one sentence: 'All criteria pass.' OR 'Fails C1' / 'Fails C2' / 'Fails C3' / 'Fails C5' — no paragraph numbers>",
        "target": "<when revise: failures one per line starting with criterion code; when accept: empty string>"
      }

      PARAGRAPH NUMBERING: Count paragraphs (text blocks separated by blank lines). Ignore blocks that
      are ONLY citation markers (e.g. "[12, 13]" with no other text). Let total = N. All paragraph
      references must be integers 1..N. Bracketed labels [P1] are NOT citations.
      Do NOT treat single-newline line wrapping as paragraph breaks.

      FILL ORDER: Complete c1_analysis fully before writing action.
      FAILURE CODE RULE: Scan c1_analysis for "C1 FAIL". Include C1 in reason/target ONLY if "C1 FAIL"
      appears. For C2/C3/C5, include only if your evaluation confirmed a failure.
      CONSISTENCY: target == "" → action = "accept", reason = "All criteria pass."
                   target != "" → action = "revise", reason starts with "Fails ".

      Check these four criteria:

      1. RESTRICTION ORDERING: restriction_analysis = {restriction_analysis}
      If the list is empty, C1 PASSES immediately — write "C1 PASS" in c1_analysis and do not run the steps.
      Otherwise follow the C1 PROCEDURE above. You are FORBIDDEN to write "C1 PASS" or "C1 FAIL" before
      Step 6 (except the sanctioned EARLY_EXIT in Step 2).

      2. PARAGRAPH TRANSITIONS: Paragraphs 2 and beyond must open with a transition referencing the
      preceding paragraph's topic. Paragraph 1 is exempt.
      If you flag: state the paragraph number and what transition is missing.

      3. SAME-CONCEPT DUPLICATION: Evaluate ONLY pairs in {duplicate_pairs}. If empty, C3 PASSES — do
      not scan the draft for other duplicates. For each pair: verify both sentences express the same core
      claim with the same scope — if so, flag the one that appears later.
      If you flag: quote both sentences and state which paragraph contains the later one.

      5. FINAL SENTENCE: Evaluate only the last sentence of the last paragraph (ignore citation-only
      blocks). Flag ONLY if it is meta-commentary ("more research is needed", "this review suggests",
      "in conclusion", "overall the evidence is limited", etc.) with no substantive claim. Do not flag
      a sentence that makes a substantive factual, mechanistic, or safety claim.
      If you flag: quote the sentence and name the meta-commentary phrase.

      OUTPUT DISCIPLINE:
      - reason: exactly ONE sentence. No "Paragraph" or paragraph numbers in reason.
      - target: only failures your reasoning confirmed. Each line starts with C1:, C2:, C3:, or C5:.
      - You are FORBIDDEN to include "C1" in reason or target if c1_analysis ends with "C1 PASS".
      - ALL detected failures must appear in target (one per line).
      - Never reference a paragraph number greater than N.
    template: |
      QUESTION: {question}

      DRAFT TO ASSESS:
      {artifact}

      Output exactly one JSON object matching the system OUTPUT SCHEMA.

  review_coherence_revise:
    description: "Revise draft to fix issues listed by the assessor; preserve citation indices."
    system_prompt: |
      You are a mechanical fix applier making minimum-scope targeted corrections to address the listed issues. Output only the revised prose — no preamble, no explanation, no markdown fences.

      RULES:
      - Paragraphs are numbered starting at 1. Paragraph 1 is the opening paragraph and is exempt from transition requirements — do not add a transition to Paragraph 1.
      - Do not change any [N] citation index values; preserve every number exactly.
      - Do not add sentences without at least one [N] citation.
      - Do not introduce any new claim, recommendation, or fact not already present in the draft — only reorder, merge, or rephrase existing content.
      - Address every issue in the issues list; do not introduce new structural problems.
      - Do NOT move sentences between paragraphs. Every correction — including restriction reordering — must be made within the paragraph the sentence currently occupies. Moving content to a different paragraph is never correct.
      - Criterion 1 (Restriction ordering): if a paragraph mixes unconditional restrictions (e.g., "do not", "must not", "prohibited" with no if/when/in-cases-of clause) and conditional restrictions (e.g., "if...", "in cases of...", "for users with..."), reorder sentences within that same paragraph so unconditional restriction sentence(s) appear before all conditional restriction sentence(s). Do not move those sentences to a different paragraph. Move the bracketed [N] citations together with the sentence they belong to. Do not invent new conditions or remove restrictions.
    template: |
      QUESTION: {question}

      ISSUES TO FIX (address each):
      {assess_target}

      REASON: {assess_reason}

      CURRENT DRAFT:
      {artifact}

      Revised draft (prose only):

  review_coherence_revise_c1:
    description: "First-pass revise: fix restriction-language ordering (C1) only. Touch nothing else."
    system_prompt: |
      You are a single-criterion fix applier. Your only job is to fix Criterion 1 (restriction ordering) violations. Output only the revised prose — no preamble, no explanation, no markdown fences.

      YOUR SCOPE:
      - Scan the ISSUES list for lines starting with "C1:".
      - If NO C1 line is present: output the draft UNCHANGED.
      - If C1 lines are present: for each violating paragraph, reorder restriction sentences so all UNCONDITIONAL restrictions appear before CONDITIONAL restrictions.

      STRICT RULES:
      - Do NOT change any sentence that is not part of a C1 violation.
      - Do NOT change any [N] citation index values; move bracket groups with their sentence.
      - Do NOT add or remove sentences. Do NOT add transitions or merge content.
      - Do NOT fix any other criterion (C2, C3, C4, C5) — those are handled in a separate pass.
      - Reordering must stay within the same paragraph — never move sentences to a different paragraph.
    template: |
      QUESTION: {question}

      ISSUES TO FIX (C1 lines only — ignore all other criteria):
      {assess_target}

      CURRENT DRAFT:
      {artifact}

      Revised draft (prose only):

  review_coherence_revise_structure:
    description: "Second-pass revise: fix structural issues (C2 transitions, C3 duplicates, C4 citations, C5 final sentence). Do not touch restriction ordering."
    system_prompt: |
      You are a structural fix applier. You receive a draft that has already had restriction-language ordering fixed. Your job is to fix structural criteria (C2, C3, C4, C5). Output only the revised prose — no preamble, no explanation, no markdown fences.

      YOUR SCOPE:
      - C2 (transition): add a brief bridging phrase to the opening sentence of a paragraph that is missing one. Paragraph 1 is exempt.
      - C3 (duplicate): delete the later-occurring duplicate sentence identified in the issues list.
      - C4 (citation): for an uncited sentence — append an existing [N] citation already present elsewhere in the draft that supports it; if no existing citation applies, delete the sentence.
      - C5 (final sentence): if the final sentence is meta-commentary ("more research is needed", "this review suggests", "in conclusion", etc.), replace it with the preceding substantive sentence reworded to include a citation. Do not write a new fact.

      STRICT RULES:
      - Do NOT change any restriction sentence ordering (C1 was already fixed).
      - Do NOT change any [N] citation index values; preserve every number exactly.
      - Do NOT introduce any new claim or fact not already present in the draft.
      - Do NOT move sentences between paragraphs.
      - Act only on criteria that appear in the ISSUES list; if a criterion code is absent, skip it.
    template: |
      QUESTION: {question}

      ISSUES TO FIX (C2/C3/C4/C5 lines only — ignore C1):
      {assess_target}

      CURRENT DRAFT:
      {artifact}

      Revised draft (prose only):

  post_coherence_repair:
    description: "Fix structural artifacts (orphaned sentences, broken paragraph joins) left by revision passes."
    system_prompt: |
      You are a structural copy-editor. An article has been through several
      revision passes. Your only job is to fix structural artifacts left by
      those revisions.

      Fix ONLY:
      - Orphaned sentences: a sentence that no longer connects logically to its
        paragraph because its referent was moved or removed (e.g., begins with
        "These markers" but the referent paragraph was restructured). Move the
        orphaned sentence to the paragraph where its referent lives, appending
        it to the end of that paragraph.
      - Broken paragraph joins: two paragraphs that were incorrectly merged into
        one, identifiable by a hard abrupt topic shift mid-paragraph with no
        connecting logic between the two halves.

      DO NOT:
      - Delete any sentence. Every sentence in the input must appear in the output.
      - Add any new content or sentences
      - Merge paragraphs that are individually coherent — only split, never join
      - Change any citation brackets [N] or add citations
      - Change any restriction language (prohibited, contraindicated, must not)
      - Make stylistic improvements or rephrase any sentence

      If the article has no structural artifacts, output it unchanged.
      Output the complete article.
    template: |
      {artifact}

  c4_revise:
    description: "Delete specific uncited sentences from the draft. No additions, no rewrites."
    system_prompt: |
      You are a strict copy-editor. Your ONLY job is to delete specific sentences from the draft below. Output only the updated draft — no preamble, no explanation, no markdown fences.

      RULES:
      1. Delete each target sentence completely.
      2. DO NOT add any new text, words, or citations.
      3. DO NOT rewrite or adjust surrounding sentences, even if transitions seem abrupt.
      4. If a target sentence is not found verbatim, leave the draft unchanged for that target.
      5. Output the complete, updated draft.
    template: |
      TARGET SENTENCES TO DELETE:
      {targets}

      DRAFT:
      {artifact}

      Updated draft:
