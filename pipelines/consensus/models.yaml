# Consensus Pipeline Model Panel
#
# Architecture: Models defined as dict, pipeline uses map steps for parallelism
# Strategy: Diverse architectures → uncorrelated errors → stronger consensus
#
# The pipeline defines model lists in pipeline options, then maps over them:
#   options.answer_models: [phi, qwen, frank]
#   Step uses map_over to iterate answer_models in parallel
#
# This keeps models.yaml simple (just model definitions) and pipeline.yaml
# controls which models are used for which roles.
#
# Execution Configuration (optional):
#   execution:
#     chunk_size: int       # Statements per model call (default: 10, use 1 for isolation)
#     max_concurrent: int   # Max parallel chunks for this model (default: unlimited)
#     timeout_ms: int       # Per-chunk timeout in milliseconds (default: none)
#     sequential: bool      # Force sequential execution (default: false)
#
# Handlers that support ChunkedModelExecutor read these hints automatically.

