# ==========================================================================
# PIPELINE ROLE ASSIGNMENT
# ==========================================================================
#
# Edit basic.yaml options section to configure model panels:
#
# options:
#   # Answer generation (parallel execution via map step)
#   answer_models: [phi, qwen, frank]
#
#   # Verification (parallel execution via map step, auto-excludes origin)
#   verify_models: [phi, qwen, frank]
#
#   # Final synthesis (single model)
#   synthesizer_model: frank
#
#   # Cross-model decomposition (reduces bias)
#   decompose_mapping:
#     phi: qwen      # qwen decomposes phi's answer
#     qwen: frank    # frank decomposes qwen's answer
#     frank: phi     # phi decomposes frank's answer
#
# ==========================================================================
# EXPERIMENTATION EXAMPLES
# ==========================================================================
#
# High-quality panel (best accuracy):
#   answer_models: [qwen2_5_14b, gemma3_12b, qwen2_5_7b]
#   verify_models: [qwen2_5_14b, gemma3_12b, qwen2_5_7b]
#
# Balanced panel (speed + quality):
#   answer_models: [qwen2_5_7b, llama_3_1_8b, phi]
#   verify_models: [qwen2_5_7b, llama_3_1_8b, phi]
#
# Fast edge panel:
#   answer_models: [phi, stablelm, pythia]
#   verify_models: [phi, stablelm, dclm]
#
# Math-focused (with domain routing):
#   answer_models: [qwen2_5_7b, phi, frank]
#   verify_models: [qwen2_5_7b, qwen_math, phi]  # qwen_math for domain=mathematics
#
# Diverse architecture (uncorrelated errors):
#   answer_models: [qwen2_5_14b, gemma3_12b, llama_3_1_8b, phi]
#   verify_models: [qwen2_5_14b, gemma3_12b, llama_3_1_8b, phi]
#
# No pipeline step changes needed - just swap model lists!
