# Verify sub-pipeline: decompose → classify → atomicity → domain → verify → filter
#
# Replaces the monolithic verify_chain handler (v5.0) with declarative steps.
# Each step is a thin handler wrapping a single function from shared/.
#
# Inputs (bound by parent pipeline):
#   answer       - Raw answer text to verify
#   question     - Cleaned question text
#   question_type - Question classification (general, math, etc.)
#   originator   - Model alias that produced the answer

id: consensus-verify
type: consensus

inputs:
  - answer
  - question
  - question_type
  - originator

steps:
  # Break answer text into atomic claims with sentence provenance — the unit for all downstream verification.
  - name: decompose
    type: consensus_decompose_v6_0
    model_ref: gemma_2_9b
    handler_inputs:
      answer: inputs.answer
      question: inputs.question
    prompt_ref_decompose: consensus.v6.0.decompose
    timeout_seconds: 120

  # Label each claim as math or general to control routing into authority vs. general verification.
  - name: classify_domain
    type: consensus_classify_domain_v6_0
    model_ref: gemma_2_9b
    handler_inputs:
      claims: decompose.json.claims
    prompt_ref_classify: consensus.v6.0.classify_math
    timeout_seconds: 120

  # Split compound claims into atomic sub-claims; parent verdict later derived from sub-claim conjunction.
  - name: atomicity_gate
    type: consensus_atomicity_gate_v6_0
    model_ref: gemma_2_9b
    handler_inputs:
      claims: classify_domain.json.claims
    decompose_compound_math: true
    prompt_ref_atomicity_classify: consensus.v6.0.classify_atomicity
    prompt_ref_decompose_compound: consensus.v6.0.decompose_general_compound
    timeout_seconds: 120

  # Route domain claims to authority models (math specialist); remainder flows to general voting.
  - name: domain_verify
    type: consensus_domain_verify_v6_0
    handler_inputs:
      claims: atomicity_gate.json.claims
    domain_verification:
      enabled: true
      domain_verifiers:
        math:
          model_ref: zyphra_math
          prompt_ref: consensus.v6.0.verify_math
          veto_policy:
            enabled: false
          generation_parameters:
            temperature: 0.0
    timeout_seconds: 180

  # Fan general claims to the verifier pool; each model independently votes true/false per claim.
  - name: verify_general
    type: consensus_verify_general_v6_0
    handler_inputs:
      claims_for_general: domain_verify.json.claims_for_general
      question: inputs.question
      originator: inputs.originator
    model_pool: optionsNs.verifier_pool
    exclude_self: true
    prompt_ref_verify: consensus.v6.0.verify_specific
    prompt_ref_verify_batch: consensus.v6.0.verify_batch_specific
    timeout_seconds: 360

  # Apply voting policy, resolve compound parents, merge authority verdicts → verified_facts / rejected_claims.
  - name: filter_threshold
    type: consensus_filter_threshold_v6_0
    handler_inputs:
      claims_for_general: domain_verify.json.claims_for_general
      verdicts: verify_general.json.verdicts
      verdicts_by_model: verify_general.json.verdicts_by_model
      authority_verdicts: domain_verify.json.authority_verdicts
      all_claims: domain_verify.json.all_claims
      compound_parents: domain_verify.json.compound_parents
      question_type: inputs.question_type
    verification_policy: majority
    math_verification_policy: unanimous_reject
    timeout_seconds: 30

output: filter_threshold
