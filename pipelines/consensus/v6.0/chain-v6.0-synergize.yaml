# Consensus v6.0 — Sub-pipeline architecture
#
# Replaces v5.0's monolithic verify_chain handlers with declarative
# verify sub-pipelines.  Each verify_link references verify/verify.yaml
# which is expanded by the DAG builder into namespaced flat steps.
#
# Key changes from v5.0:
#   - verify_link0/1/2 are type: sub_pipeline with pipeline_ref
#   - Verify flow is declarative YAML, not hidden in handler code
#   - Sequential model dispatch with affinity ordering preserved
#   - All other steps unchanged from v5.0
#
# Flow:
#   CLASSIFY:
#     analyze_question
#
#   ANSWER:
#     answer_all (parallel across 3 models)
#
#   VERIFY + MERGE:
#     verify_link0 (sub-pipeline: decompose→classify→verify→filter)  ┐
#     verify_link1 (sub-pipeline)                                     ├── PARALLEL
#     verify_link2 (sub-pipeline)                                     ┘
#       → synergize (embed dedup, no LLM)
#         → filter_negatives
#           → veto_pass (sub-pipeline: veto_verify → veto_threshold)
#
#   SYNTHESIZE (sub-pipeline):
#     synthesize (post_process → review_synthesis)

schema_version: 6
id: consensus-chain-v6.0-synergize
version: "6.0-synergize"
type: consensus
description: "Sub-pipeline verify + synergize — declarative verification flow"

options:
  save_execution_summary: true
  summary_format: detailed
  include_step_stats: true
  timeout_seconds: 1800

  answer_models:
    qwen: qwen
    gemma_2_9b: gemma_2_9b
    llama_3_1_8b: llama_3_1_8b

  verifier_pool:
    - qwen
    - gemma_2_9b
    - llama_3_1_8b
    - phi

  veto_pool:
    - qwen
    - gemma_2_9b
    - llama_3_1_8b
    - ministral_3_8b

  originator_link0: qwen
  originator_link1: gemma_2_9b
  originator_link2: llama_3_1_8b

  post_process_mode: synthesize

  verification_chunk_size: 8
  classify_chunk_size: 16
  contextualize_chunk_size: 16

token_defaults:
  analyze: 1024
  classify: 256
  answer: 4096
  verify: 777
  verify_decompose: 1776
  verify_batch: 2048
  verify_individual: 1024
  verify_classify: 512
  verify_contextualize: 4096
  verify_math_decompose: 1024
  verify_decompose_compound: 1024
  verify_domain: 512
  constrained_multiplier: 0.5

steps:
  # ==========================================================================
  # CLASSIFY
  # ==========================================================================

  # Classify the question and emit a structural contract (type, required_items, ordering) for synthesis.
  - name: analyze_question
    type: consensus_analyze_v5_0
    model_ref: qwen
    prompt_ref: consensus.v5.0.analyze_question
    handler_inputs:
      text: sourceNs.text
    handler_outputs:
      contract: analyze_question.json
    generation_parameters:
      temperature: 0.0
      response_format:
        type: json_object
    timeout_seconds: 60

  # ==========================================================================
  # ANSWER (parallel across models)
  # ==========================================================================

  # Generate candidate answers in parallel, one per model in the answer pool.
  - name: answer_all
    type: consensus_answer_v3_3
    model_ref: qwen
    map_over:
      model: optionsNs.answer_models
    map_inputs:
      model_ref: mapNs.iteration.value
    prompt_ref: consensus.v5.0.answer
    handler_inputs:
      text: sourceNs.text
      question: analyze_question.json.cleaned_question
    handler_outputs:
      answers: answer_all.*.raw
    generation_parameters:
      temperature: 0.7
    timeout_seconds: 180

  # ==========================================================================
  # VERIFY + MERGE (sub-pipeline verify + synergize)
  # ==========================================================================

  # Decompose, classify, and cross-verify qwen's answer → verified_facts + authority_verdicts.
  - name: verify_link0
    type: sub_pipeline
    pipeline_ref: verify/verify.yaml
    handler_inputs:
      answer: answer_all.qwen.raw
      question: analyze_question.json.cleaned_question
      question_type: analyze_question.json.question_type
      originator: optionsNs.originator_link0
    timeout_seconds: 600

  # Decompose, classify, and cross-verify gemma_2_9b's answer → verified_facts + authority_verdicts.
  - name: verify_link1
    type: sub_pipeline
    pipeline_ref: verify/verify.yaml
    handler_inputs:
      answer: answer_all.gemma_2_9b.raw
      question: analyze_question.json.cleaned_question
      question_type: analyze_question.json.question_type
      originator: optionsNs.originator_link1
    timeout_seconds: 600

  # Decompose, classify, and cross-verify llama_3_1_8b's answer → verified_facts + authority_verdicts.
  - name: verify_link2
    type: sub_pipeline
    pipeline_ref: verify/verify.yaml
    handler_inputs:
      answer: answer_all.llama_3_1_8b.raw
      question: analyze_question.json.cleaned_question
      question_type: analyze_question.json.question_type
      originator: optionsNs.originator_link2
    timeout_seconds: 600

  # Synergize: merge 3 verified fact sets via embedding dedup.
  - name: synergize
    type: consensus_synergize_v5_0
    handler_inputs:
      verified_facts_0: verify_link0.json.verified_facts
      verified_facts_1: verify_link1.json.verified_facts
      verified_facts_2: verify_link2.json.verified_facts
      authority_verdicts_0: verify_link0.json.authority_verdicts
      authority_verdicts_1: verify_link1.json.authority_verdicts
      authority_verdicts_2: verify_link2.json.authority_verdicts
      question: analyze_question.json.cleaned_question
    handler_outputs:
      verified_facts: synergize.json.verified_facts
      authority_verdicts: synergize.json.authority_verdicts
    embedding_model: embedding
    similarity_threshold: 0.82
    timeout_seconds: 60

  # Remove universal-negative claims that poison synthesis when contradicted by positive facts.
  - name: filter_negatives
    type: consensus_filter_negatives_v5_0
    model_ref: qwen
    prompt_ref: consensus.v5.0.filter_negatives
    handler_inputs:
      verified_facts: synergize.json.verified_facts
      authority_verdicts: synergize.json.authority_verdicts
      question: analyze_question.json.cleaned_question
    handler_outputs:
      verified_facts: filter_negatives.json.verified_facts
      authority_verdicts: filter_negatives.json.authority_verdicts
    generation_parameters:
      temperature: 0.0
      response_format:
        type: json_object
    timeout_seconds: 60

  # Second-opinion veto check on authority-accepted claims; unanimous rejection overrides authority.
  - name: veto_pass
    type: sub_pipeline
    pipeline_ref: veto/veto.yaml
    handler_inputs:
      verified_facts: filter_negatives.json.verified_facts
      rejected_claims: verify_link0.json.rejected_claims
      authority_verdicts: filter_negatives.json.authority_verdicts
      question: analyze_question.json.cleaned_question
    timeout_seconds: 180

  # ==========================================================================
  # SYNTHESIZE (sub-pipeline)
  # ==========================================================================

  # Synthesize final answer from verified facts, then review and audit coverage.
  - name: synthesize
    type: sub_pipeline
    pipeline_ref: synthesize/synthesize.yaml
    handler_inputs:
      mode: optionsNs.post_process_mode
      original_answer: answer_all.qwen.raw
      verified_facts: veto_pass.json.verified_facts
      rejected_claims: veto_pass.json.rejected_claims
      question: analyze_question.json.cleaned_question
    timeout_seconds: 900

output: synthesize
