# Synthesize sub-pipeline
#
# Inputs (bound by parent pipeline):
#   verified_facts  - Final verified facts after veto
#   question        - Cleaned question text

id: consensus-synthesize-v7
type: consensus

inputs:
  - verified_facts
  - question

steps:
  - name: group_facts
    type: consensus_group_facts_v7_1
    handler_inputs:
      verified_facts: inputs.verified_facts
    embedding_model: embedding
    similarity_threshold: 0.75
    timeout_seconds: 60

  - name: synthesize_answer
    type: consensus_synthesize_batched_v7_1
    handler_inputs:
      fact_clusters: group_facts.json.fact_clusters
      question: inputs.question
    system_prompt_ref: consensus.v7.1.synthesize_context
    prompt_ref: consensus.v7.1.synthesize_initial
    max_batch_size: 15
    model_ref: qwen
    timeout_seconds: 180

  - name: identify_redundancy
    type: consensus_identify_redundancy_v7_1
    enabled: false
    handler_inputs:
      answer: synthesize_answer.json.answer
      batch_texts: synthesize_answer.json.batch_texts
      question: inputs.question
    system_prompt_ref: consensus.v7.1.identify_redundancy_context
    prompt_ref: consensus.v7.1.identify_redundancy_initial
    model_ref: qwen
    timeout_seconds: 60

  - name: reorganize_answer
    type: consensus_reorganize_v7_1
    handler_inputs:
      answer: synthesize_answer.json.answer
      question: inputs.question
      incorporated: synthesize_answer.json.incorporated
      excluded_with_reason: synthesize_answer.json.excluded_with_reason
      merge_groups: identify_redundancy.json.merge_groups
    system_prompt_ref: consensus.v7.1.reorganize_context
    prompt_ref: consensus.v7.1.reorganize_initial
    model_ref: ministral_3_8b
    timeout_seconds: 120

output: reorganize_answer
