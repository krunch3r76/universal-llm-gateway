# Consensus v5.0 — Parallel verify + synergize
#
# Replaces v4.0's serial enrich-reverify chain with parallel independent
# verification followed by embedding-based deduplication (synergize).
#
# Key changes from v4.0:
#   - All verify links are independent — DAG executor runs them in PARALLEL
#   - Synergize merges verified fact sets via embedding cosine similarity
#     (first-occurrence-in-order wins, no LLM call)
#   - No enrichment — synthesis from verified facts directly, scaffolded
#     by the original answer for structure/style only
#   - review_synthesis checks fact coverage, revises if any missing
#   - Tiebreaker removed — triple independent verification with union
#     via synergize is inherently more inclusive
#   - No expansion pass — parallel verify already captures broad fact coverage
#
# Flow:
#   CLASSIFY:
#     analyze_question
#
#   ANSWER:
#     answer_all (parallel across 3 models)
#
#   VERIFY + MERGE:
#     verify_link0 (qwen→gemma)  ┐
#     verify_link1 (gemma→qwen)  ├── PARALLEL
#     verify_link2 (llama→qwen)  ┘
#       → synergize (embed dedup, no LLM)
#         → filter_negatives (remove universal negatives, single LLM call)
#           → veto_pass
#
#   SYNTHESIZE:
#     post_process (synthesize from verified facts)
#       → review_synthesis (audit + revise for completeness)

schema_version: 6
id: consensus-chain-v5.0-synergize
version: "5.0-synergize"
type: consensus
description: "Parallel verify + synergize — direct synthesis, no enrichment"

options:
  save_execution_summary: true
  summary_format: detailed
  include_step_stats: true
  timeout_seconds: 1800

  answer_models:
    qwen: qwen
    gemma_2_9b: gemma_2_9b
    llama_3_1_8b: llama_3_1_8b

  verifier_pool:
    - qwen
    - gemma_2_9b
    - llama_3_1_8b
    - phi

  # Veto pool: re-verifies authority-accepted claims after synergize.
  # Requires unanimous FALSE from all models to override authority.
  veto_pool:
    - qwen
    - gemma_2_9b
    - llama_3_1_8b
    - ministral_3_8b

  originator_link0: qwen
  originator_link1: gemma_2_9b
  originator_link2: llama_3_1_8b

  post_process_mode: synthesize

  # Chunk sizes for verify sub-steps (claims per LLM call).
  # Effective size = min(pipeline value, model execution.chunk_size).
  verification_chunk_size: 8
  classify_chunk_size: 16
  contextualize_chunk_size: 16

token_defaults:
  analyze: 1024
  classify: 256
  answer: 4096
  verify: 777
  post_process: 4096
  # Sub-call budgets for verify handler internals
  verify_decompose: 1776
  verify_batch: 2048
  verify_individual: 1024
  verify_classify: 512
  verify_contextualize: 4096
  verify_math_decompose: 1024
  verify_decompose_compound: 1024
  verify_domain: 512
  constrained_multiplier: 0.5

steps:
  # =============================================================================
  # CLASSIFY
  # =============================================================================

  - name: analyze_question
    type: consensus_analyze_v5_0
    model_ref: qwen
    prompt_ref: consensus.v5.0.analyze_question
    handler_inputs:
      text: sourceNs.text
    handler_outputs:
      contract: analyze_question.json
    generation_parameters:
      temperature: 0.0
      response_format:
        type: json_object
    timeout_seconds: 60

  # =============================================================================
  # ANSWER (parallel across models)
  # =============================================================================

  - name: answer_all
    type: consensus_answer_v3_3
    model_ref: qwen
    map_over:
      model: optionsNs.answer_models
    map_inputs:
      model_ref: mapNs.iteration.value
    prompt_ref: consensus.v5.0.answer
    handler_inputs:
      text: sourceNs.text
      question: analyze_question.json.cleaned_question
    handler_outputs:
      answers: answer_all.*.raw
    generation_parameters:
      temperature: 0.7
    timeout_seconds: 180

  # =============================================================================
  # VERIFY + MERGE (parallel verify + synergize)
  # =============================================================================

  # All three verify links depend only on answer_all outputs + question —
  # no enrich dependency → DAG executor runs them in PARALLEL.

  - name: verify_link0
    type: consensus_verify_chain_v5_0
    model_ref: gemma_2_9b
    handler_inputs:
      answer: answer_all.qwen.raw
      question: analyze_question.json.cleaned_question
      question_type: analyze_question.json.question_type
      originator: optionsNs.originator_link0
    handler_outputs:
      verified_facts: verify_link0.json.verified_facts
      rejected_claims: verify_link0.json.rejected_claims
      authority_verdicts: verify_link0.json.authority_verdicts
    prompt_ref_decompose: consensus.v5.0.decompose
    prompt_ref_decompose_compound: consensus.v5.0.decompose_general_compound
    prompt_ref_verify: consensus.v5.0.verify_specific
    prompt_ref_verify_batch: consensus.v5.0.verify_batch_specific
    prompt_ref_classify: consensus.v5.0.classify_math
    decompose_compound_general: true
    decompose_compound_math: true
    atomicity_gate: true
    prompt_ref_atomicity_classify: consensus.v5.0.classify_atomicity
    model_pool: optionsNs.verifier_pool
    exclude_self: true
    verification_policy: majority
    math_verification_policy: unanimous_reject
    domain_verification:
      enabled: true
      domain_verifiers:
        math:
          model_ref: zyphra_math
          prompt_ref: consensus.v5.0.verify_math
          veto_policy:
            enabled: false
          generation_parameters:
            temperature: 0.0
    timeout_seconds: 600

  - name: verify_link1
    type: consensus_verify_chain_v5_0
    model_ref: qwen
    handler_inputs:
      answer: answer_all.gemma_2_9b.raw
      question: analyze_question.json.cleaned_question
      question_type: analyze_question.json.question_type
      originator: optionsNs.originator_link1
    handler_outputs:
      verified_facts: verify_link1.json.verified_facts
      rejected_claims: verify_link1.json.rejected_claims
      authority_verdicts: verify_link1.json.authority_verdicts
    prompt_ref_decompose: consensus.v5.0.decompose
    prompt_ref_decompose_compound: consensus.v5.0.decompose_general_compound
    prompt_ref_verify: consensus.v5.0.verify_specific
    prompt_ref_verify_batch: consensus.v5.0.verify_batch_specific
    prompt_ref_classify: consensus.v5.0.classify_math
    decompose_compound_general: true
    decompose_compound_math: true
    atomicity_gate: true
    prompt_ref_atomicity_classify: consensus.v5.0.classify_atomicity
    model_pool: optionsNs.verifier_pool
    exclude_self: true
    verification_policy: majority
    math_verification_policy: unanimous_reject
    domain_verification:
      enabled: true
      domain_verifiers:
        math:
          model_ref: zyphra_math
          prompt_ref: consensus.v5.0.verify_math
          veto_policy:
            enabled: false
          generation_parameters:
            temperature: 0.0
    timeout_seconds: 600

  - name: verify_link2
    type: consensus_verify_chain_v5_0
    model_ref: qwen
    handler_inputs:
      answer: answer_all.llama_3_1_8b.raw
      question: analyze_question.json.cleaned_question
      question_type: analyze_question.json.question_type
      originator: optionsNs.originator_link2
    handler_outputs:
      verified_facts: verify_link2.json.verified_facts
      rejected_claims: verify_link2.json.rejected_claims
      authority_verdicts: verify_link2.json.authority_verdicts
    prompt_ref_decompose: consensus.v5.0.decompose
    prompt_ref_decompose_compound: consensus.v5.0.decompose_general_compound
    prompt_ref_verify: consensus.v5.0.verify_specific
    prompt_ref_verify_batch: consensus.v5.0.verify_batch_specific
    prompt_ref_classify: consensus.v5.0.classify_math
    decompose_compound_general: true
    decompose_compound_math: true
    atomicity_gate: true
    prompt_ref_atomicity_classify: consensus.v5.0.classify_atomicity
    model_pool: optionsNs.verifier_pool
    exclude_self: true
    verification_policy: majority
    math_verification_policy: unanimous_reject
    domain_verification:
      enabled: true
      domain_verifiers:
        math:
          model_ref: zyphra_math
          prompt_ref: consensus.v5.0.verify_math
          veto_policy:
            enabled: false
          generation_parameters:
            temperature: 0.0
    timeout_seconds: 600

  # Synergize: merge 3 verified fact sets via embedding dedup.
  # First-occurrence-in-order wins (rank 0 = verify_link0, etc.).
  # No LLM call — embedding via nomic CPU model.
  - name: synergize
    type: consensus_synergize_v5_0
    handler_inputs:
      verified_facts_0: verify_link0.json.verified_facts
      verified_facts_1: verify_link1.json.verified_facts
      verified_facts_2: verify_link2.json.verified_facts
      authority_verdicts_0: verify_link0.json.authority_verdicts
      authority_verdicts_1: verify_link1.json.authority_verdicts
      authority_verdicts_2: verify_link2.json.authority_verdicts
      question: analyze_question.json.cleaned_question
    handler_outputs:
      verified_facts: synergize.json.verified_facts
      authority_verdicts: synergize.json.authority_verdicts
    embedding_model: embedding
    similarity_threshold: 0.82
    timeout_seconds: 60

  # Filter universal negatives: single-concern LLM step removes unfalsifiable
  # domain-spanning absence claims before they poison synthesis.
  - name: filter_negatives
    type: consensus_filter_negatives_v5_0
    model_ref: qwen
    prompt_ref: consensus.v5.0.filter_negatives
    handler_inputs:
      verified_facts: synergize.json.verified_facts
      authority_verdicts: synergize.json.authority_verdicts
      question: analyze_question.json.cleaned_question
    handler_outputs:
      verified_facts: filter_negatives.json.verified_facts
      authority_verdicts: filter_negatives.json.authority_verdicts
    generation_parameters:
      temperature: 0.0
      response_format:
        type: json_object
    timeout_seconds: 60

  # Veto pass: re-verify authority-accepted claims with a separate pool.
  # Only unanimous FALSE (all 4 veto models) overrides the authority verdict.
  - name: veto_pass
    type: consensus_veto_pass_v5_0
    handler_inputs:
      verified_facts: filter_negatives.json.verified_facts
      rejected_claims: verify_link0.json.rejected_claims
      authority_verdicts: filter_negatives.json.authority_verdicts
      question: analyze_question.json.cleaned_question
    handler_outputs:
      verified_facts: veto_pass.json.verified_facts
      rejected_claims: veto_pass.json.rejected_claims
    veto_pool: optionsNs.veto_pool
    prompt_ref_verify: consensus.v5.0.verify_specific
    prompt_ref_verify_batch: consensus.v5.0.verify_batch_specific
    veto_policy: unanimous_reject
    timeout_seconds: 120

  # Synthesize: write a clean answer from verified facts, using the original
  # answer as structural scaffolding. Always runs (no passthrough).
  - name: post_process
    type: consensus_post_process_v5_0
    model_ref: qwen
    handler_inputs:
      mode: optionsNs.post_process_mode
      original_answer: answer_all.qwen.raw
      verified_facts: veto_pass.json.verified_facts
      rejected_claims: veto_pass.json.rejected_claims
      question: analyze_question.json.cleaned_question
    handler_outputs:
      final: post_process.raw
    allow_passthrough: false
    prompt_ref_synthesize: consensus.v5.0.post_synthesize
    generation_parameters:
      temperature: 0.3
    timeout_seconds: 600

  # Review synthesis: check which facts are missing from synthesized answer.
  # Single LLM check + conditional revision call.
  - name: review_synthesis
    type: consensus_enrich_review_v5_0
    model_ref: qwen
    prompt_ref: consensus.v5.0.check_synthesis
    prompt_ref_re_enrich: consensus.v5.0.revise_synthesis
    handler_inputs:
      enriched_answer: post_process.raw
      verified_facts: veto_pass.json.verified_facts
      question: analyze_question.json.cleaned_question
    handler_outputs:
      raw: review_synthesis.raw
    generation_parameters:
      temperature: 0.3
    timeout_seconds: 300

output: review_synthesis
