# Synthesize sub-pipeline
#
# Inputs (bound by parent pipeline):
#   verified_facts  - Final verified facts after veto
#   question        - Cleaned question text

id: consensus-synthesize-v7
type: consensus

inputs:
  - verified_facts
  - question

steps:
  - name: group_facts
    type: consensus_group_facts_v7
    handler_inputs:
      verified_facts: inputs.verified_facts
    embedding_model: embedding
    similarity_threshold: 0.75
    timeout_seconds: 60

  - name: synthesize_answer
    type: consensus_synthesize_batched_v7
    handler_inputs:
      fact_clusters: group_facts.json.fact_clusters
      question: inputs.question
    system_prompt_ref: consensus.v7.synthesize_context
    prompt_ref: consensus.v7.synthesize_initial
    max_batch_size: 15
    model_ref: qwen
    timeout_seconds: 180

output: synthesize_answer
