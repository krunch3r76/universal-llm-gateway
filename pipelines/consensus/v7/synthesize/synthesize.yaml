# Synthesize sub-pipeline: outline-first synthesis
# organize_facts → review_outline → synthesize_from_outline
#   → review_redundancy (local)
#   → review_redundancy_global (cross-section)
#   → review_flow → review_coverage → coverage_audit
# review_placement: disabled (hallucinated contradictory move instructions)
#
# Verified facts are organized into a logical JSON outline by one model,
# critiqued/revised by a judge loop, then synthesized into prose.
# Coverage audit checks the final result via embedding similarity.
#
# Legacy steps (strip, audit_pass) are disabled — retained for reference.
# They processed original prose answers; the new flow works directly from
# verified facts, bypassing prose-merge entirely.
#
# Inputs (bound by parent pipeline):
#   answer_0, answer_1, answer_2  - Original answers (unused by active steps)
#   verified_facts                - Final verified facts after veto
#   rejected_claims              - Final rejected claims (unused by active steps)
#   question                     - Cleaned question text

# ─── Tuneable generation knobs ───────────────────────────────────────────────
_knobs:
  max_tokens_organize: &max_tokens_organize 2048   # JSON outline from facts
  max_tokens_review:   &max_tokens_review   2048   # outline critique + revise
  max_tokens_synth:    &max_tokens_synth    8192   # prose from approved outline
  # Legacy knobs (disabled steps):
  max_tokens_strip:    &max_tokens_strip    2048
  max_tokens_audit:    &max_tokens_audit    2048
# ─────────────────────────────────────────────────────────────────────────────

id: consensus-synthesize-v7
type: consensus

inputs:
  - answer_0
  - answer_1
  - answer_2
  - verified_facts
  - rejected_claims
  - question

steps:
  # ─── Legacy: prose-based pipeline (disabled) ────────────────────────────
  - name: strip_0
    type: consensus_strip_rejected_v7
    enabled: false
    model_ref: qwen
    prompt_ref: consensus.v7.strip_rejected
    handler_inputs:
      original_answer: inputs.answer_0
      rejected_claims: inputs.rejected_claims
      question: inputs.question
    generation_parameters:
      temperature: 0.2
      max_tokens: *max_tokens_strip
    timeout_seconds: 300

  - name: strip_1
    type: consensus_strip_rejected_v7
    enabled: false
    model_ref: qwen
    prompt_ref: consensus.v7.strip_rejected
    handler_inputs:
      original_answer: inputs.answer_1
      rejected_claims: inputs.rejected_claims
      question: inputs.question
    generation_parameters:
      temperature: 0.2
      max_tokens: *max_tokens_strip
    timeout_seconds: 300

  - name: strip_2
    type: consensus_strip_rejected_v7
    enabled: false
    model_ref: qwen
    prompt_ref: consensus.v7.strip_rejected
    handler_inputs:
      original_answer: inputs.answer_2
      rejected_claims: inputs.rejected_claims
      question: inputs.question
    generation_parameters:
      temperature: 0.2
      max_tokens: *max_tokens_strip
    timeout_seconds: 300

  - name: audit_pass
    type: assess_loop_v1
    enabled: false
    model_ref: phi4
    prompt_ref: consensus.v7.audit_contamination
    handler_inputs:
      artifact: strip_0.raw
      rejected_claims: inputs.rejected_claims
      question: inputs.question
    artifact_key: artifact
    assess_schema:
      type: object
      properties:
        action:
          type: string
          enum: [revise, accept]
        contaminated:
          type: array
          items:
            type: string
        clean:
          type: boolean
        target:
          type: string
      required: [action, contaminated, clean]
    terminal_action: accept
    max_iterations: 2
    actions:
      revise:
        prompt_ref: consensus.v7.remove_contamination
        model_ref: qwen
    generation_parameters:
      temperature: 0.1
      max_tokens: *max_tokens_audit
    timeout_seconds: 600

  # ─── Active: outline-first synthesis ────────────────────────────────────

  - name: organize_facts
    type: consensus_organize_facts_v7
    model_ref: phi4
    prompt_ref: consensus.v7.organize_facts
    handler_inputs:
      verified_facts: inputs.verified_facts
      question: inputs.question
    generation_parameters:
      temperature: 0.1
      max_tokens: *max_tokens_organize
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            sections:
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  heading:
                    type: string
                  fact_indices:
                    type: array
                    minItems: 1
                    items:
                      type: integer
                required: [heading, fact_indices]
          required: [sections]
    timeout_seconds: 300

  - name: validate_outline
    type: assess_loop_v1
    enabled: false
    # Disabled: qwen2-5-7b cannot reliably compute set-difference across
    # multi-section JSON (reports [31..64] missing when most are assigned).
    # Missing-fact recovery and oversized-section splitting are handled
    # programmatically by review_outline below.
    model_ref: qwen
    prompt_ref: consensus.v7.assess_outline_gaps
    handler_inputs:
      artifact: organize_facts.raw
      verified_facts: inputs.verified_facts
      question: inputs.question
    artifact_key: artifact
    assess_schema:
      type: object
      properties:
        action:
          type: string
          enum: [revise, accept]
        missing_indices:
          type: array
          items:
            type: integer
        overfull_sections:
          type: array
          items:
            type: string
        reason:
          type: string
        target:
          type: string
      required: [action, reason]
    terminal_action: accept
    max_iterations: 2
    actions:
      revise:
        prompt_ref: consensus.v7.revise_outline_gaps
        model_ref: qwen
    generation_parameters:
      temperature: 0.1
      max_tokens: *max_tokens_review
    timeout_seconds: 300

  - name: review_outline
    type: consensus_outline_review_v7
    model_ref: phi4
    handler_inputs:
      artifact: organize_facts.raw
      verified_facts: inputs.verified_facts
      question: inputs.question
    # Phase 1: programmatic coverage + oversized detection; LLM reviser fixes both.
    # Python computes missing indices and oversized headings exactly; LLM decides
    # only WHERE to place missing facts and HOW to split oversized sections.
    coverage_threshold: 1.0
    oversized_threshold: 15
    max_coverage_iterations: 6
    coverage_prompt_ref: consensus.v7.coverage_revise_outline
    coverage_pool:
      - qwen
    # Phase 2: LLM quality critique (misplacement only — single pass)
    max_quality_iterations: 0
    quality_critique_ref: consensus.v7.critique_outline_quality
    quality_revise_ref: consensus.v7.revise_outline_quality
    quality_pool:
      - qwen
    assess_schema:
      type: object
      properties:
        action:
          type: string
          enum: [revise, accept]
        issues:
          type: array
          items:
            type: object
            properties:
              fact_index:
                type: integer
              current_section:
                type: string
              target_section:
                type: string
              reason:
                type: string
            required: [fact_index, current_section, target_section, reason]
        reason:
          type: string
        target:
          type: string
      required: [action, reason]
    generation_parameters:
      temperature: 0.1
      max_tokens: *max_tokens_review
    timeout_seconds: 600

  - name: synthesize_from_outline
    type: consensus_section_synthesize_v7
    model_ref: phi4
    prompt_ref: consensus.v7.synthesize_from_section
    handler_inputs:
      outline: review_outline.raw
      verified_facts: inputs.verified_facts
      question: inputs.question
    generation_parameters:
      temperature: 0.1
      max_tokens: *max_tokens_synth
    timeout_seconds: 600

  - name: review_redundancy
    type: consensus_dedup_sections_v7
    handler_inputs:
      artifact: synthesize_from_outline.raw
    overlap_threshold: 0.5
    timeout_seconds: 30

  - name: review_redundancy_global
    type: assess_loop_v1
    model_ref: phi4
    assess_pool:
      - phi4
    prompt_ref: consensus.v7.critique_redundancy_global
    handler_inputs:
      artifact: review_redundancy.raw
      question: inputs.question
    artifact_key: artifact
    assess_schema:
      type: object
      properties:
        action:
          type: string
          enum: [revise, accept]
        repeated_items:
          type: array
          items:
            type: object
            properties:
              kept:
                type: string
              deleted:
                type: string
              shared_predicate:
                type: string
            required: [kept, deleted, shared_predicate]
        reason:
          type: string
        target:
          type: string
      required: [action, reason]
    terminal_action: accept
    max_iterations: 1
    actions:
      revise:
        prompt_ref: consensus.v7.revise_redundancy
        model_ref: qwen
    generation_parameters:
      temperature: 0.1
      max_tokens: *max_tokens_synth
    timeout_seconds: 600

  - name: review_flow
    type: assess_loop_v1
    model_ref: phi4
    prompt_ref: consensus.v7.assess_flow
    handler_inputs:
      artifact: review_redundancy_global.raw
      question: inputs.question
    artifact_key: artifact
    assess_schema:
      type: object
      properties:
        action:
          type: string
          enum: [revise, accept]
        issues:
          type: array
          items:
            type: string
        reason:
          type: string
        target:
          type: string
      required: [action, reason]
    terminal_action: accept
    max_iterations: 2
    actions:
      revise:
        prompt_ref: consensus.v7.revise_flow
        model_ref: qwen
    generation_parameters:
      temperature: 0.1
      max_tokens: *max_tokens_synth
    timeout_seconds: 600

  - name: review_placement
    type: assess_loop_v1
    enabled: false
    model_ref: llama_3_1_8b
    prompt_ref: consensus.v7.assess_placement
    handler_inputs:
      artifact: review_flow.raw
      question: inputs.question
    artifact_key: artifact
    assess_schema:
      type: object
      properties:
        action:
          type: string
          enum: [revise, accept]
        issues:
          type: array
          items:
            type: string
        reason:
          type: string
        target:
          type: string
      required: [action, reason]
    terminal_action: accept
    max_iterations: 1
    actions:
      revise:
        prompt_ref: consensus.v7.revise_placement
        model_ref: qwen
    generation_parameters:
      temperature: 0.1
      max_tokens: *max_tokens_synth
    timeout_seconds: 600

  - name: review_coverage
    type: consensus_coverage_review_v7
    handler_inputs:
      artifact: review_flow.raw
      verified_facts: inputs.verified_facts
      question: inputs.question
    embedding_model: embedding
    similarity_threshold: 0.78
    adjudicate_prompt_ref: consensus.v7.adjudicate_coverage
    adjudicate_model_ref: phi4
    insert_prompt_ref: consensus.v7.insert_missing
    insert_model_ref: phi4
    generation_parameters:
      temperature: 0.1
      max_tokens: *max_tokens_synth
    timeout_seconds: 600

  - name: coverage_audit
    type: consensus_coverage_audit_v7
    enabled: true
    handler_inputs:
      final_answer: review_coverage.raw
      verified_facts: inputs.verified_facts
    embedding_model: embedding
    coverage_threshold: 0.78
    timeout_seconds: 60

output: coverage_audit
