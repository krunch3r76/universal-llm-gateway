# Consensus v7 prompts — Contextualized verification + model pool standardization
# Namespace: consensus.v7
#
# Self-contained prompt set for v7 pipeline.

prompts:
  analyze_question:
    description: "Classify question and extract structure hints for synthesis."
    system_prompt: |
      You analyze questions to extract structural metadata. Output valid JSON only.

      OUTPUT JSON SCHEMA:
      {
        "cleaned_question": "string - grammatically clean version of the question",
        "question_type": "string - one of: enumeration, comparison, definition, explanation, simple, proof",
        "required_items": [{"label": "string", "required": true}],
        "cardinality": "integer - expected count (0 if flexible)",
        "ordering": "string - canonical, alphabetical, or none",
        "structure_notes": "string - additional structural requirements"
      }

      QUESTION TYPE CLASSIFICATION:
      
      1. enumeration: Questions asking to list multiple distinct items
         - Patterns: "List X", "Name the X", "What are the X"
         - CRITICAL: "Explain [the] X layers/types/phases/steps" is ALWAYS enumeration
         - cardinality: count of items; ordering: "canonical" or "none"
      
      2. comparison: Questions comparing two or more entities
         - Patterns: "Compare X and Y", "What is the difference between X and Y"
         - cardinality: entity count
      
      3. definition: Questions asking for meaning/definition
         - Patterns: "Define X", "What is X"
         - cardinality: 1
      
      4. explanation: Questions about processes/mechanisms (NOT about layers/types/phases)
         - Patterns: "Explain how X works", "Explain why X happens"
         - cardinality: 0 (flexible)
      
      5. simple: Yes/no questions
         - Patterns: "Is X true?"
         - cardinality: 1
      
      6. proof: Questions requiring formal proof
         - Patterns: "Prove X", "Show that X is Y"
         - cardinality: 2 (claim + proof)


      REQUIRED_ITEMS RULES:
      
      RULE 1 (Well-known enumerations):
      If the question asks about a WELL-KNOWN ENUMERATION listed above,
      you MUST create a separate required_items entry for EACH specific item.
      
      Example: "Explain the four seasons of the year"
      required_items: [
        {"label": "Spring", "required": true},
        {"label": "Summer", "required": true},
        {"label": "Fall/Autumn", "required": true},
        {"label": "Winter", "required": true}
      ]
      cardinality: 4
      
      RULE 2 (Unknown enumerations):
      If the question asks to enumerate something NOT in the well-known list,
      use a single high-level label.
      
      Example: "List the benefits of exercise"
      required_items: [{"label": "benefits", "required": true}]
      cardinality: 0

      CARDINALITY EXAMPLES:
      - "N types of X" = N
      - "X model layers" = count(layers) if well-known, else 0
      - "Y layers/phases/steps" = count(items) if canonical, else 0
      - "steps of Z" = 0 if methodology-dependent
      - "Compare X and Y" = 2
    template: |
      {text}


  answer:
    description: "Generate a thorough answer to the question."
    system_prompt: |
      Answer the question thoroughly and accurately. Write in clear paragraphs.
      Cover all aspects the question asks about.
      Include specific examples, named methods, or concrete details where possible.
      Statements must be verifiable — but formal, structural, and foundational
      claims are equally valid as empirical ones.
      
      DEPTH OVER SURFACE:
      - When the question references a specific discipline, prioritize that
        field's core motivations, formal frameworks, and foundational concepts
      - For "why" questions: address the deeper theoretical motivations first,
        then practical implications if relevant
      - If a question uses specific technical framing but asks about broader
        concerns, recognize and address the underlying conceptual issue
      - Prefer foundational explanations (axioms, structural properties,
        formal distinctions) over applied consequences
      
      CRITICAL CONSTRAINT:
      If you do not have sufficient factual information to answer the question,
      state only what is unknown and STOP. Do not speculate, infer, or provide
      educated guesses. The words "likely", "perhaps", "probably", "based on",
      "suggests", and "speculation" are forbidden.
      
      WRITING STYLE - POSITIVE FRAMING:
      - State what IS true rather than what is NOT true
      - Avoid negative formulations unless they directly answer the question
      - Focus on positive properties and characteristics

      In response to technical questions, compare and contrast different approaches, schools of thought, or contrasting

    template: |
      {question}

  decompose:
    description: "Extract all factual claims with source sentence provenance."
    system_prompt: |
      Extract every independently verifiable claim from the numbered sentences below.
      Output a JSON object with a "claims" array. Each element is an object:
        "text": the claim (string)
        "source_sentences": array of integer indices of the sentence(s) this claim derives from

      RULES:
      - Each claim must be a complete, self-contained sentence
      - Each claim must be independently verifiable (true or false)
      - Do NOT combine multiple facts into one claim
      - When a sentence lists multiple examples (e.g., "X appears in A, B, and C"),
        extract ONE claim per listed item with the subject repeated explicitly
      - Each distinct verifiable fact in a comma-separated list must be its own claim
      - Do NOT add information not present in the text
      - Do NOT include opinions, hedging, or meta-commentary
      - Include ALL factual claims, even minor ones
      - For mathematical claims, preserve equations exactly
      - source_sentences MUST reference the bracketed index numbers shown in the input

      CRITICAL - RESOLVE ALL REFERENCES:
      - Replace pronouns (it, this, that, which, who, he, she) with explicit subjects
      - Replace demonstrative + noun phrases (these molecules, this process, that entity,
        those particles) with the specific entity they refer to
      - Replace implicit references with the entities they refer to
      - Each claim must mention all relevant entities explicitly
      - Test: cover the preceding text — does the claim still make sense alone?

      MECHANISM CLAUSES — EXTRACT AS SEPARATE CLAIMS (CRITICAL):
      When a sentence contains a mechanism clause ("by VERB-ing ENTITY",
      "through ENTITY", "via ENTITY"), the mechanism is a separately
      verifiable assertion and MUST become its own claim. Do NOT let it
      dissolve into pronoun resolution for the clause that follows.
        Input: "X decreases Y by inhibiting enzyme E, which converts A into B."
        → [{"text": "X decreases Y"},
           {"text": "X inhibits enzyme E"},
           {"text": "Enzyme E converts A into B"}]
        WRONG — the mechanism claim evaporates:
        ❌ [{"text": "X decreases Y"},
            {"text": "Enzyme E converts A into B"}]
      The mechanism subject is the sentence subject (X), not the entity named
      in the clause. "X inhibits E" must be produced explicitly even when the
      next clause correctly resolves "this enzyme" to E.

      SET MEMBERSHIP ENUMERATIONS:
      When a sentence lists items belonging to a set ("the factors are A, B, C",
      "the members include X, Y, Z"), extract each item as an individual
      MEMBERSHIP claim using the singular form:
        ✅ "A is a factor of N."  (individual membership)
        ❌ "The factors of N are A."  (reads as exhaustive — ambiguous)

      Examples (given numbered sentences as input):
      - "[0] Entity A has property X, which has value Y."
        → [{"text": "Entity A has property X", "source_sentences": [0]},
            {"text": "Property X has value Y", "source_sentences": [0]}]
      - "[2] System S performs operation O. [3] This produces result R."
        → [{"text": "System S performs operation O", "source_sentences": [2]},
            {"text": "Operation O produces result R", "source_sentences": [2, 3]}]
      - "[5] The official languages of Switzerland are German, French, Italian, and Romansh."
        → [{"text": "German is an official language of Switzerland", "source_sentences": [5]},
            {"text": "French is an official language of Switzerland", "source_sentences": [5]},
            {"text": "Italian is an official language of Switzerland", "source_sentences": [5]},
            {"text": "Romansh is an official language of Switzerland", "source_sentences": [5]}]

      QUESTION CONTEXT (for disambiguation only): {question}
    template: |

      {numbered_sentences}

  decompose_general_compound:
    description: "Decompose compound general claim into atomic sub-claims."
    system_prompt: |
      Decompose a compound statement that lists multiple facts into
      independently verifiable atomic sub-claims.

      RULES:
      - Each sub-claim must be independently verifiable as true or false
      - Preserve all specific details (names, dates, titles, numbers) exactly
      - Each sub-claim must name the subject explicitly (no pronouns, no "it",
        no "this", no anaphoric references like "the concept" or "the element")
      - Each sub-claim must be SELF-STANDING: a reader with no context must
        understand what it asserts without seeing the parent statement
      - Enumerated items ("such as A, B, and C") become one sub-claim per item
      - Adjective lists ("X is A, B, and C") become one sub-claim per adjective,
        each repeating the full subject and predicate
      - When a claim identifies an entity AND lists its properties or uses,
        split the identity from each property/use
      - If the statement is already atomic, return it as a single sub-claim
      - Do NOT add information not present in the original statement

      RESTRICTIVE RELATIVE CLAUSES — DO NOT SPLIT (CRITICAL):
      A restrictive relative clause ("that", "who", "where" WITHOUT a
      preceding comma) defines or narrows the noun. Splitting it off
      creates a meaningless fragment. Return the whole claim as one sub-claim.
      This includes INFINITIVAL relative clauses ("the first/smallest X
      TO verb ...") — the infinitive phrase restricts which X is meant.
        Input: "1729 is the smallest number that can be written as the
        sum of two cubes in two different ways."
        Output: {"sub_claims": ["1729 is the smallest number that can be
        written as the sum of two cubes in two different ways."]}
        WRONG — "1729 is the smallest number" is meaningless alone:
        ❌ {"sub_claims": ["1729 is the smallest number.",
        "1729 can be written as the sum of two cubes in two different ways."]}
        Input: "42 is the first number to have both the properties of
        being a product of a prime number and a practical number."
        Output: {"sub_claims": ["42 is the first number to have both the
        properties of being a product of a prime number and a practical
        number."]}
        WRONG — "42 is the first number" is absurd without the restriction:
        ❌ {"sub_claims": ["42 is the first number.", "42 is a product of
        a prime number.", "42 is a practical number."]}
      Superlative/ordinal + restrictive clause is ALWAYS a single claim:
      "the smallest/largest/first X that Y" and "the first/smallest X to Y"
      both identify a specific entity — NEVER split.

      MATHEMATICAL EXPRESSIONS — DO NOT SPLIT (CRITICAL):
      When a statement describes a mathematical operation (sum, product,
      factorization) with multiple operands, it is a SINGLE claim. The
      operands collectively form one verifiable assertion.
        Input: "42 can be expressed as the sum of 1, 2, 3, 6, 7, and 14."
        Output: {"sub_claims": ["42 can be expressed as the sum of 1, 2, 3,
        6, 7, and 14."]}
        WRONG — individual operands are meaningless without the operation:
        ❌ {"sub_claims": ["42 can be expressed as the sum of 1.",
        "42 can be expressed as the sum of 2."]}

      SET MEMBERSHIP ENUMERATIONS (CRITICAL):
      When a statement enumerates items belonging to a set (factors, members,
      ingredients, causes, components, capitals, etc.), each sub-claim MUST
      assert individual membership using the SINGULAR form — do NOT repeat
      the plural subject per item:
        ✅ "Hydrogen is a component of water."
        ❌ "The components of water are hydrogen."
      The plural phrasing ("the components are X") implies an exhaustive
      listing and will be read as false. The singular phrasing ("X is a
      component of Y") correctly asserts individual membership.

      EXAMPLES:
      Input: "Iron is a metallic element with various uses, including in
      construction and as a catalyst in industrial processes."
      Output: {"sub_claims": ["Iron is a metallic element.", "Iron is used in
      construction.", "Iron is used as a catalyst in industrial processes."]}

      Input: "HSLA steels are essential in industries such as construction,
      automotive, and aerospace."
      Output: {"sub_claims": ["HSLA steels are essential in the construction
      industry.", "HSLA steels are essential in the automotive industry.",
      "HSLA steels are essential in the aerospace industry."]}

      Input: "The primary ingredients of concrete are cement, water,
      sand, and gravel."
      Output: {"sub_claims": ["Cement is a primary ingredient of concrete.",
      "Water is a primary ingredient of concrete.",
      "Sand is a primary ingredient of concrete.",
      "Gravel is a primary ingredient of concrete."]}

      Input: "The founding members of ASEAN were Indonesia, Malaysia,
      the Philippines, Singapore, and Thailand."
      Output: {"sub_claims": ["Indonesia was a founding member of ASEAN.",
      "Malaysia was a founding member of ASEAN.",
      "the Philippines was a founding member of ASEAN.",
      "Singapore was a founding member of ASEAN.",
      "Thailand was a founding member of ASEAN."]}

      Input: "The number 42 symbolizes a quirky, enigmatic, and often
      misunderstood concept."
      Output: {"sub_claims": ["The number 42 symbolizes a quirky concept.",
      "The number 42 symbolizes an enigmatic concept.",
      "The number 42 symbolizes an often misunderstood concept."]}

      WRONG (dangling reference — "the concept" is meaningless without parent):
      ❌ {"sub_claims": ["The number 42 symbolizes a concept.",
      "The concept is quirky.", "The concept is enigmatic."]}

      OUTPUT: JSON object with a "sub_claims" field containing an array of strings.
    template: |
      {statement}

  classify_atomicity:
    description: "Batch-classify claims as atomic or compound for decomposition gate."
    system_prompt: |
      For each numbered claim, determine whether it is ATOMIC (one verifiable
      fact) or COMPOUND (multiple independently verifiable facts).

      A claim is COMPOUND when it contains TWO OR MORE INDEPENDENTLY
      VERIFIABLE assertions — facts that can each be checked on their own
      and whose truth values are independent.

      Compound indicators:
      - A non-restrictive relative clause (", where", ", which") introduces
        a NEW verifiable assertion beyond the main clause
      - Two independent facts joined by "and", "but", "while" — where
        each side is separately verifiable (NOT conjunctions inside titles,
        proper nouns, or enumerations that form a single reference)
      - A broad fact PLUS a separate specific detail that could
        independently be true or false

      EXAMPLES OF COMPOUND CLAIMS:
      - "X is used in Y, where it serves as Z" → compound (X used in Y;
        it serves as Z — each independently verifiable)
      - "A is featured in B, where C's identifier spells 'D' in ASCII"
        → compound (A in B; C's ID → ASCII = D — two separate facts)
      - "P was founded in 1990 and has 50 million users" → compound
        (founding date; user count — independent facts)

      MATHEMATICAL EXPRESSIONS WITH MULTIPLE OPERANDS:
      When a claim describes a mathematical operation (sum, product,
      factorization) listing multiple operands, it is ALWAYS ATOMIC.
      The operands collectively form one verifiable assertion — splitting
      them produces false claims.
      - "42 can be expressed as the sum of 1, 2, 3, 6, 7, and 14"
        → ATOMIC (one sum, not six independent claims)
      - "The prime factorization of 42 is 2 × 3 × 7" → ATOMIC

      EXAMPLES OF ATOMIC CLAIMS:
      - "Water boils at 100°C at sea level" → atomic (single fact)
      - "The Eiffel Tower is located in Paris" → atomic (single fact)
      - "DNA is a double helix structure" → atomic (single characterization)
      - "1729 is the smallest number that can be written as the sum of
        two cubes in two different ways" → atomic (superlative + restrictive
        clause defines WHICH smallest number — inseparable)
      - "42 is the smallest number expressible as the sum of three cubes
        in two different ways" → atomic (same pattern — single identification)
      - "42 is the first number to have both the properties of being a
        product of a prime number and a practical number" → atomic
        (ordinal + infinitival restrictive clause — "to have both..."
        defines which first number; "both...and" is INSIDE the restriction,
        not an independent conjunction)
      - "The first president who served two non-consecutive terms was
        Grover Cleveland" → atomic (restrictive clause narrows the subject)
      - "A prime number that is also a Fibonacci number" → atomic
        (restrictive clause defines the category)
      - "In Douglas Adams' work, 42 is the Answer to the Ultimate Question
        of Life, the Universe, and Everything" → atomic (single fact about
        a number's role; "and" is part of the title, not a conjunction
        between independent assertions)
      - "In Python, the constant __debug__ is set to True in non-debug
        mode" → atomic (single fact: one constant, one value, one context)
      - "The Planck temperature can be equated to 42 on a logarithmic
        scale" → atomic (single approximate equivalence)

      RESTRICTIVE vs NON-RESTRICTIVE RELATIVE CLAUSES (CRITICAL):
      A RESTRICTIVE relative clause (using "that", "who", "where" WITHOUT
      a preceding comma) narrows or defines the noun it modifies. This
      includes INFINITIVAL relative clauses ("the first/smallest X TO verb
      ...") — the infinitive phrase restricts which X is meant. Removing
      it fundamentally changes WHAT the sentence is about, not just adding
      an independent fact. These are ALWAYS atomic.
        - "X is the Y that Z" → ATOMIC ("that Z" defines which Y)
        - "X is the first Y to Z" → ATOMIC ("to Z" defines which Y)
        - "X is the Y, which Z" → likely COMPOUND (", which Z" adds info)
      Superlative/ordinal + restrictive clause is a single identification
      claim — NEVER compound. This applies to BOTH finite ("that Y") and
      infinitival ("to Y") forms.

      A claim is ATOMIC when:
      - It makes exactly one verifiable assertion
      - Any subordinate clause merely restates or clarifies the same fact
      - A relative clause restricts or defines the noun (not comma-separated)
      - Removing any clause would change the core meaning rather than
        removing an independent fact
      - It states a single value, property, or role of an entity — even
        with qualifying context (language, work, domain, conditions)

      DEFAULT TO ATOMIC. Only classify as compound when you can clearly
      identify two independently verifiable facts. If in doubt, it is atomic.

      Output a JSON object:
        {"compound_indices": [list of integer indices that are compound]}
      If all claims are atomic, return {"compound_indices": []}
    template: |

      {numbered_claims}


  classify_math:
    description: "Batch classify statements as math or general domain."
    system_prompt: |
      Classify {count} statements as "math" or "general" domain.

      A statement is "math" if verifying it requires MATHEMATICAL REASONING:
      
      MATH DOMAIN (requires mathematical verification):
      - Equations, formulas, mathematical expressions
      - Number properties requiring calculation (prime, composite, divisible, etc.)
      - Mathematical operations (sum, difference, product, quotient, exponent, root)
      - Numerical relationships or identities
      - Theorems, proofs, and claims about mathematical structures
      - Properties of number systems, sets, or algebraic structures
        (closure, density, well-ordering, cardinality, measure)
      - Claims about formal properties of mathematical objects
        (convergence, continuity, computability, decidability, compactness)
      - Geometric properties requiring calculation
      - Unit conversions requiring calculation
      
      GENERAL DOMAIN (requires general knowledge or domain expertise):
      - Scientific facts with numbers that are looked up, not reasoned about:
        * Physical constants, chemical properties, biological measurements
      - Historical facts, dates, events, biographical information
      - Applications or uses of technologies/methods
      - Qualitative descriptions
      
      KEY DISTINCTION:
      - MATH: Verify by calculating, proving, or applying mathematical reasoning
      - GENERAL: Verify by looking up references or checking domain knowledge
      
      When in doubt: if the claim involves formal/structural properties of
      mathematical objects, classify as math.

      Return a JSON object with a "classifications" field containing an array of {count} entries.
      Each entry has:
      - "index": integer (the index shown in brackets, e.g., [0], [1], [2], ...)
      - "domain": string (either "math" or "general")
      - "reasoning": string (optional, one sentence: what verification method applies)

    template: |

      {statements}


  # Specificity-anchored verification: rejects claims that are generically true
  # but not specific to the question topic.  Catches "verification-resistant
  # generic truisms" that slip through standard binary truth checks.
  verify_specific:
    description: "Single-claim verification with topic-anchored specificity check."
    system_prompt: |
      You verify a single claim for truth, accuracy, and topic specificity.
      Output a JSON object with exactly two fields:
        "verdict": true or false
        "reasoning": explain in detail why the claim is true or false

      CLAIM FORMAT:
      The claim may be wrapped in a <topic name="..."> container that
      provides the subject area for disambiguation, with a <claim> tag
      holding the assertion you must evaluate.
      Evaluate ONLY the <claim> content. The topic attribute helps you
      understand what the claim refers to — it must NOT bias your
      evaluation toward acceptance.

      VERIFY FACTUAL CORRECTNESS:
      - Check whether the claim accurately represents reality
      - For scientific claims, consider precise definitions and measurements

      ALSO mark FALSE if the claim:
      - Contains speculation markers: "likely", "perhaps", "probably", "based on", "suggests"
      - Uses load-bearing possibility/conditionality modals: "can", "may", "might", or "could"
        where the modal is essential to accuracy — i.e., removing it would make the claim
        overstated or false (e.g., "X can contraindicate Y" — without "can", the claim would
        be false; the modal signals a conditional relationship, not an established fact)
        EXCEPTION: modals expressing an inherent capability or mechanism are fine
        (e.g., "TCP can retransmit packets" asserts a definite capability, not conditionality)
      - Makes inferences not directly stated in source material
      - Presents educated guesses as facts

      SPECIFICITY CHECK (apply to EVERY claim):
      - The claim must be SPECIFIC to the topic in the question, not just generically
        true about the broader domain or field
      - If the claim could equally apply to 3+ other technologies, concepts, or entities
        in the same field without modification, it is TOO GENERIC — mark FALSE
      - Vague characterizations that sound plausible but add no topic-specific information
        are FALSE (e.g., "improves performance and efficiency" for any technology)
      - Prefer rejecting vague claims over accepting plausible-sounding ones


      QUESTION CONTEXT: {cleaned_question}

      {parent_claim_context}
    template: |
      {claim_text}

  verify_batch_specific:
    description: "Multi-claim batch verification with topic-anchored specificity check."
    system_prompt: |
      You verify the given list of claims for truth, accuracy, and topic specificity.
      Output a JSON object with an "evaluations" field containing an array with one entry per claim in order.
      Each entry has exactly three fields:
        "index": integer (the numbered container tag, e.g., <0>, <1>, <2>, ...)
        "verdict": true or false
        "reasoning": explain in detail why the claim is true or false

      CLAIM FORMAT:
      Claims are nested inside <topic name="..."> containers that provide
      the subject area for disambiguation. Each claim is in a numbered
      container tag (<0>...</0>, <1>...</1>, etc.) inside its topic,
      with a <claim> tag holding the assertion you must evaluate.
      Treat each numbered container as an INDEPENDENT verification task.
      Evaluate ONLY the <claim> content. The topic attribute helps you
      understand what the claim refers to — it must NOT bias your
      evaluation toward acceptance.

      VERIFY FACTUAL CORRECTNESS:
      - Check whether each claim accurately represents reality
      - For scientific claims, consider precise definitions and measurements
      - A claim must be fully correct to be TRUE; partial truth or imprecision is FALSE
      - Show your work: explain your reasoning thoroughly

      ALSO mark FALSE if the claim:
      - Contains speculation markers: "likely", "perhaps", "probably", "based on", "suggests"
      - Uses load-bearing possibility/conditionality modals: "can", "may", "might", or "could"
        where the modal is essential to accuracy — i.e., removing it would make the claim
        overstated or false (e.g., "X can contraindicate Y" — without "can", the claim would
        be false; the modal signals a conditional relationship, not an established fact)
        EXCEPTION: modals expressing an inherent capability or mechanism are fine
        (e.g., "TCP can retransmit packets" asserts a definite capability, not conditionality)
      - Makes inferences not directly stated in source material
      - Presents educated guesses as facts

      SPECIFICITY CHECK (apply to EVERY claim):
      - Each claim must be SPECIFIC to the topic in the question, not just generically
        true about the broader domain or field
      - If a claim could equally apply to 2+ other technologies, concepts, or entities
        in the same field without modification, it is TOO GENERIC — mark FALSE
      - Vague characterizations that sound plausible but add no topic-specific information
        are FALSE (e.g., "improves performance and efficiency" for any technology)
      - Prefer rejecting vague claims over accepting plausible-sounding ones


      Some claims may include a [PARENT CLAIM: ...] annotation on the line below.
      This is the original compound claim the sub-claim was extracted from.
      Use it for context when verifying the sub-claim, but verify ONLY the sub-claim itself.

      You MUST return exactly {claim_count} evaluations, one per numbered claim so not no indices repeat.

      QUESTION CONTEXT: {cleaned_question}
    template: |

      {numbered_claims}


  filter_negatives:
    description: "Identify and remove universal negatives from verified facts."
    system_prompt: |
      You are given a numbered list of verified claims. Your ONLY task is to identify
      which claims are UNIVERSAL NEGATIVES and return their indices.

      A UNIVERSAL NEGATIVE is a claim that asserts a subject has NO properties,
      significance, or relevance across an ENTIRE domain. These are unfalsifiable
      because proving the complete absence of all possible properties is impossible.

      UNIVERSAL NEGATIVES (return their indices):
      - "X has no mathematical significance"
      - "X does not hold any inherent scientific significance"
      - "X does not possess any unique or exceptional mathematical properties"
      - "X is not particularly special or significant in the world of Y"
      - "Outside of context A, X does not hold any significance"

      NOT universal negatives (do NOT return their indices):
      - "44 is not a prime number" — specific falsifiable claim about one property
      - "44 is not divisible by 5" — specific falsifiable arithmetic claim
      - "X is a relatively ordinary integer" — subjective but not claiming total absence
      - "44 is an even number" — positive factual claim
      - "43 does not appear in the Fibonacci sequence" — specific falsifiable claim

      The key distinction: a universal negative claims TOTAL ABSENCE of significance
      or properties across a whole domain. A specific negative denies ONE particular
      property and is perfectly fine.

      QUESTION CONTEXT (for reference only): {question}

      Return a JSON object:
        {{"negative_indices": [list of integer indices of universal negatives]}}

      If NO claims are universal negatives, return {{"negative_indices": []}}
    template: |

      {numbered_facts}

  strip_rejected:
    description: "Remove rejected claims from an answer while preserving passage structure."
    system_prompt: |
      You are given an answer and a list of REJECTED CLAIMS that were independently
      verified as false or unsupported. Your task: rewrite the answer removing any
      content that states or implies any of the rejected claims.

      REJECTED CLAIMS:
      {rejected_claims_list}

      RULES:
      - Remove sentences or clauses that directly state a rejected claim
      - Remove supporting sentences that exist solely to set up or elaborate on
        a rejected claim — if a sentence only makes sense as context for a
        rejected claim, remove it
      - When removal creates an awkward transition, smooth the surrounding text
        with minimal edits (conjunctions, sentence joins) — do NOT rewrite
        surviving paragraphs
      - Do NOT add any new content, facts, or elaboration
      - Do NOT rephrase surviving content beyond minimal transition smoothing
      - If removing a claim leaves an empty or single-sentence paragraph, merge
        the remaining sentence into an adjacent paragraph
      - If no rejected claims appear in the answer, return the answer unchanged

      QUESTION CONTEXT: {question}
    template: |

      {original_answer}

  audit_contamination:
    description: "Check combined answer for rejected claim contamination."
    system_prompt: |
      You are checking a combined answer for ONE type of error.

      CONTAMINATION: The claims below were independently verified as false.
      Check whether the answer DIRECTLY STATES any of them.

      MATCHING RULES:
      - A sentence is contaminated ONLY if it asserts the same core claim
        as a rejected item — same subject, same predicate, same relationship
      - Superficial word overlap is NOT contamination. "Metformin reduces
        glucose" is NOT contaminated by "Metformin reduces appetite" — they
        share a subject but assert different predicates.
      - When in doubt, do NOT flag — false positives destroy verified content

      REJECTED CLAIMS:
      {rejected_claims}

      QUESTION CONTEXT: {question}

      Return a JSON object:
      {
        "action": "accept" if contaminated is empty, "revise" otherwise,
        "contaminated": [rejected claim texts found in the answer],
        "clean": true if contaminated is empty,
        "target": human-readable description of what to remove (empty string if clean)
      }
    template: |

      {artifact}

  combine_passages:
    description: "Write answer from verified facts, using 3 passages as style scaffold."
    system_prompt: |
      You are given {fact_count} VERIFIED FACTS and 3 REFERENCE PASSAGES that
      answer this question: {question}.

      Write a well-structured answer using ONLY the verified facts below. The
      3 reference passages are provided for structure and style guidance only —
      borrow their organization and tone, but include ONLY content that appears
      in the verified fact list.

      COMPLETENESS (MANDATORY — {fact_count} facts):
      Include ALL {fact_count} facts. Every fact was independently verified and
      survived deduplication — omitting any is a critical error. If you cannot
      find a natural place for a fact, add a brief standalone sentence rather
      than drop it.

      ORGANIZE BY TOPIC:
      Group facts by domain (e.g. mechanism of action, contraindications,
      pharmacology). Write one section per domain. Use the reference passages
      to decide grouping and ordering.

      RULES:
      - Add NOTHING beyond what is listed in the verified facts
      - NEVER FABRICATE CONNECTIONS: if two facts appear adjacent, do NOT invent
        a causal or explanatory link unless it is explicitly stated in a fact
      - Do NOT copy unverified claims from the reference passages
      FORBIDDEN CLAIMS:
      The claims below were independently verified as FALSE. You MUST NOT assert,
      imply, paraphrase, or derive any of them. If a verified fact appears to
      support a forbidden claim, include the fact verbatim but do NOT draw the
      forbidden inference.
      CITATION (MANDATORY):
      End every factual sentence with a bracketed list of the verified fact
      indices it draws from. Format: [Fact N] for one fact, [Fact N, M] for
      multiple facts in the same sentence.

      Examples:
        The compound inhibits the target enzyme via competitive binding [Fact 2].
        Severe renal impairment is a primary contraindication [Fact 4, 11].

      Rules:
      - Every factual sentence MUST have at least one citation
      - A sentence with NO citation will be treated as unsupported and removed
      - Every verified fact must be cited at least once across the full answer
      - Use the index numbers shown in the VERIFIED FACTS list (1-based)
      - Do NOT cite FORBIDDEN CLAIM indices — they are not part of the fact list
      - PRESERVE EPISTEMIC STRENGTH: if a fact uses "can", "may", "might", or "could"
        to express a conditional or context-dependent relationship, you MUST preserve
        that modal — do NOT harden "X can Y" into "X Ys" or "X is Y"
      - Boring correctness over eloquence
      - No meta commentary, no "In conclusion", no filler
      - Do NOT add a document title, label, or header before the first section (e.g. no "Verified Output", "Answer:", or similar prefix)
      - Citations MUST use square brackets: [Fact N] or [Fact N, M] — parentheses (Fact N) are FORBIDDEN
    template: |
      VERIFIED FACTS:
      {numbered_facts}

      FORBIDDEN CLAIMS (verified FALSE — never assert, imply, or derive):
      {forbidden_claims}

      === REFERENCE PASSAGE 1 (style guide only) ===
      {passage_0}

      === REFERENCE PASSAGE 2 (style guide only) ===
      {passage_1}

      === REFERENCE PASSAGE 3 (style guide only) ===
      {passage_2}


  insert_missing:
    description: "Insert missing verified facts into the answer."
    system_prompt: |
      You are given an answer and a list of verified facts that are NOT yet
      represented in the answer. Insert each missing fact into the section
      where it topically belongs.

      About: {question}

      RULES:
      - Add one sentence per missing fact, placed in the existing section
        where it topically belongs
      - Each added sentence MUST end with its citation: [Fact N]
      - If two missing facts express the same idea, combine into one sentence: [Fact N, Fact M]
      - Do NOT modify, remove, or rephrase any existing content
      - Do NOT add headings, preamble, or explanation
      - Do NOT create new ### sections — insert only into existing sections
      - If a fact is already stated verbatim in the answer, skip it

      RETURN THE COMPLETE ANSWER (CRITICAL):
      Your output MUST contain EVERY ### section from the input, in
      the same order, with all existing sentences preserved. Even if
      a missing fact only needs to be inserted into one section, you
      MUST still reproduce every other section verbatim. Returning
      only the modified section is a critical error — the output
      replaces the entire answer.
    template: |
      CURRENT ANSWER:
      {artifact}

      MISSING FACTS TO INSERT:
      {uncited_facts}

  remove_contamination:
    description: "Remove contaminated claims identified by audit."
    template: |
      The audit found the following contaminated claims in the answer:

      CONTAMINATED (rejected claims that survived — must be removed):
      {assess_target}

      CURRENT ANSWER:
      {artifact}

      Remove ONLY the specific contaminated sentences listed above.
      - Delete the sentence(s) that directly assert a contaminated claim
      - If only a clause within a sentence is contaminated, remove that clause
        and keep the rest
      - Do NOT remove sentences that merely share vocabulary with a
        contaminated claim but assert a different fact
      - PRESERVE all [Fact N] and [Fact N, M] citations
      - Do NOT add any new content
      - Return the COMPLETE revised answer
      - Output the revised answer text only — no preamble or explanation

  assess_synthesis:
    description: "Structural quality gate — paragraph coherence and sentence flow only."
    system_prompt: |
      You are reviewing a SYNTHESIZED ANSWER about: {question}.

      Your ONLY job is STRUCTURAL QUALITY. Redundancy and fact coverage
      are handled by separate steps — do NOT check for duplicates or
      missing facts.

      Check these three things:

      1. STRUCTURE: Is the answer organized into coherent paragraphs that
         group related information? Scattered facts dumped in no logical
         order is the most important defect to fix.
      2. FLOW: Do sentences within each paragraph follow a logical sequence?
         Abrupt topic jumps mid-paragraph indicate poor structure.
      3. ORPHANS: One-liner sentences that belong in an earlier paragraph
         but were left stranded at the end.

      PRESERVE:
      - All existing ### section headings — do NOT merge or remove sections
      - All existing [Fact N] citations — do NOT add, remove, or renumber

      ACCEPT THRESHOLD: Accept the answer if paragraphs are coherent and
      sentences flow logically, even if minor improvements are possible.
      Only choose "revise" for clear structural defects — not stylistic
      preferences or minor wording.

      SYNTHESIZED ANSWER:
      {artifact}

      Return JSON:
        action: "revise" or "accept"
        issues: array of specific issues found (empty if accepting)
        reason: brief explanation
        target: what to fix (empty string if accept)
    template: |
      Question being answered: {question}

  revise_synthesis:
    description: "Fix specific issues identified by quality gate, including reorganization."
    template: |
      Fix the following issues in the answer:
      {assess_reason}
      {assess_target}

      CURRENT ANSWER:
      {artifact}

      RULES:
      - Fix the listed issues — you MAY reorder sentences and move them
        between paragraphs to improve logical grouping and flow
      - SENTENCE VARIETY: If multiple consecutive sentences start with the
        same subject, vary the openings without changing the meaning
      - PRESERVE all ### section headings exactly as they appear — do NOT
        merge, rename, or remove sections
      - PRESERVE all [Fact N] and [Fact N, M] citations exactly as they
        appear — every citation in the input must appear in the output
      - Do NOT add new factual claims or remove existing ones
      - Do NOT rephrase sentences beyond what is needed for flow
      - Return the COMPLETE revised answer
      - No preamble, no closing summary

  assess_flow:
    description: "Flow-only quality gate — sentence sequencing and referential continuity within sections."
    system_prompt: |
      You are reviewing a SYNTHESIZED ANSWER about: {question}.

      Your ONLY job is FLOW QUALITY WITHIN EACH SECTION.

      Check only:
      1. SEQUENCE: do adjacent sentences follow a logical progression?
      2. REFERENTS: are pronouns and phrases like "this/these" clearly anchored?
      3. LOCAL ORDER: are cause/effect or definition/detail pairs in a sensible order?

      DO NOT CHECK:
      - duplicates or redundancy
      - missing facts or coverage
      - section placement/orphans across sections
      - citation correctness beyond preserving existing citations

      PRESERVE:
      - All existing ### section headings
      - All existing [Fact N] citations

      ACCEPT THRESHOLD: Accept if flow is understandable and only minor stylistic
      improvements remain.

      SYNTHESIZED ANSWER:
      {artifact}

      Return JSON:
        action: "revise" or "accept"
        issues: array of specific issues found (empty if accepting)
        reason: brief explanation
        target: concrete local flow edits to apply (empty string if accept)
    template: |
      Question being answered: {question}

  revise_flow:
    description: "Apply flow-only edits from assess_flow while preserving structure and citations."
    template: |
      Fix the following FLOW issues in the answer:
      {assess_reason}
      {assess_target}

      CURRENT ANSWER:
      {artifact}

      SECTION PRESERVATION (CRITICAL):
      You MUST return every ### section heading that exists in the input.
      Never drop or omit a section. The output MUST contain the same
      set of ### headings in the same order.

      RULES:
      - Apply only the requested flow fixes
      - You MAY reorder sentences within a section
      - You MAY make minimal connective rephrasing for coherence
      - Do NOT move sentences between sections
      - Do NOT add or remove factual claims
      - PRESERVE all [Fact N] and [Fact N, M] citations exactly
      - Return the COMPLETE revised answer
      - No preamble, no closing summary
      - HEADING LEVELS: Use ONLY ### headings — exactly as they appear in the
        input. Do NOT add #### sub-headings or convert any section to a subsection.

  assess_placement:
    description: "Placement-only quality gate — section membership and orphan sentence placement."
    system_prompt: |
      You are reviewing a SYNTHESIZED ANSWER about: {question}.

      Your ONLY job is SECTION PLACEMENT QUALITY.

      Check only:
      1. WRONG SECTION: sentence belongs to a different existing section.
      2. ORPHANS: sentence is stranded and should be moved to an earlier/later section.
      3. MIXED CLUSTERS: a section includes sentences whose topic clearly belongs elsewhere.
      4. TOPIC SCOPE: for each sentence, ask: does its primary assertion
         belong to the topic named by its section heading? A sentence whose
         subject matter is categorically distinct from its section heading
         is misplaced — it belongs in the section whose heading matches its
         topic. Flag the mismatch and name the correct target section.

      DO NOT CHECK:
      - sentence-level flow inside a section
      - redundancy/duplicates
      - missing facts/coverage
      - citation correctness beyond preserving existing citations

      PRESERVE:
      - All existing ### section headings — do NOT merge/rename/remove sections
      - All existing [Fact N] citations

      ACCEPT THRESHOLD: Accept if only weakly debatable placements remain.
      Revise only for clear placement defects.

      SYNTHESIZED ANSWER:
      {artifact}

      Return JSON:
        action: "revise" or "accept"
        issues: array of specific issues found (empty if accepting)
        reason: brief explanation
        target: explicit move instructions (empty string if accept)
    template: |
      Question being answered: {question}

  revise_placement:
    description: "Apply section placement moves from assess_placement while preserving facts and citations."
    template: |
      Fix the following PLACEMENT issues in the answer:
      {assess_reason}
      {assess_target}

      CURRENT ANSWER:
      {artifact}

      RULES:
      - Apply only the requested placement fixes
      - You MAY move sentences between existing sections
      - You MAY reorder sentences after moves for readability
      - Do NOT add, remove, merge, rename, or reorder section headings
      - Do NOT add or remove factual claims
      - PRESERVE all [Fact N] and [Fact N, M] citations exactly

      CONTENT INTEGRITY (CRITICAL):
      - You MUST NOT create new sentences or new [Fact N] citations
      - You MUST NOT create new sections that do not exist in the input
      - Only move existing sentences (with their citations) between
        existing sections
      - If the input is missing content you expect, that is outside
        your scope — work only with what is present

      - Return the COMPLETE revised answer
      - No preamble, no closing summary

  organize_facts:
    description: "Organize verified facts into a structured JSON outline for coherent answer synthesis."
    system_prompt: |
      You organize verified facts into a coherent outline for answering a question.
      You receive a question and a numbered list of verified facts.
      Your task: assign every fact index to a logical section, ordered for
      natural reading flow.

      Rules:
      - Every fact index MUST appear in exactly one section
      - Order facts within each section for logical flow
        (general → specific, cause → effect, mechanism → consequence)
      - Choose section headings that match the question's natural structure
      - 2-5 sections typically suffice
      - Do NOT invent facts — only reference indices from the list
      - Do NOT leave any fact index unassigned

      Return valid JSON only, no preamble:
      {{"sections": [{{"heading": "Section Title", "fact_indices": [1, 5, 3, 12]}}]}}
    template: |
      QUESTION: {question}

      VERIFIED FACTS:
      {verified_facts}

  critique_outline:
    description: "Evaluate whether the fact outline coherently organizes all facts for the question."
    system_prompt: |
      You are evaluating a JSON outline that assigns verified facts to sections
      for answering: {question}

      STEP 1 — COUNT COVERAGE:
      Compare the fact indices in the outline against the verified facts list.
      Identify any MISSING indices (present in verified facts but absent from
      all sections) and any DUPLICATED indices (appearing in more than one
      section).

      STEP 2 — EVALUATE (in this order):
      1. COMPLETENESS: Are ≥90% of fact indices assigned? If so, completeness
         is acceptable — do NOT revise solely for a small number of missing
         indices.
      2. GROUPING: Are related facts grouped together?
      3. ORDERING: Within each section, logical sequence?
      4. SECTIONS: Appropriate headings for the question?

      DECISION:
      - "accept" if ≥90% of indices are assigned AND grouping/ordering are
        reasonable. Minor imperfections are fine.
      - "revise" if <90% of indices are assigned, OR grouping is seriously
        wrong. When revising, you MUST list the exact missing indices in
        the "target" field so the reviser knows what to add.

      OUTLINE TO EVALUATE:
      {artifact}

      Return JSON:
        action: "revise" or "accept"
        issues: array of specific issues found (empty if accepting)
        reason: brief explanation
        target: if revising, list missing indices like "Missing indices: [3, 17, 22] — add to appropriate sections". Empty string if accepting.
    template: |

      VERIFIED FACTS (for reference — check all indices are assigned):
      {verified_facts}

  revise_outline:
    description: "Revise the fact outline based on critic feedback."
    system_prompt: |
      You are a JSON outline reviser. Return valid JSON only — no preamble, no explanation.
    template: |
      CRITIC FEEDBACK:
      Reason: {assess_reason}
      Target: {assess_target}

      CURRENT OUTLINE:
      {artifact}

      VERIFIED FACTS (for reference — read facts at the missing indices):
      {verified_facts}

      INSTRUCTIONS:
      - If the critic lists missing indices, read the corresponding facts
        above and insert each index into the section where it topically fits
      - If the critic flags grouping or ordering issues, reorganize accordingly
      - Do NOT remove any existing indices — only add or move
      - Return the COMPLETE revised outline as valid JSON
      - Format: {{"sections": [{{"heading": "...", "fact_indices": [...]}}]}}

  coverage_revise_outline:
    description: "Insert missing facts into outline using programmatically detected gaps."
    system_prompt: |
      You are revising a JSON outline to improve fact coverage.
      The system has detected exactly which verified facts are missing from the
      outline. Your job: read each missing fact and insert its index into the
      most appropriate existing section. If no existing section fits, create a
      new section with a clear heading.

      Return valid JSON only — no preamble, no explanation.
    template: |
      QUESTION: {question}

      CURRENT OUTLINE:
      {artifact}

      MISSING FACTS ({missing_count} of {total_facts} not yet assigned):
      {missing_facts}

      ALL VERIFIED FACTS (for context when deciding placement):
      {verified_facts}

      INSTRUCTIONS:
      - Insert each missing index into the section where it topically belongs
      - Read the missing fact text to decide which section fits
      - If a fact does not fit any existing section, create a new section
      - Do NOT remove any existing indices — only add
      - Return the COMPLETE revised outline as valid JSON
      - Format: {{"sections": [{{"heading": "...", "fact_indices": [...]}}]}}

  critique_outline_quality:
    description: "Evaluate outline grouping, ordering, and section headings (coverage verified programmatically)."
    system_prompt: |
      You are evaluating a JSON outline for answering: {question}

      Fact coverage has been verified programmatically — do NOT check whether
      all indices are assigned. Focus ONLY on qualitative organization:

      1. OVERLAP: Do any two sections cover the same topic or theme? Sections
         whose headings or fact content overlap substantially MUST be merged.
         This is the most important defect — overlapping sections cause
         repetition in the final prose.
      2. GROUPING: Are related facts grouped together? Facts about the same
         topic, mechanism, or category should share a section.
      3. ORDERING: Within each section, do facts follow a logical sequence?
         (general → specific, cause → effect, definition → example)
      4. SECTIONS: Are section headings clear and appropriate for the question?
         Would a reader understand the answer's structure from the headings alone?

      If the outline is well-organized, choose "accept".
      If grouping or ordering has clear problems, choose "revise" and give
      specific, actionable feedback (e.g., "Move facts [5, 8] from
      Contraindications to Mechanism of Action — they describe how the drug
      works, not when to avoid it").

      OUTLINE TO EVALUATE:
      {artifact}

      Return JSON:
        action: "revise" or "accept"
        issues: array of specific issues found (empty if accepting)
        reason: brief explanation
        target: what to fix (empty string if accept)
    template: |

      VERIFIED FACTS (for reference — to understand what each index represents):
      {verified_facts}

  revise_outline_quality:
    description: "Revise outline grouping and ordering based on quality critique."
    system_prompt: |
      You are a JSON outline reviser. Return valid JSON only — no preamble, no explanation.
    template: |
      QUALITY FEEDBACK:
      Reason: {assess_reason}
      Target: {assess_target}

      CURRENT OUTLINE:
      {artifact}

      VERIFIED FACTS (for reference):
      {verified_facts}

      INSTRUCTIONS:
      - Fix the grouping or ordering issues identified above
      - You may move indices between sections or reorder within sections
      - Do NOT remove any indices — all must remain assigned
      - Return the COMPLETE revised outline as valid JSON
      - Format: {{"sections": [{{"heading": "...", "fact_indices": [...]}}]}}

  synthesize_from_outline:
    description: "Write coherent prose from an approved fact outline."
    system_prompt: |
      You write a well-organized answer from a pre-approved section outline
      and verified facts. The outline assigns specific fact indices to
      sections — follow it exactly.

      About: {question}

      MANDATORY — CITE EVERY FACT:
      Every sentence that states a fact MUST end with its citation inline.
      No exceptions. A sentence without a citation will be treated as
      unsupported and removed.

        [Fact N]       — one fact per sentence
        [Fact N, M]    — two facts combined into one sentence

      Examples:
        Metformin inhibits hepatic gluconeogenesis [Fact 3].
        It suppresses PEPCK and G6Pase, the key enzymes in glucose
        production [Fact 5, Fact 7].
        Severe renal impairment is a primary contraindication [Fact 12].

      MERGE EQUIVALENT FACTS (CRITICAL):
      Many facts express the same claim in different words.
      When facts in a section describe the same mechanism, property, or
      relationship, write ONE sentence citing ALL their indices.
        Example: [Fact 1] "reduces glucose production" and
        [Fact 13] "inhibits gluconeogenesis" → ONE sentence [Fact 1, 13].
      Do NOT write separate sentences for semantically equivalent facts.

      CITATION LIMIT:
      Cite at most 4 fact indices per sentence. If more than 4 facts express
      the same claim, pick the 4 most specific indices. Write additional
      equivalent facts as a separate sentence if needed.
      Do NOT generate sequential ranges of fact numbers — each cited index
      must be deliberately chosen because that specific fact supports the
      sentence.

      SENTENCE VARIETY (CRITICAL):
      Do NOT start 3+ consecutive sentences with the same subject.
      Vary openings: use pronouns, dependent clauses, or topic phrases.

      STRUCTURE:
      - Write one ### Section Title heading per outline section
      - Use the outline's section order — do not reorder or merge sections
      - Include ALL facts assigned to each section — do not skip any

      SECTION COMPLETENESS (CRITICAL):
      You MUST produce exactly one ### heading for EVERY section in the
      outline, in the same order. If the outline has 3 sections, the output
      MUST have exactly 3 ### headings. Dropping or skipping a section is
      a critical error.

      SECTION BOUNDARIES (CRITICAL):
      For each section, ONLY write about the facts whose indices appear in
      that section's fact_indices. Do NOT reference or discuss facts assigned
      to other sections. If a fact feels relevant to multiple sections, it
      belongs ONLY in the section where the outline placed it.

      FORMATTING:
      - Prose paragraphs for explanations, mechanisms, narrative flow
      - Bullet lists for enumerations, contraindications, side effects,
        named lists of items
      - **Bold** key terms, entity names, and important values on first mention
      - Smooth transitions within sections

      CONSTRAINTS:
      - Combine closely related facts into flowing sentences where natural
      - Do NOT add information beyond what the facts state
      - Do NOT repeat facts across sections
      - Do NOT repeat the same paragraph or passage within a section
      - Do NOT include meta-commentary, structural narration, or transition
        announcements (e.g., "The next section covers...", "Now follows...",
        "The first paragraph of X section now follows:")
      - No preamble, no closing summary — output the answer text only
    template: |
      APPROVED OUTLINE:
      {outline}

      VERIFIED FACTS:
      {verified_facts}

  critique_redundancy:
    description: "Identify local repetition (within-sentence and consecutive restatement) in a synthesized answer."
    system_prompt: |
      You are reviewing a synthesized answer for LOCAL REDUNDANCY only.
      The answer may have section headings (### ...).

      SCOPE: You identify content to DELETE. Do NOT suggest merging,
      reordering, or restructuring sections — structure is handled
      separately. Only specify what to remove.

      PREREQUISITE — Apply these filters BEFORE flagging any redundancy:

      1. SAME SUBJECT ≠ SAME CLAIM:
         Two sentences sharing a subject are duplicates ONLY if they
         assert the SAME predicate. Different predicates about the same
         entity are independent facts — NEVER flag them.
           DUPLICATE: "reduces hepatic glucose production" vs "inhibits
             gluconeogenesis" → identical mechanism, different words
           NOT DUPLICATE — different predicates, keep both:
           - "contraindicated in renal impairment" vs "contraindicated
             in alcoholism"
           - "reduces glucose production" vs "enhances insulin sensitivity"

      2. ELABORATION ≠ RESTATEMENT:
         A sentence that explains HOW or WHY a preceding claim holds
         is elaboration, not redundancy. The specific mechanism or
         enzyme target is NEW information even when it relates to the
         same general effect.
           NOT redundant: "reduces glucose production" followed by
             "inhibits PEPCK, which is crucial for gluconeogenesis"
             → second sentence names the enzyme mechanism
           NOT redundant: "is a contraindication" followed by "metformin
             can accumulate" → second explains the pharmacokinetic reason

      3. DEFINITION ≠ SEVERITY:
         A sentence defining what a condition IS (pathophysiology) is
         not redundant with a sentence about how SEVERE it is.
           NOT redundant: "lactic acidosis is life-threatening" vs
             "lactic acidosis is characterized by accumulation of
             lactic acid" → severity assessment vs biochemical definition

      When in doubt, keep both — false deletions destroy verified content.

      With those prerequisites in mind, check for these problems in order
      of severity:

      0. PARAGRAPH DUPLICATION: Two consecutive paragraphs within the same
         section convey the same information in similar or identical words.
         Delete the second paragraph entirely — this is the most severe defect.
      1. WITHIN-SENTENCE DUPLICATION: A single sentence or clause pair says
         the same thing twice using different words. Example: "reduces the
         liver's glucose production and inhibits gluconeogenesis" — both
         clauses mean the same thing. One clause must be deleted.
      2. CONSECUTIVE RESTATEMENT: A sentence restates the idea from the
         immediately preceding sentence. Example:
           "Metformin suppresses hepatic glucose production."
           "It reduces the amount of glucose the liver releases."
         These are the same claim — delete one.
      3. CIRCULAR SENTENCES: A sentence adds no information beyond what the
         surrounding text already stated.

      IMPORTANT: Do NOT flag cross-section overlap in this step.
      Cross-section deduplication is handled by a separate reviewer.

      For each redundancy found:
      - Quote BOTH instances (the kept one and the deleted one)
      - State which to KEEP and which to DELETE
      - If within-sentence, quote the full sentence and mark the clause
        to delete

      Be precise: only flag content where the SAME claim is stated twice.
      Two sentences about the same topic that assert different predicates
      are NOT redundant — recheck the prerequisite filters above before
      flagging. Prefer keeping the more specific or technical version.

      LIMIT: Report at most 5 redundancies per review — pick the most
      severe. This keeps reviser instructions focused and executable.

      ACCEPT THRESHOLD: If the only remaining issues are minor phrasing
      differences that do not confuse a reader, choose "accept". The goal
      is to eliminate clear repetition — not to polish prose to perfection.

      If the answer is free of meaningful repetition, choose "accept".

      ANSWER TO REVIEW:
      {artifact}

      Return JSON:
        action: "revise" or "accept"
        repeated_items: array of specific redundancies found (empty if accepting)
        reason: brief explanation
        target: concrete deletion instructions for the reviser — for each
          redundancy, state the exact sentence or clause to delete
          (empty string if accept)
    template: |
      Question being answered: {question}

  critique_redundancy_global:
    description: "Identify cross-section and long-range semantic duplication in a synthesized answer."
    system_prompt: |
      You are reviewing a synthesized answer for GLOBAL REDUNDANCY only.
      The answer may have section headings (### ...).

      SCOPE: identify repeated ideas spanning paragraph boundaries —
      whether intra-section (two paragraphs under the same heading) or
      cross-section. The local reviewer handles sentence pairs; your job
      is everything above that level.

      SAME SUBJECT ≠ SAME CLAIM (CRITICAL):
      Two sentences that name the same subject are NOT duplicates unless
      they assert the SAME predicate — the same mechanism, property, or
      relationship. Different facts about the same entity are independent
      and MUST both survive.
        DUPLICATE: "reduces hepatic glucose production" vs "inhibits
          gluconeogenesis" → same mechanism, different words → delete one
        NOT duplicate: "reduces hepatic glucose production" vs "improves
          insulin sensitivity in skeletal muscle" → different mechanisms
        NOT duplicate: "is contraindicated in renal impairment" vs
          "is cleared by the kidneys" → contraindication vs pharmacokinetics
      When in doubt, keep both — false deletions destroy verified content.

      PREDICATE EQUIVALENCE TEST (MANDATORY for every proposed pair):
      Before flagging any pair as redundant, complete this sentence:
        "Both sentences assert: [one specific shared predicate]."
      If you cannot fill in a SINGLE PREDICATE that both sentences
      state — not just a shared subject or topic — they are NOT
      duplicates. Drop the pair from your list.

      PASS — same predicate, different words:
        A: "reduces the liver's production of glucose"
        B: "inhibits hepatic gluconeogenesis"
        ✅ "Both assert: metformin reduces liver glucose output"

      FAIL — same subject, different predicates:
        A: "improves insulin sensitivity in peripheral tissues"
        B: "is primarily used to treat type 2 diabetes"
        ❌ Cannot complete — insulin sensitivity mechanism ≠
           clinical indication. Drop this pair.

      FAIL — same topic, different conditions:
        A: "contraindicated in liver disease and heart failure"
        B: "patients with lactic acidosis should be monitored"
        ❌ Cannot complete — listing contraindication conditions ≠
           monitoring guidance for a different condition.

      SECTION PRESERVATION (HIGHEST PRIORITY):
      You MUST NEVER flag an entire section for deletion. This is the
      single most important rule. Each ### section was created from a
      distinct group of verified facts. Even when one sentence overlaps
      with another section, the remaining sentences contain unique,
      independently verified content that exists NOWHERE else.

      CORRECT: "Delete the sentence 'X increases glucose uptake in
        muscles [8, 9]' from Effects section — same claim appears in
        Mechanism section as 'increase in glucose uptake [35, 39]'"
      WRONG: "Delete ### Effects on Insulin Sensitivity section"
        — this destroys unique facts [2, 3] about insulin sensitivity
        that appear ONLY in that section

      When cross-section overlap exists, flag the SPECIFIC SENTENCE
      that duplicates content in another section. Keep the version
      with more specific or better-cited content.

      EMPTY SECTION GUARD (ABSOLUTE):
      Before returning, count how many sentences each section would
      retain after your proposed deletions. If ANY section would have
      zero sentences remaining, you MUST change your action to
      "accept" — no exceptions. Emptying a section destroys unique
      verified facts that exist nowhere else in the answer.

      DELETION DIRECTION (for cross-section duplicates):
      When the same claim appears in a SMALL section (≤3 sentences)
      and a LARGE section (≥4 sentences), you MUST delete from the
      LARGE section. The small section needs every sentence.
      This overrides "keep the more specific version."
      Count sentences in each section BEFORE deciding direction.

      Check for:
      1. INTRA-SECTION PARAGRAPH DUPLICATION: two paragraphs under the
         same heading convey the same information in similar or different
         words. Delete the less precise paragraph entirely.
      2. CROSS-SECTION DUPLICATION: the same claim appears in two sections
         using different wording. Both sentences must assert the same
         predicate — not merely share the same subject.
      3. LONG-RANGE RESTATEMENT: a later paragraph repeats an earlier idea
         without adding new information.
      4. DUPLICATE CATEGORICAL CLUSTERS: a category of claims (risks,
         prerequisites, examples, properties) restated in multiple places
         without adding new information each time.

      For each redundancy found:
      - Quote BOTH instances (the kept one and the deleted one)
      - State which to KEEP and which to DELETE
      - Prefer keeping the sentence that is more specific and better cited

      LIMIT: Report at most 5 redundancies per review.

      ACCEPT THRESHOLD: Accept if sections are mostly distinct and only
      minor thematic overlap remains. Sections that discuss the same
      subject from different angles (mechanism vs contraindications vs
      pharmacokinetics) are NOT redundant.

      ANSWER TO REVIEW:
      {artifact}

      VALIDATION (do this LAST, before returning):
      Review each entry in repeated_items. If the shared_predicate
      is vague (e.g. "both about metformin", "both discuss lactic
      acidosis") or names a topic rather than a specific assertion,
      the pair is NOT a valid duplicate — remove it from your list.
      If removing invalid pairs leaves an empty list, change action
      to "accept".

      Return JSON:
        action: "revise" or "accept"
        repeated_items: array of objects, one per redundancy found
          (empty array if accepting). Each object:
          - kept: exact sentence to KEEP (quote from the answer)
          - deleted: exact sentence to DELETE (quote from the answer)
          - shared_predicate: one phrase completing
            "Both sentences assert: ___"
        reason: brief explanation
        target: (MANDATORY when action is "revise") concrete deletion
          instructions — state the exact sentence to delete for each
          redundancy. The reviser receives ONLY reason + target, so
          ALL actionable instructions must be in target.
          Empty string ONLY when action is "accept".
    template: |
      Question being answered: {question}

  revise_redundancy:
    description: "Remove redundant/repeated content from a synthesized answer."
    system_prompt: |
      You are revising a synthesized answer to remove redundancy.
      A shorter answer is better than a repetitive one.

      SECTION PRESERVATION (CRITICAL):
      You MUST return every ### section heading that exists in the input.
      Never drop, merge, or omit a section — even if the feedback only
      mentions one section. Count sections before editing; the output
      MUST contain the same set of ### headings in the same order.

      UNIQUE CONTENT PROTECTION (CRITICAL):
      Before deleting any sentence, verify it has a semantic equivalent
      elsewhere in the answer. If the sentence states a fact that appears
      NOWHERE else (no other sentence asserts the same mechanism, property,
      or relationship), KEEP it regardless of what the feedback says —
      the assessor likely confused topical proximity with duplication.

      Rules:
      - Follow the REDUNDANCY FEEDBACK — but apply the unique-content
        check above before each deletion
      - When a sentence contains two clauses that say the same thing,
        delete the weaker clause and keep the more precise one
      - When consecutive sentences restate the same idea, delete the
        less informative one entirely
      - Do NOT merge, reorder, or restructure sections — only delete
        redundant content within the existing structure
      - PRESERVE all [Fact N] and [Fact N, M] citations — every citation
        in the input must appear in the output. When deleting a sentence,
        absorb its unique citations into a surviving sentence that covers
        the same topic
      - Do NOT remove ideas that appear only once
      - Do NOT add new content beyond what is already present
      - Output the revised answer text only — no preamble, no explanation

      CITATION AUDIT (CRITICAL — do this LAST, before returning):
      1. List every [Fact N] citation in the INPUT answer
      2. Verify every one appears in your OUTPUT
      3. If ANY citation is missing: find the deleted sentence that
         carried it, and either restore that sentence or append its
         citation to the nearest surviving sentence about the same topic
      4. If you cannot find a surviving sentence to absorb the citation,
         KEEP the original sentence — losing a citation is worse than
         keeping a borderline-redundant sentence
    template: |
      REDUNDANCY FEEDBACK:
      Reason: {assess_reason}
      Target: {assess_target}

      CURRENT ANSWER:
      {artifact}

  verify_math:
    description: "Mathematical verification with minimal disambiguation context"
    system_prompt: |
      Verify T/F whether a given mathematical claim is accurate.
      
      If context is provided (previous statement), use it ONLY to resolve pronouns or ambiguous references.
      Do NOT let narrative context bias your mathematical verification - verify the math itself.

      Output your final answer as \boxed{T} for TRUE or \boxed{F} for FALSE

    template: |
      {claim}


  # ========================================================================
  # Hybrid coverage review (embeddings narrow → LLM adjudicates)
  # ========================================================================

  adjudicate_coverage:
    description: "Determine which embedding-flagged facts are genuinely uncovered vs semantic duplicates."
    system_prompt: |
      You are given a SYNTHESIZED ANSWER and a list of CANDIDATE UNCOVERED
      FACTS. These facts scored below an embedding similarity threshold,
      meaning they may not be well-represented in the answer.

      However, many candidates are semantic near-duplicates of content
      already covered. Your job: determine which candidates represent
      genuinely MISSING TOPICS — information the answer does NOT discuss
      at all, even in different words.

      For each candidate:
      - If the answer already discusses the same topic, mechanism, or
        relationship (even using different wording), it is COVERED
      - If the answer says NOTHING about this topic, it is MISSING

      Example: if the answer says "reduces glucose production in the
      liver" and a candidate says "inhibits hepatic gluconeogenesis",
      that candidate is COVERED — same mechanism, different words.

      About: {question}

      SYNTHESIZED ANSWER:
      {artifact}

      Return JSON:
        {{"missing_indices": [1-based fact indices that are genuinely missing]}}
      If all candidates are already covered, return {{"missing_indices": []}}
    template: |
      CANDIDATE UNCOVERED FACTS:
      {candidate_facts}

  # ========================================================================
  # v7 additions
  # ========================================================================

  contextualize:
    description: "Add topic-anchoring context prefix to claims without modifying claim text."
    system_prompt: |
      You are given a list of claims extracted from an answer to a question.
      Your task is to produce a SHORT context prefix for each claim that
      anchors it to the question's topic, so a reader can understand what
      the claim refers to without seeing the original answer.

      QUESTION: {cleaned_question}

      RULES:
      - Output a BARE TOPIC string — just the subject noun phrase, not a
        full sentence or prefix phrase
        (e.g. "TCP", "quantum mechanics", "natural selection",
         "the French Revolution", "TCP's flow control mechanism")
      - PREFER THE QUESTION'S PRIMARY SUBJECT as the topic. Most claims
        from an answer about a specific subject should share that subject
        as their topic, not sub-topics like incidental mechanisms or side
        entities. Use the same topic for claims about properties, mechanisms,
        or effects of the primary subject. Only use a different topic when a
        claim genuinely belongs to a separate domain (e.g. a comparison entity).
      - Claims are grouped by topic for batch verification — consistent
        topics allow claims to collate under a single heading
      - Do NOT include framing words like "In the context of" or "Regarding"
        — the handler adds structural markup automatically
      - Do NOT repeat, rephrase, or rewrite the claim itself — only provide
        the topic
      - Do NOT add new factual information or definitions
      - Do NOT elaborate on the claim's content
      - If a claim is already self-standing and names the primary subject
        explicitly, return an empty string for its context field
      - Resolve pronoun ambiguity by naming the subject in the topic
        (e.g. use the question's primary subject when the claim says "It ...")

      Return a JSON object with a "claims" array containing exactly
      {claim_count} entries, one per input claim in order.
      Each entry has:
        "index": integer (the index shown in brackets, e.g., [0], [1], ...)
        "context": string (the bare topic, or "" if the claim is already self-standing)

    template: |

      {numbered_claims}

