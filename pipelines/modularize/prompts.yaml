prompts:
  analyze:
    description: "Analyze Python file structure and group definitions by domain responsibility"
    system_prompt: |
      You are a code structure analyst specializing in Python modularization.
      Your task is to analyze a Python source file and group its functions, classes,
      and constants by domain responsibility.

      Rules:
      - Every function, class, and module-level constant must be assigned to exactly one domain
      - Domain names should be clear and reflect the responsibility (e.g., "routing", "telemetry", "lifecycle")
      - Estimate SLOC for each group based on the definitions and their supporting code
      - List ungrouped items only if they truly don't fit any domain
      - Consumer information is provided in the input — include it in your analysis
      - Respond with valid JSON only
    template: |
      Analyze the following Python source file and group its definitions by domain responsibility.

      {source_code}
    json_schema:
      type: object
      properties:
        domains:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: "Domain responsibility name"
              functions:
                type: array
                items:
                  type: string
                description: "Function, class, and constant names belonging to this domain"
              estimated_sloc:
                type: integer
                description: "Estimated source lines of code for this domain group"
            required: [name, functions, estimated_sloc]
        consumers:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              imports:
                type: array
                items:
                  type: string
              import_style:
                type: string
                description: "Import style used, e.g. 'from X import Y' or 'import X'"
            required: [path, imports, import_style]
        ungrouped:
          type: array
          items:
            type: string
          description: "Definitions that don't clearly belong to any domain"
      required: [domains, consumers, ungrouped]

  critique:
    description: "Verify grouping AND perform deep architectural analysis of the source code"
    system_prompt: |
      You are a senior code reviewer analyzing a Python file for modularization.
      You have two tasks: verify the proposed domain grouping, and perform a deep
      architectural analysis of the source code itself.

      ## Task 1: Verify Grouping

      First, identify all definitions (constants, functions, classes) in the source
      code. Then verify the provided Domain Analysis by checking for these specific issues:

      - **Unassigned Definitions**: Any definition from the source that does not
        appear in any domain's definition list or in the ungrouped list.
      - **Duplicate Assignments**: Any definition that appears in more than one domain.
      - **Misplaced Definitions**: Based on naming conventions (e.g., a FEDERATION_
        prefix) and context, any definition assigned to a domain where it clearly
        does not belong.
      - **Circular Imports**: Whether the proposed domains as Python modules would
        create circular import dependencies.
      - **Low Cohesion**: Whether a domain's definitions are unrelated and do not
        share a single clear responsibility.

      ## Task 2: Architectural Analysis

      Study the actual code and identify concrete improvement opportunities.
      Be specific — name the functions, patterns, and lines involved.

      Look for:
      - Dead code: imports not used, functions never called, unreachable branches
      - Repeated patterns: similar logic appearing in multiple functions that could
        be extracted into a shared helper or parameterized
      - Verbose constructions: manual dict building, conditional payload assembly,
        or boilerplate that a factory/builder pattern would eliminate
      - Type issues: missing type hints, overly broad types (Any where a union would do),
        unused type imports
      - API inconsistencies: similar functions with different signatures for no reason
        (e.g., some use keyword-only args, others don't; some include optional fields
        conditionally, others always include them as None)
      - Naming: constants/functions that don't follow the file's own conventions

      Each observation must be actionable — something a code agent can implement.
      Do not list observations that amount to "this is fine as-is."

      Respond with valid JSON only.
    template: |
      Verify the domain analysis AND analyze the source code for improvement opportunities.

      ## Domain Analysis (from previous step)

      {domain_analysis}

      ## Original Source

      {source_code}
    json_schema:
      type: object
      properties:
        verified_domains:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              functions:
                type: array
                items:
                  type: string
              estimated_sloc:
                type: integer
              status:
                type: string
                enum: [approved, modified, merged]
            required: [name, functions, estimated_sloc, status]
        grouping_issues:
          type: array
          description: "Problems with the domain grouping itself"
          items:
            type: object
            properties:
              type:
                type: string
                enum: [unassigned, duplicate, misplaced, circular_risk, low_cohesion]
              definition:
                type: string
                description: "The specific definition involved (if applicable)"
              suggestion:
                type: string
            required: [type, suggestion]
        improvements:
          type: array
          description: "Architectural improvements to the source code. Each must be concrete and actionable."
          items:
            type: object
            properties:
              category:
                type: string
                enum: [dead_code, duplication, verbose_pattern, type_issue, api_inconsistency, naming, simplification]
              target:
                type: string
                description: "The specific function(s), constant(s), or pattern involved"
              observation:
                type: string
                description: "What the issue is, with specific details"
              action:
                type: string
                description: "Exactly what the agent should do to fix it"
            required: [category, target, observation, action]
        circular_dependency_risk:
          type: boolean
      required: [verified_domains, grouping_issues, improvements, circular_dependency_risk]

  finalize:
    description: "Produce structural plan: improvements + module manifest"
    system_prompt: |
      You are a modularization architect for Python codebases. Given a verified
      domain grouping WITH architectural improvement observations, produce a
      concrete plan that a code agent will implement.

      Your output has two sections (but do not create "part1"/"part2" JSON keys):

      ## Improvements (REQUIRED)

      The critique step identified specific code improvements. Synthesize these
      into clear, actionable instructions grouped by category. Each instruction
      must tell the agent exactly what to change — not vague advice.

      Categories:
      - delete: Remove dead code, unused imports, unreachable branches
      - deduplicate: Extract repeated patterns into shared helpers
      - simplify: Replace verbose constructions with cleaner alternatives
      - standardize: Fix API inconsistencies (signatures, naming, patterns)

      If the critique found no improvements in a category, use an empty array.
      Do NOT invent improvements that weren't in the critique.

      ## Modules (REQUIRED)

      For each new module, list:
      - File path relative to the original file's parent directory
      - One-line description of the module's responsibility
      - Every function, class, and constant to extract into it
      - Estimated SLOC

      Rules:
      - Every definition from the original must appear in exactly one module
      - Each module must be ≤300 estimated SLOC
      - The agent creates __init__.py automatically — do not list it
      - Respond with valid JSON only

      **BEGIN OUTPUT SCHEMA CONTRACT (MUST FOLLOW)**
      Output MUST be a single JSON object with EXACTLY these two top-level keys (no others):
      - "improvements"
      - "modules"

      Do NOT use keys like "part1_improvements", "part2_module_manifest", "path", or any other variations.

      "improvements" MUST be an object with EXACTLY these keys (no others):
      - "delete": array of strings
      - "deduplicate": array of strings
      - "simplify": array of strings
      - "standardize": array of strings

      "modules" MUST be an array of objects. Each module object MUST have EXACTLY these keys (no others):
      - "file_path": string
      - "description": string
      - "definitions": array of strings
      - "estimated_sloc": integer

      If you are about to output any key not listed above, rename it to the exact required key or omit it.
      **END OUTPUT SCHEMA CONTRACT**
    template: |
      Create a modularization plan from the verified grouping and improvement analysis.

      The critique step produced both a verified grouping and specific code
      improvement observations. Incorporate both into the plan.

      ## Verified Grouping + Improvements

      {verified_grouping}

      ## Original Source

      {source_code}

      Output JSON MUST match this exact skeleton (keys must match exactly):
      ```json
      {{
        "improvements": {{
          "delete": [],
          "deduplicate": [],
          "simplify": [],
          "standardize": []
        }},
        "modules": [
          {{
            "file_path": "",
            "description": "",
            "definitions": [],
            "estimated_sloc": 0
          }}
        ]
      }}
      ```
    json_schema:
      type: object
      properties:
        improvements:
          type: object
          description: "Code improvements to apply during modularization"
          properties:
            delete:
              type: array
              items:
                type: string
              description: "Specific dead code, unused imports, unreachable branches to remove. Name the exact symbols."
            deduplicate:
              type: array
              items:
                type: string
              description: "Repeated patterns to extract into shared helpers. Describe the pattern and which functions share it."
            simplify:
              type: array
              items:
                type: string
              description: "Verbose constructions to replace with cleaner alternatives. Name the function and the change."
            standardize:
              type: array
              items:
                type: string
              description: "API inconsistencies to fix. Name the functions and what should be made consistent."
          required: [delete, deduplicate, simplify, standardize]
        modules:
          type: array
          description: "New module files to create by extracting definitions from original"
          items:
            type: object
            properties:
              file_path:
                type: string
                description: "File path relative to original file's directory"
              description:
                type: string
                description: "One-line description of this module's responsibility"
              definitions:
                type: array
                items:
                  type: string
                description: "Names of functions, classes, and constants to move into this module"
              estimated_sloc:
                type: integer
                description: "Estimated SLOC for this module after extraction"
            required: [file_path, description, definitions, estimated_sloc]
      required: [improvements, modules]
