prompts:
  continuity_checkpoint.v1.pre_consolidate_packet:
    description: >
      cursor-sdk read-only pre-consolidate packet for continuity CHECKPOINT
      card patch + bounded residue (contract none · JSON-only closeout).
    template: |
      ---
      contract: none
      read_only: true
      sdk_mode: agent
      packet_label: continuity_checkpoint
      ---

      # Continuity CHECKPOINT pre-consolidate

      You are the off-seat author of a continuity CHECKPOINT. Output exactly one
      fenced ```json block in your CLOSEOUT body. No prose outside it. No tool use.

      ## Required JSON shape

      Keys: `residue` (string ≤800 chars), `mission` (one line),
      `card_patch.resume_open` (replaces whole ## Resume open section),
      `card_patch.opportunities_rows` (optional list of {id, status, note}).

      ## CHECKPOINT role

      A reconstitution index and deliberative steering, not completeness authority.
      An empty Next does not mean the arc is complete. Never claim DONE for a G-row
      unless the tape shows the evidence.

      ## Residue rules (≤800-char bus body)

      Line 1 `Mission: …` (mandatory). Then `Primary OPEN:` gated G-row(s) by id.
      Then `Next:` exactly one named hop — pointer, never a status claim.
      Then `Do-not-trust:` what a resumer must not take as settled.
      Then `Vocabulary:` bind bare ids to homes when the arc uses numbered lists.
      Pointers only: `agent-bus:{id}#{turn}`, `cortex://…`, `workspaces://…`.
      Forbidden: `### User` anywhere; restating seal facts; the RESUME footer;
      apologies; meta; a second Mission line.

      ## resume_open rules (uncapped card zone)

      Been → Are → Going in three short paragraphs, then a single line starting
      exactly `In one line:` (resume fence parses this prefix). Carry settled rows
      by reference; write new state without "formerly" or "updated from".

      ## Input precedence

      Seat seed (when present) is authoritative for rulings and blockers — fold it,
      do not copy verbatim. Tape is evidence. Tip CHECKPOINT residue is prior index —
      supersede it. Card Resume open / Pools / hub summary are context. Seal facts
      are anchors, not content.

      If the tape opens with `(tape truncated: …)`, older arc is in tip residue and
      card — do not infer dropped turns did not happen.

      ## Inputs (rules and short inputs before tape)

      ### Thread
      {{ thread }}

      ### Seal
      {{ seal_json }}

      ### Tape stats
      {{ tape_stats }}

      ### Seat seed
      {{ seat_seed }}

      ### Tip CHECKPOINT residue
      {{ tip_residue }}

      ### Card ## Resume open
      {{ resume_open }}

      ### Card ## Pools
      {{ pools_section }}

      ### Hub summary
      {{ hub_summary }}

      ### Tape
      {{ tape_lines }}
