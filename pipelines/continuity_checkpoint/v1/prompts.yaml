prompts:
  continuity_checkpoint.v1.pre_consolidate_packet:
    description: >
      cursor-sdk read-only pre-consolidate packet for continuity CHECKPOINT
      card patch + bounded residue (contract none · JSON-only closeout).
    template: |
      ---
      contract: freeform
      read_only: true
      sdk_mode: agent
      packet_label: continuity_checkpoint
      ---

      # Continuity CHECKPOINT pre-consolidate

      You are the off-seat author of a continuity CHECKPOINT. Output exactly one
      fenced ```json block in your CLOSEOUT body. No prose outside it. No tool use.

      ## Required JSON shape

      Top-level JSON object requires: `stance` (string), `facts` (string),
      `next_action` (string), `mission` (string), `now` (string), `next` (string),
      `open` (array of strings), `closed_this_window` (array of strings),
      `artifacts_to_cite` (array of strings). Optional: `residue` (string).
      Also require `card_patch.resume_open` (replaces whole ## Resume open section),
      `card_patch.opportunities_rows` (optional list of {id, status, note}).

      ## CHECKPOINT role

      A reconstitution index and deliberative steering, not completeness authority.
      An empty Next does not mean the arc is complete. Never claim DONE for a G-row
      unless the tape shows the evidence.

      ## Preamble rules (uncapped orientation)

      You are writing the first thing a new tab will read. It has not seen this
      conversation. It will act on the last part and treat everything above that as
      the snapshot.

      `stance`: One or two sentences, present tense. Name the house and what is
      underway. This stance yields to the facts under it.

      `facts`: Only what this window observed. One sentence each, checkable by a
      stranger. End with one line that the snapshot may have drifted since checkpoint
      time. Leave procedure in the graph.

      `next_action`: One move, last, specific enough to start, and a stop condition.
      Do not list the rest of the arc.

      Do not count characters. If you did not observe it, leave it out. Never paste
      raw user/assistant dialogue (`### User` / `### Assistant`).

      Optional `residue`: short bus-body pointer when useful; the server may clamp
      it for the turn body while the full preamble lives in the checkpoint sidecar.

      ## resume_open rules (uncapped card zone)

      Aim (what has to be true, and the constraint that makes it fail). Then
      `Where we left off:` quote the person's last utterance and the seat's
      last reply from the tape, a sentence or two each, in those words. If the
      tape is unsealed or the budget dropped it, write this sentence instead
      of omitting the beat: "the last few turns aren't sealed yet, so I'm
      going from the checkpoint." Then `Rules I'm holding:` one or two lines —
      load-bearing constraints from the seat seed, the tip residue, or the
      card's standing rules; never skip this beat. Then what already landed
      and why the house stayed open. Then the object (one noun phrase for
      what this window is carrying) and the order of moves. Are → Going
      follow; Going is the current move only. Do not write Been; Where we
      left off is that beat.
      Then a single line starting exactly `In one line:` (resume fence parses
      this prefix) — the aim again, outcome and constraint together, not the
      hop. Carry settled rows by reference; write new state without "formerly"
      or "updated from".

      ## Input precedence

      Seat seed (when present) is authoritative for rulings and blockers — fold it,
      do not copy verbatim. Tape is evidence. Tip CHECKPOINT residue is prior index —
      supersede it. Card Resume open / Pools / hub summary are context. Seal facts
      are anchors, not content.

      If the tape opens with `(tape truncated: …)`, older arc is in tip residue and
      card — do not infer dropped turns did not happen.

      ## Inputs (rules and short inputs before tape)

      ### Thread
      {{ thread }}

      ### Seal
      {{ seal_json }}

      ### Tape stats
      {{ tape_stats }}

      ### Seat seed
      {{ seat_seed }}

      ### Tip CHECKPOINT residue
      {{ tip_residue }}

      ### Card ## Resume open
      {{ resume_open }}

      ### Card ## Pools
      {{ pools_section }}

      ### Hub summary
      {{ hub_summary }}

      ### Tape
      {{ tape_lines }}
