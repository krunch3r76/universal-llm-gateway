# cursor-paste-resolve — investigate (optional), compose, then launch.
#
# Compose is identical for launch_target ∈ {glass, ide, cursor_sdk}.
# Investigate is a prior cursor-sdk hop when options.investigate is set.
# Launch is the last step: Glass/IDE shells scripts/cursor-bridge-launch.py
# open-tab (the paste chord). cursor_sdk POSTs /api/v1/team/dispatch with
# CURSOR_SDK_MODEL (cursor/composer-2.5) — non-investigate SDK write default.
#
# Invocation:
#   pipeline(op="run", pipeline_id="cursor-paste-resolve",
#            messages=[{"role":"user","content":"compose"}],
#            options={
#              "kind": "friction"|"assertion",
#              "assertion_id": <int>,
#              "window": "glass"|"ide",          # Glass/IDE; default glass
#              "host": "orion-node"|"jupiter",   # required for glass/ide launch
#              "notify": "maestro"|absent,
#              "launch_target": "glass"|"ide"|"cursor_sdk"|absent,
#              "investigate": "opus"|"fable"|absent, # SDK investigate hop
#              "tab_model": "opus"|"fable"|absent,  # Glass Ctrl+/ query
#              "dispatch_thread_id": "<minted>", # cursor_sdk write executor
#              "operator_note": "<prose>",       # data-only <operator_note> before implementer; soft refuse >8000
#              "finalize": "dispatchee"|"dispatcher"|absent, # who restarts+closes; dispatcher = cursor_sdk or compose-only
#            })
# cursor_sdk admit always pairs reuse_thread=dispatch_thread_id (after mint or caller-supplied).
# finalize=dispatcher appends the untagged dispatcher-finalize block last (a:38698);
# absent/""/dispatchee are byte-identical; glass/ide + dispatcher refuses.

schema_version: 6
id: cursor-paste-resolve
version: "1.0"
type: cursor_paste_resolve
category: cursor_paste_resolve
description: >
  optional investigate hop, then assertion_get + implementer read +
  write tmp/prompts/cursor-paste-<kind>-<id>.md, then optional Glass/IDE
  script launch or cursor_sdk team_dispatch admit.
output: launch

options:
  timeout_seconds: 1800
  launch_target:
    type: string
    description: glass | ide | cursor_sdk; empty = compose only
    default: ""
  investigate:
    type: string
    description: opus | fable; empty = skip investigate hop
    default: ""
  tab_model:
    type: string
    description: opus | fable (folded tab-opus / tab-fable); empty = no Ctrl+/
    default: ""
  operator_note:
    type: string
    description: >
      optional seat-judgment prose spliced as <operator_note> after investigate
      and before implementer bytes (data, not instructions); soft refuse if
      longer than 8000 codepoints
    default: ""
  finalize:
    type: string
    description: >
      dispatchee | dispatcher; empty = dispatchee (executor restarts and
      closes). dispatcher appends a plain constraints block last (no restart,
      no friction_close, no 12286 post; land, post land_sha + importer
      services, stop). dispatcher refuses on launch_target glass|ide; unknown
      values refuse
    default: ""

steps:
  - name: investigate
    type: cursor_paste_resolve_investigate_v1
    handler_outputs:
      splice: investigate.json.splice
      model: investigate.json.model

  - name: compose
    type: cursor_paste_resolve_compose_v1
    handler_inputs:
      investigate_splice: investigate.json.splice
      investigate_model: investigate.json.model
    handler_outputs:
      message_path: compose.json.message_path
      kind: compose.json.kind
      assertion_id: compose.json.assertion_id

  - name: launch
    type: cursor_paste_resolve_launch_v1
    handler_inputs:
      message_path: compose.json.message_path
