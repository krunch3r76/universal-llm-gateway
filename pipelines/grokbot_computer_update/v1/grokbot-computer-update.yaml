# grokbot-computer-update — status, wake, or update a Grok Bot computer.
#
# Zero LLM calls. Options: action (status|wake|update), display, cdp_port, require_idle.
# display :9 → CDP 9339 and :10 → CDP 9340 via config/grok-windows.json when
# cdp_port is omitted or left at the default 9339. An explicit other port wins.
#
#   pipeline(op="run", pipeline_id="grokbot-computer-update",
#            messages=[{"role":"user","content":"update"}],
#            options={"action": "update", "display": "10"})

schema_version: 6
id: grokbot-computer-update
version: "1.0"
type: grokbot_computer_update
category: grokbot_computer_update
description: >
  Probe, wake, or update a Grok Bot computer on a configured X11 display.
  Update uses the settings Computer row, then closes that dialog.
  No model invocation.
output: run_grokbot_computer_ctl

options:
  timeout_seconds: 300
  action:
    type: string
    description: status, wake, or update
    default: status
  display:
    type: string
    description: X11 display number
    default: "9"
  cdp_port:
    type: integer
    description: Grok Bot CDP port
    default: 9339
  require_idle:
    type: boolean
    description: refuse update when assistants are running
    default: true

steps:
  - name: run_grokbot_computer_ctl
    type: grokbot_computer_update_v1
