schema_version: 6
id: rag-extraction
version: "2.1"
type: rag_extraction
description: >
  Extract structured knowledge (entities, topics, facets) from multiple text chunks
  in parallel. Called by the RAG service at index time via virtual model ID.
  Fans out over all file chunks concurrently using map step; partial success
  allowed (min 50% of chunks must succeed).
output: extract_batch
output_format: json_array

options:
  timeout_seconds: 3600

steps:
  - name: extract_batch
    type: generate
    model_ref: extraction
    prompt_ref: rag_extraction.extract_batch
    # Stall timeout: resets whenever any map iteration completes (liveness under queue pressure).
    # Must exceed cold model load time + first inference time (~120s load + ~30s inference = 150s).
    timeout_seconds: 300
    # Per-iteration ceiling; flows as X-Request-Timeout to Stargate (min with upstream_retry_timeout).
    handler_timeout_seconds: 300
    skip_token_counting: true
    max_concurrency: 32
    map_over:
      chunk: optionsNs.chunks
    map_inputs:
      text: mapNs.iteration.value.text
    min_success_threshold: 0.1
    generation_parameters:
      max_tokens: 8192
      temperature: 0.2
      frequency_penalty: 0.3
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            entities:
              type: array
              maxItems: 12
              items:
                type: object
                properties:
                  name: { type: string }
                  type: { type: array, items: { type: string } }
                  facets:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        value: { type: string }
                      required: [name, value]
                  relations:
                    type: array
                    items:
                      type: object
                      properties:
                        predicate: { type: string }
                        target: { type: string }
                      required: [predicate, target]
                required: [name, type]
            topics:
              type: array
              maxItems: 10
              items: { type: string }
          required: [entities, topics]
