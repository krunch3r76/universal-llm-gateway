schema_version: 6
id: rag-extraction
version: "2.1"
type: rag_extraction
description: >
  Extract structured knowledge (entities, topics, facets) from multiple text chunks
  in parallel. Called by the RAG service at index time via virtual model ID.
  Fans out over all file chunks concurrently using map step; partial success
  allowed (min 50% of chunks must succeed).
output: extract_batch
output_format: json_array

options:
  timeout_seconds: 3600

steps:
  - name: extract_batch
    type: generate
    model_ref: extraction
    prompt_ref: rag_extraction.extract_batch
    # Stall timeout: resets whenever any map iteration completes (liveness under queue pressure).
    # Under concurrent ingest load (3 docs × 8 concurrency), late iterations queue 23–40s before
    # inference. 900s gives ~22 stall cycles without any completion — effectively never fires.
    timeout_seconds: 900
    # Safety-net ceiling for handler dispatch (X-Request-Timeout = handler_timeout + 30s buffer).
    # NOT the primary inference budget — inference_timeout_seconds owns that role.
    # Sized for: worst-case queue wait (~130s across 8 serial chunks at 11s each) +
    # inference_timeout (200s) + buffer (120s) = 450s. Only fires when both
    # request.inference.started and request.processing signals are lost.
    handler_timeout_seconds: 450
    # Per-iteration inference ceiling — primary budget control.
    # MapExecutor monitor starts counting from request.inference.started (primary) or
    # request.processing (fallback). Queue wait never consumes this budget.
    # 200s = cold load ceiling (~120s) + max observed warm inference (~11s) + 69s margin.
    inference_timeout_seconds: 200
    skip_token_counting: true
    max_concurrency: 8
    min_success_threshold: 0.5
    map_over:
      chunk: optionsNs.chunks
    map_inputs:
      text: mapNs.iteration.value.text
    generation_parameters:
      # Schema hard max (12 entities × 3 facets × 3 relations + 10 topics) ≈ 1893 tokens.
      # 4096 gives 2× headroom over that ceiling; halves the original 8192 safety net.
      max_tokens: 4096
      temperature: 0.2
      frequency_penalty: 0.3
      # Explicitly suppress qwen3 thinking mode. The profile (qwen3-instruct) also sets
      # this via chat_template_kwargs, but certain math-heavy inputs bypass profile-level
      # suppression. User-specified params cannot be overridden — this is the hard guard.
      chat_template_kwargs:
        enable_thinking: false
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            entities:
              type: array
              maxItems: 12
              items:
                type: object
                properties:
                  name: { type: string }
                  type: { type: array, items: { type: string } }
                  facets:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        value: { type: string }
                      required: [name, value]
                  relations:
                    type: array
                    items:
                      type: object
                      properties:
                        predicate: { type: string }
                        target: { type: string }
                      required: [predicate, target]
                required: [name, type]
            topics:
              type: array
              maxItems: 10
              items: { type: string }
          required: [entities, topics]
