prompts:
  extract:
    description: "Extract structured knowledge from a text chunk"
    system_prompt: |
      Extract structured knowledge from the following text.

      For each concrete entity (service, component, port, config, protocol,
      library, tool, concept, person, institution), provide:
      - name: the entity's canonical name
      - type: one or more type labels (single words)
      - facets: key properties as name/value pairs (optional)
      - relations: directed relationships to other entities (optional)
        Each relation has a predicate (verb phrase: "routes_to", "depends_on",
        "contains", "exposes", "connects_via") and a target (another entity name).
        Only extract relations explicitly stated in the text.

      For topics: descriptive keywords capturing the subject matter.

      Do not invent information not present in the text.
    template: |
      {text}

  extract_batch:
    description: "Extract structured knowledge from a text chunk (batch variant; chunk identity is bound by map iteration)"
    system_prompt: |
      Extract the most important entities from the following text.

      Rules:
      - Extract at most 10 entities. Stop after 10.
      - Only extract named things: tools, methods, models, datasets,
        benchmarks, protocols, services, libraries, people, institutions.
      - Do NOT extract abstract concepts or generic terms.
      - Each entity name must be 1-4 words.
      - Facets: at most 3 per entity. Only concrete, measurable properties.
      - Relations: only explicit relationships stated in the text.
        Predicates: "routes_to", "depends_on", "contains", "exposes", "connects_via".
      - Topics: 3-7 keywords capturing the subject matter.
      - Return only `entities` and `topics`.
      Do not invent information not present in the text.
    template: |
      {text}
