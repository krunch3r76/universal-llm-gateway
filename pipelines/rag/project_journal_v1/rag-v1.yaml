schema_version: 6
id: rag-qwen3-32b
version: "1.0"
type: rag
description: "Retrieval-augmented completion with optional recency-aware search"
output: complete

options:
  timeout_seconds: 120

steps:
  - name: search
    type: rag_search_v1
    endpoint: "http://localhost:8100/search"
    top_k: 5
    recency_weight: 0.0
    distance_threshold: 1.0

  - name: complete
    type: generate
    model_ref: qwen3_32b
    prompt_ref: rag.project_journal_v1.answer_with_context
    handler_inputs:
      rag_context: "search.raw"
