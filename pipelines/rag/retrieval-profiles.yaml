# Empirically measured optimal RAG retrieval tunables.
# Source: docs/engram/rag-tunable-optimization-findings.md
#
# Loaded by rag_query_retrieve handler at first use.
# Keyed by consumer model (the model that reads the retrieved context).
#
# Resolution precedence (highest to lowest):
#   runtime pipeline_options > exact profile[consumer_model] > model_class[consumer_model]
#   > tier[consumer_tier] > YAML defaults
# After scope resolution, scope_defaults[scope] fills keys not set by the above layers.
#
# rag_top_k_per_query: candidate generation breadth (vector search)
# rag_max_chunks: final context budget for downstream consumer (token cost)

tiers:
  frontier:
    rag_top_k_per_query: 15
    rag_max_chunks: 30
    rag_rrf_k: 35
  local:
    rag_top_k_per_query: 10
    rag_max_chunks: 12
    rag_rrf_k: 25
  small_local:
    rag_top_k_per_query: 8
    rag_max_chunks: 6
    rag_rrf_k: 20

model_classes:
  frontier:
    match: "/"
    rag_max_chunks: 30
    rag_top_k_per_query: 15
    rag_rrf_k: 35
  small_local:
    # Sub-8B local models — conservative chunk budget fits ~4-8K context.
    # Pattern covers common small model ID suffixes, e.g. model-1b-chat, phi-2b-v2.
    match: "-0-6b-|-1-7b-|-1b-|-2b-|-3b-|-4b-"
    rag_max_chunks: 6
    rag_top_k_per_query: 5
    rag_rrf_k: 20
profiles:
  qwen3-5-9b-q8-0-32768:
    # 8K effective context (32768 / 4 parallel slots); ~4800 tokens for chunks
    rag_max_chunks: 8
    rag_rrf_k: 20
  qwen3-32b-awq-32768:
    rag_max_chunks: 15
    rag_rrf_k: 20
  phi-4-q4-k-m-16384:
    rag_max_chunks: 12
    rag_rrf_k: 20
  gpt-oss-20b-mxfp4-65536:
    rag_max_chunks: 30
    rag_rrf_k: 35
# Per-scope defaults — only values that genuinely vary per scope belong here.
# Diversity behavior (source_diversity_max, habituation, swap) is controlled by
# the retrieval_path pipeline option ("research" or "general"), not per-scope.
scope_defaults:
  research:
    rag_recency_weight: 0.2
  research_small_llm:
    rag_recency_weight: 0.2
  research_rag_design:
    rag_recency_weight: 0.1
  research_rag_code:
    rag_recency_weight: 0.15
  all_research:
    rag_recency_weight: 0.2
  llm_foundations:
    rag_recency_weight: 0.05
  rag_systems:
    rag_recency_weight: 0.15
  knowledge_systems:
    rag_recency_weight: 0.1
  prompting:
    rag_recency_weight: 0.15
  small_llm_prompting:
    rag_recency_weight: 0.15
  llm_prompting:
    rag_recency_weight: 0.15
  project:
    rag_recency_weight: 0.0
  architecture:
    rag_recency_weight: 0.0
  both:
    rag_recency_weight: 0.1
  all:
    rag_recency_weight: 0.1
