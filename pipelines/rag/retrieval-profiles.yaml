# Empirically measured optimal RAG retrieval tunables.
# Source: docs/engram/rag-tunable-optimization-findings.md
#
# Loaded by rag_query_retrieve handler at first use.
# Keyed by consumer model (the model that reads the retrieved context).
#
# Resolution order in the handler:
#   runtime pipeline_options  >  profile[consumer_model]  >  scope_defaults[scope]  >  YAML defaults
#
# Callers pass consumer_model via pipeline_options (or consumer_model_ref
# on pipeline_call_v1 steps for automatic alias resolution).
#
# Measurement scripts can append profiles here; the handler re-reads
# on next cold start.
#
# model_classes: optional pattern-based fallback when no exact profile matches
# consumer_model. match is a substring test; first matching class wins (dict order).

model_classes:
  frontier:
    match: "/"
    rag_max_chunks: 30
    rag_top_k_per_query: 15
    rag_rrf_k: 35
  small_local:
    # Sub-8B local models — conservative chunk budget fits ~4-8K context.
    # Pattern covers common small model ID suffixes.
    match: "-0-6b-|-1-7b-|-1b-|-2b-|-3b-|-4b-"
    rag_max_chunks: 6
    rag_top_k_per_query: 5
    rag_rrf_k: 20
profiles:
  qwen3-5-9b-q8-0-32768:
    # 8K effective context (32768 / 4 parallel slots); ~4800 tokens for chunks
    rag_max_chunks: 8
    rag_rrf_k: 20
  qwen3-32b-awq-32768:
    rag_max_chunks: 15
    rag_rrf_k: 20
  phi-4-q4-k-m-16384:
    rag_max_chunks: 12
    rag_rrf_k: 20
  gpt-oss-20b-mxfp4-65536:
    rag_max_chunks: 30
    rag_rrf_k: 35
scope_defaults:
  research:
    rag_recency_weight: 0.2
  research_rag_design:
    rag_recency_weight: 0.1
  research_rag_code:
    rag_recency_weight: 0.15
  llm_foundations:
    rag_recency_weight: 0.05
  project:
    rag_recency_weight: 0.0
  both:
    rag_recency_weight: 0.1
  all:
    rag_recency_weight: 0.1
