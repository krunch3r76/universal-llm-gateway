schema_version: 6
id: rag-context
version: "1.1"
type: rag
description: >
  RAG query rewriting + multi-query retrieval without generation.
  Rewrites the query into optimized sub-queries, executes parallel retrieval
  with RRF merge, and returns assembled context chunks as the response.
  Used by pipeline_test ask/consult as a drop-in replacement for direct RAG search.
  scope_options: candidate scope labels for the scope-analysis prompt; runtime
  validation uses RAG scope registry (GET /scopes). scope_aliases: map
  model-invented labels (e.g. schema_design) to valid registry labels; invalid
  or unknown scopes are fail-closed (0 chunks).
output: rerank_assemble

options:
  timeout_seconds: 60    # §4.2: raised from 30s; GPU contention headroom
  corpus_hints: ""       # Optional. Injected at runtime from corpus_hints.yaml. Provides
                         # additional context or keywords to guide retrieval.
  rewrite_enabled: true  # Diagnostic toggle: skip rewrite generation/HyDE when false
  # Candidate scope labels for the scope-analysis prompt.
  scope_options:
    - "project"
    - "small_llm_prompting"
    - "llm_prompting"
    - "prompting"
    - "workflows"
    - "research"
    - "rag_systems"
    - "code_retrieval"
    - "graph_modeling"
    - "temporal_provenance"
    - "belief_consistency"
    - "llm_foundations"
    # Synthetic/umbrella scopes (knowledge_systems, all_research, all) are
    # NOT listed here. Callers pass them via `synthetic_scope` pipeline
    # option; the handler queries them alongside predicted leaf subscopes
    # with demotion.
  # Map model-invented scope labels to valid registry labels.
  scope_aliases:
    schema_design: graph_modeling
    data_modeling: graph_modeling
    data_governance: temporal_provenance
  # --- Retrieval tunables (overridable via pipeline_options) ---
  rag_top_k_per_query: 15
  rag_max_chunks: 20
  rag_rrf_k: 35           # §4.3: Chosen to preserve more rank separation than k=60
                          #        for small list counts (N≤3), improving diversity.
  rag_recency_weight: 0.2  # §4.6: linear additive; deeper decay model deferred
  scope_confidence_threshold: 0.7  # §4.4: CRAG 3-state evaluation — queries below
                                   #        threshold are fail-closed (0 chunks, no broadening)
  rag_scope_chunk_caps: {}  # Optional per-scope cap for multi-scope retrieval unions.
                            # Limits chunks per scope, preventing a single scope from saturating results.
                            # Example: {"graph_modeling": 8, "knowledge_systems": 4}
  bibliography_filter_threshold: 0.35  # 0 = disable junk filter; >0 = fraction of lines to treat as boilerplate/citations
  bibliography_filter_disable: false   # Explicit hard-disable flag; if true, overrides threshold
  synthetic_scope: ""                   # Caller-provided broad scope queried alongside predicted
                                       # leaf scopes but with demotion. Distinct from scope_override
                                       # (which replaces prediction). E.g. "knowledge_systems".
  synthetic_scope_demotion: 0.6        # Score multiplier for chunks found ONLY in the synthetic
                                       # scope (0–1). 1.0 = no demotion.
  source_diversity_max: 3              # Max chunks per source document post-RRF; 0 = disabled.
                                       # Forces minority sources to surface when a dominant paper
                                       # saturates retrieval.
  hyde_enabled: true  # Hypothetical Document Embeddings — generates a short
                      # hypothetical passage as an additional retrieval query
  source_only_retrieval: false  # Diagnostic mode: ignore rewritten queries and
                                # HyDE, retrieve using source_text only
  metadata_boost_enabled: true   # Post-RRF metadata re-scoring using extracted
                                 # entity/relation/topic overlap with query terms
  metadata_boost_weight: 0.20    # Weight of metadata score in fusion with RRF
                                 # (0.0 = pure RRF, 1.0 = pure metadata)
  coverage_selection_enabled: false  # Greedy entity coverage selection — maximizes the
                                     # diversity of unique entities and concepts in the final chunk set.
  # --- Neighbor chunk expansion (post-junk-filter, pre-metadata-boost) ---
  neighbor_expansion_enabled: false     # Fetch ±n adjacent chunks from same source
  neighbor_expansion_n: 1              # Neighbors each direction (±n)
  neighbor_expansion_max_chunks: 30    # Cap on total chunks after expansion
  neighbor_expansion_score_discount: 1.0  # Score multiplier for neighbor chunks
  # --- LLM reranking (post-RRF, pre-formatting) ---
  rerank_enabled: true               # LLM-based reranking for relevance + diversity
  rerank_model: qwen3_9b             # Model alias for reranking LLM calls
  rerank_window_size: 5              # Chunks per sliding window
  rerank_overlap: 1                  # Overlap between adjacent windows
  rerank_max_candidates: 14          # Top-N chunks sent to reranker (rest pass through)
  rerank_max_movement: 3             # Max rank movement (±) to prevent drastic LLM reorder.
  rerank_prior_weight: 0.70          # Weight of prior (RRF+metadata) score in fusion
                                     # (0.0 = pure LLM, 1.0 = pure prior)

steps:
  - name: suggest_terms
    type: generate
    model_ref: qwen3_9b
    model_requirements:
      task: rag_rewrite
      source: any
    prompt_ref: rag.rag_context_v1.suggest_terms
    generation_parameters:
      temperature: 0.2
      max_tokens: 256
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            terms:
              type: array
              minItems: 5
              maxItems: 10
              items:
                type: string
              description: "Concrete retrieval terms (standards, relation types, key concepts)"
          required: ["terms"]

  - name: filter_corpus_hints
    type: filter_corpus_hints_v1
    handler_inputs:
      suggested_terms: "suggest_terms.json.terms"
    max_hints: 7
    min_chunk_cooccurrence: 2

  - name: analyze_scope
    type: generate
    model_ref: qwen3_14b
    model_requirements:
      task: rag_rewrite
      source: any       # local models qualify — enables laptop/CPU fallback
    prompt_ref: rag.rag_context_v1.analyze_scope
    handler_inputs:
      suggested_terms: "suggest_terms.json.terms"
      corpus_hints: "filter_corpus_hints.json.filtered_hints"
    generation_parameters:
      temperature: 0.3
      max_tokens: 512
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            needs_retrieval:
              type: boolean
            scopes:
              type: array
              minItems: 1
              maxItems: 3
              items:
                type: string
              description: "1–3 valid scope labels the query touches"
            scope_confidence:
              type: number
              minimum: 0
              maximum: 1
              description: "Confidence in the scope classification (0–1)"
            out_of_scope_reason:
              type: string
              description: "Empty string if in-scope; otherwise brief explanation of why the query does not match the corpus and what research area it maps to"
            rewrite_strategy:
              type: string
              description: "2-5 sentence rewrite strategy with register diversification guidance, injected into the rewrite generation prompt"
            must_include:
              type: array
              minItems: 0
              maxItems: 3
              items:
                type: string
              description: "1-3 high-signal tokens from suggested_terms or corpus_hints that MUST appear in at least one rewrite"
          required: ["needs_retrieval", "scopes", "scope_confidence", "out_of_scope_reason", "rewrite_strategy", "must_include"]

  - name: refine_generation_context
    type: refine_generation_context_v1
    handler_inputs:
      scopes: "analyze_scope.json.scopes"
      must_include: "analyze_scope.json.must_include"
      suggested_terms: "suggest_terms.json.terms"
    max_scope_anchors: 2
    min_chunk_cooccurrence: 1
    max_hints: 7

  - name: generate_rewrites
    type: generate
    model_ref: qwen3_14b_reasoning
    model_requirements:
      task: rag_rewrite
      source: any
    prompt_ref: rag.rag_context_v1.generate_rewrites
    condition: "analyze_scope.json.needs_retrieval and options.rewrite_enabled"
    handler_inputs:
      scope: "analyze_scope.json.scopes"
      rewrite_strategy: "analyze_scope.json.rewrite_strategy"
      must_include: "refine_generation_context.json.enriched_must_include"
      suggested_terms: "suggest_terms.json.terms"
      corpus_hints: "refine_generation_context.json.filtered_hints"
    generation_parameters:
      temperature: 0.4   # moderate temperature improves rewrite diversity while JSON schema constrains structure
      max_tokens: 1024  # reasoning profile uses hidden thinking tokens; keep headroom
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            reasoning:
              type: string
              description: "Free-form explanation of rewrite decisions, trade-offs, and omitted optional terms"
            rewritten_queries:
              type: array
              minItems: 2
              maxItems: 4
              items:
                type: string
          required: ["reasoning", "rewritten_queries"]

  - name: generate_hyde
    type: generate
    model_ref: qwen3_9b
    model_requirements:
      task: rag_rewrite
      source: any
    prompt_ref: rag.rag_context_v1.generate_hyde
    condition: "analyze_scope.json.needs_retrieval and options.rewrite_enabled and options.hyde_enabled"
    handler_inputs:
      rewrite_strategy: "analyze_scope.json.rewrite_strategy"
      must_include: "refine_generation_context.json.enriched_must_include"
    generation_parameters:
      temperature: 0.3
      max_tokens: 256  # Keep HyDE passage concise for retrieval quality
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            hyde_passage:
              type: string
              description: "A hypothetical document passage used as an additional retrieval query"
          required: ["hyde_passage"]

  - name: retrieve_assemble
    type: rag_multi_retrieve_v1
    endpoint: "http://localhost:8100/search"
    handler_inputs:
      scope_result: "analyze_scope.json"
      rewrite_result: "generate_rewrites.json"
      hyde_result: "generate_hyde.json"

  - name: rerank_assemble
    type: rag_rerank_assemble_v1
    model_ref: optionsNs.rerank_model
    prompt_ref: rag.rag_context_v1.rerank_chunks
    handler_inputs:
      chunks_data: "retrieve_assemble.json.chunks"
      rewrite_result: "generate_rewrites.json"
    generation_parameters:
      temperature: 0.2
      max_tokens: 768    # Bounds ranking JSON size while keeping generation headroom.
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            ranking:
              type: array
              items:
                type: object
                properties:
                  chunk_id:
                    type: string
                  rank:
                    type: integer
                  confidence:
                    type: string
                    enum: ["high", "medium", "low"]
                    description: "Confidence in the chunk's relevance to the query after reranking."
                  reason:
                    type: string
                required: ["chunk_id", "rank", "confidence", "reason"]
          required: ["ranking"]
