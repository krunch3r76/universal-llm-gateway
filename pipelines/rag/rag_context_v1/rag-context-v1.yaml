schema_version: 6
id: rag-context
version: "1.1"
type: rag
description: >
  RAG query rewriting + multi-query retrieval without generation.
  Rewrites the query into optimized sub-queries, executes parallel retrieval
  with RRF merge, and returns assembled context chunks as the response.
  Used by pipeline_test ask/consult as a drop-in replacement for direct RAG search.
output: rerank_assemble

options:
  timeout_seconds: 60    # §4.2: raised from 30s; GPU contention headroom
  scope_options: |
    "project" — Architecture docs, vision, engram, journal entries, and FAQ
    "small_llm_prompting" — Prompt engineering research for small/local models
    "llm_prompting" — Prompt engineering research for large/cloud models
    "prompting" — All prompt engineering research (small + large model, tier-agnostic)
    "workflows" — Pipeline architecture, agent workflows, and orchestration patterns
    "research" — All research papers — prompting, RAG systems, workflows, knowledge systems
    "rag_systems" — RAG systems research — architecture, evaluation frameworks, benchmarks
    "code_retrieval" — Code retrieval research — AST chunking, dependency retrieval, code embeddings
    "knowledge_management" — PKM systems, second brain, personal information architecture, agent memory
    "graph_modeling" — Property graphs, RDF/OWL, schema design, schema evolution, query languages, KG construction
    "temporal_provenance" — Bitemporal databases, versioning, data lineage, event sourcing, provenance tracking
    "belief_consistency" — Belief revision, contradiction handling, confidence/uncertainty, entity resolution
    "knowledge_systems" — All knowledge systems research — PKM, graph modeling, temporal, belief/consistency
    "llm_foundations" — LLM reference ebooks and foundational texts
    "all_research" — All research papers and reference ebooks combined
    "both" — Project knowledge + research papers — broad fallback for ambiguous queries
    "all" — All indexed content — use when scope is unclear or spans multiple domains
  # --- Retrieval tunables (overridable via pipeline_options) ---
  rag_top_k_per_query: 10
  rag_max_chunks: 20
  rag_rrf_k: 35           # §4.3: k=60 compresses rank diffs to 13% for N≤3 lists;
                          #        k=35 yields 23% — Cormack/Clarke/Butt 2009 tuned
                          #        k=60 on TREC Web with 3–5 systems, not 1–3
  rag_recency_weight: 0.2  # §4.6: linear additive; deeper decay model deferred
  scope_confidence_threshold: 0.7  # §4.4: CRAG 3-state evaluation — queries below
                                   #        threshold fall back to scope="both"
  hyde_enabled: true  # Hypothetical Document Embeddings — generates a short
                      # hypothetical passage as an additional retrieval query
  metadata_boost_enabled: true   # Post-RRF metadata re-scoring using extracted
                                 # entity/relation/topic overlap with query terms
  metadata_boost_weight: 0.20    # Weight of metadata score in fusion with RRF
                                 # (0.0 = pure RRF, 1.0 = pure metadata)
  coverage_selection_enabled: false  # Greedy entity coverage selection — maximizes
                                     # unique entity diversity in final chunk set
  # --- LLM reranking (post-RRF, pre-formatting) ---
  rerank_enabled: false              # Master toggle — zero overhead when disabled
  rerank_model: qwen3_9b             # Model alias for reranking LLM calls
  rerank_window_size: 5              # Chunks per sliding window
  rerank_overlap: 1                  # Overlap between adjacent windows
  rerank_max_candidates: 14          # Top-N chunks sent to reranker (rest pass through)
  rerank_max_movement: 3             # Max rank positions a chunk can move (±)
  rerank_prior_weight: 0.70          # Weight of prior (RRF+metadata) score in fusion
                                     # (1.0 = ignore LLM, 0.0 = ignore prior)

steps:
  - name: analyze_rewrite
    type: generate
    model_ref: qwen3_9b
    model_requirements:
      task: rag_rewrite
      source: any       # local models qualify — enables laptop/CPU fallback
    prompt_ref: rag.rag_context_v1.analyze_rewrite
    generation_parameters:
      temperature: 0.4   # §4.1: T=0.1→0.4; all 4 sources agree moderate temp
                         #        improves sub-query diversity 3–8% recall;
                         #        JSON schema constraint keeps output reliable
      max_tokens: 512
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            needs_retrieval:
              type: boolean
            scope:
              type: string
            scope_confidence:
              type: number
              minimum: 0
              maximum: 1
              description: "Confidence in the scope classification (0–1)"
            rewritten_queries:
              type: array
              items:
                type: string
            hyde_passage:
              type: string
              description: "A hypothetical 2-3 sentence passage that would answer the query, written in the style of an academic paper or technical document"
            out_of_scope_reason:
              type: string
              description: "Empty string if in-scope; otherwise brief explanation of why the query does not match the corpus and what research area it maps to"
          required: ["needs_retrieval", "scope", "scope_confidence", "rewritten_queries", "hyde_passage", "out_of_scope_reason"]

  - name: retrieve_assemble
    type: rag_multi_retrieve_v1
    endpoint: "http://localhost:8100/search"
    handler_inputs:
      rewrite_result: "analyze_rewrite.json"

  - name: rerank_assemble
    type: rag_rerank_assemble_v1
    model_ref: optionsNs.rerank_model
    prompt_ref: rag.rag_context_v1.rerank_chunks
    handler_inputs:
      chunks_data: "retrieve_assemble.json.chunks"
      rewrite_result: "analyze_rewrite.json"
    generation_parameters:
      temperature: 0.2
      max_tokens: 1024   # window_size=5 chunks × ~80 tok/entry + JSON overhead; 512 truncates
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            ranking:
              type: array
              items:
                type: object
                properties:
                  chunk_id:
                    type: string
                  rank:
                    type: integer
                  confidence:
                    type: string
                    enum: ["high", "medium", "low"]
                  reason:
                    type: string
                required: ["chunk_id", "rank", "confidence", "reason"]
          required: ["ranking"]
