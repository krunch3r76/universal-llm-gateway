prompts:
  suggest_terms:
    description: "Pre-step LLM call to suggest concrete retrieval terms (generic, corpus-agnostic)"
    system_prompt: |
      You suggest concrete retrieval terms for search.
      From the user query, extract 5–10 short, specific terms likely to appear verbatim in relevant documents.
      Good terms: names of entities, products, tools, systems, languages, frameworks, protocols, standards,
      APIs, formats, identifiers, relation names, attribute names, acronyms, and domain technical nouns.
      Rules: prefer exact terms over paraphrases; prefer nouns/noun phrases over questions; avoid generic filler; no explanations.
      Format: {"terms":["...", "..."]}
    template: |
      Query: {text}

      Return JSON with a single key "terms" (array of 5–10 strings).

  analyze_scope:
    description: "Analyze query retrieval need and scope (compact, corpus-agnostic)"
    system_prompt: |
      You analyze a user query for dense-retrieval RAG over the indexed corpus.
      Return valid JSON only with these keys:
      needs_retrieval, scope, scope_confidence, out_of_scope_reason.

      Required behavior:
      1. needs_retrieval: false only for purely conversational (thanks, ok); else true.
      2. scope: set to exactly one of the valid scope labels below. Copy the label verbatim; do not invent values.
      If uncertain or the query spans multiple areas, use "all".
      For scope assignment, prioritize label stability across close phrasings:
      - Choose the most specific valid label directly supported by explicit query terms.
      - Do not switch to a broader neighboring label based only on paraphrase, wording strength, or inferred intent.
      - If two labels remain genuinely plausible from the literal query text, use "all" rather than guessing.
      Valid scopes (use exactly one):
       {scope_options}
      Invalid (do not use): schema_design, data_governance, data_modeling — use the closest valid label instead.
      3. If the query is a poor match for the corpus, set out_of_scope_reason to a brief
        explanation and scope_confidence <= 0.5. Otherwise out_of_scope_reason = "".
      Scope confidence should reflect confidence in the chosen label versus nearby valid labels,
      not general topic familiarity. If label choice is ambiguous among valid scopes, lower
      scope_confidence; if unresolved, prefer "all".
    template: |
      Task: classify this query for RAG retrieval.
      For scope, use exactly one allowed label from the system prompt. Do not invent new labels.
      For scope, prefer the most specific label justified by the query's literal wording; avoid broader relabeling from paraphrase or inferred context.

      Query:
      <query>{text}</query>

  generate_rewrites:
    description: "Generate retrieval rewrites and optional HyDE passage (compact, corpus-agnostic)"
    system_prompt: |
      You generate retrieval-optimized rewrites for dense-retrieval RAG over the indexed corpus.
      Return valid JSON only with these keys: rewritten_queries, hyde_passage.

      Required behavior:
      1. rewritten_queries:
         - Return 2 queries for simple topics; 3-4 for multi-facet or comparative.
         - Keep one rewrite identical or near-identical to the original query.
         - Keep rewrites short keyword phrases (not full sentences).
         - Preserve the main lexical anchors from the original query.
         - Do not invent entities, systems, methods, or side-topics.
         - Only add a term from optional lists when it is directly supported by
           query wording (or a clear close technical synonym). If uncertain, omit it.
         - For comparison queries, include at least one rewrite naming both sides.
      2. hyde_passage:
         - 60-100 words.
         - Write as neutral factual text that could appear in a relevant document.
         - For comparison queries, mention both sides with balanced emphasis.
         - No invented names.


      Optional context:
      - Predicted scope: {scope}
      - Suggested retrieval terms: {suggested_terms}
      - Corpus hints: {corpus_hints}

      Use optional list terms only when directly relevant to explicit query anchors.

      Optional reference lists:
      - Suggested retrieval terms (from prior step): {suggested_terms}
      - Corpus vocabulary (domain terms indexed in the corpus): {corpus_hints}

      Output: rewritten_queries (2-4 short phrases), hyde_passage (60-100 words).

    template: |
      <query>{text}</query>

  rerank_chunks:
    description: "Rerank retrieved chunks by relevance to query using metadata signals"
    system_prompt: |
      You are reranking candidate context chunks for a retrieval-augmented generation system.
      Rank chunks by how useful they are for answering the query.

      Criteria, in order of importance:
      1. Direct relevance to the query intent
      2. Presence of concrete facts, definitions, or evidence useful for answering
      3. Match between query concepts and chunk metadata (entities, topics)
      4. Prefer chunks that add new useful information over redundant ones
      5. Do NOT overvalue chunks just because they list many entities or topics
      6. Prefer text evidence over superficial keyword overlap
      7. Use the prior rank as a weak anchor, not a hard rule
    template: |
      Query: {text}

      Candidate chunks:

      {rerank_candidates}
