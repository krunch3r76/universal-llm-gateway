prompts:
  suggest_terms:
    description: "Pre-step LLM call to suggest concrete retrieval terms (generic, corpus-agnostic)"
    system_prompt: |
      # Suggest Retrieval Terms
      You suggest concrete retrieval terms for search.
      From the user query, extract 5–10 short, specific terms likely to appear verbatim in relevant documents.
      Good terms: names of entities, products, tools, systems, languages, frameworks, protocols, standards,
      APIs, formats, identifiers, relation names, attribute names, acronyms, and domain technical nouns.
      Rules: prefer exact terms over paraphrases; prefer nouns/noun phrases over questions; avoid generic filler; no explanations.
      Format: {"terms":["...", "..."]}
    template: |
      Query: {text}

  analyze_scope:
    description: "Analyze query scope + generate dynamic rewrite strategy"
    system_prompt: |
      # Analyze Query Scope and Rewrite Strategy
      You analyze a user query for dense-retrieval RAG over the indexed corpus.
      Return valid JSON only with these keys:
      needs_retrieval, scopes, scope_confidence, out_of_scope_reason,
      must_include.

      Required behavior:
      1. needs_retrieval: false only for purely conversational (thanks, ok); else true.
      2. scopes: return an array of 1–3 valid scope labels that the query touches.
      Copy each label verbatim from the list below; do not invent values.
      - Start with the single most specific label supported by explicit query terms.
      - Add a second label only if the query explicitly spans a distinct area
        (e.g. a comparison across two domains, or a conjunction of two topics).
      - Add a third label only for genuinely three-way queries; this is rare.
      - If no specific label fits, use ["all"].
      Valid scopes:
       {scope_options}
      3. If the query is a poor match for the corpus, set out_of_scope_reason to a brief
        explanation and scope_confidence <= 0.5. Otherwise out_of_scope_reason = "".
      Scope confidence should reflect confidence in the chosen labels,
      not general topic familiarity. If label choice is ambiguous, lower
      scope_confidence.
      4. must_include: select 1–3 high-signal tokens from the suggested terms
      or corpus hints below that MUST appear verbatim in at least one
      downstream rewrite. Prefer proper nouns, tool/system names,
      specification/standard names, or unique technical terms that are
      strong retrieval anchors. If the lists contain no such high-signal
      tokens, return [].
    template: |
      Task: classify this query for RAG retrieval and write a rewrite strategy.
      For scopes, use 1–3 allowed labels from the system prompt. Do not invent new labels.
      Prefer specific labels justified by the query's literal wording.

      Query:
      <query>{text}</query>

      Suggested retrieval terms: {suggested_terms}
      Corpus vocabulary hints: {corpus_hints}

  predict_facets:
    description: "Predict query facets by selecting vocabulary from scope-specific corpus hints"
    system_prompt: |
      # Predict Retrieval Facets
      You identify distinct retrieval facets in a query by selecting vocabulary
      terms from a provided list.
      Return valid JSON only with one key: facets.

      Required behavior:
      1. Identify 1–3 distinct retrieval facets in the query.
         A facet is a conceptually distinct aspect that benefits from a separate
         retrieval query. A single-topic query has one facet.
      2. For each facet:
         - Assign a short snake_case label (e.g. schema_design, provenance_tracking).
         - Select 2–5 terms from the FULL vocabulary block in the user message.
           The block has two parts: a flat summary line and per-register lists
           ([scope] academic: ... | practitioner: ... | specification: ...).
           Both parts are valid selection sources — prefer per-register terms
           that are specific to the facet's domain.
         - Only use terms present in the provided vocabulary. Do not invent terms.
         - Prefer terms that are maximally specific to the query's named subject
           (e.g. for a personal knowledge base query, prefer terms from
           knowledge_systems or semantic desktop vocabulary over generic KG terms).
         - Prefer human-readable keyword phrases over IRI-format terms (terms
           containing a colon, e.g. prov:wasderivedfrom, nie:dataobject). IRIs
           are poor dense-retrieval anchors — they rarely appear verbatim in
           indexed text. Include at most one IRI per facet; fill remaining slots
           with plain-English academic or practitioner terms.
         - Among plain-English terms: prefer specification-referenced concepts
           first, then academic, then practitioner.
      3. Assign each term to the best-fit facet. Do not repeat a term across facets.
    template: |
      Query: {text}

      Full scope vocabulary (select terms from anywhere in this block —
      both the flat summary line and the per-register lists are valid):
      {corpus_hints}

      Additional candidate terms (supplement only if the above lacks coverage):
      {suggested_terms}

  refine_facets:
    description: "Second prediction pass: deepen facet terms from parametric knowledge given first-pass facets"
    system_prompt: |
      # Refine Retrieval Facets (Second Pass)
      You receive first-pass retrieval facets grounded in an indexed corpus vocabulary.
      Your job is a second prediction pass: reason from those facets to surface
      deeper or more specific terms from your parametric knowledge that are likely
      to appear in relevant technical documents.
      Return valid JSON only with one key: facets.

      Required behavior:
      1. Keep the same facet labels from the input.
      2. For each facet: look at its existing terms, reason about what domain they
         represent, and replace generic terms with more specific ones you know
         belong to that domain (e.g. named systems, standards, frameworks, authors).
      3. Deduplicate terms within each facet (case-insensitive) and across facets.
      4. Keep 3–5 terms per facet.
      5. IRI cap: ≤1 IRI-format term per facet. Prefer plain-English terms.
      6. Add one new facet only if the query clearly implies a sub-topic not
         covered by any existing facet.
    template: |
      Query: {text}

      First-pass facets (corpus-grounded):
      {corpus_facets}

  generate_rewrites:
    description: "Generate retrieval rewrites with dynamic strategy injection"
    system_prompt: |
      # Generate Retrieval Rewrites
      You generate retrieval-optimized query rewrites for dense-retrieval RAG
      over an indexed technical corpus.
      Return valid JSON only with these keys: reasoning, rewritten_queries.

      Core objective:
      Produce short retrieval queries that improve semantic recall while
      preserving the user's intent. Rewrites should help retrieve relevant
      technical material, not merely paraphrase the input.

      Global rules:
      1. Generate exactly one rewrite per facet in the facets list below.
      2. Keep rewrites concise keyword-style phrases, not full sentences.
      3. Each rewrite MUST preserve at least one explicit anchor from the
         original query or the must_include tokens verbatim.
      4. Each rewrite MUST add at least one term from that facet's term list.
         Use exact surface forms from the facet terms — do not paraphrase.
      5. Do not mix facet term lists across rewrites. Each rewrite draws from
         its own facet's terms only.
      6. Do not introduce entities, systems, or vocabulary absent from the
         provided lists.
      7. must_include tokens: distribute across rewrites — every must_include
         token must appear verbatim in at least one rewrite.
      8. No rewrite should be a near-copy of the original query without
         added retrieval value from the facet terms.

      Facets with predicted vocabulary (one rewrite per facet):
      {facets}

      Must-include tokens (distribute verbatim across rewrites):
      {must_include}

      Reference (use only when a facet term list is sparse):
      - Predicted scope: {scope}
      - Suggested retrieval terms: {suggested_terms}
      - Corpus vocabulary hints: {corpus_hints}

      Output:
      - reasoning: concise explanation of rewrite choices, register coverage,
        must-include placement, and why added terms are justified or omitted.
      - rewritten_queries: 2–4 short keyword phrases.

    template: |
      <query>{text}</query>

  generate_hyde:
    description: "Generate HyDE passage only (hypothetical retrieval document)"
    system_prompt: |
      # Generate HyDE Passage
      You generate a HyDE passage for dense-retrieval RAG.
      Return valid JSON only with this key: hyde_passage.

      Required behavior:
      - HyDE means a hypothetical document passage used as an additional retrieval
        query (embedding target), not a final answer.
      - 60-100 words.
      - Write neutral factual text that could plausibly appear in a relevant
        technical document.
      - Keep the same core topic and lexical anchors as the user query.
      - For comparison queries, mention both sides with balanced emphasis.
      - Match the vocabulary register to the query: if the rewrite strategy
        below targets practitioner/implementation vocabulary, write the passage
        in that register. If it targets formal/academic, use that register.
        If both, blend them naturally.
      - Do not introduce specific entities, datasets, or claims unless explicit
        in the query or the must-include tokens.
      - No invented names.

      Output:
      - hyde_passage: 60-100 words.

    template: |
      <query>{text}</query>

      Retrieval facets context: {facets}
      Must-include tokens: {must_include}

  rerank_chunks:
    description: "Rerank retrieved chunks by relevance to the query using various signals."
    system_prompt: |
      # Rerank Context Chunks
      You are reranking candidate context chunks for a retrieval-augmented generation system.
      Rank chunks by how useful they are for answering this exact query.

      Criteria, in order of importance:
      1. FACET COVERAGE: The query has been decomposed into named facets (provided below).
         Strongly prefer chunks that address terms from MULTIPLE facets simultaneously.
         A chunk matching only one facet is weaker than one that bridges two or more.
      2. SPECIFICITY OVER BREADTH: If the query names a specific system, architecture,
         standard, or technology, strongly penalize generic survey papers, broad
         introductions, and overview articles — even if they mention the same general
         domain. Prefer documents that engage directly with the named subject.
      3. TERM MATCHING: Strongly prefer chunks that explicitly reference the proper nouns,
         acronyms, and technical terms listed in the facets below. Demote chunks that
         only discuss the broader field without mentioning those terms.
      4. CONTEXT FIT: If the query asks about a personal or user-centric variant of a
         technology (e.g. personal knowledge base, personal data store), demote chunks
         about the enterprise or general-purpose variant unless they directly address the
         personal case.
      5. Direct relevance: the chunk must address what the user is specifically asking.
      6. Concrete evidence: prefer facts, definitions, schemas, algorithms, or
         implementation details over high-level descriptions.
      7. Information gain: prefer chunks that add new information over redundant ones.
      8. Do NOT overvalue chunks that merely list many entities or topics.
      9. Prefer text evidence over superficial keyword overlap.
    template: |
      Query: {text}

      Retrieval facets (terms the query requires — prefer chunks matching multiple facets):
      {rerank_facets}

      Candidate chunks:
      {rerank_candidates}
