schema_version: 6
id: rag-context
version: "2.0"
type: rag
description: >
  Direct RAG retrieval with property-index term expansion + optional HyDE.
  Bypasses the 7-step LLM rewriting chain. Term expansion uses the property
  index to find corpus-grounded co-occurring terms (zero LLM calls, ~100ms).
  HyDE (optional, hyde_enabled) adds one LLM call for vocabulary bridging
  via hypothetical document embedding. Set scope_override for targeted
  retrieval; defaults to "all" scopes.
output: rerank_assemble

options:
  timeout_seconds: 30
  rewrite_enabled: false
  hyde_enabled: false
  rag_top_k_per_query: 15
  rag_max_chunks: 20
  rag_rrf_k: 35
  rag_recency_weight: 0.2
  scope_confidence_threshold: 0.7
  rag_scope_chunk_caps: {}
  noise_filter_threshold: 0.35
  noise_filter_disable: false
  synthetic_scope: ""
  synthetic_scope_demotion: 0.6
  source_diversity_max: 3
  metadata_boost_enabled: true
  metadata_boost_weight: 0.20
  coverage_selection_enabled: false
  neighbor_expansion_enabled: false
  neighbor_expansion_n: 1
  neighbor_expansion_max_chunks: 30
  neighbor_expansion_score_discount: 1.0
  rerank_enabled: true
  rerank_model: qwen3_9b
  rerank_window_size: 5
  rerank_overlap: 1
  rerank_max_candidates: 14
  rerank_max_movement: 3
  rerank_prior_weight: 0.70
  scope_options: []
  scope_aliases: {}

steps:
  - name: direct_scope
    type: rag_direct_scope_v1
    default_scope: "all"

  - name: expand_terms
    type: rag_expand_terms_v1
    max_expansion_terms: 10
    min_chunk_cooccurrence: 1

  - name: generate_hyde
    type: generate
    model_ref: qwen3_9b
    model_requirements:
      task: rag_rewrite
      source: any
    prompt_ref: rag.rag_context_v1.generate_hyde_standalone
    condition: "options.hyde_enabled"
    generation_parameters:
      temperature: 0.3
      max_tokens: 256
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            hyde_passage:
              type: string
              description: "A hypothetical document passage used as an additional retrieval query"
          required: ["hyde_passage"]

  - name: retrieve_assemble
    type: rag_multi_retrieve_v1
    endpoint: "http://localhost:8100/search"
    handler_inputs:
      scope_result: "direct_scope.json"
      rewrite_result: "direct_scope.json"
      hyde_result: "generate_hyde.json"
      facet_result: "expand_terms.json.facets"

  - name: rerank_assemble
    type: rag_rerank_assemble_v1
    model_ref: optionsNs.rerank_model
    prompt_ref: rag.rag_context_v1.rerank_chunks
    handler_inputs:
      chunks_data: "retrieve_assemble.json.chunks"
      facet_result: "expand_terms.json.facets"
    generation_parameters:
      temperature: 0.2
      max_tokens: 8192
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            ranking:
              type: array
              items:
                type: object
                properties:
                  chunk_id:
                    type: string
                  rank:
                    type: integer
                  confidence:
                    type: string
                    enum: ["high", "medium", "low"]
                    description: "Confidence in the chunk's relevance to the query after reranking."
                  reason:
                    type: string
                required: ["chunk_id", "rank", "confidence", "reason"]
          required: ["ranking"]
