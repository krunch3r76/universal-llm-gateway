schema_version: 6
id: journal-agent
version: "1.0"
type: rag
description: "Journal-aware agent: deterministic RAG + journal + git, then LLM synthesis"
output: synthesize

options:
  timeout_seconds: 120

steps:
  - name: rag_search
    type: rag_search_v1
    endpoint: "http://localhost:8100/search"
    top_k: 5
    recency_weight: 0.3
    distance_threshold: 1.0
    depends_on: []

  - name: journal_index
    type: rag_source_v1
    endpoint: "http://localhost:8100/source"
    path: "/mnt/torus/projects/universal-llm-gateway/tasks/journal/index.yaml"
    depends_on: []

  - name: git_recent
    type: shell_v1
    command: "git log --oneline -10"
    workdir: "/mnt/torus/projects/universal-llm-gateway"
    depends_on: []

  - name: synthesize
    type: generate
    model_ref: qwen3_32b
    prompt_ref: rag.project_journal_v2.answer_with_all_context
    handler_inputs:
      rag_context: "rag_search.raw"
      journal_index: "journal_index.raw"
      git_history: "git_recent.raw"
