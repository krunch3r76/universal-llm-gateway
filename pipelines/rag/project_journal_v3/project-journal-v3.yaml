schema_version: 6
id: journal-agent-adaptive
version: "1.0"
type: rag
description: "Adaptive journal agent: baseline gather → assessment → conditional expansion → synthesis"
output: synthesize

options:
  timeout_seconds: 180

steps:
  # --- Baseline gather (parallel) ---
  - name: rag_search
    type: rag_search_v1
    endpoint: "http://localhost:8100/search"
    top_k: 5
    recency_weight: 0.3
    distance_threshold: 1.0

  - name: journal_index
    type: rag_source_v1
    endpoint: "http://localhost:8100/source"
    path: "/mnt/torus/projects/universal-llm-gateway/tasks/journal/index.yaml"

  - name: git_recent
    type: shell_v1
    command: "git log --oneline -10"
    workdir: "/mnt/torus/projects/universal-llm-gateway"

  # --- Assessment ---
  - name: assess_context
    type: generate
    model_ref: qwen3_32b
    prompt_ref: rag.project_journal_v3.assess_sufficiency
    handler_inputs:
      rag_context: "rag_search.raw"
      journal_index: "journal_index.raw"
      git_history: "git_recent.raw"
    generation_parameters:
      temperature: 0.1
      max_tokens: 256
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            sufficient:
              type: boolean
              description: "true if context is adequate to answer the question"
            need_more_history:
              type: boolean
              description: "true if more git history would help"
            need_deeper_search:
              type: boolean
              description: "true if more RAG results would help"
            reasoning:
              type: string
              description: "Brief explanation of the assessment"
          required: [sufficient, need_more_history, need_deeper_search, reasoning]

  # --- Conditional expansion ---
  - name: git_expanded
    type: shell_v1
    command: "git log --oneline -50"
    workdir: "/mnt/torus/projects/universal-llm-gateway"
    condition: "assess_context.json.get('need_more_history', False) == True"

  - name: rag_deep
    type: rag_search_v1
    endpoint: "http://localhost:8100/search"
    top_k: 15
    recency_weight: 0.3
    distance_threshold: 1.2
    condition: "assess_context.json.get('need_deeper_search', False) == True"

  # --- Coalesce (pick expanded if available, else baseline) ---
  - name: git_context
    type: coalesce_v1
    handler_inputs:
      primary: "git_expanded.raw"
      fallback: "git_recent.raw"

  - name: rag_context
    type: coalesce_v1
    handler_inputs:
      primary: "rag_deep.raw"
      fallback: "rag_search.raw"

  # --- Synthesis ---
  - name: synthesize
    type: generate
    model_ref: qwen3_32b
    prompt_ref: rag.project_journal_v3.answer_with_context
    handler_inputs:
      rag_context: "rag_context.raw"
      journal_index: "journal_index.raw"
      git_history: "git_context.raw"
      assessment: "assess_context.raw"
