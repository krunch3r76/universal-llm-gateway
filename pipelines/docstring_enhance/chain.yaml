schema_version: 6
id: docstring-enhance
version: "1"
type: docstring_enhance
description: "Enhance Python docstrings from structural quality inventory"
output: review

options:
  timeout_seconds: 480

steps:
  - name: collect
    type: docstring_enhance_collect_inventory
    handler_inputs:
      target_path: sourceNs.text
    timeout_seconds: 45

  - name: enhance
    type: generate
    model_ref: enhance_model
    prompt_ref: docstring_enhance.enhance
    handler_inputs:
      target_path: sourceNs.text
      inventory_json: collect.raw
    generation_parameters:
      temperature: 0.1
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            target_kind:
              type: string
              enum: [file, directory]
            edits:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  scope:
                    type: string
                    enum: [module, class, function, method]
                  name:
                    type: string
                  line:
                    type: integer
                  rationale:
                    type: string
                  docstring:
                    type: string
                required: [path, scope, name, line, docstring]
            summary:
              type: object
              properties:
                critical_issues:
                  type: integer
                warnings:
                  type: integer
                edits_proposed:
                  type: integer
              required: [critical_issues, warnings, edits_proposed]
            notes:
              type: array
              items:
                type: string
          required: [target_kind, edits, summary]
    timeout_seconds: 240
    retry_policy:
      max_attempts: 3
      backoff_strategy: exponential
      initial_interval_seconds: 3.0
      max_interval_seconds: 15.0
      retry_on: ["ProxyClientError"]

  - name: review
    type: generate
    model_ref: review_model
    prompt_ref: docstring_enhance.review
    handler_inputs:
      target_path: sourceNs.text
      inventory_json: collect.raw
      proposal_json: enhance.raw
    generation_parameters:
      temperature: 0.0
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            target_kind:
              type: string
              enum: [file, directory]
            edits:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  scope:
                    type: string
                    enum: [module, class, function, method]
                  name:
                    type: string
                  line:
                    type: integer
                  rationale:
                    type: string
                  docstring:
                    type: string
                required: [path, scope, name, line, docstring]
            summary:
              type: object
              properties:
                critical_issues:
                  type: integer
                warnings:
                  type: integer
                edits_proposed:
                  type: integer
              required: [critical_issues, warnings, edits_proposed]
            unsupported_edits:
              type: array
              items:
                type: string
            notes:
              type: array
              items:
                type: string
          required: [target_kind, edits, summary, unsupported_edits]
    timeout_seconds: 240
    retry_policy:
      max_attempts: 3
      backoff_strategy: exponential
      initial_interval_seconds: 3.0
      max_interval_seconds: 15.0
      retry_on: ["ProxyClientError"]

