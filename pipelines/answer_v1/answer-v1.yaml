# Supported pipeline_options:
#   model: <full model ID>  — override the answer model; bypasses models.yaml lookup.
#                             Use for cloud models (e.g. arcee-ai/trinity-large-preview:free).
#                             Defaults to the `answer` alias in models.yaml.
schema_version: 6
id: rag-answer
version: "1.1"
type: answer_v1
description: >
  RAG answer pipeline with relevance gate. Delegates query rewriting + retrieval
  to rag-context, checks context relevance via a lightweight classifier, then
  generates a grounded answer or returns a "not grounded" response.
output: answer

options:
  timeout_seconds: 140

steps:
  - name: get_context
    type: pipeline_call_v1
    pipeline_id: "rag-context"
    consumer_model_ref: answer   # resolved at runtime → retrieval-profiles.yaml lookup
    timeout_seconds: 70

  - name: relevance_check
    type: generate
    model_ref: answer
    model_requirements:
      task: rag_relevance
      source: any
    prompt_ref: answer_v1.relevance_check
    handler_inputs:
      rag_context: "get_context.raw"
    generation_parameters:
      temperature: 0.1
      max_tokens: 1024
      response_format:
        type: json_object
        schema:
          type: object
          properties:
            relevant:
              type: boolean
              description: "true if the retrieved context contains information that directly addresses the question"
            confidence:
              type: number
              minimum: 0
              maximum: 1
              description: "confidence in the relevance assessment"
            reason:
              type: string
              description: "one-sentence explanation"
          required: ["relevant", "confidence", "reason"]

  - name: answer
    type: generate
    model_ref: answer
    model_requirements:
      task: rag_answer
      source: any       # local models qualify — enables laptop/CPU fallback
    prompt_ref: answer_v1.answer_gated
    handler_inputs:
      rag_context: "get_context.raw"
      relevance: "relevance_check.json"
    generation_parameters:
      temperature: 0.3
