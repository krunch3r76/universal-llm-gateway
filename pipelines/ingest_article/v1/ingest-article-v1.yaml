schema_version: 6
id: ingest-article
version: "1.0"
type: ingest_article
category: ingest_article
description: >
  Download one paper through web-fetcher POST /fetch with save_to, then
  register the file with rag. saved_to maps to source_path. web-fetcher
  returns no digest, title, or filename, so those stay on caller options.
options:
  timeout_seconds: 900
steps:
  - name: fetch
    type: http_v1
    service: web_fetcher
    operation_id: fetch
    body:
      url:
        from: options.url
      save_to:
        from: options.save_to
    await: none
  - name: register
    type: http_v1
    service: rag
    operation_id: upsert_article
    body:
      source_path:
        first_present:
          - from: options.source_path
          - from: steps.fetch.json.saved_to
      filename:
        from: options.filename
      title:
        from: options.title
      authors:
        from: options.authors
      content_hash:
        from: options.content_hash
      subdirectory:
        first_present:
          - from: options.subdirectory
          - literal: downloads
    await: none
