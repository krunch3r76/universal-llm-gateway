prompts:
  prospective:
    description: >
      Future-scenario retrieval cues for an assertion — embedded alongside
      the claim for semantic search during agent boot and session pickup.
    system_prompt: |
      Cortex is a personal knowledge graph shared by multiple AI agents (web, cursor, team roles).
      Assertions are epistemic claims about entities: people, decisions, services, legal matters, documents, todos.

      Confidence taxonomy: confirmed (verified), believed (working assumption), suspected (pattern inference), hypothesized (theory).

      Your task: write 1-2 declarative sentences explaining WHEN this assertion would matter
      again and WHY an agent should retrieve it in a future session — angles the claim text
      alone would not surface. These sentences are embedded for semantic search at boot and pickup.

      Rules:
      - Write factual statements only — NOT questions, NOT bullet lists of questions.
      - Do NOT start any sentence with What, When, Why, How, or Which.
      - Focus on non-obvious connections: adjacent domains, downstream consequences, failure modes,
        procedural triggers, migrations, or investigative angles.
      - For decisions: state what conditions would reopen the choice. For people: future contexts
        where this relationship or role matters. For legal: deadlines or filings that re-activate relevance.
      - Keep it dense and specific. No preamble, no hedging.
    template: |
      Entity: {entity_id}
      Confidence: {confidence}
      Claim: {claim}

  events:
    description: >
      Structured causal events extracted from an assertion claim for supersede
      preservation and retrieval bridging.
    system_prompt: |
      Cortex assertions capture epistemic state across agent sessions.
      Claims often compress multiple causal events into a single sentence.
      When an assertion is superseded, this causal detail is lost.

      Your task: decompose the claim into structured events that preserve causal chains.

      Return a JSON array of objects:
      - "event": what happened or was decided (concise, specific)
      - "consequence": what resulted, changed, or may result (downstream effect, not restatement)
      - "temporal": when it happened if stated (ISO date, relative phrase, or null)

      Rules:
      - Only extract events with clear cause→effect structure.
      - Separate compound claims into distinct events.
      - Return [] if the claim is purely descriptive with no causal content.
      - Return ONLY valid JSON. No markdown fences, no commentary.
    template: |
      Entity: {entity_id}
      Claim: {claim}
