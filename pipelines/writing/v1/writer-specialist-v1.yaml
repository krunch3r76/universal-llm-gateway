# writer-specialist-v1 — multi-weight plain-text draft, post-hoc verification.
# UNSENT by construction. Zero cdp/* and web-anthropic pipeline steps.

schema_version: 6
id: writer-specialist-v1
version: "1.0"
type: writing
category: writing
description: >
  Multi-weight plain-text outbound drafting with post-hoc fact-ceiling and prose-rhythm gates.
  UNSENT by construction.
delivery: id_status_only
output: finalize

options:
  timeout_seconds: 1800
  output:
    type: string
    description: envelope or packet
    default: envelope
  max_pins:
    type: integer
    description: cap on ledger rows including not-attested pins
    default: 40
  allow_partial_independence:
    type: boolean
    description: when true, unknown or same-family models yield partial instead of a refusal
    default: false
  working_set:
    type: array
    description: refs resolved into the pin ledger
    default: []

steps:
  - name: assemble
    type: writing_assemble_v1

  - name: prompt_architect
    type: writing_prompt_architect_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet'"

  - name: drafter_openai
    type: generate
    model_ref: drafter_openai
    prompt_ref: writing.v1.writer
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet'"
    handler_inputs:
      documents: assemble.json.documents_block
      brief: assemble.json.brief_block
      architect_brief: prompt_architect.json.architect_brief_block
      verbatim_notes: assemble.json.verbatim_notes_block
    generation_parameters:
      temperature: 0.4
      max_tokens: 16384

  - name: drafter_google
    type: generate
    model_ref: drafter_google
    prompt_ref: writing.v1.writer
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet'"
    handler_inputs:
      documents: assemble.json.documents_block
      brief: assemble.json.brief_block
      architect_brief: prompt_architect.json.architect_brief_block
      verbatim_notes: assemble.json.verbatim_notes_block
    generation_parameters:
      temperature: 0.4
      max_tokens: 16384

  - name: drafter_xai
    type: generate
    model_ref: drafter_xai
    prompt_ref: writing.v1.writer
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet'"
    handler_inputs:
      documents: assemble.json.documents_block
      brief: assemble.json.brief_block
      architect_brief: prompt_architect.json.architect_brief_block
      verbatim_notes: assemble.json.verbatim_notes_block
    generation_parameters:
      temperature: 0.4
      max_tokens: 16384

  - name: drafter_local_hermes
    type: generate
    model_ref: drafter_local_hermes
    prompt_ref: writing.v1.writer
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet'"
    handler_inputs:
      documents: assemble.json.documents_block
      brief: assemble.json.brief_block
      architect_brief: prompt_architect.json.architect_brief_block
      verbatim_notes: assemble.json.verbatim_notes_block
    generation_parameters:
      temperature: 0.4
      max_tokens: 3072

  - name: drafter_local_ernie
    type: generate
    model_ref: drafter_local_ernie
    prompt_ref: writing.v1.writer
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet'"
    handler_inputs:
      documents: assemble.json.documents_block
      brief: assemble.json.brief_block
      architect_brief: prompt_architect.json.architect_brief_block
      verbatim_notes: assemble.json.verbatim_notes_block
    generation_parameters:
      temperature: 0.4
      max_tokens: 3072

  - name: drafter_anthropic
    type: generate
    model_ref: drafter_anthropic
    prompt_ref: writing.v1.writer
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet'"
    handler_inputs:
      documents: assemble.json.documents_block
      brief: assemble.json.brief_block
      architect_brief: prompt_architect.json.architect_brief_block
      verbatim_notes: assemble.json.verbatim_notes_block
    generation_parameters:
      temperature: 0.4
      max_tokens: 16384

  - name: draft
    type: writing_draft_selector_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet'"

  - name: independence
    type: writing_independence_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and draft.json.get('refused') is None"

  - name: fact_ceiling_audit
    type: writing_review_local_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and draft.json.get('refused') is None and independence.json.get('refused') is None"

  - name: provenance_check
    type: writing_provenance_check_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and draft.json.get('refused') is None and independence.json.get('refused') is None and fact_ceiling_audit.json.get('refused') is None"
    handler_inputs:
      pin_ledger: assemble.json.pin_ledger
      draft: draft.json

  - name: prose_rhythm_pass
    type: generate
    model_ref: reviser
    prompt_ref: writing.v1.prose_rhythm
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and draft.json.get('refused') is None and independence.json.get('refused') is None and fact_ceiling_audit.json.get('refused') is None"
    handler_inputs:
      draft: draft.json.draft
      documents: assemble.json.documents_block
      brief: assemble.json.brief_block
    generation_parameters:
      temperature: 0.3
      max_tokens: 3072

  - name: fact_ceiling_final
    type: writing_provenance_check_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and draft.json.get('refused') is None and independence.json.get('refused') is None and fact_ceiling_audit.json.get('refused') is None"
    handler_inputs:
      pin_ledger: assemble.json.pin_ledger
      draft: prose_rhythm_pass.raw
      draft_v1: draft.json

  - name: finalize
    type: writing_finalize_v1
    reads_from:
      - step: assemble
        fields: [json]
      - step: prompt_architect
        fields: [json]
      - step: drafter_openai
        fields: [json, raw, model_id, prompt_tokens, completion_tokens]
      - step: drafter_google
        fields: [json, raw, model_id, prompt_tokens, completion_tokens]
      - step: drafter_xai
        fields: [json, raw, model_id, prompt_tokens, completion_tokens]
      - step: drafter_local_hermes
        fields: [json, raw, model_id, prompt_tokens, completion_tokens]
      - step: drafter_local_ernie
        fields: [json, raw, model_id, prompt_tokens, completion_tokens]
      - step: drafter_anthropic
        fields: [json, raw, model_id, prompt_tokens, completion_tokens]
      - step: draft
        fields: [json]
      - step: provenance_check
        fields: [json]
      - step: independence
        fields: [json]
      - step: fact_ceiling_audit
        fields: [json]
      - step: prose_rhythm_pass
        fields: [json, raw, model_id, prompt_tokens, completion_tokens]
      - step: fact_ceiling_final
        fields: [json]
    handler_outputs:
      unsent: finalize.json.unsent
