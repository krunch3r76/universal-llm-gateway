# writer-specialist-v1 — local draft, independent review, targeted revision.
# bare id writer-specialist-v1 is an alias of writing/writer-specialist-v1 (both resolve to this member).
# UNSENT by construction: no send, post, file write, or mail draft.

schema_version: 6
id: writer-specialist-v1
version: "1.0"
type: writing
category: writing
description: >
  Local writer, a different-family reviewer, and a targeted revision.
  UNSENT by construction: every draft stays in the envelope.
output: finalize

options:
  timeout_seconds: 1800
  writer_seat:
    type: string
    description: local, cdp, or cursor_pool1
    default: local
  reviewer_seat:
    type: string
    description: auto, local, or cdp
    default: auto
  dispatch_thread_id:
    type: string
    description: agent-bus thread for a non-local seat
    default: "15790"
  seat_models:
    type: object
    description: model id per remote seat
    default:
      cdp: cdp/opus-5.5
      cursor_pool1: cursor/grok-4.7
  seat_timeout_s:
    type: integer
    description: per wait step
    default: 600
  output:
    type: string
    description: envelope or packet
    default: envelope
  max_pins:
    type: integer
    description: cap on ledger rows including not-attested pins
    default: 40
  allow_partial_independence:
    type: boolean
    description: when true, unknown or same-family models yield partial instead of a refusal
    default: false
  working_set:
    type: array
    description: refs resolved into the pin ledger
    default: []
  brief:
    type: object
    description: signer, objective, recipient, deliverable, and attested lists
    default: {}

steps:
  - name: assemble
    type: writing_assemble_v1

  - name: draft_dispatch
    type: writing_seat_dispatch_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and assemble.json.get('writer_seat') != 'local'"

  - name: draft_wait
    type: writing_seat_wait_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and assemble.json.get('writer_seat') != 'local'"

  - name: draft_local
    type: generate
    model_ref: writer
    prompt_ref: writing.v1.writer
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and (assemble.json.get('writer_seat') == 'local' or draft_wait.json.get('fallback_to') == 'local')"
    handler_inputs:
      documents: assemble.json.documents_block
      brief: assemble.json.brief_block
    generation_parameters:
      temperature: 0.4
      max_tokens: 3072
      response_format:
        type: json_object
        schema:
          type: object
          additionalProperties: false
          properties:
            draft:
              type: string
            claims:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  claim_id:
                    type: string
                  text:
                    type: string
                  pin_ids:
                    type: array
                    items:
                      type: string
                  disposition:
                    type: string
                    enum: [express, imply, omit_with_reason]
                  state:
                    type: string
                    enum: [backed, unverified, need]
                required:
                  - claim_id
                  - text
                  - pin_ids
                  - disposition
                  - state
            need:
              type: array
              items:
                type: string
            dispositions:
              type: array
              items:
                type: string
          required:
            - draft
            - claims
            - need
            - dispositions

  - name: draft
    type: writing_seat_select_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet'"

  - name: provenance_check
    type: writing_provenance_check_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and draft.json.get('refused') is None"
    handler_inputs:
      pin_ledger: assemble.json.pin_ledger
      draft: draft.json

  - name: independence
    type: writing_independence_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and draft.json.get('refused') is None"

  - name: review_dispatch
    type: writing_seat_dispatch_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and draft.json.get('refused') is None and independence.json.get('refused') is None and assemble.json.get('reviewer_seat') == 'cdp'"

  - name: review_wait
    type: writing_seat_wait_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and draft.json.get('refused') is None and independence.json.get('refused') is None and assemble.json.get('reviewer_seat') == 'cdp'"

  - name: review_local
    type: generate
    model_ref: reviewer
    prompt_ref: writing.v1.reviewer
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and draft.json.get('refused') is None and independence.json.get('refused') is None and (assemble.json.get('reviewer_seat') == 'local' or review_wait.json.get('fallback_to') == 'local')"
    handler_inputs:
      documents: assemble.json.documents_block
      brief: assemble.json.brief_block
      draft: draft.json.draft
    generation_parameters:
      temperature: 0.1
      max_tokens: 2048
      response_format:
        type: json_object
        schema:
          type: object
          additionalProperties: false
          properties:
            findings:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  ref:
                    type: string
                  type:
                    type: string
                    enum:
                      - unsupported
                      - contradicts_pin
                      - unattested_fact
                      - unraised_denial
                      - register
                      - sequitur
                      - omission
                  fix:
                    type: string
                required:
                  - ref
                  - type
                  - fix
            verdict:
              type: string
              enum: [ship, revise]
          required:
            - findings
            - verdict

  - name: review
    type: writing_seat_select_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and draft.json.get('refused') is None and independence.json.get('refused') is None"

  - name: revise
    type: generate
    model_ref: reviser
    prompt_ref: writing.v1.reviser
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and draft.json.get('refused') is None and independence.json.get('refused') is None and (review.json.get('verdict') == 'revise' or len(provenance_check.json.get('violations', [])) > 0)"
    handler_inputs:
      documents: assemble.json.documents_block
      brief: assemble.json.brief_block
      draft: draft.json.draft
      findings: review.json.findings
      violations: provenance_check.json.violations
    generation_parameters:
      temperature: 0.3
      max_tokens: 3072
      response_format:
        type: json_object
        schema:
          type: object
          additionalProperties: false
          properties:
            draft:
              type: string
            claims:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  claim_id:
                    type: string
                  text:
                    type: string
                  pin_ids:
                    type: array
                    items:
                      type: string
                  disposition:
                    type: string
                    enum: [express, imply, omit_with_reason]
                  state:
                    type: string
                    enum: [backed, unverified, need]
                required:
                  - claim_id
                  - text
                  - pin_ids
                  - disposition
                  - state
            need:
              type: array
              items:
                type: string
            dispositions:
              type: array
              items:
                type: string
            changed_claims:
              type: array
              items:
                type: string
          required:
            - draft
            - claims
            - need
            - dispositions
            - changed_claims

  - name: provenance_check_final
    type: writing_provenance_check_v1
    condition: "assemble.json.get('refused') is None and options.get('output', 'envelope') != 'packet' and draft.json.get('refused') is None and independence.json.get('refused') is None and (review.json.get('verdict') == 'revise' or len(provenance_check.json.get('violations', [])) > 0)"
    handler_inputs:
      pin_ledger: assemble.json.pin_ledger
      draft: revise.json

  - name: finalize
    type: writing_finalize_v1
    reads_from:
      - step: assemble
        fields: [json]
      - step: draft_dispatch
        fields: [json]
      - step: draft_wait
        fields: [json]
      - step: draft_local
        fields: [json]
      - step: draft
        fields: [json]
      - step: provenance_check
        fields: [json]
      - step: independence
        fields: [json]
      - step: review_dispatch
        fields: [json]
      - step: review_wait
        fields: [json]
      - step: review_local
        fields: [json]
      - step: review
        fields: [json]
      - step: revise
        fields: [json]
      - step: provenance_check_final
        fields: [json]
    handler_outputs:
      unsent: finalize.json.unsent
